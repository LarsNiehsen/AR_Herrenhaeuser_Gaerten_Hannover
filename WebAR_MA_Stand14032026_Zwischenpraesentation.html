            Object.keys(AR_MODELS).forEach(key => {
                const m = AR_MODELS[key];
                if(m.lat && m.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, m.lat, m.lon);
                    // Wenn die Distanz kleiner als der bisherige Rekord ist, neuen Rekord setzen
                    if(dist < closestDist) {
                        closestDist = dist;
                        closestObj = m;
                    }
                }
            });
            closestObjForArrow = closestObj; // Dem Pfeil mitteilen, wo er hinzeigen soll
            
            // String-Interpolation mit Backticks (`) erlaubt es, Variablen direkt in den Text zu schreiben (${...})
            if (closestObj) {
                const distStr = closestDist < 1000 ? Math.round(closestDist) + " m" : (closestDist/1000).toFixed(1) + " km";
                const latStr = lastPos.latitude.toFixed(5) + "°"; // .toFixed(5) schneidet auf 5 Nachkommastellen ab
                const lonStr = lastPos.longitude.toFixed(5) + "°";
                const accStr = "± " + Math.round(lastPos.accuracy || 0) + " m";
                const compassStr = Math.round(heading) + "°";
                
                let sourceLabel = isSimulatedPos ? "Pos. (Simuliert)" : "Pos. (GNSS)";
                let offsetInfo = (isSimulatedPos && compassOffset !== 0) ? `<br><span class="label-small">Kompass-Korrektur</span> <span class="val-green">${Math.round(compassOffset)}°</span>` : "";

                // HTML-String wird in das Panel geschrieben
                statusText.innerHTML = `
                    <span class="label-small">${sourceLabel}</span> <span class="val-highlight">${latStr}, ${lonStr}</span><br>
                    <span class="label-small">Genauigkeit</span> <span class="val-highlight">${accStr}</span><br>
                    <span class="label-small">Kompass</span> <span class="val-highlight">${compassStr}</span>${offsetInfo}<br>
                    <div style="margin: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2);"></div>
                    <span class="label-small">POI</span> <span class="val-green">${closestObj.title}</span><br>
                    <span class="label-small">Entfernung</span> <span class="val-highlight">${distStr}</span>
                `;
            }
        }
        
        // Dreht den grünen Navigations-Pfeil am unteren Rand in die richtige Richtung
        function updateArrow() {
            // SONDERFALL: Target 9 (Lokaler Modus)
            if (isFechterPlacedLocally && Date.now() < localFechterEndTime && gnssMeshes[2]) {
                arrowContainer.style.opacity = 1;
                
                // Aktuelle Position der Kamera auslesen
                const camPos = new THREE.Vector3();
                camera.getWorldPosition(camPos);
                
                // Position des virtuellen 3D-Modells auslesen
                const targetPos = new THREE.Vector3();
                gnssMeshes[2].getWorldPosition(targetPos);
                
                // Vektor berechnen, der exakt von der Kamera zum Modell zeigt (Höhe Y wird ignoriert)
                const toTarget = new THREE.Vector3().subVectors(targetPos, camPos);
                toTarget.y = 0;
                toTarget.normalize();
                
                // Aktuelle Blickrichtung der Kamera berechnen
                const camDir = new THREE.Vector3(0, 0, -1);
                camDir.applyQuaternion(camera.quaternion);
                camDir.y = 0;
                camDir.normalize();

                // Den Winkel zwischen der Blickrichtung und dem Modell berechnen
                const angle = camDir.angleTo(toTarget);
                // Mit einem Kreuzprodukt bestimmen, ob das Ziel links oder rechts von uns liegt
                const cross = new THREE.Vector3().crossVectors(camDir, toTarget);
                let relativeAngle = THREE.MathUtils.radToDeg(angle);
                
                // Falls das Modell links von der Kamera liegt, muss der Winkel umgekehrt werden
                if (cross.y > 0) {
                    relativeAngle = 360 - relativeAngle;
                }
                
                arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
                return; // Beendet die Funktion hier, ignoriert echte GNSS-Daten
            }

            // NORMALFALL: Standortbasiertes GNSS
            if (!lastPos || !closestObjForArrow) {
                arrowContainer.style.opacity = 0; // Unsichtbar machen, wenn keine Daten da sind
                return;
            }
            arrowContainer.style.opacity = 1;
            // Berechnet, in welchem Himmelsrichtungs-Winkel das Ziel liegt
            const bearing = calculateBearing(lastPos.latitude, lastPos.longitude, closestObjForArrow.lat, closestObjForArrow.lon);
            // Relativer Winkel: Zieht die aktuelle Blickrichtung des Nutzers ab, um den Pfeil auf dem Bildschirm zu drehen
            const relativeAngle = (bearing - heading + 360) % 360;
            // CSS Transform wird genutzt, um die Grafik zu rotieren
            arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
        }

        // Berechnung und Platzierung der GNSS-Modelle in der 3D-Szene
        function updateGNSSObjects() {
            // Wenn der Fechter über Target 9 ausgelöst wurde, wird die GNSS-Berechnung 
            // temporär komplett übersprungen, um ein Wackeln des Modells zu verhindern.
            if (isFechterPlacedLocally && Date.now() < localFechterEndTime) {
                Object.keys(gnssMeshes).forEach(key => {
                    const id = parseInt(key);
                    const mesh = gnssMeshes[id];
                    
                    if (id === 2) {
                        // Sichert ab, dass das animierte Modell IMMER exakt am statischen klebt
                        // Auch wenn der Nutzer z.B. über die Buttons das Modell dreht.
                        if (mesh.userData.animMesh) {
                            mesh.userData.animMesh.position.copy(mesh.position);
                            mesh.userData.animMesh.rotation.copy(mesh.rotation);
                            mesh.userData.animMesh.scale.copy(mesh.scale);
                        }

                        // Steuert die Sichtbarkeit (statisch vs. animiert)
                        if (mesh.userData.animMesh && mesh.userData.animMesh.visible) {
                            mesh.visible = false;
                        } else {
                            mesh.visible = true;
                            if (mesh.userData.animMesh) mesh.userData.animMesh.visible = false;
                        }
                        updateUIForModel(id, "AR / lokal im Sichtbereich"); 
                    } else {
                        mesh.visible = false;
                        if (mesh.userData.animMesh) mesh.userData.animMesh.visible = false;
                    }
                });
                return; // Beendet die Funktion frühzeitig
            } else if (isFechterPlacedLocally) {
                // Die 30 Sekunden sind abgelaufen, Modell wieder freigeben
                isFechterPlacedLocally = false;
                if (gnssMeshes[2]) {
                    // Setzt die Rotation wieder auf den realen geografischen GNSS-Standard (341) zurück
                    gnssMeshes[2].rotation.y = THREE.MathUtils.degToRad(AR_MODELS[2].initRotation);
                    if (gnssMeshes[2].userData.animMesh) {
                        gnssMeshes[2].userData.animMesh.rotation.y = THREE.MathUtils.degToRad(AR_MODELS[2].initRotation);
                    }
                }
            }

            if (!lastPos) return;

            // SCHRITT 1: Zuerst werden die Distanzen zu allen Modellen berechnet und in einem Array (Liste) gespeichert
            let modelsWithDistance =[];
            Object.keys(gnssMeshes).forEach(key => {
                const id = parseInt(key);
                const config = AR_MODELS[id];
                if (config.lat && config.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    // Fügt ein kleines Datenpaket {id, dist} am Ende der Liste hinzu
                    modelsWithDistance.push({ id: id, dist: dist });
                }
            });

            // SCHRITT 2: Sortierung der Modelle nach Distanz (das nächste zuerst). 
            // Die sort-Funktion tauscht Plätze je nachdem ob a-b positiv oder negativ ist.
            modelsWithDistance.sort((a, b) => a.dist - b.dist);

            // SCHRITT 3: Nur das allernächste Modell wird angezeigt, sofern es nah genug ist
            let closestModelFound = false;

            modelsWithDistance.forEach((item) => {
                const id = item.id;
                const mesh = gnssMeshes[id];
                const config = AR_MODELS[id];
                const dist = item.dist;

                // Wenn noch kein nahes gefunden wurde und es innerhalb der Sichtweite ist
                if (!closestModelFound && dist < VISIBILITY_DISTANCE) {
                    closestModelFound = true; // Markierung, dass ein Modell angezeigt wird

                    // Basis-Höhe für Objekte ist jetzt exakt 0.0 (der echte Boden).
                    const heightY = 0.0; 
                    
                    // WICHTIG: Berechnung des Offsets (in Metern) relativ zur aktuellen 'lastPos'.
                    const offset = calcOffset(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    
                    let finalScale = config.scale * 0.05;
                    
                    if (id === 1) {
                        finalScale = config.scale * 0.015; 
                    }
                    
                    mesh.scale.set(finalScale, finalScale, finalScale);

                    // Positionierung anwenden (EXAKTE DISTANZ BLEIBT BEIBEHALTEN!)
                    mesh.position.set(offset.x, heightY, -offset.z);
                    
                    // Animiertes Modell exakt synchron zum statischen Modell mitziehen
                    if (mesh.userData.animMesh) {
                        mesh.userData.animMesh.scale.copy(mesh.scale);
                        mesh.userData.animMesh.position.copy(mesh.position);
                        // Rotation muss hier nicht kopiert werden, da das GNSS Modell starr ist,
                        // außer es wird manuell über die Buttons gedreht (das ist dort abgesichert)
                    }
                    
                    // Steuert, ob gerade das statische oder das springende Modell zu sehen ist
                    if (mesh.userData.animMesh && mesh.userData.animMesh.visible) {
                        mesh.visible = false;
                    } else {
                        mesh.visible = true;
                        if (mesh.userData.animMesh) mesh.userData.animMesh.visible = false;
                    }
                    
                    // Sauberes, zentrales UI-Update. "sourceName" wird genutzt um den Dauerschleifen-Fehler zu beheben.
                    updateUIForModel(id, isSimulatedPos ? "Pos. Simulation" : "GNSS"); 

                } else {
                    // Alle anderen Modelle werden ausgeblendet, damit das Handy nicht laggt
                    mesh.visible = false;
                    if (mesh.userData.animMesh) mesh.userData.animMesh.visible = false;
                }
            });
            
            /* 
             * UI AUFRÄUMEN (BUGFIX):
             * Falls gar kein Objekt im GNSS-Modus in der Nähe ist, wird das UI sauber ausgeblendet.
             * WICHTIG: Dies passiert NUR, wenn der GNSS-Modus gerade das UI kontrolliert.
             * Das verhindert, dass der GNSS-Modus ein UI löscht, welches gerade vom ArUco-Modus geöffnet wurde!
             */
            if (!closestModelFound && currentTrackingID !== -1 && !isMarkerTracking) {
                 if (currentTrackingSource === "GNSS" || currentTrackingSource === "Pos. Simulation") {
                     currentTrackingID = -1;
                     currentTrackingSource = "";
                     modelInfo.style.display = 'none';
                     historicalInfo.style.display = 'none';
                     clickHint.style.opacity = "0"; // Sauberer CSS String zum Ausblenden
                 }
            }
        }

        // Haversine-Formel: Rechnet die Entfernung zwischen zwei GNSS-Koordinaten auf der gekrümmten Erdoberfläche aus.
        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Erdradius in Metern
            const rad = Math.PI/180;
            const dLat = (lat2-lat1)*rad; const dLon = (lon2-lon1)*rad;
            // Trigonometrische Funktionen für genaue Berechnungen
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); // Gibt die Distanz in Metern zurück
        }

        // Rechnet GNSS-Koordinaten in ein lokales Meter-Koordinatensystem für Three.js (X und Z) um.
        function calcOffset(lat1, lon1, lat2, lon2) {
            const R = 6378137; // Erdradius am Äquator
            const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            // dx wird mit dem Cosinus des Breitengrads korrigiert, weil Längengrade zu den Polen hin schmaler werden
            const dx = dLon * Math.cos(lat1Rad) * R; const dz = dLat * R; 
            return { x: dx, z: dz };
        }
        
        // Berechnet den Kompass-Winkel (Bearing), den man laufen muss, um vom Start zum Ziel zu gelangen.
        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * (Math.PI / 180); const startLngRad = startLng * (Math.PI / 180);
            const destLatRad = destLat * (Math.PI / 180); const destLngRad = destLng * (Math.PI / 180);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            // Math.atan2 gibt den Winkel zurück, der hier dann in ein 0-360 Grad Format gepresst wird.
            return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }

        // Analysiert das Kamerabild auf der Suche nach quadratischen ArUco-Markern
        function processArucoFrame(video) {
            // Wenn das Video noch nicht lädt, sofort abbrechen (return false)
            if (!video || video.readyState < video.HAVE_METADATA) return false;

            const cw = videoCanvas.width; const ch = videoCanvas.height;
            // Wenn der Bildschirm gedreht wurde, müssen wir die Zeichenfläche anpassen.
            if (cw !== window.innerWidth || ch !== window.innerHeight) {
                videoCanvas.width = window.innerWidth; videoCanvas.height = window.innerHeight;
                posit = new POS.Posit(markerSize, window.innerWidth);
            }

            // Berechnungen, um das Kamera-Video im korrekten Seitenverhältnis in den Canvas zu malen
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            // Zentriert das Bild, schneidet Ränder ab, wenn nötig.
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            
            // Bild vom Video auf das interne Canvas kopieren
            context2D.clearRect(0, 0, cw, ch);
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            // Pixel auslesen für den Algorithmus
            const imageData = context2D.getImageData(0, 0, cw, ch);
            // Canvas wieder leeren, damit es transparent ist und nur die roten Boxen gleich gezeichnet werden
            context2D.clearRect(0, 0, cw, ch); 

            // Der Detektor sucht nach Mustern im Pixel-Brei
            let markers = detector.detect(imageData);
            // Filtern: Zu kleine Marker und Fehler (wie ID 97) werden aussortiert
            markers = markers.filter(m => {
                const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                return d > 30 && m.id !== 97; 
            });

            let found = false;
            if (markers.length > 0) {
                markers.forEach(marker => {
                    // Zeichnet eine rote Umrandung um den Marker im Bildschirm
                    drawRedBox(marker.corners); drawIdText(marker.corners, marker.id);
                    // Verschiebt die Ecken für die 3D-Mathematik in die Mitte (0,0 Koordinatensystem)
                    const cornersCentered = marker.corners.map(c => ({ x: c.x - (cw / 2), y: (ch / 2) - c.y }));
                    // POSIT schätzt die 3D Lage (Pose) des Markers anhand der verzerrten Ecken
                    const pose = posit.pose(cornersCentered);
                    
                    if (pose) {
                        const r = pose.bestRotation; const t = pose.bestTranslation;
                        drawAxis(r, t, markerSize); // Zeichnet kleine RGB Linien (X, Y, Z Achsen)
                        const id = marker.id;
                        // Prüft, ob es ein Modell für diese Marker-Nummer gibt
                        if (AR_MODELS[id] && marker === markers[0]) {
                            found = true; 
                            lossCounter = 0; // Verlust-Zähler auf 0 setzen
                            updatePoseUI(r, t, id, "ArUco"); // Text updaten
                            
                            // Rechnet die rohen POSIT-Werte in das Three.js Format um
                            const targetPos = new THREE.Vector3(t[0], -t[1], -t[2]);
                            const m = new THREE.Matrix4();
                            m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
                            const fullQuat = new THREE.Quaternion().setFromRotationMatrix(m);
                            // Verhindert, dass das Modell kippt (wir übernehmen nur die Drehung um die Hochachse Y)
                            const euler = new THREE.Euler().setFromQuaternion(fullQuat, 'YXZ');
                            const uprightQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, euler.y, 0));
                            // Verschiebt das Modell an den Marker
                            updateActiveModelArUco(id, targetPos, uprightQuat);
                        }
                    }
                });
            }

            if (!found) {
                markerGroup.visible = false;
                lossCounter++; // Wenn der Marker weg ist, Zähler erhöhen
                if (lossCounter > maxLossFrames) {
                    /*
                     * BUGFIX: Hier darf das UI nur zurückgesetzt werden, wenn es vorher auch
                     * tatsächlich durch einen ArUco-Marker geöffnet wurde! Das verhindert 
                     * die störende Dauerschleife im GNSS-Modus.
                     */
                    if (currentTrackingID !== -1 && currentTrackingSource === "ArUco") {
                            modelInfo.style.display = 'none';
                            clickHint.style.opacity = "0";
                            historicalInfo.style.display = 'none'; 
                            currentTrackingID = -1;
                            currentTrackingSource = ""; // Quelle nach dem Löschen zurücksetzen
                    }
                    if(statusText.innerHTML.includes("Gefunden") || statusText.innerHTML.includes("Tracking")) {
                            statusText.innerHTML = "Warte auf GNSS Signal...";
                    }
                }
            }
            return found; // Meldet zurück, ob ein Marker gefunden wurde
        }

        // Baut die 2D-Orientierungskarte (Leaflet) zusammen
        function initMap() {
            // L.map erstellt die Karte und bindet sie an das HTML-Div
            mapStations = L.map(mapEl).setView([52.3895, 9.6975], 16);
            // L.tileLayer lädt die Kartenkacheln von OpenStreetMap herunter
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(mapStations);
            // Setzt kleine Pins für alle Stationen
            stations.forEach(s => { L.marker(s.coords).addTo(mapStations).bindPopup(`<strong>${s.title}</strong>`); });
            userLayer = L.layerGroup().addTo(mapStations); // Eine extra Ebene nur für den roten Nutzer-Punkt
            
            // Wenn man den Standort-Button klickt, springt die Karte zum Handy
            locateBtn.addEventListener('click', (e) => { e.stopPropagation(); if (lastPos) mapStations.setView([lastPos.latitude, lastPos.longitude], 17); else mapStations.locate({ setView: true, maxZoom: 17 }); });
            
            // Fragt beim Klicken die Erlaubnis ab, den Kompass des Handys nutzen zu dürfen (Wichtig für Apple iOS)
            orientBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { 
                        const res = await DeviceOrientationEvent.requestPermission(); 
                        if (res === 'granted') { 
                            window.addEventListener('deviceorientation', onDeviceOrientation, true); 
                            orientBtn.style.background = '#4f4'; 
                        } 
                    } catch (err) { console.warn(err); }
                } else { 
                    // Für Android und ältere Geräte
                    if ('ondeviceorientationabsolute' in window) {
                        window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
                    } else {
                        window.addEventListener('deviceorientation', onDeviceOrientation, true);
                    }
                    orientBtn.style.background = '#4f4'; 
                }
            });
            // Nach kurzer Verzögerung wird das GNSS des Handys (Geolocation API) aktiviert
            setTimeout(() => { if (navigator.geolocation) { navigator.geolocation.watchPosition(onPos, err => console.warn(err), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }); } }, 1500);
        }

        // Wird vom Browser aufgerufen, sobald neue GNSS-Daten vom Sensor ankommen
        function onPos(pos) {
            realPos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy || 5 };
            if (!isSimulatedPos) {
                lastPos = realPos;
                // Einmalig die Karte auf den Nutzer zentrieren
                if (mapStations && !mapStations._userCentered) { mapStations.setView([lastPos.latitude, lastPos.longitude], 17); mapStations._userCentered = true; }
                drawUserOnMap(lastPos);
            } else {
                if (lastPos) drawUserOnMap(lastPos);
            }
        }

        // Wird vom Browser aufgerufen, sobald sich das Handy dreht (Kompass-Sensoren)
        function onDeviceOrientation(e) {
            lastDeviceOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
            // Apple nutzt webkitCompassHeading, andere berechnen es aus Alpha
            if (e.webkitCompassHeading) rawHeading = e.webkitCompassHeading; else if (e.alpha !== null) rawHeading = (360 - e.alpha) % 360;
            // Der finale Winkel wird aus Rohdaten + magnetischer Abweichung + Kalibrierung zusammengebaut
            heading = (rawHeading + magDeclination + compassOffset) % 360;
            if (lastPos) drawUserOnMap(lastPos);
        }

        // Malt den kleinen roten Punkt (Nutzer) auf die Leaflet Karte
        function drawUserOnMap(p) {
            if (!userLayer) return; userLayer.clearLayers(); // Alten Punkt löschen
            // Der Kreis repräsentiert die GNSS-Ungenauigkeit (je ungenauer, desto größer der Kreis)
            L.circle([p.latitude, p.longitude], { radius: Math.max(p.accuracy, 4), color: 'rgba(255,0,0,0.6)', fillColor: 'rgba(255,0,0,0.12)', weight: 1 }).addTo(userLayer);
            // Baut eine kleine SVG-Vektorgrafik für den Pfeil und dreht ihn mit dem Heading-Winkel
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${heading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/><circle cx="0" cy="10" r="3" fill="red"/></g></svg>`;
            // Konvertiert die SVG in Text (Base64), um sie als Bild einzubinden
            const url = 'data:image/svg+xml;base64,' + btoa(svg);
            const icon = L.icon({ iconUrl: url, iconSize:[48, 48], iconAnchor:[24, 24], className: 'user-arrow' });
            L.marker([p.latitude, p.longitude], { icon: icon, interactive: false }).addTo(userLayer);
        }

        // Hilfsfunktion: Wandelt 3D-Koordinaten in 2D-Bildschirmkoordinaten um (für die ArUco-Anzeige)
        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -1000, y: -1000 }; // Ignoriert, was hinter der Kamera ist
            const f = videoCanvas.width; const scale = f / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        // Zeichnet das RGB Achsenkreuz auf erkannte Marker
        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans); // Mittelpunkt
            const ax = project([len, 0, 0], rot, trans); // X-Richtung
            const ay = project([0, len, 0], rot, trans); // Y-Richtung
            const az = project([0, 0, len], rot, trans); // Z-Richtung
            context2D.lineWidth = 4;
            // Linie X malen (Rot)
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            // Linie Y malen (Grün/Lime)
            context2D.strokeStyle = "lime"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            // Linie Z malen (Blau)
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        // Zeichnet die rote Umrandung um den ArUco-Marker
        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            // Verbindet alle 4 Ecken mit Linien
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        // Schreibt die gefundene ID-Nummer an den roten Rahmen
        function drawIdText(corners, id, source = "ArUco") {
            const pt = corners[0];
            context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10); // Schwarzer Rahmen für Lesbarkeit
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10); // Hellblaue Schrift
        }

        // Zeigt in der Debug-Box an, welche Rotation das getrackte ArUco Modell gerade hat
        function updatePoseUI(r, t, id, source = "ArUco") {
            const m = new THREE.Matrix4();
            m.set(r[0][0], r[0][1], r[0][2], t[0], -r[1][0], -r[1][1], -r[1][2], -t[1], -r[2][0], -r[2][1], -r[2][2], -t[2], 0, 0, 0, 1);
            const inv = m.clone().invert();
            const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const sc = new THREE.Vector3();
            inv.decompose(pos, quat, sc);
            const euler = new THREE.Euler().setFromQuaternion(quat);
            const x = (pos.x / 10).toFixed(0); const y = (pos.y / 10).toFixed(0); const z = (pos.z / 10).toFixed(0);
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);
            statusText.innerHTML = `<span style="color:yellow;">Gefunden: ID ${id} (${source})</span><br><div style="margin-top:8px; padding-top:5px; border-top:1px solid #777;"><span class="label-small">Position (Relativ)</span><br>X: ${x} cm | Y: ${y} cm | Z: ${z} cm</div><div style="margin-top:8px;"><span class="label-small">Rotation (relativ)</span><br>Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°</div>`;
        }

        // Modifizierte Trigger-Funktion: Blendet den Hinweis ("Tippe auf das Modell") sauber ein und lässt ihn ungestört ablaufen.
        function triggerHint() {
            // Wenn der Text gerade sichtbar ist, brechen wir hier sofort ab, um den Timer nicht ungewollt zu stören!
            if (clickHint.style.opacity === "1") return; 

            if (hintTimeout) {
                clearTimeout(hintTimeout); // Bricht einen alten, noch laufenden Timer ab
            }
            
            clickHint.style.opacity = "1"; // CSS Fade-In
            
            // Timeout auf 5000ms (5 Sekunden) gesetzt
            hintTimeout = setTimeout(() => { 
                clickHint.style.opacity = "0"; // CSS Fade-Out nach der Zeit
                hintTimeout = null; 
            }, 5000);
        }
        
        // ZENTRALE FUNKTION FÜR DAS UI (steuert Text, Kupferstich und den Klick-Hinweis)
        function updateUIForModel(id, sourceName) {
            // Die Abfrage prüft nun auch die "Tracking-Quelle", um Dauerschleifen zwischen GNSS und Markern zu verhindern.
            if (currentTrackingID !== id || currentTrackingSource !== sourceName) {
                currentTrackingID = id;
                currentTrackingSource = sourceName;
                
                // Modell-Infos nur anzeigen, wenn es nicht das reine Debug-Modell (ID 0) ist
                modelInfo.style.display = (id === 0 ? 'none' : 'block');
                
                // Wenn es die Fontäne ist, zeige den historischen Kupferstich
                if (id === 3 || id === 33) {
                    historicalInfo.style.display = 'block';
                } else {
                    historicalInfo.style.display = 'none';
                }

                // Textinhalte austauschen
                objTitle.innerText = AR_MODELS[id].title;
                objText.innerText = AR_MODELS[id].info;
                activeLink = AR_MODELS[id].link;
                
                // Zeige den 5-Sekunden-Hinweis an, sobald ein neues 3D-Modell fokussiert wurde.
                triggerHint();
            }
        }

        // Übernimmt die von ArUco berechnete Position und wendet sie weich (lerp/slerp) auf das 3D-Modell an.
        function updateActiveModelArUco(id, pos, quat) {
            if (AR_MODELS[id]) {
                Object.keys(loadedMeshes).forEach(key => { loadedMeshes[key].visible = (parseInt(key) === id); });
                updateUIForModel(id, "ArUco");
                markerGroup.visible = true;
                // lerp mischt die alte und neue Position (0.2 bedeutet 20% pro Schritt), das glättet das Wackeln
                markerGroup.position.lerp(pos, 0.2);
                markerGroup.quaternion.slerp(quat, 0.2);
            }
        }

        // Initialisierung des ArUco-Detektors aus der externen Bibliothek
        detector = new AR.Detector({ dictionaryName: selectedDictionary });
        // Initialisierung des Pose-Schätzers (für 3D-Koordinaten aus 2D-Bild)
        posit = new POS.Posit(markerSize, window.innerWidth);
        
        // Führt die oben definierten Start-Routinen aus
        initMap();
        startAR();

        // Texterkennung-Button Event-Listener (Öffnet eine neue HTML-Datei, falls vorhanden)
        document.getElementById('ocrBtn').addEventListener('click', () => {
            window.open('Texterkennung_Informationstafeln.html', '_blank');
        });

        // 3D-Viewer-Button Event-Listener (Öffnet eine Detail-Ansicht in neuem Tab)
        document.getElementById('viewerBtn').addEventListener('click', () => {
            window.open('Model_Viewer_AR_MA.html', '_blank');
        });

        // Kamerabutton wechselt von Back- auf Frontkamera (falls vom Modul unterstützt)
        switchCamBtn.addEventListener('click', () => { mindarThree.switchCamera(); });
        
        // Versteckt oder zeigt die kleine Karte in der Ecke an
        toggleMapBtn.addEventListener('click', () => {
            const isVisible = mapContainer.style.display === 'block';
            if (isVisible) { mapContainer.style.display = 'none'; toggleMapBtn.innerText = '🗺️'; toggleMapBtn.style.background = 'rgba(30, 30, 30, 0.85)'; }
            else { mapContainer.style.display = 'block'; toggleMapBtn.innerText = '✖'; toggleMapBtn.style.background = 'rgba(150, 0, 0, 0.85)'; if (mapStations) { setTimeout(() => mapStations.invalidateSize(), 50); } }
        });

        // Rotiert die 3D Modelle manuell per Button-Klick nach links (-0.2 Radiant)
        rotLeftBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
            ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z -= 0.2;
                
                // Dreht das GNSS Modell und (falls vorhanden) direkt auch das animierte Kind-Modell mit
                if(gnssMeshes[id]) {
                    if (gnssMeshes[id].visible) gnssMeshes[id].rotation.y -= 0.2;
                    if (gnssMeshes[id].userData.animMesh && gnssMeshes[id].userData.animMesh.visible) gnssMeshes[id].userData.animMesh.rotation.y -= 0.2;
                }
                
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { 
                    if(m.visible) m.rotation.y -= 0.2; 
                });
            });
        });
        
        // Rotiert die 3D Modelle manuell nach rechts (+0.2 Radiant)
        rotRightBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
             ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z += 0.2;
                
                if(gnssMeshes[id]) {
                    if (gnssMeshes[id].visible) gnssMeshes[id].rotation.y += 0.2;
                    if (gnssMeshes[id].userData.animMesh && gnssMeshes[id].userData.animMesh.visible) gnssMeshes[id].userData.animMesh.rotation.y += 0.2;
                }
                
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { 
                    if(m.visible) m.rotation.y += 0.2; 
                });
            });
        });

        // Klick auf das Infofenster unten (Text-Bereich) öffnet den Link zur Webseite
        modelInfo.addEventListener('click', () => { if (activeLink) window.open(activeLink, '_blank'); });
        
        // Raycaster (Virtueller Laserstrahl): Erkennt, wenn der Nutzer auf ein 3D-Modell in der Szene klickt.
        document.body.addEventListener('click', (event) => {
            // FILTER: Klicks auf UI-Elemente ignorieren! (Damit man z.B. bei Klick auf einen Button nicht das Modell dahinter trifft)
            if (event.target.closest('.ui-panel') || 
                event.target.closest('#mapControls') || 
                event.target.closest('.leaflet-container') ||
                event.target.closest('.icon-btn')) {
                return;
            }

            if (!camera) return;
            // Berechnet die Maus-Position (oder Finger) auf einem Bereich von -1 bis +1 (Zentrum ist 0,0)
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Der Raycaster schießt virtuell einen Laserstrahl von der Kamera aus durch den angeklickten Punkt
            const raycaster = new THREE.Raycaster(); raycaster.setFromCamera(mouse, camera);
            
            let objectsToCheck =[];
            // Sammelt alle derzeit sichtbaren Objekte zusammen, die vom Raycaster geprüft werden sollen
            Object.values(loadedMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            Object.values(mindARMeshes).forEach(meshArray => {
                if (Array.isArray(meshArray)) { meshArray.forEach(m => { if(m.visible) objectsToCheck.push(m); }); }
            });
            
            // Sucht auch explizit in der GNSS-Gruppe nach dem statischen und animierten Modell
            Object.values(gnssMeshes).forEach(m => { 
                if(m.visible) objectsToCheck.push(m); 
                // Fügt das animierte Modell in die Prüfung ein, falls es gerade abgespielt wird
                if(m.userData.animMesh && m.userData.animMesh.visible) objectsToCheck.push(m.userData.animMesh);
            });
            
            if(objectsToCheck.length === 0) return;
            // intersectObjects ermittelt alle Überschneidungen des Laserstrahls mit den gesammelten Objekten
            const intersects = raycaster.intersectObjects(objectsToCheck, true);
            
            if (intersects.length > 0) {
                // Das erste getroffene Element (nächste zur Kamera)
                let clickedObj = intersects[0].object;
                
                // Modelle bestehen oft aus vielen Einzelteilen (Augen, Arme etc.). Diese Schleife läuft "hoch" zum übergeordneten Hauptmodell.
                while(clickedObj.parent && clickedObj.parent.type !== 'Scene') {
                     
                     // Prüft für GNSS/Simulations-Modelle (Hier liegt nun auch unser Fechter Target 9!)
                     for(let[key, val] of Object.entries(gnssMeshes)) {
                         
                         let isStaticHit = (val === clickedObj);
                         let isAnimHit = (val.userData.animMesh === clickedObj);
                         
                         // Falls das statische Modell ODER das animierte Modell angetippt wurde
                         if(isStaticHit || isAnimHit) {
                             
                             // ANIMATIONS-WECHSEL FÜR TARGET 9
                             // Wenn das Modell eine versteckte Animation besitzt (also der Nutzer gerade darauf geklickt hat)
                             if (val.userData.animMesh && !val.userData.animMesh.visible) {
                                 // Blendet das statische Modell sofort aus
                                 val.visible = false;
                                 
                                 // Ultimative Absicherung: Kopiert die exakten Welt-Koordinaten im Moment des Klicks
                                 // So erscheint das animierte Modell garantiert exakt dort, wo das statische war.
                                 val.userData.animMesh.position.copy(val.position);
                                 val.userData.animMesh.rotation.copy(val.rotation);
                                 val.userData.animMesh.scale.copy(val.scale);
                                 
                                 // Blendet das animierte Modell ein
                                 val.userData.animMesh.visible = true;
                                 
                                 if (val.userData.animAction) {
                                     // Setzt die Animation absolut sauber auf den Anfang (Frame 0) zurück
                                     val.userData.animAction.reset();
                                     // Startet die Jump-Animation
                                     val.userData.animAction.play();
                                 }
                                 
                                 // Aktualisiert das UI-Fenster kurz, ohne den Link aufzurufen
                                 let label = isSimulatedPos ? "Pos. Simulation" : "GNSS";
                                 updateUIForModel(parseInt(key), label);
                                 return; // Der Vorgang wird gestoppt (Link öffnet sich nicht)
                             } 
                             // Wenn keine Animation existiert (z.B. andere Modelle) oder sie schon läuft
                             else {
                                 activeLink = AR_MODELS[key].link;
                                 let label = isSimulatedPos ? "Pos. Simulation" : "GNSS";
                                 updateUIForModel(parseInt(key), label);
                                 window.open(activeLink, '_blank');
                                 return;
                             }
                         }
                     }
                     
                     // Prüft für herkömmliche MindAR-Modelle
                     for(let id in mindARMeshes) {
                         if(mindARMeshes[id].includes(clickedObj)) {
                             activeLink = AR_MODELS[id].link;
                             updateUIForModel(parseInt(id), "MindAR");
                             window.open(activeLink, '_blank');
                             return;
                         }
                     }
                     
                     // Geht eine Hierarchie-Ebene im Modell höher
                     clickedObj = clickedObj.parent;
                }
                // Fallback, falls das Modell bereits als ganzes erkannt wurde
                if (currentTrackingID !== -1 && activeLink) window.open(activeLink, '_blank');
            }
        });
    </script>
