<!DOCTYPE html>
<!-- Deklariert das Dokument als HTML5-Standard -->
<html lang="de">
<head>
    <!-- Legt die Zeichencodierung auf UTF-8 fest, damit Umlaute (ä, ö, ü) korrekt angezeigt werden -->
    <meta charset="UTF-8">
    <!-- 
        Viewport-Einstellungen: 
        Definiert den sichtbaren Bereich auf mobilen Geräten. 
        'user-scalable=no' verhindert das Zoomen, um die AR-Darstellung stabil zu halten.
        'maximum-scale=1.0' und 'initial-scale=1.0' erzwingen die originale Darstellungsgröße.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Der Titel, der im Browser-Tab angezeigt wird -->
    <title>Herrenhäuser Gärten Hannover - Augmented Reality (AR)</title>
    
    <!-- Leaflet CSS: Die Stilvorlagen für die 2D-Karte werden geladen. 
         Leaflet ist eine Open-Source-Bibliothek für interaktive Karten. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importmap: Die Speicherorte für externe Module (Three.js und MindAR) werden definiert. 
         Das erlaubt es, in JavaScript Module einfach mit ihrem Namen (z.B. "three") zu importieren, 
         ohne jedes Mal die lange URL angeben zu müssen. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    
    <!-- Tesseract.js: Bibliothek für optische Zeichenerkennung (OCR) wird eingebunden. 
         Diese erlaubt es, Text auf Bildern direkt im Browser auszulesen. -->
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>

    <!-- CSS Styles: Die visuelle Gestaltung der Benutzeroberfläche wird festgelegt. -->
    <style>
        /* Basis-Layout: Der Hintergrund wird schwarz gesetzt, Scrollleisten werden ausgeblendet. 
           margin: 0 und padding: 0 entfernen standardmäßige Abstände des Browsers.
           overflow: hidden verhindert, dass man die Seite scrollen kann. */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Das Video-Element wird von MindAR verwaltet und hier ausgeblendet. 
           MindAR projiziert das Kamerabild selbst in den 3D-Hintergrund. */
        #videoElement { display: none; }

        /* Canvas über dem Video für Debug-Linien (ArUco Visualisierung). 
           z-index: 30 legt fest, dass es über den unteren Ebenen liegt.
           pointer-events: none sorgt dafür, dass Klicks "durch" dieses Element hindurchgehen. */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; pointer-events: none;
        }

        /* Container für die 3D-Szene (Three.js Layer). 
           Hier werden alle 3D-Modelle gerendert. pointer-events: auto erlaubt Klicks auf 3D-Objekte. */
        #container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: auto; overflow: hidden;
        }

        /* Standard-Design für UI-Elemente (halbtransparentes Schwarz mit Unschärfe-Effekt). 
           backdrop-filter: blur(8px) erzeugt den modernen "Milchglas"-Effekt (Glassmorphism). 
           transition sorgt für weiche Animationen bei Veränderungen. */
        .ui-panel {
            position: absolute; z-index: 100; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2); color: white;
            border-radius: 12px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }

        /* Debug-Informationen werden oben links positioniert. 
           calc(100% - 100px) sorgt dafür, dass die Box auf kleinen Bildschirmen nicht zu breit wird. */
        #debugInfo {
            top: 20px; left: 20px; padding: 15px; min-width: 200px;
            max-width: calc(100% - 100px); font-size: 13px; pointer-events: none;
        }

        /* Styling für fettgedruckten Text innerhalb der Debug-Info Box */
        #debugInfo strong {
            display: block; margin-bottom: 8px; color: #ffffff;
            font-weight: bold; font-size: 11px; 
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px; line-height: 1.3;
        }

        /* Der Schließen-Button wird oben rechts positioniert. 
           display: flex hilft dabei, den Inhalt (das 'X') perfekt zentriert auszurichten. */
        #closeBtn {
            top: 20px; right: 20px; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px; cursor: pointer;
            background: rgba(200, 40, 40, 0.85);
            border: 1px solid rgba(255, 100, 100, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        /* :active wird angewendet, wenn der Button gerade angetippt wird (Klick-Feedback) */
        #closeBtn:active { transform: scale(0.95); }

        /* Texterkennung-Button unter dem Schließen-Button platziert */
        #ocrBtn {
            top: 75px; right: 20px; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; cursor: pointer;
            background: rgba(40, 100, 200, 0.85);
            border: 1px solid rgba(100, 150, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #ocrBtn:active { transform: scale(0.95); }

        /* 3D-Viewer-Button unter dem Texterkennungs-Button platziert */
        #viewerBtn {
            top: 115px; right: 20px; width: 30px; height: 30px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; cursor: pointer;
            background: rgba(40, 180, 100, 0.85); 
            border: 1px solid rgba(100, 255, 150, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #viewerBtn:active { transform: scale(0.95); }

        /* Das Informationsfeld für 3D-Modelle wird unten mittig angezeigt. 
           transform: translateX(-50%) ist ein CSS-Trick, um ein absolut positioniertes Element exakt mittig zu platzieren. */
        #modelInfo {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 400px; text-align: center; display: none; cursor: pointer; z-index: 200; 
        }
        /* Styling für die Überschrift im Info-Panel */
        #modelInfo h3 { color: #4f4; margin: 0 0 4px 0; font-size: 18px; font-weight: bold; }
        /* Styling für den Beschreibungstext im Info-Panel */
        #modelInfo p { color: #eee; margin: 0; font-size: 14px; line-height: 1.3; }

        /* Historisches Bild (Kupferstich) wird rechts mittig platziert. */
        #historicalInfo {
            display: none; top: 50%; right: 20px; left: auto;
            transform: translateY(-50%); width: 180px; padding: 10px; text-align: center; z-index: 250;
        }
        #historicalInfo h4 {
            margin: 0 0 8px 0; font-size: 12px; color: #ffda85; 
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px;
        }
        /* Begrenzt die Bildbreite auf 100% des Containers, um Verzerrungen zu vermeiden */
        #historicalInfo img {
            width: 100%; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Container für die Kartensteuerung unten rechts. 
           flex-direction: column ordnet die Inhalte von oben nach unten an. */
        #mapControls {
            position: absolute; bottom: 20px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
        }

        /* Der eigentliche Karten-Container, der anfänglich ausgeblendet ist (display: none) */
        #mapContainer {
            position: relative; width: 240px; height: 180px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; pointer-events: auto;
        }

        /* Dieses div enthält später die Leaflet-Karte */
        #mapStations { width: 100%; height: 100%; }

        /* Overlay für die kleinen Buttons (Standort, Orientierung) innerhalb der Karte */
        .map-btn-overlay {
            position: absolute; top: 5px; right: 5px;
            display: flex; flex-direction: column; gap: 4px; z-index: 1000;
        }

        /* Stil für die kleinen Icon-Buttons auf der Karte */
        .icon-btn {
            background: rgba(255, 255, 255, 0.9); border: none; border-radius: 4px; padding: 6px;
            cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Container für die Buttons unterhalb der Karte */
        .bottom-right-btns { display: flex; gap: 12px; }

        /* Stil für die Haupt-Aktions-Buttons (z.B. Karte öffnen, Kamera wechseln) */
        .action-btn {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Steuerung für die manuelle Rotation unten links. */
        #rotationControls {
            position: absolute; bottom: 20px; left: 20px; z-index: 100; display: flex; gap: 12px;
        }

        /* Stil für die Rotations-Buttons (Links-/Rechtsdrehung) */
        .rotate-btn {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 26px; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Höhen-Regler, vertikal positioniert in der linken Mitte. 
           Ermöglicht dem Nutzer, die Kamera-Höhe in der 3D-Welt anzupassen. */
        #height-control {
            top: 50%; left: 20px; transform: translateY(-50%); 
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 10px; border-radius: 30px;
        }
        #height-control span { 
            font-weight: bold; margin-bottom: 5px; font-size: 14px; 
        }
        /* -webkit-appearance überschreibt das Standard-Design des Browsers, um den Slider vertikal zu machen */
        #heightSlider {
            -webkit-appearance: slider-vertical; appearance: slider-vertical;
            width: 8px; height: 120px; margin: 10px 0; cursor: pointer;
        }

        /* Hinweis-Text für Interaktionen in der Bildschirmmitte. 
           opacity: 0 versteckt den Text zu Beginn. Mit transition wird er später sanft eingeblendet. */
        #clickHint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; font-size: 1.3rem;
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Richtungspfeil für GNSS-Navigation. 
           Zeigt dem Nutzer die Richtung an, in der sich das nächste 3D-Modell befindet. */
        #direction-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 95;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); pointer-events: none; transition: opacity 0.5s; opacity: 0;
        }
        
        /* Das CSS-Dreieck für den Richtungspfeil. 
           Durch Rahmen (border) mit transparenten Seiten wird ein Dreieck geformt. */
        #arrow {
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-bottom: 30px solid #00ff00; /* Grüner Pfeil */
            transform-origin: center 20px;
            filter: drop-shadow(0 0 4px #00ff00); transform: rotate(0deg); transition: transform 0.2s ease-out;
        }

        /* Hilfsklassen zur Formatierung von Text in Info-Panels */
        .label-small { font-size: 11px; color: #bbb; margin-right: 5px; text-transform: uppercase; }
        .val-highlight { color: #fff; font-weight: bold; }
        .val-green { color: #4f4; font-weight: bold; }

    </style>
</head>
<body>

    <!-- ÜBERLAGERNDES FENSTER (STARTBILDSCHIRM) 
         Dieses Element dunkelt den Hintergrund ab und zeigt eine kleine Vorschau-Webseite 
         bevor der Nutzer die eigentliche AR-Anwendung startet. -->
    <div id="introOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <!-- Innerer Container für das Fenster -->
        <div style="width: 80%; height: 80%; background: #222; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
            
            <!-- Titelzeile des Fensters -->
            <div style="padding: 15px; text-align: center; font-weight: bold; font-size: 0.8rem; color: #fff; background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(255,255,255,0.2);">
                Überblick über die vielen Highlights im Großen Garten
            </div>
            
            <!-- Einbettung einer externen Webseite in das Fenster (Iframe) -->
            <iframe src="https://www.gartenis.de/" allow="geolocation" style="flex: 1; width: 100%; border: none; background: #fff;"></iframe>
            
            <!-- Fußzeile mit dem Button zum Schließen des Fensters und Starten der AR -->
            <div style="padding: 15px; text-align: center; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.2);">
                <button id="closeIntroBtn" style="background: rgba(40, 180, 100, 0.9); color: white; border: 1px solid rgba(100, 255, 150, 0.5); padding: 12px 24px; font-size: 0.8rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s;">
                    Virtuelle Tour in Augmented Reality starten!
                </button>
            </div>
        </div>
    </div>

    <!-- Skript für das Startbildschirm-Overlay -->
    <script>
        // Wird ausgeführt, wenn der Button im Intro-Fenster geklickt wird
        document.getElementById('closeIntroBtn').addEventListener('click', function(event) {
            event.stopPropagation(); // Stoppt das Durchklicken auf darunterliegende Elemente (wie z.B. 3D-Modelle)
            document.getElementById('introOverlay').style.display = 'none'; // Blendet das Startfenster aus
        });

        // Verhindert ebenfalls, dass Klicks auf den abgedunkelten Randbereich des Overlays durchgereicht werden
        document.getElementById('introOverlay').addEventListener('click', function(event) {
            event.stopPropagation();
        });
    </script>
    <!-- ENDE OVERLAY -->

    <!-- Video-Element für den Kamerazugriff 
         Spielt das Kamera-Bild automatisch (autoplay) und ohne Ton (muted) ab. -->
    <video id="videoElement" playsinline muted autoplay autofocus></video>
    
    <!-- 3D-Container für die Three.js Szene. Hier baut die JavaScript-Engine die dreidimensionale Welt auf. -->
    <div id="container"></div>
    
    <!-- 2D-Overlay Canvas für Debugging (ArUco Erkennung). 
         Hierauf werden rote Rahmen um erkannte Marker gezeichnet, ohne die 3D-Welt zu stören. -->
    <canvas id="videoCanvas"></canvas>

    <!-- UI: Debug-Informationen zur Anzeige von Systemzuständen, Koordinaten und Fehlern -->
    <div id="debugInfo" class="ui-panel">
        <strong id="debugTitle">Herrenhäuser Gärten - Augmented Reality (AR)</strong>
        <div id="statusText">Starte System...<br><span style='color: #aaa;'>Initialisiere...</span></div>
    </div>

    <!-- UI: Schließen-Button (Geht eine Seite zurück oder schließt das Fenster, falls keine Historie existiert) -->
    <div id="closeBtn" class="ui-panel" title="Schließen" onclick="window.history.length > 1 ? window.history.back() : window.close()">✕</div>

    <!-- UI: Texterkennung-Button -->
    <div id="ocrBtn" class="ui-panel" title="Texterkennung Informationstafeln">📄</div>
    
    <!-- UI: 3D-Viewer-Button hinzugefügt -->
    <div id="viewerBtn" class="ui-panel" title="3D-Modell Viewer öffnen">🧊</div>

    <!-- UI: Historisches Bild (Kupferstich). Wird eingeblendet, wenn die Fontäne betrachtet wird. -->
    <div id="historicalInfo" class="ui-panel">
        <h4>Kupferstich Große Fontäne um 1800</h4>
        <img src="https://herrenhaeuser-gaerten.hannover.de/var/storage/images/_aliases/alias_1600xVariabel/9/4/8/5/25555849-2-ger-DE/a12171440e88-Stich_Grosse_Fontaene.jpg" alt="Historischer Stich">
    </div>

    <!-- UI: Richtungspfeil. Ein Container für den rotierenden Pfeil. -->
    <div id="direction-indicator">
        <div id="arrow"></div>
    </div>

    <!-- UI: Modell-Informationen. Zeigt Titel und Beschreibung des aktuell fokussierten 3D-Modells. -->
    <div id="modelInfo" class="ui-panel">
        <h3 id="objTitle">Titel</h3>
        <p id="objText">Beschreibung</p>
    </div>

    <!-- UI: Hinweis zum Antippen (wird nun für 5 Sekunden eingeblendet) -->
    <div id="clickHint">👆 Tippe auf das 3D-Modell<br>für weitere Informationen</div>

    <!-- UI: Kartensteuerung. Beinhaltet die Mini-Map und Buttons unten rechts. -->
    <div id="mapControls">
        <!-- Der Container, in dem Leaflet die Karte platziert -->
        <div id="mapContainer">
            <div id="mapStations"></div>
            <!-- Overlay-Buttons auf der Karte -->
            <div class="map-btn-overlay">
                <button id="locateBtn" class="icon-btn" title="Standort">📍</button>
                <button id="orientBtn" class="icon-btn" title="Ausrichtung">🧭</button>
            </div>
        </div>
        <!-- Haupt-Buttons zum Ein-/Ausklappen der Karte und Wechseln der Kamera (Front/Back) -->
        <div class="bottom-right-btns">
            <button id="toggleMapBtn" class="ui-panel action-btn">🗺️</button>
            <button id="switchCamBtn" class="ui-panel action-btn">📷</button>
        </div>
    </div>

    <!-- UI: Rotationssteuerung zum manuellen Drehen der 3D-Modelle -->
    <div id="rotationControls">
        <button id="rotLeftBtn" class="ui-panel rotate-btn">↺</button>
        <button id="rotRightBtn" class="ui-panel rotate-btn">↻</button>
    </div>

    <!-- UI: Höhen-Slider Menü (Vertikal auf der linken Seite). Verstellt die Höhe der Kamera. -->
    <div id="height-control" class="ui-panel">
        <span>Höhe</span>
        <!-- Der Bereich geht von tief unterirdisch (-10.0) bis sehr hoch (10.0) -->
        <input type="range" orient="vertical" id="heightSlider" min="-10.0" max="10.0" step="0.1" value="1.6">
    </div>

    <!-- Externe Skripte für Mapping und AR-Funktionalität einbinden.
         Diese Skripte stammen aus anderen Quellen (CDN) und liefern Programmbibliotheken. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    
    <!-- Hauptlogik der Anwendung. type="module" erlaubt es, Import-Befehle zu verwenden. -->
    <script type="module">
        // Import der Three.js Kernbibliothek (Die Engine für alles, was 3D ist)
        import * as THREE from 'three';
        // Import des GLTF-Loaders für 3D-Modelle (Zum Einlesen von .glb oder .gltf Dateien)
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        // Import der MindAR Bibliothek für bildbasiertes Tracking (Erkennt Bilder in der Kamera)
        import { MindARThree } from 'mindar-image-three';

        // --- KONFIGURATION DER ANWENDUNG ---
        // Konstanten (const) ändern sich zur Laufzeit nicht. 
        const markerSize = 100.0; // Kantenlänge der ArUco-Marker in mm (für die Skalierung der 3D-Welt wichtig)
        const selectedDictionary = 'ARUCO_MIP_36h12'; // Verwendetes ArUco-Wörterbuch (Definiert, welche Marker-Muster erkannt werden)
        const VISIBILITY_DISTANCE = 75.0; // Distanz in Metern, ab der GNSS-Modelle angezeigt werden
        
        // Magnetische Deklination für Hannover (Korrekturwert zum geographischen Norden, da magnetisch Nord leicht abweicht)
        const magDeclination = 3.5;

        // Koordinaten für die Simulations-Trigger (GNSS Daten der Standorte)
        const target0Lat = 52.386444; // Fontäne Breitengrad
        const target0Lon = 9.695780;  // Fontäne Längengrad

        const targetBlumengartenLat = 52.388029; // Blumengarten Breitengrad
        const targetBlumengartenLon = 9.697794;  // Blumengarten Längengrad

        // Definition der verfügbaren 3D-Modelle und ihrer Eigenschaften in einem JavaScript-Objekt (JSON-artig).
        // 'initRotation' bestimmt die initiale Drehung des Modells relativ zu Norden (in Grad).
        const AR_MODELS = {
            0: { 
                url: '3D_models/Koenig.glb', scale: 150.0, 
                title: 'König Georg I.', info: 'Referenzmodell (ID 0)', link: null,
                lat: null, lon: null, initRotation: 0 
            },
            1: { 
                url: '3D_models/Statue_3D.glb', scale: 90.0, 
                title: 'Niederdeutscher Blumengarten', 
                info: 'Sandsteinstatue "Veritas" von 1730', 
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Gro%C3%9Fer-Garten/Der-Niederdeutsche-Blumengarten',
                // mindTargetIndexes listet alle MindAR-Target-Indizes auf, bei denen dieses Modell angezeigt werden soll.
                mindTargetIndexes:[1, 2, 3, 4, 5, 6, 7, 8], 
                lat: 52.388196, lon: 9.697853,
                initRotation: 354
            },
            2: { 
                url: '3D_models/BorghesischerFechter_WebAR.glb', scale: 26000.0, 
                title: 'Borghesischer Fechter', info: 'Borghesischer Fechter am Gartentheater', 
                link: 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen',
                lat: 52.389463, lon: 9.699207,
                initRotation: 341 
            },
            3: { 
                url: '3D_models/GrosseFontaine_WebAR.glb', scale: 8000.0, 
                title: 'Große Fontäne', info: 'Große Fontäne - Wahrzeichen des Großen Gartens', 
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
                isAnimated: true, mindTargetIndexes: [0],

        // Erstellung eines Partikelsystems (Wasserfontäne)
        function createWaterEffect() {
            const particleCount = 15000; // Anzahl der Wassertropfen
            // BufferGeometry ist extrem performant, da sie direkt auf der Grafikkarte läuft
            const geometry = new THREE.BufferGeometry();
            // Ein Float32Array ist ein sehr effizienter Weg, um viele Zahlen (Koordinaten) zu speichern.
            // Jeder Tropfen braucht 3 Werte (X, Y, Z).
            const positions = new Float32Array(particleCount * 3); 
            const velocities = new Float32Array(particleCount * 3); // Speicher für Bewegungsgeschwindigkeit

            // Schleife geht durch alle Partikel und vergibt Startwerte
            for (let i = 0; i < particleCount; i++) {
                // Alle starten im Ursprung (0,0,0)
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                // Zufällige Geschwindigkeit für X, Y, Z berechnen (damit es spritzt)
                velocities[i*3] = (Math.random() - 0.5) * 0.036;     
                velocities[i*3+1] = (Math.random() * 0.3 + 0.15);    
                velocities[i*3+2] = (Math.random() - 0.5) * 0.036;   
            }

            // Die Arrays werden der Geometrie als Attribute zugewiesen
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            // Das Material bestimmt das Aussehen (hellblau, leicht transparent, Additiv-Blending für einen Leuchteffekt)
            const material = new THREE.PointsMaterial({
                color: 0xaaddff, size: 0.03, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            });
            // Punkte-Objekt erstellen und die Geschwindigkeiten zum späteren Auslesen in 'userData' speichern
            const points = new THREE.Points(geometry, material);
            points.userData.vels = velocities; 
            points.frustumCulled = false; // Verhindert, dass das Partikelsystem abgeschnitten wird, wenn die Kamera sich wegdreht
            return points;
        }

        // Animation des Wassereffekts (wird pro Frame aufgerufen)
        function updateWaterEffect(points) {
            // Holt sich die aktuellen Positionen und Geschwindigkeiten
            const pos = points.geometry.attributes.position.array;
            const vels = points.userData.vels;
            const gravity = 0.003; // Gravitationskraft, die das Wasser nach unten zieht

            // Geht wieder alle Partikel durch
            for (let i = 0; i < pos.length / 3; i++) {
                // Addiert die Geschwindigkeit auf die Position
                pos[i*3] += vels[i*3];     
                pos[i*3+1] += vels[i*3+1]; 
                pos[i*3+2] += vels[i*3+2]; 
                // Zieht bei jedem Durchlauf etwas Geschwindigkeit von der vertikalen Y-Achse ab (Falleffekt)
                vels[i*3+1] -= gravity; 

                // Wenn der Tropfen den Boden erreicht (Y < 0), wird er zurück nach oben teleportiert
                if (pos[i*3+1] < 0) {
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
                    vels[i*3] = (Math.random() - 0.5) * 0.036; 
                    vels[i*3+1] = (Math.random() * 0.3 + 0.15); 
                    vels[i*3+2] = (Math.random() - 0.5) * 0.036; 
                }
            }
            // Teilt der Grafikkarte mit, dass sich die Koordinaten geändert haben
            points.geometry.attributes.position.needsUpdate = true; 
        }

        // Erstellung eines Maßstabs neben der Fontaine (angepasst auf halbe Ausdehnung/Höhe)
        function createMeasureBar() {
            // Eine Gruppe bündelt mehrere 3D-Objekte, damit sie gemeinsam bewegt werden können
            const group = new THREE.Group();
            
            // Horizontale Linie UNTEN (an der Unterkante des Modells, jetzt nur die halbe Breite: -0.875 bis 0.875)
            const horizontalBottomGeometry = new THREE.BufferGeometry();
            const horizontalBottomPositions = new Float32Array([
                -0.875, 0, 0,    // Links (Startpunkt der Linie)
                0.875, 0, 0      // Rechts (Endpunkt der Linie)
            ]);
            horizontalBottomGeometry.setAttribute('position', new THREE.BufferAttribute(horizontalBottomPositions, 3));
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 4, fog: false }); // Blaue Linie behalten
            const horizontalBottom = new THREE.Line(horizontalBottomGeometry, lineMaterial);
            group.add(horizontalBottom);
            
            // Vertikale Linie (jetzt die exakte halbe Höhe, um im Sichtfeld zu bleiben)
            const verticalGeometry = new THREE.BufferGeometry();
            const verticalPositions = new Float32Array([
                0, 0, 0,        // Unten
                0, 1.75, 0      // Oben (Halb so hoch wie vorher 3.5)
            ]);
            verticalGeometry.setAttribute('position', new THREE.BufferAttribute(verticalPositions, 3));
            const vertical = new THREE.Line(verticalGeometry, lineMaterial);
            group.add(vertical);
            
            // Horizontale Linie OBEN (halbe Ausdehnung auf der neuen Höhe 1.75)
            const horizontalTopGeometry = new THREE.BufferGeometry();
            const horizontalTopPositions = new Float32Array([
                -0.875, 1.75, 0,  // Links
                0.875, 1.75, 0    // Rechts
            ]);
            horizontalTopGeometry.setAttribute('position', new THREE.BufferAttribute(horizontalTopPositions, 3));
            const horizontalTop = new THREE.Line(horizontalTopGeometry, lineMaterial);
            group.add(horizontalTop);
            
            // Kleine Markierungen unten (Zwei winzige Striche, angepasst an die halbe Breite)
            const markBottomGeometry = new THREE.BufferGeometry();
            const markBottomPositions = new Float32Array([
                -0.875, -0.2, 0,
                -0.875, 0.2, 0,
                0.875, -0.2, 0,
                0.875, 0.2, 0
            ]);
            markBottomGeometry.setAttribute('position', new THREE.BufferAttribute(markBottomPositions, 3));
            const markMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 2, fog: false });
            const markBottom = new THREE.LineSegments(markBottomGeometry, markMaterial);
            group.add(markBottom);
            
            // Kleine Markierungen oben (angepasst an die halbe Breite und neue Höhe)
            const markTopGeometry = new THREE.BufferGeometry();
            const markTopPositions = new Float32Array([
                -0.875, 1.55, 0,
                -0.875, 1.95, 0,
                0.875, 1.55, 0,
                0.875, 1.95, 0
            ]);
            markTopGeometry.setAttribute('position', new THREE.BufferAttribute(markTopPositions, 3));
            const markTop = new THREE.LineSegments(markTopGeometry, markMaterial);
            group.add(markTop);
            
            // Ein 2D-Canvas wird erstellt, um Text ("72 m") als Bild (Textur) in die 3D-Welt zu laden.
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0000ff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Text geändert zu "72 m"
            ctx.fillText('72 m', 128, 32);
            
            // Die gezeichnete Schrift wird in eine Textur umgewandelt und auf ein Sprite gelegt.
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            // Das Schild wird weiter unten platziert (exakt in der Mitte der vertikalen Achse, also bei 0.875)
            sprite.position.set(0, 0.875, 0);  
            sprite.scale.set(2, 0.5, 1);
            group.add(sprite);
            
            group.userData.isMeasureBar = true; // Markierung für eventuelle spätere Abfragen
            return group;
        }

        // Initialisierung und Start der AR-Engine (async erlaubt Warte-Befehle wie "await")
        const startAR = async () => {
            // Erstellen der MindAR Instanz und Verknüpfung mit dem HTML-Container
            mindarThree = new MindARThree({
                container: document.querySelector("#container"),
                imageTargetSrc: 'ImageMatching/GrosseFontaineInfo_NiederdeutscherBlumengarten_BorghesischerFechter_targets.mind',
                uiLoading: "no", uiScanning: "no", uiError: "no", // Schaltet Standard-Ladebildschirme aus
                filterMinCF: 0.0001, filterBeta: 0.001, // Filter zur Stabilisierung des Trackings (gegen Wackeln)
                maxTrack: 2  // Gibt an, wie viele Bilder gleichzeitig erkannt werden können
            });

            // Herausholen der Hauptkomponenten aus MindAR
            renderer = mindarThree.renderer;
            scene = mindarThree.scene;
            camera = mindarThree.camera;

            // Der HTML-Schieberegler für die Höhe wird mit der 3D-Kamera verknüpft
            const hSlider = document.getElementById('heightSlider');
            if (hSlider) {
                // Startwert setzen
                camera.position.y = parseFloat(hSlider.value);
                // EventListener wartet auf 'input' (wenn der Nutzer schiebt) und ändert sofort die Höhe
                hSlider.addEventListener('input', (e) => {
                    camera.position.y = parseFloat(e.target.value);
                });
            }

            // camera.far gibt an, wie weit die Kamera in die Ferne blicken kann, bevor Objekte abgeschnitten werden.
            camera.far = 50000; camera.updateProjectionMatrix();
            
            // Ein System (Renderer) wird erstellt, das die 3D-Welt in ein 2D-Bild für den Bildschirm umrechnet
            // setClearColor auf Transparenz (0), damit das Kameravideo im Hintergrund sichtbar bleibt
            renderer.setClearColor(0x000000, 0);
            
            // Die Berechnung von Schatten wird generell für die Engine aktiviert
            renderer.shadowMap.enabled = true;
            // Die Art des Schattens wird auf "weich" gestellt (hohe Qualität)
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            
            // Beleuchtung hinzufügen
            // AmbientLight beleuchtet alles gleichmäßig, ohne Schatten zu werfen.
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); 
            
            // DirectionalLight funktioniert wie eine Sonne und gibt gerichtet Licht von oben.
            const dl = new THREE.DirectionalLight(0xffffff, 2.0); 
            // Angepasst für optimalen Schattenwurf im lokalen AR-Modus
            dl.position.set(-3, 4, -1);
            // Es wird eingestellt, dass diese Lampe Schatten werfen darf
            dl.castShadow = true;
            
            // Die Qualität (Auflösung) des Schattens wird hochgesetzt
            dl.shadow.mapSize.width = 1024;
            dl.shadow.mapSize.height = 1024;
            // Der Bereich, in dem Schatten berechnet werden, wird genau definiert, um Rechenleistung zu sparen
            dl.shadow.camera.near = 0.5;
            dl.shadow.camera.far = 50; 
            dl.shadow.camera.left = -10;
            dl.shadow.camera.right = 10;
            dl.shadow.camera.top = 10;
            dl.shadow.camera.bottom = -10;
            // Ein kleiner Korrekturwert verhindert Grafikfehler beim Schatten ("Shadow Acne")
            dl.shadow.bias = -0.001; 
            // Die Lampe wird endgültig zur Szene hinzugefügt
            scene.add(dl);
            
            // Das Ziel der Lampe wird in der Szene verankert, damit es auf das 3D-Modell zeigen kann
            scene.add(dl.target);
            dl.target.position.set(0, 0, -2);

            // Gruppen erstellen, um Marker und GNSS-Modelle sauber zu trennen
            markerGroup = new THREE.Group(); markerGroup.visible = false; scene.add(markerGroup);
            gnssGroup = new THREE.Group(); gnssGroup.visible = true; scene.add(gnssGroup);

            // Eine unsichtbare Fläche (Boden) wird erstellt, um Schatten aufzufangen
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            // Ein spezielles Material wird gewählt, das nur Schatten darstellt und sonst unsichtbar ist
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); 
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            // Die Fläche wird flach auf den Boden gelegt
            floorMesh.rotation.x = -Math.PI / 2; 
            floorMesh.position.y = 0;
            // Die Fläche wird angewiesen, Schatten zu empfangen
            floorMesh.receiveShadow = true; 
            // Die Schattenfläche wird in die GNSS-Gruppe gelegt, damit sie sich immer passend verhält
            gnssGroup.add(floorMesh);

            // --- KORREKTUR: VISUELLES METRISCHES GITTER (AM BODEN BEI DEN FÜSSEN) ---
            /*
             * Das Gitter ist 200x200 Meter groß. Da der Nutzer in der 3D-Welt IMMER im Zentrum (0,0,0) steht,
             * liegt dieses Gitter immer exakt an den Füßen und dehnt sich 100m in jede Richtung aus.
             * Gitter 1 macht alle grauen 1-Meter Kästchen.
             * Gitter 2 macht nur alle 10 Meter dicke blaue Linien.
             */
            
            // 1-Meter Raster (grau, 200 Kästchen)
            const gridHelper1m = new THREE.GridHelper(200, 200, 0x444444, 0x444444); 
            gridHelper1m.position.y = 0.0; // Exakt am Boden (wurde vorher auf 0.0 korrigiert)
            gnssGroup.add(gridHelper1m);

            // 10-Meter Raster (blau, 20 Kästchen -> also genau jede 10. Linie des grauen Gitters)
            const gridHelper10m = new THREE.GridHelper(200, 20, 0x0088ff, 0x0088ff); 
            gridHelper10m.position.y = 0.01; // Minimal höher als das graue Gitter, um Flackern (Z-Fighting) zu vermeiden
            gnssGroup.add(gridHelper10m);

            // Achsenkreuz für die Himmelsrichtungen (kleine Farb-Linien im Zentrum)
            const axesHelper = new THREE.AxesHelper(10); 
            axesHelper.position.y = 0.02; // Direkt über dem Gitter am Boden
            gnssGroup.add(axesHelper);
            // --------------------------------------------------------------------------
            
            // Definition der MindAR-Anker
            // Eine Schleife erstellt Platzhalter in der 3D-Welt, die mit den Bildern verknüpft werden.
            for (let i = 0; i < 10; i++) {
                const anchor = mindarThree.addAnchor(i);
                // onTargetFound wird automatisch aufgerufen, sobald die Handykamera das entsprechende Bild sieht
                anchor.onTargetFound = () => {
                    activeMindARId = i;
                    if (i === 0) {
                        // Simulation Fontäne (Position 0) aktivieren
                        activateSimulation(target0Lat, target0Lon, 335);
                    } else if (i === 4 || i === 5 || i === 6) {
                        // Simulation NiederdeutscherBlumengarten (Trigger 4-6) aktivieren
                        // Blickrichtung auf exakt 12.2 Grad (Bearing zur Statue) gesetzt.
                        activateSimulation(targetBlumengartenLat, targetBlumengartenLon, 12.2);
                    } else if (i === 9) {
                        // Lokale Platzierung des Borghesischen Fechters (Target 9) aktivieren
                        // Anstatt GNSS-Koordinaten zu nutzen, wird das Modell stabil
                        // in 20 Metern Entfernung genau in der aktuellen Blickrichtung des Nutzers platziert.
                        isFechterPlacedLocally = true;
                        localFechterEndTime = Date.now() + 30000; // Für 30 Sekunden anzeigen
                        activeMindARId = -1; // Image Tracking beenden, wir nutzen das stabile Grid
                        
                        // Wir merken uns exakt die Himmelsrichtung, in die wir beim Auslösen gerade schauen
                        localFechterHeading = heading; 
                        
                        if (gnssMeshes[2]) {
                            // Blickrichtung der Kamera im 3D-Raum auslesen
                            const dir = new THREE.Vector3(0, 0, -1);
                            dir.applyQuaternion(camera.quaternion);
                            dir.y = 0; // Auf der horizontalen Ebene bleiben, damit das Modell am Boden steht
                            dir.normalize();
                            
                            // Punkt exakt 20 Meter vor der aktuellen Blickrichtung ermitteln
                            const placementPos = dir.multiplyScalar(20);
                            
                            // Modell an dieser errechneten Position verankern
                            gnssMeshes[2].position.set(placementPos.x, 0, placementPos.z);
                            
                            // Modell so rotieren, dass es den Nutzer (der im Ursprung 0,0,0 steht) anschaut
                            // Da das Modell intern leicht eingedreht ist, kompensieren wir dies,
                            // indem wir zur Ausrichtung der Kamera 275 Grad hinzufügen.
                            const camEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                            gnssMeshes[2].rotation.y = camEuler.y + THREE.MathUtils.degToRad(275);
                            
                            // Korrekte Skalierung anwenden
                            const finalScale = AR_MODELS[2].scale * 0.05;
                            gnssMeshes[2].scale.set(finalScale, finalScale, finalScale);
                            
                            // Dieselben Werte auf das animierte Modell kopieren, damit der Wechsel unsichtbar ist
                            if (gnssMeshes[2].userData.animMesh) {
                                gnssMeshes[2].userData.animMesh.position.copy(gnssMeshes[2].position);
                                gnssMeshes[2].userData.animMesh.rotation.copy(gnssMeshes[2].rotation);
                                gnssMeshes[2].userData.animMesh.scale.copy(gnssMeshes[2].scale);
                            }
                            
                            // Ziel der Lampe (Sonne) exakt auf den Fechter richten, damit der Schatten sitzt
                            dl.target.position.copy(placementPos);
                        }
                    } else if (i === 1 || i === 2 || i === 3 || i === 7 || i === 8) {
                         // Standard-Timer für reines Image Tracking aktivieren (Bild klebt an Kamera).
                         activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                    }
                };
                mindarAnchors[i] = anchor; // Speichert den Anker zur späteren Verwendung
            }

            // Lädt alle 3D-Modelle in den Arbeitsspeicher
            loadModels();
            // Startet die Bildverarbeitung von MindAR (wartet, bis die Kamera bereit ist)
            await mindarThree.start();

            // Render-Schleife: Diese Funktion wird etwa 60 mal pro Sekunde ausgeführt, um das Bild zu zeichnen.
            renderer.setAnimationLoop(() => {
                // Berechnet die Zeit, die seit dem letzten Bild vergangen ist. Wird für Animationen benötigt.
                const delta = clock.getDelta();
                // Alle registrierten Animations-Mixer (z.B. der Fechter) werden ein kleines Stück vorwärtsgespult
                mixers.forEach(mixer => mixer.update(delta));

                const video = mindarThree.video;
                // Prüfen, ob ein schwarzer ArUco-Marker im Bild ist
                const arucoFound = processArucoFrame(video);
                
                // OCR-Prüfung periodisch ausführen, wenn kein Marker getrackt wird und 2 Sekunden vergangen sind.
                if (!arucoFound && activeMindARId === -1 && !isOcrRunning && (Date.now() - lastOcrTime > 2000)) {
                    runOcrCheck(videoCanvas);
                }
                
                let showSimulation = false;
                let showStandardMindAR = false;

                // Logik für MindAR-Timer: Solange das Bild sichtbar ist, wird die Zeit immer wieder verlängert.
                if ((activeMindARId >= 1 && activeMindARId <= 3) || activeMindARId === 7 || activeMindARId === 8) {
                    if (mindarAnchors[activeMindARId] && mindarAnchors[activeMindARId].group.visible) {
                        activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                    }
                }
                
                // Entscheidung Tracking-Modus
                if (arucoFound) {
                    // Wenn ein ArUco-Marker da ist, wird MindAR ignoriert.
                    activeMindARId = -1; 
                } else {
                    if (isSimulatedPos) {
                        // Simulationsmodus aktiv
                        if (Date.now() < simulationEndTime) {
                            showSimulation = true;
                            
                            /*
                             * RELATIVE BEWEGUNGSBERECHNUNG WÄHREND DER SIMULATION:
                             * Die Kamera springt initial auf den hinterlegten Basis-Koordinatenpunkt (simulatedBaseCoords).
                             * Anschließend wird bei jedem Frame geprüft, wie weit sich das Gerät physisch vom 
                             * ursprünglichen Startpunkt (simulationStartRealPos) entfernt hat.
                             * Diese Differenz (Delta) wird live auf die simulierte Position addiert.
                             * So kann man sich auf das Objekt zubewegen, obwohl man sich in einer Simulation befindet.
                             */
                            if (simulatedBaseCoords) {
                                let curLat = simulatedBaseCoords.lat;
                                let curLon = simulatedBaseCoords.lon;
                                let curAcc = 1.5;

                                if (realPos) {
                                    // Falls beim Auslösen noch kein GNSS verfügbar war, wird es beim ersten Fix als Nullpunkt gesetzt.
                                    if (!simulationStartRealPos) {
                                        simulationStartRealPos = { lat: realPos.latitude, lon: realPos.longitude };
                                    }
                                    
                                    // Koordinatendifferenz (Delta) zum physischen Startpunkt berechnen
                                    const deltaLat = realPos.latitude - simulationStartRealPos.lat;
                                    const deltaLon = realPos.longitude - simulationStartRealPos.lon;
                                    
                                    // Differenz zur virtuellen Basisposition addieren
                                    curLat += deltaLat;
                                    curLon += deltaLon;
                                    curAcc = realPos.accuracy;
                                }
                                
                                // Letzte Position für das Rendering entsprechend überschreiben, um die Welt zu bewegen.
                                lastPos = { latitude: curLat, longitude: curLon, accuracy: curAcc };
                            }
                        } else {
                            // Wenn die Zeit abgelaufen ist, Simulation beenden.
                            isSimulatedPos = false;
                            // Zurückfallen auf reale GNSS-Daten
                            if (realPos) lastPos = realPos;
                        }
                    } 
                    else if ((activeMindARId >= 1 && activeMindARId <= 3) || activeMindARId === 7 || activeMindARId === 8) {
                        // Standard MindAR Anzeige aktiv
                        // Zeige das Modell, solange der Timer (Nachbrennzeit) noch nicht abgelaufen ist.
                        if (Date.now() < activeMindAREndTime) showStandardMindAR = true;
                        else activeMindARId = -1;
                    }
                }

                // Steuerung MindAR-Modelle (Ein- und Ausblenden je nach Status)
                Object.keys(mindARMeshes).forEach(idStr => {
                    const id = parseInt(idStr); 
                    if (mindARMeshes[id]) {
                        mindARMeshes[id].forEach(mesh => {
                            if (showStandardMindAR && mesh.userData.anchorIndex === activeMindARId) {
                                mesh.visible = true;
                                if(mesh.userData.particles) updateWaterEffect(mesh.userData.particles);
                                updateUIForModel(id, "MindAR");
                            } else {
                                mesh.visible = false;
                            }
                        });
                    }
                });

                // Setzt den Marker-Tracking Status auf wahr, falls eins von beiden aktiv ist
                isMarkerTracking = arucoFound || showStandardMindAR;

                // Bestimmen, ob GNSS-Modelle angezeigt werden sollen
                // (Nur, wenn wir nicht gerade ein Bild oder einen Marker tracken, es sei denn es ist eine Simulation)
                let showGNSSModels = !arucoFound && !(showStandardMindAR && !isSimulatedPos);

                // --- GNSS-LOGIK UND KAMERA-ROTATION ---
                if (showGNSSModels && (showSimulation || (!isMarkerTracking && gnssGroup) || isFechterPlacedLocally)) {
                    gnssGroup.visible = true;
                    
                    // KAMERA-ROTATION ANSTATT SZENEN-ROTATION:
                    // Um zu ermöglichen, dass man sich um GNSS-Modelle herumdrehen kann,
                    // wird hier die Orientierung der Kamera angepasst. Die 'gnssGroup' bleibt 
                    // statisch auf (0,0,0) Rotation, während sich die Kamera dreht.
                    if (lastDeviceOrientation) {
                         /* 
                          * ANPASSUNG FÜR DIE 3D-KAMERA:
                          * Die Kameraausrichtung benötigt zur Orientierung nicht nur die rohen Neigungsdaten,
                          * sondern auch den exakt berechneten und kalibrierten Kompasswert (heading).
                          * Durch die Übergabe der Variablen "heading" an die Rotationsberechnung 
                          * richten sich alle 3D-Modelle exakt am realen geografischen Norden aus,
                          * wodurch Kalibrierungen und Deklinationen auch in der 3D-Welt korrekt sichtbar werden.
                          */
                         const q = getDeviceQuaternion(lastDeviceOrientation, heading);
                         camera.quaternion.copy(q); // Kamera übernimmt die Rotation des Geräts
                         gnssGroup.rotation.set(0, 0, 0); // Die Welt bleibt starr
                    } else {
                         // Falls keine Orientierungsdaten vorliegen (z.B. Desktop PC), wird hart auf den Heading-Wert gesetzt
                         camera.rotation.set(0, THREE.MathUtils.degToRad(heading), 0, 'YXZ');
                         gnssGroup.rotation.set(0, 0, 0);
                    }

                    // Führt die Berechnungen für Distanzen aus
                    updateGNSSObjects(); 
                    // Aktualisiert den Text auf dem Bildschirm
                    updateGNSSUI(); 
                } else {
                    // GNSS ausblenden, Kamera für Marker-Tracking zurücksetzen
                    gnssGroup.visible = false;
                    Object.keys(gnssMeshes).forEach(key => {
                        if (gnssMeshes[key]) {
                            gnssMeshes[key].visible = false;
                            // Auch das animierte Modell wird ausgeblendet, falls es gerade abgespielt wird
                            if (gnssMeshes[key].userData.animMesh) gnssMeshes[key].userData.animMesh.visible = false;
                        }
                    });
                    // Kamera-Rotation zurücksetzen damit MindAR/ArUco sie korrekt verwaltet.
                    // Ohne diesen Reset würde das Bild beim Wechsel von GNSS zu Marker schief hängen.
                    camera.rotation.order = 'YXZ';
                    camera.rotation.set(0, 0, 0);
                    camera.quaternion.set(0, 0, 0, 1);
                }

                // Aktualisierung aller Partikelsysteme (Hilfsfunktion für sauberen Code)
                const handleParticles = (meshList, listType) => {
                    Object.entries(meshList).forEach(([key, m]) => {
                        let id = parseInt(key);
                        let meshes = Array.isArray(m) ? m : [m];
                        
                        meshes.forEach(mesh => {
                            if (mesh.userData.particles) {
                                if (mesh.visible) {
                                    updateWaterEffect(mesh.userData.particles);
                                    if (listType === 'aruco' && (id === 3 || id === 33)) {
                                        // Spezifische Behandlung für ArUco
                                    } else {
                                        // Partikel folgen dem Mesh. Es liest die echte Welt-Position aus und kopiert sie.
                                        const worldPos = new THREE.Vector3();
                                        mesh.getWorldPosition(worldPos);
                                        let yOffset = 0;
                                        if (id === 3 || id === 33) yOffset = 4.0; 
                                        mesh.userData.particles.position.copy(mesh.position);
                                        mesh.userData.particles.position.y += yOffset;
                                    }
                                    mesh.userData.particles.visible = true;
                                } else {
                                    mesh.userData.particles.visible = false;
                                }
                            }
                        });
                    });
                };

                // Wendet die Partikel-Hilfsfunktion auf alle drei Systemarten an
                handleParticles(gnssMeshes, 'gnss');
                handleParticles(loadedMeshes, 'aruco'); 
                handleParticles(mindARMeshes, 'mindar');

                // Debug Anzeige für Rotation
                let currentRotY = 0;
                if (gnssGroup.visible) {
                     // Im GNSS Modus ist die Objekt-Rotation statisch, aber zur Info wird sie angezeigt
                     Object.keys(gnssMeshes).forEach(id => {
                         if(gnssMeshes[id].visible) currentRotY = gnssMeshes[id].rotation.y;
                         // Wenn das Modell animiert ist, dessen Rotation auslesen
                         if(gnssMeshes[id].userData.animMesh && gnssMeshes[id].userData.animMesh.visible) currentRotY = gnssMeshes[id].userData.animMesh.rotation.y;
                     });
                } 
                else if (isMarkerTracking && activeMindARId !== -1) {
                     // Holt sich die Rotation, falls gerade ein Bild (MindAR) betrachtet wird
                     Object.keys(mindARMeshes).forEach(idStr => {
                         const id = parseInt(idStr);
                         if (AR_MODELS[id].mindTargetIndexes && AR_MODELS[id].mindTargetIndexes.includes(activeMindARId) && mindARMeshes[id]) {
                             mindARMeshes[id].forEach(mesh => {
                                 if (mesh.visible) currentRotY = mesh.rotation.y;
                             });
                         }
                     });
                }
                else if (isMarkerTracking && currentTrackingID !== -1 && loadedMeshes[currentTrackingID]?.visible) {
                     // Holt sich die Rotation bei ArUco-Markern
                     currentRotY = loadedMeshes[currentTrackingID].rotation.z;
                }

                // Ein kleines Info-Panel wird dynamisch erstellt und mit der ermittelten Rotation gefüllt
                let angleSpan = document.getElementById('debugAngle');
                const displayDeg = Math.round(THREE.MathUtils.radToDeg(currentRotY) % 360);
                const finalDeg = displayDeg < 0 ? displayDeg + 360 : displayDeg;
                
                if(!angleSpan) {
                    const d = document.createElement('div');
                    d.style.marginTop = "8px"; d.style.borderTop = "1px solid rgba(255,255,255,0.3)"; d.style.paddingTop = "5px";
                    d.innerHTML = `<span class="label-small">Modell-Ausrichtung (Stehachse)</span><br><span id="debugAngle" class="val-highlight">${finalDeg}°</span>`;
                    document.getElementById('debugInfo').appendChild(d);
                } else {
                    angleSpan.innerText = finalDeg + "°";
                }

                // Aktualisierung des Richtungspfeils (falls ein Ziel gefunden wurde)
                if (closestObjForArrow || isFechterPlacedLocally) updateArrow();
                else arrowContainer.style.opacity = 0;

                // Zum Schluss wird das fertige Bild gerendert und an den Bildschirm gesendet
                renderer.render(scene, camera);
            });
        }

        // Texterkennung (OCR) Logik
        async function runOcrCheck(canvas) {
            isOcrRunning = true;
            lastOcrTime = Date.now();

            try {
                // Tesseract scannt das Bild, das vom Canvas übergeben wird.
                // 'deu' lädt das deutsche Sprachpaket.
                const { data: { text } } = await Tesseract.recognize(canvas, 'deu', { 
                    logger: m => {} // Logging deaktiviert lassen für bessere Performance
                });
                
                // 1. Text bereinigen: Alles klein schreiben, mehrfache Leerzeichen und Zeilenumbrüche entfernen
                const cleanText = text.toLowerCase().replace(/\s+/g, ' ');

                // Debugging: Zeigt in der Konsole an, was erkannt wurde (WICHTIG für Tests!)
                if(cleanText.length > 5) console.log("OCR Scan:", cleanText);

                // 2. Robuste Prüfung: Es wird auf charakteristische Wortteile geprüft statt auf ganze Sätze.
                // Das hilft, wenn Tesseract z.B. "Blurnengarten" statt "Blumengarten" liest.
                const matchNieder = cleanText.includes("nieder") && cleanText.includes("deut");
                const matchBlumen = cleanText.includes("blumen") && cleanText.includes("garten");

                // Wenn ein Match gefunden wurde, wird die GNSS Simulation für den Blumengarten gestartet
                if (matchNieder || matchBlumen) {
                    console.log("Texterkennung erfolgreich!");
                    statusText.innerHTML = "<span style='color:#4f4'>Text erkannt:<br>Niederdeutscher Blumengarten!</span>";
                    
                    // Simulation starten
                    activateSimulation(targetBlumengartenLat, targetBlumengartenLon, 12.2);
                }
            } catch (err) {
                // Fängt Abstürze ab, falls die OCR-Engine crasht
                console.warn("OCR Fehler:", err);
            }
            isOcrRunning = false;
        }


        /*
         * Funktion zur Berechnung der 3D-Kamera-Rotation (Quaternion) anhand der Smartphone-Sensoren.
         * Ein Quaternion ist ein mathematisches Konstrukt, das Drehungen im dreidimensionalen Raum 
         * berechnet, ohne Probleme durch blockierende Rotationsachsen (Gimbal Lock) zu verursachen.
         */
        function getDeviceQuaternion(orientData, correctedHeading) {
            /* 
             * Kompasswerte (correctedHeading) laufen auf der Kompassrose immer im Uhrzeigersinn 
             * (0 Grad = Nord, 90 Grad = Ost). Das mathematische System der 3D-Engine erwartet 
             * die Drehung um die Hochachse (Z-Achse bzw. Alpha) jedoch gegen den Uhrzeigersinn.
             * Aus diesem Grund wird der Winkel umgedreht, indem der Wert von 360 subtrahiert wird. 
             * Der Modulo-Operator (% 360) stellt zusätzlich sicher, dass der errechnete Wert 
             * sicher im Rahmen von 0 bis 359 Grad bleibt.
             */
            const absoluteAlpha = (360 - correctedHeading) % 360;
            // degToRad rechnet Grad (0-360) in das für Computer verständlichere Bogenmaß um (Radiant).
            const alpha = THREE.MathUtils.degToRad(absoluteAlpha); 
            
            /* 
             * Beta beschreibt die Neigung nach vorne und hinten (Nicken des Smartphones).
             * Gamma beschreibt die Neigung nach links und rechts (Rollen des Smartphones).
             */
            const beta = orientData.beta ? THREE.MathUtils.degToRad(orientData.beta) : 0;   
            const gamma = orientData.gamma ? THREE.MathUtils.degToRad(orientData.gamma) : 0; 
            
            /*
             * Abfrage der Bildschirmorientierung (Hochformat oder Querformat).
             */
            const orient = window.screen.orientation ? THREE.MathUtils.degToRad(window.screen.orientation.angle) : 0;

            /*
             * Ein Euler-Winkel führt die drei Rotationsachsen (Nicken, Gieren, Rollen) in einem 
             * Objekt zusammen. Das Minus vor dem Gammawert (-gamma) ist erforderlich, um die Richtung 
             * der Sensordaten an das zugrunde liegende Koordinatensystem der 3D-Engine anzugleichen.
             */
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            
            const q = new THREE.Quaternion();
            q.setFromEuler(euler);
            
            /*
             * Anpassung der berechneten Rotation an den Standard-Blickwinkel der verwendeten Three.js Engine.
             */
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            q.multiply(q1);
            
            /*
             * Die finale Multiplikation mit q2 sorgt dafür, dass die weiter oben ermittelte Korrektur für 
             * das Bildschirmformat angewendet wird.
             */
            const q2 = new THREE.Quaternion();
            q2.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
            q.multiply(q2);
            
            return q;
        }

        /*
         * Startet die Simulation einer GNSS-Position für eine definierte Zeit.
         * Hier wird nun zusätzlich der physische Startpunkt (GNSS) gespeichert, 
         * um während der Simulation die Relativbewegung des Geräts errechnen zu können.
         */
        function activateSimulation(lat, lon, targetHeading) {
            isSimulatedPos = true;
            isFechterPlacedLocally = false; // Bricht eine eventuell noch laufende lokale Platzierung ab
            simulationEndTime = Date.now() + SIMULATION_PERSISTENCE; 
            
            // Fechter-Rotation vorsichtshalber auf den GNSS-Standardwert (341) zurücksetzen,
            // falls eine vorherige Target 9 Simulation diese überschrieben hatte.
            if (gnssMeshes[2]) {
                gnssMeshes[2].rotation.y = THREE.MathUtils.degToRad(AR_MODELS[2].initRotation);
                if (gnssMeshes[2].userData.animMesh) {
                    gnssMeshes[2].userData.animMesh.rotation.y = THREE.MathUtils.degToRad(AR_MODELS[2].initRotation);
                }
            }
            
            // Wir definieren das Ziel, zu dem die Simulation initial springen soll.
            simulatedBaseCoords = { lat: lat, lon: lon };
            
            // Wir speichern die ECHTE Position im Moment des Auslösens.
            // Jeder Schritt von hier aus wird als "Delta" live auf simulatedBaseCoords addiert.
            if (realPos) {
                simulationStartRealPos = { lat: realPos.latitude, lon: realPos.longitude };
            } else {
                simulationStartRealPos = null; // Falls noch kein Fix da ist, wird dies später in der Loop nachgeholt.
            }

            activeMindARId = -1; // Trennt die Bilderkennung für den Moment
            
            // Berechnung des Kompass-Offsets zur Kalibrierung
            if (typeof targetHeading === 'number') {
                // Vergleicht, wo der Kompass des Handys gerade hinzeigt, mit der Angabe, 
                // wo er eigentlich hinzeigen müsste.
                compassOffset = (targetHeading - rawHeading + 360) % 360;
                console.log("Kompass kalibriert. Soll: " + targetHeading + ", Roh: " + rawHeading + ", Offset: " + compassOffset);
            }
        }

        // Laden aller definierten 3D-Modelle aus dem Dateisystem
        function loadModels() {
            const loader = new GLTFLoader(); // Hilfsprogramm von Three.js, das glb/gltf-Dateien lesen kann.
            const ids = Object.keys(AR_MODELS); // Holt alle Modell-IDs (0, 1, 2, 3, 33)
            
            // Hilfsfunktion zum Aktivieren von Schatten auf allen Modell-Teilen
            const enableShadows = (modelObj) => {
                modelObj.traverse((child) => {
                    // Prüft, ob es sich um ein darstellbares 3D-Gitter (Mesh) handelt
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true; 
                    }
                });
            };

            // Geht jedes Modell einzeln durch
            ids.forEach(idStr => {
                const id = parseInt(idStr);
                const config = AR_MODELS[id]; // Holt die Einstellungen für das aktuelle Modell
                
                // Asynchrones Laden: Das Skript wartet hier nicht, sondern macht im Hintergrund weiter.
                // Sobald die Datei geladen ist, wird die Funktion "gltf => { ... }" ausgeführt.
                loader.load(config.url, (gltf) => {
                    
                    // 1. ArUco-Marker Version: Erstellt einen Klon des Modells speziell für das Marker-Tracking
                    const modelAruco = gltf.scene.clone();
                    modelAruco.scale.set(config.scale, config.scale, config.scale); // Skalierung anwenden
                    modelAruco.rotation.x = Math.PI / 2; // Liegt flach auf dem Marker
                    if (id === 1 || id === 2 || id === 3 || id === 33) modelAruco.rotation.z += Math.PI; // Drehung um 180 Grad
                    
                    if (id === 3 || id === 33) {
                        const p = createWaterEffect(); // Generiert Wasser
                        modelAruco.add(p); // Heftet das Wasser an das Modell an
                        p.position.set(0, 4.0, 0); // Schiebt das Wasser nach oben zur Düse
                        p.rotation.x = -Math.PI / 2; // Dreht das Wasser korrekt nach oben
                        modelAruco.userData.particles = p; // Speichert das System für spätere Updates
                        
                        // Das Maßband wird hinzugefügt
                        const measureBar = createMeasureBar();
                        modelAruco.add(measureBar);
                        modelAruco.userData.measureBar = measureBar;
                    }
                    modelAruco.visible = false; // Initial unsichtbar machen
                    markerGroup.add(modelAruco); // Fügt es zur 3D-Welt hinzu
                    loadedMeshes[id] = modelAruco; // Speichert es in der Liste

                    // 2. GNSS Version (Positionsbasiert)
                    if (config.lat && config.lon) {
                        const modelGNSS = gltf.scene.clone();
                        // Bei GNSS-Modellen wird die Skalierung deutlich reduziert, um echte Meter zu simulieren
                        let finalScale = config.scale * 0.05; 
                        
                        // Spezielle Größenanpassung für die Blumengarten-Statue
                        if (id === 1) {
                            finalScale = config.scale * 0.015; 
                        }
                        
                        modelGNSS.scale.set(finalScale, finalScale, finalScale);
                        
                        // Start-Drehung aus den Einstellungen auslesen und in Bogenmaß umwandeln.
                        let initRotDeg = config.initRotation || 0;
                        
                        // Spezieller Check, falls das Modell fertig lädt, während Target 9 (Simulation) bereits läuft
                        if (id === 2 && isSimulatedPos && simulatedBaseCoords && simulatedBaseCoords.lat === targetFechterLat) {
                            initRotDeg = 275;
                        }
                        
                        modelGNSS.rotation.y = THREE.MathUtils.degToRad(initRotDeg); 

                        if (id === 3 || id === 33) {
                             const pG = createWaterEffect();
                             modelGNSS.userData.particles = pG;
                             gnssGroup.add(pG);
                             // Das Maßband wird für GNSS hinzugefügt
                             const measureBar = createMeasureBar();
                             modelGNSS.add(measureBar);
                             modelGNSS.userData.measureBar = measureBar;
                        }
                        
                        // Aktiviert den Schattenwurf für das GNSS-Modell (speziell für Fechter ID 2 wichtig)
                        enableShadows(modelGNSS);
                        
                        // --- ANIMIERTES MODELL LADEN FÜR TARGET 9 (GNSS / Simulation) ---
                        // Da das Modell nun in der Grid-Simulation steht, laden wir das Animationsmodell hier rein!
                        if (id === 2) {
                            loader.load('3D_models/BorghesischerFechter_iPhone17Pro_animiert_JumpDown.glb', (gltfAnim) => {
                                // Klonen des Modells
                                const animGNSS = gltfAnim.scene;
                                
                                // Größe und Drehung direkt vom Basismodell kopieren
                                animGNSS.scale.copy(modelGNSS.scale);
                                animGNSS.rotation.copy(modelGNSS.rotation);
                                
                                // Eine zusätzliche Kopie der Position ist hier wichtig als Initialwert
                                animGNSS.position.copy(modelGNSS.position);
                                
                                // Das Modell ist zu Beginn unsichtbar, bis der Nutzer es antippt
                                animGNSS.visible = false;
                                
                                // Aktiviert den Schattenwurf auch für das animierte Modell
                                enableShadows(animGNSS);
                                
                                // Prüfen, ob Animationen (Knochen) existieren
                                if (gltfAnim.animations && gltfAnim.animations.length > 0) {
                                    // Mixer (Stoppuhr) erstellen und speichern
                                    const mixer = new THREE.AnimationMixer(animGNSS);
                                    mixers.push(mixer);
                                    
                                    // Wir laden die erste Animation im Modell
                                    const action = mixer.clipAction(gltfAnim.animations[0]);
                                    // Befehl: Nur 1 Mal abspielen!
                                    action.setLoop(THREE.LoopOnce, 1);
                                    // Wenn die Animation durch ist, im letzten Bild stoppen
                                    action.clampWhenFinished = true;
                                    
                                    // In die unsichtbare Daten-Tasche (userData) des Basismodells stecken
                                    modelGNSS.userData.animMesh = animGNSS;
                                    modelGNSS.userData.animAction = action;
                                    
                                    // Das animierte Modell zum GNSS Grid hinzufügen
                                    gnssGroup.add(animGNSS);

                                    // --- WICHTIGER GRAFIKKARTEN-WARMUP ---
                                    // Um das Stottern oder Nicht-Abspielen beim ersten Klick zu verhindern,
                                    // wird das Gerät hier heimlich zu einer Vorab-Berechnung gezwungen.
                                    
                                    // 1. Modell extrem winzig machen, damit man es nicht bemerkt
                                    animGNSS.scale.set(0.0001, 0.0001, 0.0001);
                                    animGNSS.visible = true;
                                    
                                    // 2. Die Knochen-Animation für den Bruchteil einer Sekunde starten
                                    mixer.update(0.01);
                                    
                                    // 3. Dem System befehlen, die Shader zu übersetzen und einmal stumm zu rendern
                                    renderer.compile(scene, camera);
                                    renderer.render(scene, camera);
                                    
                                    // 4. Alles wieder sauber auf den Anfangszustand zurücksetzen
                                    animGNSS.visible = false;
                                    animGNSS.scale.copy(modelGNSS.scale);
                                    
                                    // Die Stoppuhr stoppen, damit sie nicht im Hintergrund weiterläuft
                                    action.stop(); 
                                    // Setzt die Animation für den späteren Klick sauber zurück auf 0
                                    action.reset(); 
                                    // ------------------------------------------------
                                    
                                    // Event: Wenn die Animation vorbei ist, wieder auf statisch zurückschalten
                                    mixer.addEventListener('finished', () => {
                                        animGNSS.visible = false;
                                        modelGNSS.visible = true;
                                    });
                                }
                            });
                        }
                        // --- ENDE ---

                        modelGNSS.visible = false;
                        gnssGroup.add(modelGNSS);
                        gnssMeshes[id] = modelGNSS;
                    }

                    // 3. MindAR Version (Bildbasiert)
                    if (config.mindTargetIndexes) {
                        if (!mindARMeshes[id]) mindARMeshes[id] =[];

                        // Geht alle konfigurierten Bilder (Indizes) durch
                        config.mindTargetIndexes.forEach(targetIndex => {
                            // Includes prüft, ob die Zahl im angegebenen Array existiert.
                            if ([1, 2, 3, 4, 5, 6, 7, 8].includes(targetIndex) && mindarAnchors[targetIndex]) {
                                const modelMind = gltf.scene.clone();
                                let mindScale = config.scale * 0.015; // Anpassung der Skalierung für Bilder

                                // Skalierung halbieren wie bei Index 1.
                                if ((targetIndex >= 1 && targetIndex <= 3) || targetIndex === 7 || targetIndex === 8) {
                                    mindScale = mindScale * 0.5;
                                }

                                modelMind.scale.set(mindScale, mindScale, mindScale);
                                
                                let rotationY = Math.PI; // Standard 180 Grad
                                // Gleiche Rotation wie 1
                                if (targetIndex === 1 || targetIndex === 7 || targetIndex === 8) rotationY = THREE.MathUtils.degToRad(357); 
                                if (targetIndex === 2) rotationY = THREE.MathUtils.degToRad(123); 
                                if (targetIndex === 3) rotationY = THREE.MathUtils.degToRad(265);

                                modelMind.rotation.y = rotationY; 
                                
                                // Auch hier greift die Regel für 7 und 8 implizit, 
                                // da id === 1 für das Blumengarten-Modell gilt und 7/8 in dessen Array liegen.
                                // Die Modelle werden auf den Boden gesetzt (-2.0)
                                if (id === 1 ||[4,5,6].includes(targetIndex)) {
                                     modelMind.position.y = -2.0; 
                                }

                                if (id === 3 || id === 33) {
                                     const pM = createWaterEffect();
                                     modelMind.userData.particles = pM;
                                     mindarAnchors[targetIndex].group.add(pM);
                                     // Das Maßband wird für MindAR hinzugefügt
                                     const measureBar = createMeasureBar();
                                     modelMind.add(measureBar);
                                     modelMind.userData.measureBar = measureBar;
                                }

                                modelMind.userData.anchorIndex = targetIndex; // Welches Bild gehört zu diesem Klon?
                                mindarAnchors[targetIndex].group.add(modelMind); // An den Anker der 3D-Welt heften
                                mindARMeshes[id].push(modelMind); // In die Liste packen
                                modelMind.visible = false;
                            }
                        });
                    }
                });
            });
        }

        // Aktualisiert die Anzeige der GNSS-Daten auf dem Bildschirm
        function updateGNSSUI() {
            // Wenn das Modell gerade direkt vor dem Nutzer verankert ist (Target 9)
            if (isFechterPlacedLocally && Date.now() < localFechterEndTime) {
                closestObjForArrow = AR_MODELS[2];
                const compassStr = Math.round(heading) + "°";
                statusText.innerHTML = `
                    <span class="label-small">Modus</span> <span class="val-highlight">AR (lokal auf Grid im Sichtbereich)</span><br>
                    <span class="label-small">Kompass</span> <span class="val-highlight">${compassStr}</span><br>
                    <div style="margin: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2);"></div>
                    <span class="label-small">POI</span> <span class="val-green">${AR_MODELS[2].title}</span><br>
                    <span class="label-small">Entfernung</span> <span class="val-highlight">20 m (lokal fixiert)</span>
                `;
                return; // Normalen GNSS-Text überspringen
            }

            if (!lastPos) {
                 statusText.innerHTML = "Warte auf GNSS Signal...";
                 return;
            }
            let closestDist = 99999; // Startwert extrem hoch ansetzen, damit alles näher ist
            let closestObj = null;
            
            // Schleife geht durch alle Modelle und rechnet die Distanz zwischen GNSS-Standort und Modell aus
