<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Herrenhäuser Gärten - AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* --- CSS DESIGN --- */
    body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; color: white; }
    
    /* Kamera-Feed */
    #bg-video {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 0;
    }

    /* 3D Canvas */
    canvas {
        display: block; position: absolute; top: 0; left: 0; z-index: 10;
        width: 100%; height: 100%;
    }

    /* UI Layer */
    #ar-overlay-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .info-wrapper { padding: 10px; display: flex; flex-direction: column; gap: 5px; }
    .info-box {
      background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 12px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; align-self: center; min-width: 280px; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    h1 { margin: 0 0 8px 0; font-size: 1.1rem; line-height: 1.3; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; padding: 2px 0; }
    #status { color: #ccc; font-weight: bold; }

    #debug-console {
        font-family: monospace; font-size: 10px; color: #ffff00;
        background: rgba(0,0,0,0.8); padding: 5px; margin-top: 10px;
        text-align: left; white-space: pre-wrap; pointer-events: none;
        max-height: 80px; overflow: hidden; border-radius: 4px;
    }

    /* Button Wrapper */
    .button-wrapper { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
    .ar-btn {
        position: absolute; z-index: 200; color: white; padding: 12px 20px;
        border-radius: 30px; font-weight: bold; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px); pointer-events: auto; text-transform: uppercase;
        font-size: 12px; letter-spacing: 1px;
    }
    #closeBtn { top: 20px; right: 20px; background: rgba(200, 40, 40, 0.85); }
    #resetBtn { bottom: 30px; right: 20px; background: rgba(40, 40, 40, 0.8); }

    /* Controls */
    .controls-wrapper {
      position: absolute; bottom: 100px; left: 0; width: 100%;
      display: flex; justify-content: center; gap: 40px; pointer-events: none;
      z-index: 300;
    }
    .rotate-btn {
      width: 75px; height: 75px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.6);
      color: white; font-size: 32px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    /* Kompass Pfeil Overlay */
    #direction-indicator {
        position: absolute; bottom: 30px; left: 20px; width: 80px; height: 80px;
        background: rgba(0,0,0,0.4); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
        display: flex; justify-content: center; align-items: center; pointer-events: none;
        backdrop-filter: blur(5px); z-index: 400;
    }
    #arrow {
        width: 0; height: 0; 
        border-left: 15px solid transparent; border-right: 15px solid transparent;
        border-bottom: 30px solid white; transform-origin: center center;
    }

    /* MINIMAP */
    #minimap-container {
        position: absolute; bottom: 90px; right: 20px;
        width: 140px; height: 140px; z-index: 400;
        border-radius: 50%; overflow: hidden;
        border: 2px solid rgba(255,255,255,0.8);
        box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: auto;
        display: block; 
    }
    #mapStations { width: 100%; height: 100%; background: #222; }
    .user-arrow { pointer-events: none; }
  </style>
</head>
<body>
  
  <!-- Hintergrundvideo -->
  <video id="bg-video" autoplay muted playsinline loop></video>

  <!-- UI -->
  <div id="ar-overlay-container">
      <div id="direction-indicator"><div id="arrow"></div></div>
      <div id="minimap-container"><div id="mapStations"></div></div>

      <div class="button-wrapper">
          <button id="closeBtn" class="ar-btn">✕ Schließen</button>
          <button id="resetBtn" class="ar-btn">↺ Neustart</button>
      </div>

      <div class="controls-wrapper" id="rotation-controls">
          <div class="rotate-btn" id="rotateLeft">←</div>
          <div class="rotate-btn" id="rotateRight">→</div>
      </div>

      <div class="info-wrapper">
        <div class="info-box">
          <h1>Herrenhäuser Gärten - Virtueller Rundgang AR</h1>
          <p id="msg">Initialisiere...</p>
          <p>Nächstes Ziel: <span id="targetName">Suche...</span></p>
          <p>Entfernung: <span id="dist">-</span> Meter</p>
          <p>Ausrichtung: <span id="rotationDisplay">-</span>°</p>
          <p>Status: <span id="status">Bitte Bildschirm antippen...</span></p>
          <div id="debug-console">Lade System...</div>
        </div>
      </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

    // Globale Variablen
    let mapStations, userLayer, mapHeading = 0;
    let camera, scene, renderer, raycaster, controls;
    let positionHistory = [], waterParticles = null;
    let modelsReady = false, gnssReady = false, closestLocRef = null;
    const MAX_HISTORY = 5;

    // --- DATEN ---
    const mapStationsData = [
      { title: 'Große Fontaine', coords: [52.385968, 9.695931] },
      { title: 'Goldenes Tor', coords: [52.390184, 9.699546] },
      { title: 'Haupteingang mit Kasse', coords: [52.391185, 9.698368] },
      { title: 'Niki de Saint Phalle - Grotte', coords: [52.390713, 9.696767] },
      { title: 'Sommer - Statue', coords: [ 52.389583, 9.697833] },
      { title: 'Borghesischer Fechter', coords: [52.389472, 9.699222] },
      { title: 'Niederdeutscher Blumengarten', coords: [52.388194, 9.697861] }
    ];

    const LOCATIONS = [
        { title: 'Niederdeutscher Blumengarten', lat: 52.388194, lon: 9.697861, url: '3D_models/Statue_3D.glb', infoText: 'Sandsteinstatue "Veritas"', link: 'https://herrenhaeuser-gaerten.hannover.de', rotation: 215, object3D: null, loaded: false, isAnimated: false },
        { title: 'Borghesischer Fechter', lat: 52.389472, lon: 9.699222, url: '3D_models/BorghesischerFechter_WebAR.glb', infoText: 'Borghesischer Fechter', link: 'https://www.visit-hannover.com', rotation: 295, object3D: null, loaded: false, isAnimated: false },
        { title: 'Große Fontäne', lat: 52.385968, lon: 9.695931, url: '3D_models/GrosseFontaine_WebAR.glb', infoText: 'Große Fontäne', link: 'https://herrenhaeuser-gaerten.hannover.de', rotation: 180, object3D: null, loaded: false, isAnimated: true }
    ];

    const VISIBILITY_DISTANCE = 75.0; 
    const TARGET_HEIGHT = 3.0; 

    // --- AUTOMATISCHER START ---
    try {
        initThreeJS();
        initLeaflet();
        start2DCamera();
        startGNSS();
        animate();
        
        // Versuche Android Controls direkt
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
             initControls();
        }

        // iOS TRICK: Warte auf den ersten Touch irgendwo auf dem Bildschirm
        // um die Sensoren freizuschalten.
        document.body.addEventListener('click', unlockSensors, { once: true });
        document.body.addEventListener('touchstart', unlockSensors, { once: true });

    } catch (e) {
        alert("Startfehler: " + e.message);
    }

    // --- SENSOREN FREISCHALTEN ---
    async function unlockSensors() {
        document.getElementById('status').innerText = "Aktiviere Sensoren...";
        
        // Kamera sicherstellen (falls Autoplay blockiert war)
        const video = document.getElementById('bg-video');
        if (video.paused) video.play().catch(e => console.log("Video Play Error", e));

        // Device Orientation Permission (iOS)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    initControls();
                    document.getElementById('status').innerText = "Sensoren Aktiv";
                } else {
                    document.getElementById('status').innerText = "Sensoren abgelehnt";
                }
            } catch (e) {
                console.error(e);
            }
        } else {
            // Android / Desktop
            initControls();
            document.getElementById('status').innerText = "Sensoren Aktiv";
        }
    }

    function initControls() {
        if(controls) return;
        try {
            controls = new DeviceOrientationControls(camera);
            controls.connect();
            // Event für Minimap-Rotation
            window.addEventListener('deviceorientation', (e) => {
                if(e.alpha !== null) mapHeading = (360 - e.alpha) % 360;
            });
        } catch(e) { console.warn("Controls init error", e); }
    }

    // --- KAMERA ---
    function start2DCamera() {
        const video = document.getElementById('bg-video');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
                // Versuche Autoplay, ansonsten erledigt 'unlockSensors' das beim Touch
                video.play().catch(() => console.log("Warte auf Interaktion für Video..."));
            })
            .catch(function(err) {
                document.getElementById('debug-console').innerText = "Kamera Fehler: " + err.message;
            });
        }
    }

    // --- THREE.JS ---
    function initThreeJS() {
        const container = document.createElement('div');
        document.body.appendChild(container);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);
        scene.add(camera);
        raycaster = new THREE.Raycaster();

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        const loader = new GLTFLoader();
        let loadedCount = 0;

        LOCATIONS.forEach((loc) => {
            const group = new THREE.Group();
            group.visible = false;
            scene.add(group);
            loc.object3D = group;

            loader.load(loc.url, (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                let scaleFactor = size.y > 0 ? TARGET_HEIGHT / size.y : 1.0;
                model.scale.set(scaleFactor, scaleFactor, scaleFactor);
                
                const scaledBox = new THREE.Box3().setFromObject(model);
                model.position.y -= scaledBox.min.y; 
                model.position.y -= 1.6; 

                model.rotation.y = THREE.MathUtils.degToRad(loc.rotation);
                group.add(model);

                if (loc.isAnimated) {
                    waterParticles = createWaterEffect();
                    waterParticles.position.y -= 1.6;
                    group.add(waterParticles);
                }

                const info = createInfoWindow(loc.infoText);
                info.position.y = 2.0; 
                group.add(info);

                loc.loaded = true;
                loadedCount++;
                if (loadedCount === LOCATIONS.length) {
                    modelsReady = true;
                    checkReadyStatus();
                }
            }, undefined, (err) => console.warn("Ladefehler", err));
        });

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Interaction
        document.getElementById('rotateLeft').addEventListener('pointerdown', (e) => { e.stopPropagation(); changeRotation(-5); });
        document.getElementById('rotateRight').addEventListener('pointerdown', (e) => { e.stopPropagation(); changeRotation(5); });
        
        // Raycasting beim Touch
        const onTouch = (e) => {
            // Wenn auf Button geklickt wird, ignorieren wir den Raycast in die Szene
            if(e.target.closest('button') || e.target.closest('.rotate-btn')) return;
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            LOCATIONS.forEach(loc => {
                if (loc.object3D && loc.object3D.visible) {
                    const intersects = raycaster.intersectObjects(loc.object3D.children, true);
                    if (intersects.length > 0) {
                        if(loc.link) window.open(loc.link, '_blank');
                    }
                }
            });
        };
        window.addEventListener('touchstart', onTouch, false);
        window.addEventListener('click', onTouch, false);

        // UI Buttons
        document.getElementById('closeBtn').addEventListener('click', () => location.reload());
        document.getElementById('resetBtn').addEventListener('click', () => location.reload());
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // --- LEAFLET ---
    function initLeaflet() {
        const mapEl = document.getElementById('mapStations');
        if (!mapEl) return;
        mapStations = L.map(mapEl, { zoomControl: false, attributionControl: false }).setView([52.3895, 9.6975], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapStations);
        mapStationsData.forEach(s => {
            L.circleMarker(s.coords, { radius: 4, color: '#fff', fillColor: '#555', fillOpacity: 1 }).addTo(mapStations); 
        });
        userLayer = L.layerGroup().addTo(mapStations);
    }

    function updateLeafletPosition(lat, lon, acc) {
        if(!mapStations || !userLayer) return;
        userLayer.clearLayers();
        L.circle([lat, lon], { radius: Math.max(acc, 4), color: '#3388ff', fillOpacity: 0.2, weight: 1 }).addTo(userLayer);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${mapHeading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/><circle cx="0" cy="10" r="3" fill="red"/></g></svg>`;
        const icon = L.icon({ iconUrl: 'data:image/svg+xml;base64,' + btoa(svg), iconSize: [48, 48], iconAnchor: [24, 24], className: 'user-arrow' });
        L.marker([lat, lon], { icon: icon, interactive: false }).addTo(userLayer);
        mapStations.setView([lat, lon], 17);
    }

    // --- GPS ---
    function startGNSS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = pos.coords.accuracy;

            updateLeafletPosition(lat, lon, acc);

            positionHistory.push({ lat, lon });
            if (positionHistory.length > MAX_HISTORY) positionHistory.shift();
            let avgLat = 0, avgLon = 0;
            positionHistory.forEach(p => { avgLat += p.lat; avgLon += p.lon; });
            avgLat /= positionHistory.length;
            avgLon /= positionHistory.length;

            if (!gnssReady) {
                gnssReady = true;
                checkReadyStatus();
            }

            let closestDist = 99999;
            let closestLoc = null;

            LOCATIONS.forEach(loc => {
                const dist = haversineDist(avgLat, avgLon, loc.lat, loc.lon);
                const offset = calcOffset(avgLat, avgLon, loc.lat, loc.lon);
                
                if (dist < closestDist) {
                    closestDist = dist;
                    closestLoc = loc;
                    closestLocRef = loc;
                }

                if (dist < VISIBILITY_DISTANCE) {
                    loc.object3D.position.x = offset.x;
                    loc.object3D.position.z = offset.z;
                    loc.object3D.visible = true;
                } else {
                    loc.object3D.visible = false;
                }
            });

            let debugMsg = `GPS: ${avgLat.toFixed(5)}, ${avgLon.toFixed(5)} (±${Math.round(acc)}m)\n`;
            if (closestLoc) {
                document.getElementById('targetName').innerText = closestLoc.title;
                document.getElementById('dist').innerText = Math.round(closestDist);
                debugMsg += `Ziel: ${closestLoc.title} (${Math.round(closestDist)}m)`;
            }
            logToDebug(debugMsg);

        }, (err) => {
            logToDebug("GPS Error: " + err.message);
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    // --- HELPER ---
    function checkReadyStatus() {
        if (modelsReady && gnssReady) document.getElementById('status').innerText = "Rundgang aktiv";
    }
    function changeRotation(delta) {
        if(!closestLocRef || !closestLocRef.object3D) return;
        const model = closestLocRef.object3D.children.find(child => child.type === 'Group' || child.type === 'Scene'); 
        if(model) {
            model.rotation.y += THREE.MathUtils.degToRad(delta);
            const deg = Math.round(THREE.MathUtils.radToDeg(model.rotation.y) % 360);
            document.getElementById('rotationDisplay').innerText = deg;
        }
    }
    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        if (waterParticles && waterParticles.parent && waterParticles.parent.visible) updateWaterEffect(waterParticles);
        if (closestLocRef && closestLocRef.object3D) {
            const camPos = new THREE.Vector3();
            camera.getWorldPosition(camPos);
            const targetPos = new THREE.Vector3();
            closestLocRef.object3D.getWorldPosition(targetPos);
            const dx = targetPos.x - camPos.x;
            const dz = targetPos.z - camPos.z;
            const bearingToTarget = Math.atan2(dx, dz);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const camBearing = Math.atan2(forward.x, forward.z);
            document.getElementById('arrow').style.transform = `rotate(${bearingToTarget - camBearing}rad)`;
        }
        renderer.render(scene, camera);
    }
    function createWaterEffect() {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(1500), vel = new Float32Array(1500);
        for(let i=0; i<500; i++) {
            pos[i*3]=0; pos[i*3+1]=0; pos[i*3+2]=0;
            vel[i*3]=(Math.random()-0.5)*0.1; vel[i*3+1]=Math.random()*0.3+0.2; vel[i*3+2]=(Math.random()-0.5)*0.1;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({color:0x88ccff, size:0.1, transparent:true}));
        pts.userData.velocities = vel;
        return pts;
    }
    function updateWaterEffect(pts) {
        const pos = pts.geometry.attributes.position.array;
        const vel = pts.userData.velocities;
        for(let i=0; i<500; i++) {
            pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
            vel[i*3+1]-=0.01;
            if(pos[i*3+1]<0) { pos[i*3]=0; pos[i*3+1]=0; pos[i*3+2]=0; vel[i*3]=(Math.random()-0.5)*0.05; vel[i*3+1]=Math.random()*0.3+0.2; vel[i*3+2]=(Math.random()-0.5)*0.05; }
        }
        pts.geometry.attributes.position.needsUpdate = true;
    }
    function createInfoWindow(text) {
        const cvs = document.createElement('canvas'); cvs.width=512; cvs.height=128;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,512,128);
        ctx.font='bold 26px sans-serif'; ctx.fillStyle='white'; ctx.textAlign='center'; ctx.fillText(text,256,75);
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvs), transparent:true}));
        spr.scale.set(2,0.5,1); return spr;
    }
    function calcOffset(lat1, lon1, lat2, lon2) {
        const R=6378137, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180, lat1Rad=lat1*Math.PI/180;
        return { x: dLon*Math.cos(lat1Rad)*R, z: -dLat*R };
    }
    function haversineDist(lat1, lon1, lat2, lon2) {
        const R=6371e3, rad=Math.PI/180, dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
        const a=Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
        return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function logToDebug(txt) { 
        const el = document.getElementById('debug-console'); 
        if(el) el.innerText = txt.split('\n')[0] + "\n" + el.innerText.substring(0, 150);
    }
  </script>
</body>
</html>
