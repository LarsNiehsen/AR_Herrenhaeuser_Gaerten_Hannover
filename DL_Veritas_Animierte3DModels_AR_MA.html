<!-- Der Kopfbereich enthält versteckte Metadaten und Einstellungen -->
<head>
    <!-- Legt die Zeichenkodierung fest, damit Umlaute korrekt dargestellt werden -->

    <!-- Passt das Bild an die Bildschirmgröße von Smartphones an und verhindert manuelles Zoomen -->

    <!-- Setzt den Titel, der im Tab des Webbrowsers angezeigt wird -->
    <title>WebAR - Animierte 3D-Modelle mit Deep-Learning Objekterkennung</title>
    
    <!-- Bereich für das Aussehen (CSS-Design) -->
    <style>
        /* Design für den gesamten sichtbaren Hintergrund (body) */
        body {
            /* Entfernt alle äußeren Ränder */
            margin: 0;
            /* Verhindert das Scrollen der Seite */
            overflow: hidden;
            /* Setzt die Hintergrundfarbe auf Schwarz */
            background-color: #000;
            /* Bestimmt die Standard-Schriftart für Texte auf der Seite */
            font-family: sans-serif;
            /* Deaktiviert Wisch-Gesten auf Mobilgeräten */
            touch-action: none; 
        }
        
        /* Design für das Videobild der Kamera */
        #webcam {
            /* Absolute Positionierung löst das Element aus dem normalen Textfluss */
            position: absolute;
            /* Ausrichtung an der oberen linken Ecke */
            top: 0; left: 0;
            /* Füllt die volle Breite und Höhe des Bildschirms aus */
            width: 100vw; height: 100vh;
            /* Skaliert das Video proportional, bis es den Bildschirm ausfüllt (ohne Verzerrung) */
            object-fit: cover;
            /* Setzt das Video auf die unterste Ebene */
            z-index: 1;
        }
        
        /* Container für die virtuelle 3D-Welt */
        #container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Platziert die 3D-Welt über dem Kamera-Video */
            z-index: 2;
        }

        /* Ein unsichtbares Canvas-Element für die KI-Rahmen (Bounding Boxes) */
        #box-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; 
            /* Platziert das Element über der 3D-Welt und dem Video */
            z-index: 3;
            /* Deaktiviert Zeigerereignisse, sodass Klicks durch das Element hindurch 
               auf die darunterliegenden 3D-Modelle weitergeleitet werden. */
            pointer-events: none; 
        }
        
        /* Startbildschirm mit Button */
        #ui {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Platziert das Menü ganz nach vorne */
            z-index: 10;
            /* Zentriert den Inhalt horizontal und vertikal */
            display: flex; justify-content: center; align-items: center;
            /* Halbtransparenter schwarzer Hintergrund */
            background: rgba(0, 0, 0, 0.85);
        }
        
        /* Design für Interaktions-Buttons */
        button {
            padding: 15px 40px; font-size: 20px; cursor: pointer;
            background-color: #ff0000; color: white; border: none;
            border-radius: 8px; font-weight: bold;
        }
        
        /* Design für das Informations-Textfeld */
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            z-index: 5; background: rgba(0,0,0,0.5); padding: 5px 10px;
            border-radius: 4px; display: none; pointer-events: none;
        }

        /* Virtuelles Steuerkreuz für Bewegungen */
        #walk-controls {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: none; grid-template-columns: 45px 45px 45px; grid-template-rows: 45px 45px 45px; gap: 5px;
        }
        
        /* Design der einzelnen Navigationstasten */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 50%;
            color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; user-select: none;
        }
        /* Designänderung bei aktiver Betätigung */
        .ctrl-btn:active { background: rgba(255, 0, 0, 0.6); }
        
        /* Definition der Raster-Positionen für die Tasten */
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* Steuerungselement für die Höhenanpassung */
        #height-control {
            position: absolute; top: 50%; left: 20px; transform: translateY(-50%); 
            z-index: 10; display: none; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.6); padding: 20px 10px; border-radius: 30px;
        }

        /* Steuerungselement für die Modell-Rotation */
        #rotation-control {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 10; display: none; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.6); padding: 10px 15px; border-radius: 30px;
        }

        /* Textformatierung der Beschriftungen in den Steuerungselementen */
        #rotation-control span, #height-control span { color: white; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        /* Abmessungen der Schieberegler */
        #rotationSlider { width: 25vw; max-width: 120px; margin: 0; }
        #heightSlider { -webkit-appearance: slider-vertical; appearance: slider-vertical; width: 8px; height: 120px; margin: 10px 0; cursor: pointer; }
    </style>

    <script type="importmap">

<body>

    <!-- Overlay mit Start-Schaltfläche -->
    <div id="ui"><button id="startButton" type="button">AR Starten</button></div>
    
    <!-- Video-Element für den Kamera-Stream (Startet automatisch ohne Ton) -->

    <!-- Hauptskript -->
    <script type="module">
        // Import der Three.js Kernfunktionen und Erweiterungen
        import * as THREE from 'three';
        import { GLTFLoader } from 'GLTFLoader';
        import { DeviceOrientationControls } from 'DeviceOrientationControls';

        // Deklaration der globalen Variablen für die 3D-Szene
        let camera, scene, renderer, controls;
        let staticModel, animatedModel, mixer, animationAction;
        
        // Initialisierung einer Stoppuhr zur Steuerung flüssiger Animationen
        let clock = new THREE.Clock();
        
        // Objekt zur Speicherung des aktuellen Bewegungsstatus
        let moveState = { forward: false, backward: false, left: false, right: false };
        
        // Konstante für die Bewegungsgeschwindigkeit
        const MOVE_SPEED = 0.05;

        // ==========================================
        // SYSTEM-ERKENNUNG FÜR SPEICHER-OPTIMIERUNG
        // ==========================================
        // Überprüfung des User-Agents zur Identifikation von iOS-Geräten.
        // iOS besitzt strikte RAM-Limits pro Tab. Wird dieses Limit überschritten, wird der Tab beendet.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // Auflösung des Bildes, das an das DL-Modell übergeben wird.
        // Bei iOS wird die Auflösung reduziert, um den Arbeitsspeicher zu schonen.
        const WORKER_SIZE = isIOS ? 320 : 640;

        // Wartezeit in Millisekunden zwischen zwei KI-Auswertungen.
        // Eine längere Pause bei iOS verhindert eine Überlastung der CPU und des Speichermanagements.
        const AI_DELAY = isIOS ? 300 : 100;
        // ==========================================

        // Variablen für den Hintergrundprozess (Web Worker) und den Berechnungsstatus
        let aiWorker;
        let isDetecting = false;
        
        // Referenzierung des Canvas-Elements für die Rahmenzeichnung
        const boxCanvas = document.getElementById('box-canvas');
        const boxCtx = boxCanvas.getContext('2d');
        
        // Erstellung eines temporären, unsichtbaren Canvas zur Extraktion der Bilddaten
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        // Referenzierung von DOM-Elementen zur Steuerung der Benutzeroberfläche
        const startButton = document.getElementById('startButton');
        const ui = document.getElementById('ui');
        const webcam = document.getElementById('webcam');
        const info = document.getElementById('info');

        // Dateipfade der 3D-Modelle
        const URL_STATIC_MODEL = '3D_models/BorghesischerFechter_WebAR.glb';
        const URL_ANIMATED_MODEL = '3D_models/BorghesischerFechter_iPhone17Pro_animiert_JumpDown.glb';

        // NEU: Bild-Objekt für den roten Vorhang erstellen
        const curtainImg = new Image();
        curtainImg.src = 'ImageMatching/Vorhang_rot.png'; 

        // Event-Listener für den Start-Button
        startButton.addEventListener('click', async () => {
            // Prüfung und Anforderung von Berechtigungen für Bewegungssensoren (häufig bei iOS erforderlich)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') { alert('Zugriff verweigert.'); return; }
                } catch (error) { console.error(error); }
            }

            // Anforderung des Kamera-Streams
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                webcam.srcObject = stream;
            } catch (error) {
                alert('Kamera konnte nicht gestartet werden.'); return;
            }

            // Anpassung der Benutzeroberfläche nach erfolgreichem Start
            ui.style.display = 'none';
            info.style.display = 'block';

            // Einblendung der Steuerungselemente
            document.getElementById('walk-controls').style.display = 'grid';
            document.getElementById('height-control').style.display = 'flex';
            document.getElementById('rotation-control').style.display = 'flex';

            // Initialisierung der Systemkomponenten
            initAI();
            initThreeJS();
            setupVirtualWalking();
        });

        // ==========================================
        // Deep-Learning-Erkennung
        // ==========================================
        
        // Initialisiert den Web Worker für die asynchrone Bildanalyse
        function initAI() {
            // Anpassung des Zeichenbereichs an die Bildschirmdimensionen
            boxCanvas.width = window.innerWidth;
            boxCanvas.height = window.innerHeight;

            info.innerText = 'Lade Modelle & KI...';

            // Start des Worker-Skripts im Hintergrund
            aiWorker = new Worker('worker.js');
            
            // Event-Listener zum Empfang von Nachrichten des Workers
            aiWorker.onmessage = function(event) {
                if (event.data.type === 'ready') {
                    console.log("KI bereit!");
                    // Der Startimpuls für den ersten Frame wird gesendet
                    requestNextFrame(); 
                } 
                else if (event.data.type === 'result') {
                    // Ausführen der Zeichenfunktion mit den erhaltenen Daten
                    drawBoxes(event.data.data);
                    
                    // Implementierung einer Verzögerung vor der nächsten Analyse zur Entlastung des Systems
                    setTimeout(() => {
                        isDetecting = false;
                        requestNextFrame(); 
                    }, AI_DELAY); 
                }
            };
        }

        // Extrahiert den aktuellen Video-Frame und übergibt ihn an den Worker
        function requestNextFrame() {
            // Abbruch, falls aktuell eine Berechnung stattfindet oder das Video nicht bereit ist
            if (isDetecting || webcam.readyState < 2) return;
            
            // Anpassung des versteckten Canvas auf die berechnete Zielauflösung
            hiddenCanvas.width = WORKER_SIZE;
            hiddenCanvas.height = WORKER_SIZE;
            
            // Der Video-Frame wird auf den Canvas gezeichnet und skaliert
            hiddenCtx.drawImage(webcam, 0, 0, WORKER_SIZE, WORKER_SIZE);
            
            // Die Pixeldaten werden aus dem Canvas extrahiert
            const imageData = hiddenCtx.getImageData(0, 0, WORKER_SIZE, WORKER_SIZE);
            
            // Sperrung weiterer Anfragen bis zum Abschluss der aktuellen Berechnung
            isDetecting = true;
            
            // Übermittlung der Daten an den Worker.
            // Der ArrayBuffer wird als 'Transferable Object' übergeben. Dies verhindert ein Kopieren der Daten
            // im Speicher und minimiert das Risiko von Speicherlecks.
            aiWorker.postMessage(
                { type: 'predict', image: imageData },[imageData.data.buffer]
            );
        }

        // Zeichnet die von der KI erkannten Begrenzungsrahmen
        function drawBoxes(predictions) {
            // Leerung des vorherigen Canvas-Inhalts
            boxCtx.clearRect(0, 0, boxCanvas.width, boxCanvas.height);
            
            // Abbruch bei fehlenden Daten
            if (!predictions || !predictions.boxes) return;

            // Extraktion der Dimensionen für die Skalierungsberechnung
            const videoW = webcam.videoWidth;
            const videoH = webcam.videoHeight;
            const screenW = boxCanvas.width;
            const screenH = boxCanvas.height;

            // Berechnung des Skalierungsfaktors für das Video (object-fit: cover)
            const scale = Math.max(screenW / videoW, screenH / videoH);
            // Berechnung des resultierenden Versatzes durch das Abschneiden an den Rändern
            const offsetX = (screenW - (videoW * scale)) / 2;
            const offsetY = (screenH - (videoH * scale)) / 2;

            // Definition der visuellen Eigenschaften für die Rahmen
            boxCtx.strokeStyle = '#00FF00';
            boxCtx.lineWidth = 4;
            boxCtx.fillStyle = 'rgba(0, 255, 0, 0.2)';

            // Iteration über alle gefundenen Objekte
            for (let i = 0; i < predictions.boxes.length; i++) {
                // Filterung nach einem Konfidenzwert von mindestens 90%
                if (predictions.scores[i] > 0.9) {
                    let[x_center, y_center, width, height] = predictions.boxes[i];

                    // Transformation der KI-Koordinaten zurück auf die Original-Videoauflösung
                    const origX = (x_center / WORKER_SIZE) * videoW;
                    const origY = (y_center / WORKER_SIZE) * videoH;
                    const origBoxW = (width / WORKER_SIZE) * videoW;
                    const origBoxH = (height / WORKER_SIZE) * videoH;

                    // Anpassung der Dimensionen an die Bildschirmskalierung
                    const finalBoxW = origBoxW * scale;
                    const finalBoxH = origBoxH * scale;
                    
                    // Berechnung der finalen X- und Y-Startpunkte
                    const finalX = (origX * scale) + offsetX - (finalBoxW / 2);
                    const finalY = (origY * scale) + offsetY - (finalBoxH / 2);

                    // Auslesen der erkannten Klasse durch die KI
                    let detectedClass = 'Statue';
                    if (predictions.classes && predictions.classes[i] !== undefined) {
                        detectedClass = predictions.classes[i].toString();
                    } else if (predictions.labels && predictions.labels[i] !== undefined) {
                        detectedClass = predictions.labels[i].toString();
                    }

                    // Erkennen, ob es sich um eine "sonstige" Statue handelt
                    // Wir checken auf den Namen "statue" ODER auf die ID "1" (für Web-Export)
                    const isSonstige = detectedClass.toLowerCase().includes('statue') || detectedClass === '1';

                    if (isSonstige) {
                        // Vorhang einblenden statt Rahmen für "sonstige" Statuen
                        if (curtainImg.complete && curtainImg.naturalHeight !== 0) {
                            boxCtx.drawImage(curtainImg, finalX, finalY, finalBoxW, finalBoxH);
                        } else {
                            // Fallback, wenn das Vorhang-Bild noch geladen wird
                            boxCtx.fillStyle = '#8B0000';
                            boxCtx.fillRect(finalX, finalY, finalBoxW, finalBoxH);
                        }

                        // Textbeschriftung für verdeckte Statuen
                        boxCtx.fillStyle = '#FFFFFF';
                        boxCtx.font = '20px Arial';
                        boxCtx.fillText(`Statue: ${Math.round(predictions.scores[i] * 100)}%`, finalX, finalY - 10);
                        
                        // Zurücksetzen der Füllfarbe für Folgeiterationen
                        boxCtx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                    } else {
                        // Zeichnen des Rahmens
                        boxCtx.beginPath();
                        boxCtx.rect(finalX, finalY, finalBoxW, finalBoxH);
                        boxCtx.stroke();
                        boxCtx.fill();
                        
                        // Zeichnen der Textbeschriftung inklusive Prozentangabe
                        boxCtx.fillStyle = '#00FF00';
                        boxCtx.font = '20px Arial';
                        boxCtx.fillText(`Veritas: ${Math.round(predictions.scores[i] * 100)}%`, finalX, finalY - 10);
                        // Zurücksetzen der Füllfarbe für Folgeiterationen
                        boxCtx.fillStyle = 'rgba(0, 255, 0, 0.2)'; 
                    }
                }
            }
        }
        // ==========================================
        // ENDE KI FUNKTIONEN
        // ==========================================

        // Initialisiert die 3D-Szene und deren Komponenten
        function initThreeJS() {
            // Referenzierung des Container-Elements
            const container = document.getElementById('container');

            // Erstellung der Szene
            scene = new THREE.Scene();

            // Konfiguration der Kamera (Sichtfeld, Seitenverhältnis, minimaler/maximaler Renderabstand)
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000000);
            camera.position.set(0, 1.6, 0);

            // Konfiguration des Renderers
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Aktivierung und Konfiguration der Schattenberechnung
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            container.appendChild(renderer.domElement);

            // Hinzufügen einer globalen Umgebungsbeleuchtung
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(ambientLight);

            // Konfiguration eines gerichteten Lichts zur Schattenerzeugung
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(-3, 4, -1);
            dirLight.castShadow = true;

            // Ausrichtung der Lichtquelle auf den Modellstandpunkt
            dirLight.target.position.set(0, 0, -2);
            scene.add(dirLight.target);

            // Definition der Schattenparameter zur Optimierung der Renderleistung
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 15;
            dirLight.shadow.camera.left = -5;
            dirLight.shadow.camera.right = 5;
            dirLight.shadow.camera.top = 5;
            dirLight.shadow.camera.bottom = -5;
            dirLight.shadow.bias = -0.001; 
            scene.add(dirLight);

            // Erstellung einer transparenten Bodenebene zum Empfang von Schatten
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); 
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            floorMesh.rotation.x = -Math.PI / 2; 
            floorMesh.position.y = 0;
            floorMesh.receiveShadow = true; 
            scene.add(floorMesh);

            // Erstellung von Gitternetzen zur visuellen Orientierung
            const grid1m = new THREE.GridHelper(100, 100, 0x888888, 0x555555);
            grid1m.position.y = 0;
            scene.add(grid1m);

            for (let xOffset = -0.02; xOffset <= 0.02; xOffset += 0.02) {
                for (let zOffset = -0.02; zOffset <= 0.02; zOffset += 0.02) {
                    const grid5m = new THREE.GridHelper(100, 20, 0xff0000, 0xff0000);
                    grid5m.position.set(xOffset, 0.01, zOffset);
                    scene.add(grid5m);
                }
            }

            // Vorbereitung des 3D-Modell-Laders
            const loader = new GLTFLoader();
            const modelScale = 200.0;

            // Hilfsfunktion zur Zuweisung von Schatteneigenschaften an alle Teilnetze (Meshes)
            const enableShadows = (modelObj) => {
                modelObj.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true; 
                    }
                });
            };

            // Ladevorgang des statischen Modells
            loader.load(URL_STATIC_MODEL, (gltf) => {
                staticModel = gltf.scene;
                staticModel.scale.set(modelScale, modelScale, modelScale);
                staticModel.position.set(0, 0, -2);
                enableShadows(staticModel); 
                scene.add(staticModel);

                info.innerText = 'Statisches Modell geladen. Lade animiertes...';

                // Anschließender Ladevorgang des animierten Modells
                loader.load(URL_ANIMATED_MODEL, (gltfAnim) => {
                    animatedModel = gltfAnim.scene;
                    animatedModel.scale.set(modelScale, modelScale, modelScale);
                    animatedModel.position.set(0, 0, -2);
                    enableShadows(animatedModel); 
                    animatedModel.visible = false;
                    scene.add(animatedModel);

                    // Initialisierung der Animationskomponenten
                    if (gltfAnim.animations && gltfAnim.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(animatedModel);
                        animationAction = mixer.clipAction(gltfAnim.animations[0]);
                        animationAction.setLoop(THREE.LoopOnce, 1);
                        animationAction.clampWhenFinished = true;

                        // Event-Listener zur Steuerung der Sichtbarkeiten nach Animationsende
                        mixer.addEventListener('finished', () => {
                            animatedModel.visible = false;
                            if (staticModel) {
                                staticModel.visible = true;
                            }
                            
                            const rControl = document.getElementById('rotation-control');
                            if (rControl) rControl.style.display = 'flex';
                            
                            const hControl = document.getElementById('height-control');
                            if (hControl) hControl.style.display = 'flex';
                        });

                        // Kompilierung des Renderers mit Minimalgröße des Modells
                        // Dies verhindert ein plötzliches Ruckeln während des ersten Aufrufs.
                        animatedModel.scale.set(0.0001, 0.0001, 0.0001);
                        animatedModel.visible = true;
                        mixer.update(0.01);
                        renderer.compile(scene, camera);
                        renderer.render(scene, camera);
                        animatedModel.visible = false;
                        animatedModel.scale.set(modelScale, modelScale, modelScale);
                        animationAction.reset();
                    }

                    info.innerText = '1. Modell drehen\n2. Modell antippen!';
                    setTimeout(() => info.style.display = 'none', 4000);
                }, undefined, (error) => {
                    console.error("Fehler beim Laden des animierten Modells", error);
                    info.innerText = 'Statisches Modell bereit. (Animiertes Modell nicht gefunden)';
                });

            }, undefined, (error) => {
                console.error("Fehler beim Laden des statischen Modells:", error);
                info.innerText = 'Fehler beim Laden des Modells!';
            });

            // Zuweisung der Geräteorientierung an die Kamerasteuerung
            controls = new DeviceOrientationControls(camera);
            
            // Registrierung globaler Event-Listener
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);

            // Anbindung des Höhenreglers
            const hSlider = document.getElementById('heightSlider');
            if (hSlider) {
                hSlider.addEventListener('input', (e) => {
                    camera.position.y = parseFloat(e.target.value);
                });
            }

            // Anbindung des Rotationsreglers
            const rSlider = document.getElementById('rotationSlider');
            if (rSlider) {
                rSlider.addEventListener('input', (e) => {
                    const radians = parseFloat(e.target.value) * (Math.PI / 180);
                    if (staticModel) staticModel.rotation.y = radians;
                    if (animatedModel) animatedModel.rotation.y = radians;
                });
            }

            // Start der Render-Schleife
            animate();
        }

        // Koppelt die HTML-Bedienelemente an den virtuellen Bewegungsstatus
        function setupVirtualWalking() {
            const bindBtn = (id, action) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = true; }, {passive: false});
                btn.addEventListener('mousedown', (e) => { e.stopPropagation(); moveState[action] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = false; }, {passive: false});
                btn.addEventListener('mouseup', (e) => { e.stopPropagation(); moveState[action] = false; });
                btn.addEventListener('mouseleave', () => { moveState[action] = false; });
            };
            
            bindBtn('btn-up', 'forward');
            bindBtn('btn-down', 'backward');
            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');
        }

        // Raycaster und Mausvektor zur Objekterkennung bei Interaktionen
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Wird bei einer Eingabe auf dem Bildschirm ausgelöst
        function onPointerDown(event) {
            // Prüfung, um versehentliche Interaktionen über Bedienelemente zu verhindern
            if ((event.target.classList && event.target.classList.contains('ctrl-btn')) || 
                event.target.tagName === 'INPUT' || 
                event.target.closest('#rotation-control') || 
                event.target.closest('#height-control')) {
                return;
            }

            // Umrechnung der Bildschirmkoordinaten in den normalisierten Gerätebereich (-1 bis +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Ausrichtung des Raycasters basierend auf der Kameraperspektive
            raycaster.setFromCamera(mouse, camera);

            // Prüfung auf Kollisionen zwischen Raycaster und dem statischen Modell
            if (staticModel && staticModel.visible) {
                const intersects = raycaster.intersectObject(staticModel, true);
                
                if (intersects.length > 0) {
                    // Ausblenden des statischen Modells
                    staticModel.visible = false;
                    
                    // Einblenden und Starten des animierten Modells
                    if (animatedModel) {
                        animatedModel.visible = true;
                        
                        if (animationAction) {
                            animationAction.reset();
                            animationAction.play();
                        }
                    }
                    
                    // Ausblenden der Steuerungsmenüs während der Animation
                    const rControl = document.getElementById('rotation-control');
                    if (rControl) rControl.style.display = 'none';
                    
                    const hControl = document.getElementById('height-control');
                    if (hControl) hControl.style.display = 'none';
                }
            }
        }

        // Aktualisiert die Kameraposition auf Basis des ermittelten Bewegungsstatus
        function applyMovement() {
            if(!moveState.forward && !moveState.backward && !moveState.left && !moveState.right) return;
            
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; 
            dir.normalize();
            
            const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            if (moveState.forward) camera.position.addScaledVector(dir, MOVE_SPEED);
            if (moveState.backward) camera.position.addScaledVector(dir, -MOVE_SPEED);
            if (moveState.left) camera.position.addScaledVector(right, -MOVE_SPEED);
            if (moveState.right) camera.position.addScaledVector(right, MOVE_SPEED);
        }

        // Passt die Projektionsmatrix und das Rendering bei Änderungen der Fenstergröße an
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Die Dimensionen des Zeichenbereichs werden ebenfalls synchronisiert
            boxCanvas.width = window.innerWidth;
            boxCanvas.height = window.innerHeight;
        }

        // Hauptschleife zur kontinuierlichen Aktualisierung der 3D-Szene
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer && animatedModel && animatedModel.visible) {
                mixer.update(delta);
            }

            if (controls) {
                controls.update();
            }

            applyMovement();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
