<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- 
        Viewport-Einstellungen: 
        Definiert den sichtbaren Bereich auf mobilen Geräten. 
        'user-scalable=no' verhindert das Zoomen, um die AR-Darstellung stabil zu halten.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - Augmented Reality (AR)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importmap: Die Speicherorte für externe Module (Three.js und MindAR) werden definiert. -->

    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    
    <!-- Tesseract.js: Bibliothek für optische Zeichenerkennung (OCR) wird eingebunden. -->

    <!-- CSS Styles: Die visuelle Gestaltung der Benutzeroberfläche wird festgelegt. -->
    <style>
        /* Basis-Layout: Der Hintergrund wird schwarz gesetzt, Scrollleisten werden ausgeblendet. */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Das Video-Element wird von MindAR verwaltet und hier ausgeblendet. */
        #videoElement { display: none; }

        /* Canvas über dem Video für Debug-Linien (ArUco Visualisierung). */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; pointer-events: none;
        }

        /* Container für die 3D-Szene (Three.js Layer). */
        #container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: auto; overflow: hidden;
        }

        /* Standard-Design für UI-Elemente (halbtransparentes Schwarz mit Unschärfe-Effekt). */
        .ui-panel {
            position: absolute; z-index: 100; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2); color: white;
            border-radius: 12px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }

        /* Debug-Informationen werden oben links positioniert. */
        #debugInfo {
            top: 20px; left: 20px; padding: 15px; min-width: 200px;
            max-width: calc(100% - 100px); font-size: 13px; pointer-events: none;
        }

        #debugInfo strong {
            display: block; margin-bottom: 8px; color: #ffffff;
            font-weight: bold; font-size: 11px; 
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px; line-height: 1.3;
        }

        /* Der Schließen-Button wird oben rechts positioniert. */
        #closeBtn {
            top: 20px; right: 20px; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px; cursor: pointer;
            background: rgba(200, 40, 40, 0.85);
            border: 1px solid rgba(255, 100, 100, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #closeBtn:active { transform: scale(0.95); }

        /* Texterkennung-Button unter dem Schließen-Button */
        #ocrBtn {
            top: 75px; right: 20px; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; cursor: pointer;
            background: rgba(40, 100, 200, 0.85);
            border: 1px solid rgba(100, 150, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #ocrBtn:active { transform: scale(0.95); }

        /* 3D-Viewer-Button unter dem Texterkennungs-Button platziert */
        #viewerBtn {
            top: 115px; right: 20px; width: 30px; height: 30px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; cursor: pointer;
            background: rgba(40, 180, 100, 0.85); 
            border: 1px solid rgba(100, 255, 150, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #viewerBtn:active { transform: scale(0.95); }

        /* Das Informationsfeld für 3D-Modelle wird unten mittig angezeigt. */
        #modelInfo {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 400px; text-align: center; display: none; cursor: pointer; z-index: 200; 
        }
        #modelInfo h3 { color: #4f4; margin: 0 0 4px 0; font-size: 18px; font-weight: bold; }
        #modelInfo p { color: #eee; margin: 0; font-size: 14px; line-height: 1.3; }

        /* Historisches Bild (Kupferstich) wird rechts mittig platziert. */
        #historicalInfo {
            display: none; top: 50%; right: 20px; left: auto;
            transform: translateY(-50%); width: 180px; padding: 10px; text-align: center; z-index: 250;
        }
        #historicalInfo h4 {
            margin: 0 0 8px 0; font-size: 12px; color: #ffda85; 
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px;
        }
        #historicalInfo img {
            width: 100%; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Container für die Kartensteuerung unten rechts. */
        #mapControls {
            position: absolute; bottom: 20px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
        }

        #mapContainer {
            position: relative; width: 240px; height: 180px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; pointer-events: auto;
        }

        #mapStations { width: 100%; height: 100%; }

        .map-btn-overlay {
            position: absolute; top: 5px; right: 5px;
            display: flex; flex-direction: column; gap: 4px; z-index: 1000;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.9); border: none; border-radius: 4px; padding: 6px;
            cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }

        .bottom-right-btns { display: flex; gap: 12px; }

        .action-btn {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Steuerung für die manuelle Rotation unten links. */
        #rotationControls {
            position: absolute; bottom: 20px; left: 20px; z-index: 100; display: flex; gap: 12px;
        }

        .rotate-btn {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 26px; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Hinweis-Text für Interaktionen in der Bildschirmmitte. */
        #clickHint {

            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; font-size: 1.3rem;
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Richtungspfeil für GNSS-Navigation. */
        #direction-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 95;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); pointer-events: none; transition: opacity 0.5s; opacity: 0;
        }
        
        #arrow {
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-bottom: 30px solid #00ff00; /* Grüner Pfeil */
            transform-origin: center 20px;
            filter: drop-shadow(0 0 4px #00ff00); transform: rotate(0deg); transition: transform 0.2s ease-out;
        }

        .label-small { font-size: 11px; color: #bbb; margin-right: 5px; text-transform: uppercase; }
        .val-highlight { color: #fff; font-weight: bold; }
        .val-green { color: #4f4; font-weight: bold; }

</head>

            },

                title: 'Borghesischer Fechter', info: 'Borghesischer Fechter am Gartentheater',

                isAnimated: true, mindTargetIndexes: [0],
                lat: 52.386018, lon: 9.695975, initRotation: 0
            },
            33: {

                title: 'Große Fontäne', info: 'Große Fontäne',
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
                isAnimated: true,
                lat: 52.388778, lon: 9.817775, initRotation: 0
            }
        };

        // Liste der POIs für die Karte
        const stations =[
            { title: 'Große Fontaine', coords:[52.386018, 9.695975] },
            { title: 'Goldenes Tor', coords:[52.390184, 9.699546] },
            { title: 'Haupteingang mit Kasse', coords:[52.391185, 9.698368] },
            { title: 'Niki de Saint Phalle - Grotte', coords:[52.390713, 9.696767] },
            { title: 'Sommer - Statue', coords:[ 52.389583, 9.697833] },
            { title: 'Borghesischer Fechter', coords:[52.389463, 9.699207] },
            { title: 'Niederdeutscher Blumengarten', coords:[52.388196, 9.697853] }
        ];

        // Referenzierung der HTML-Elemente
        const videoCanvas = document.getElementById('videoCanvas');
        const statusText = document.getElementById('statusText');
        const modelInfo = document.getElementById('modelInfo');
        const objTitle = document.getElementById('objTitle');

        // Globale Variablen
        let activeLink = null;
        let loadedMeshes = {}; // ArUco-Objekte
        let mindARMeshes = {}; // MindAR-Objekte
        let gnssMeshes = {};   // GNSS-Objekte
        let detector, posit;   
        let mindarThree, renderer, scene, camera;
        let mindarAnchors =[];
        let markerGroup, gnssGroup;

        let realPos = null; // Tatsächliche Sensor-Position
        let heading = 0;    // Korrigierte Blickrichtung
        let rawHeading = 0; // Rohdaten des Kompass
        let compassOffset = 0; // Kalibrierungsoffset
        let lastDeviceOrientation = null; 
        let mapStations, userLayer;

        // Speichert, welches Modul aktuell das UI kontrolliert, um Dauerschleifen/Fehler zu verhindern
        let currentTrackingSource = "";

        /*
         * Variablen für die relative GNSS-Simulation.
         * Die Simulation springt initial auf einen Zielpunkt, erlaubt dem Nutzer
         * aber während der Simulationsphase, sich physisch darauf zuzubewegen.

        let isSimulatedPos = false; // Status der Simulation
        let simulationEndTime = 0; // Endzeitpunkt (z.B. nach 30 Sekunden)
        let simulatedBaseCoords = null; // Die Basis-Zielkoordinate der Simulation (wohin anfangs gesprungen wird)
        let simulationStartRealPos = null; // Die echte Startposition des Nutzers (dient als Nullpunkt für die Schrittberechnung)
        const SIMULATION_PERSISTENCE = 30000; // Dauer der Simulation in Millisekunden

        // Variablen für MindAR Tracking Zeitfenster
        let activeMindARId = -1; 
        let activeMindAREndTime = 0; 
        const STANDARD_PERSISTENCE = 10000; 

        // Variablen für OCR (Texterkennung)
        let isOcrRunning = false;

        // Erstellung eines Partikelsystems (Wasserfontäne)
        function createWaterEffect() {
            const particleCount = 15000; 
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3); 
            const velocities = new Float32Array(particleCount * 3); 

            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                velocities[i*3] = (Math.random() - 0.5) * 0.036;     
                velocities[i*3+1] = (Math.random() * 0.3 + 0.15);    
                velocities[i*3+2] = (Math.random() - 0.5) * 0.036;   
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xaaddff, size: 0.03, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geometry, material);
            points.userData.vels = velocities; 
            points.frustumCulled = false; 
            return points;
        }

        // Animation des Wassereffekts
        function updateWaterEffect(points) {
            const pos = points.geometry.attributes.position.array;
            const vels = points.userData.vels;
            const gravity = 0.003; 

            for (let i = 0; i < pos.length / 3; i++) {
                pos[i*3] += vels[i*3];     
                pos[i*3+1] += vels[i*3+1]; 
                pos[i*3+2] += vels[i*3+2]; 
                vels[i*3+1] -= gravity; 

                if (pos[i*3+1] < 0) {
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
                    vels[i*3] = (Math.random() - 0.5) * 0.036; 
                    vels[i*3+1] = (Math.random() * 0.3 + 0.15); 
                    vels[i*3+2] = (Math.random() - 0.5) * 0.036; 
                }
            }
            points.geometry.attributes.position.needsUpdate = true; 
        }

        // Erstellung eines Maßstabs neben der Fontaine (70m vertikal)
        function createMeasureBar() {
            const group = new THREE.Group();
            
            // Horizontale Linie UNTEN (an der Unterkante des Modells)
            const horizontalBottomGeometry = new THREE.BufferGeometry();
            const horizontalBottomPositions = new Float32Array([
                -1.75, 0, 0,    // Links
                1.75, 0, 0      // Rechts
            ]);
            horizontalBottomGeometry.setAttribute('position', new THREE.BufferAttribute(horizontalBottomPositions, 3));
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 4, fog: false });
            const horizontalBottom = new THREE.Line(horizontalBottomGeometry, lineMaterial);
            group.add(horizontalBottom);
            
            // Vertikale Linie (70m = 3.5 Units)
            const verticalGeometry = new THREE.BufferGeometry();
            const verticalPositions = new Float32Array([
                0, 0, 0,        // Unten
                0, 3.5, 0       // Oben
            ]);
            verticalGeometry.setAttribute('position', new THREE.BufferAttribute(verticalPositions, 3));
            const vertical = new THREE.Line(verticalGeometry, lineMaterial);
            group.add(vertical);
            
            // Horizontale Linie OBEN (70m)
            const horizontalTopGeometry = new THREE.BufferGeometry();
            const horizontalTopPositions = new Float32Array([
                -1.75, 3.5, 0,  // Links
                1.75, 3.5, 0    // Rechts
            ]);
            horizontalTopGeometry.setAttribute('position', new THREE.BufferAttribute(horizontalTopPositions, 3));
            const horizontalTop = new THREE.Line(horizontalTopGeometry, lineMaterial);
            group.add(horizontalTop);
            
            // Kleine Markierungen unten
            const markBottomGeometry = new THREE.BufferGeometry();
            const markBottomPositions = new Float32Array([
                -1.75, -0.2, 0,
                -1.75, 0.2, 0,
                1.75, -0.2, 0,
                1.75, 0.2, 0
            ]);
            markBottomGeometry.setAttribute('position', new THREE.BufferAttribute(markBottomPositions, 3));
            const markMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 2, fog: false });
            const markBottom = new THREE.LineSegments(markBottomGeometry, markMaterial);
            group.add(markBottom);
            
            // Kleine Markierungen oben
            const markTopGeometry = new THREE.BufferGeometry();
            const markTopPositions = new Float32Array([
                -1.75, 3.3, 0,
                -1.75, 3.7, 0,
                1.75, 3.3, 0,
                1.75, 3.7, 0
            ]);
            markTopGeometry.setAttribute('position', new THREE.BufferAttribute(markTopPositions, 3));
            const markTop = new THREE.LineSegments(markTopGeometry, markMaterial);
            group.add(markTop);
            
            // Canvas-Text "70 m" in der Mitte
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0000ff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('70 m', 128, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(0, 1.75, 0);  // Mittig zwischen unten und oben
            sprite.scale.set(2, 0.5, 1);
            group.add(sprite);
            
            group.userData.isMeasureBar = true;
            return group;
        }

        // Initialisierung und Start der AR-Engine
        const startAR = async () => {
            mindarThree = new MindARThree({
                container: document.querySelector("#container"),
                imageTargetSrc: 'ImageMatching/GrosseFontaineInfo_NiederdeutscherBlumengarten_targets.mind',
                uiLoading: "no", uiScanning: "no", uiError: "no",
                filterMinCF: 0.0001, filterBeta: 0.001,
                maxTrack: 2 
            });

            renderer = mindarThree.renderer;
            scene = mindarThree.scene;
            camera = mindarThree.camera;
            camera.far = 50000; camera.updateProjectionMatrix();
            renderer.setClearColor(0x000000, 0);
            
            // Beleuchtung hinzufügen
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); 
            const dl = new THREE.DirectionalLight(0xffffff, 2.0); 
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            markerGroup = new THREE.Group(); markerGroup.visible = false; scene.add(markerGroup);
            gnssGroup = new THREE.Group(); gnssGroup.visible = true; scene.add(gnssGroup);

            // --- KORREKTUR: VISUELLES METRISCHES GITTER (AM BODEN BEI DEN FÜSSEN) ---
            /*
             * Das Gitter ist 200x200 Meter groß. Da der Nutzer in der 3D-Welt IMMER im Zentrum (0,0,0) steht,
             * liegt dieses Gitter immer exakt an deinen Füßen und dehnt sich 100m in jede Richtung aus.
             * Gitter 1 macht alle grauen 1-Meter Kästchen.
             * Gitter 2 macht nur alle 10 Meter dicke blaue Linien.
             */
            
            // 1-Meter Raster (grau, 200 Kästchen)
            const gridHelper1m = new THREE.GridHelper(200, 200, 0x444444, 0x444444); 
            gridHelper1m.position.y = -2.0; // Exakt am Boden
            gnssGroup.add(gridHelper1m);

            // 10-Meter Raster (blau, 20 Kästchen -> also genau jede 10. Linie des grauen Gitters)
            const gridHelper10m = new THREE.GridHelper(200, 20, 0x0088ff, 0x0088ff); 
            gridHelper10m.position.y = -1.99; // Minimal höher als das graue Gitter, um Flackern (Z-Fighting) zu vermeiden
            gnssGroup.add(gridHelper10m);

            // Achsenkreuz für die Himmelsrichtungen
            const axesHelper = new THREE.AxesHelper(10); 
            axesHelper.position.y = -1.98; // Direkt über dem Gitter am Boden
            gnssGroup.add(axesHelper);
            // --------------------------------------------------------------------------
            
            // Definition der MindAR-Anker
            for (let i = 0; i < 7; i++) {
                const anchor = mindarThree.addAnchor(i);
                anchor.onTargetFound = () => {
                    activeMindARId = i;
                    if (i === 0) {
                        // Simulation Fontäne (Position 0)
                        activateSimulation(target0Lat, target0Lon, 335);
                    } else if (i === 4 || i === 5 || i === 6) {
                        // Simulation Blumengarten (Trigger 4-6)
                        activateSimulation(targetBlumengartenLat, targetBlumengartenLon, 22);
                    } else if (i === 1 || i === 2 || i === 3) {
                         // Standard-Timer für Image Tracking
                         activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                    }
                };
                mindarAnchors[i] = anchor;
            }

            loadModels();
            await mindarThree.start();

            // Render-Schleife
            renderer.setAnimationLoop(() => {
                const video = mindarThree.video;
                const arucoFound = processArucoFrame(video);
                
                // OCR-Prüfung periodisch ausführen, wenn kein Marker getrackt wird
                if (!arucoFound && activeMindARId === -1 && !isOcrRunning && (Date.now() - lastOcrTime > 2000)) {
                    runOcrCheck(videoCanvas);
                }
                
                let showSimulation = false;
                let showStandardMindAR = false;

                // Logik für MindAR-Timer
                if (activeMindARId >= 1 && activeMindARId <= 3) {
                    if (mindarAnchors[activeMindARId] && mindarAnchors[activeMindARId].group.visible) {
                        activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                    }
                }
                
                // Entscheidung Tracking-Modus
                if (arucoFound) {
                    activeMindARId = -1; 
                } else {
                    if (isSimulatedPos) {
                        // Simulationsmodus aktiv
                        if (Date.now() < simulationEndTime) {
                            showSimulation = true;
                            
                            /*
                             * RELATIVE BEWEGUNGSBERECHNUNG WÄHREND DER SIMULATION:
                             * Die Kamera springt initial auf den hinterlegten Basis-Koordinatenpunkt (simulatedBaseCoords).
                             * Anschließend wird bei jedem Frame geprüft, wie weit sich das Gerät physisch vom 
                             * ursprünglichen Startpunkt (simulationStartRealPos) entfernt hat.
                             * Diese Differenz (Delta) wird live auf die simulierte Position addiert.
                             * So kann man sich auf das Objekt zubewegen, obwohl man sich in einer Simulation befindet.
                             */
                            if (simulatedBaseCoords) {
                                let curLat = simulatedBaseCoords.lat;
                                let curLon = simulatedBaseCoords.lon;
                                let curAcc = 1.5;

                                if (realPos) {
                                    // Falls beim Auslösen noch kein GPS verfügbar war, wird es beim ersten Fix als Nullpunkt gesetzt.
                                    if (!simulationStartRealPos) {
                                        simulationStartRealPos = { lat: realPos.latitude, lon: realPos.longitude };
                                    }
                                    
                                    // Koordinatendifferenz (Delta) zum physischen Startpunkt berechnen
                                    const deltaLat = realPos.latitude - simulationStartRealPos.lat;
                                    const deltaLon = realPos.longitude - simulationStartRealPos.lon;
                                    
                                    // Differenz zur virtuellen Basisposition addieren
                                    curLat += deltaLat;
                                    curLon += deltaLon;
                                    curAcc = realPos.accuracy;
                                }
                                
                                // Letzte Position für das Rendering entsprechend überschreiben
                                lastPos = { latitude: curLat, longitude: curLon, accuracy: curAcc };
                            }
                        } else {
                            isSimulatedPos = false;
                            // Zurückfallen auf reale GNSS-Daten
                            if (realPos) lastPos = realPos;
                        }
                    } 
                    else if (activeMindARId >= 1 && activeMindARId <= 3) {
                        // Standard MindAR Anzeige aktiv
                        if (Date.now() < activeMindAREndTime) showStandardMindAR = true;
                        else activeMindARId = -1;
                    }
                }

                // Steuerung MindAR-Modelle
                Object.keys(mindARMeshes).forEach(idStr => {
                    const id = parseInt(idStr);
                    if (mindARMeshes[id]) {
                        mindARMeshes[id].forEach(mesh => {
                            if (showStandardMindAR && mesh.userData.anchorIndex === activeMindARId) {
                                mesh.visible = true;
                                if(mesh.userData.particles) updateWaterEffect(mesh.userData.particles);
                                
                                // Sauberer UI-Aufruf (steuert Text, Kupferstich und den 5s-Hinweis zentral)
                                updateUIForModel(id, "MindAR");
                            } else {
                                mesh.visible = false;
                            }
                        });
                    }
                });

                isMarkerTracking = arucoFound || showStandardMindAR;

                // Bestimmen, ob GNSS-Modelle angezeigt werden sollen
                let showGNSSModels = !arucoFound && !(showStandardMindAR && !isSimulatedPos);

                // --- GNSS-LOGIK UND KAMERA-ROTATION ---
                if (showGNSSModels && (showSimulation || (!isMarkerTracking && gnssGroup))) {
                    gnssGroup.visible = true;
                    
                    // KAMERA-ROTATION ANSTATT SZENEN-ROTATION:
                    // Um zu ermöglichen, dass der Nutzer um GNSS-Modelle herumgehen kann,
                    // wird hier die Orientierung der Kamera angepasst. Die 'gnssGroup' bleibt 
                    // statisch auf (0,0,0) Rotation, während sich die Kamera dreht.
                    if (lastDeviceOrientation) {
                         /* 
                          * ANPASSUNG FÜR DIE 3D-KAMERA:
                          * Die Kameraausrichtung benötigt zur Orientierung nicht nur die rohen Neigungsdaten,
                          * sondern auch den exakt berechneten und kalibrierten Kompasswert (heading).
                          * Durch die Übergabe der Variablen "heading" an die Rotationsberechnung 
                          * richten sich alle 3D-Modelle exakt am realen geografischen Norden aus,
                          * wodurch Kalibrierungen und Deklinationen auch in der 3D-Welt korrekt sichtbar werden.
                          */
                         const q = getDeviceQuaternion(lastDeviceOrientation, heading);
                         camera.quaternion.copy(q); // Kamera übernimmt die Rotation des Geräts
                         gnssGroup.rotation.set(0, 0, 0); // Die Welt bleibt starr
                    } else {
                         camera.rotation.set(0, THREE.MathUtils.degToRad(heading), 0, 'YXZ');
                         gnssGroup.rotation.set(0, 0, 0);
                    }

                    updateGNSSObjects(); 
                    updateGNSSUI(); 
                } else {
                    // GNSS ausblenden, Kamera für Marker-Tracking zurücksetzen
                    gnssGroup.visible = false;
                    Object.keys(gnssMeshes).forEach(key => {
                        if (gnssMeshes[key]) gnssMeshes[key].visible = false;
                    });
                    // Kamera-Rotation zurücksetzen damit MindAR/ArUco sie korrekt verwaltet
                    camera.rotation.order = 'YXZ';
                    camera.rotation.set(0, 0, 0);
                    camera.quaternion.set(0, 0, 0, 1);
                }

                // Aktualisierung aller Partikelsysteme
                const handleParticles = (meshList, listType) => {
                    Object.entries(meshList).forEach(([key, m]) => {
                        let id = parseInt(key);
                        let meshes = Array.isArray(m) ? m : [m];
                        
                        meshes.forEach(mesh => {
                            if (mesh.userData.particles) {
                                if (mesh.visible) {
                                    updateWaterEffect(mesh.userData.particles);
                                    if (listType === 'aruco' && (id === 3 || id === 33)) {
                                        // Spezifische Behandlung für ArUco
                                    } else {
                                        // Partikel folgen dem Mesh
                                        const worldPos = new THREE.Vector3();
                                        mesh.getWorldPosition(worldPos);
                                        let yOffset = 0;
                                        if (id === 3 || id === 33) yOffset = 4.0; 
                                        mesh.userData.particles.position.copy(mesh.position);
                                        mesh.userData.particles.position.y += yOffset;
                                    }
                                    mesh.userData.particles.visible = true;
                                } else {
                                    mesh.userData.particles.visible = false;
                                }
                            }
                        });
                    });
                };

                handleParticles(gnssMeshes, 'gnss');
                handleParticles(loadedMeshes, 'aruco'); 
                handleParticles(mindARMeshes, 'mindar');

                // Debug Anzeige für Rotation
                let currentRotY = 0;
                if (gnssGroup.visible) {
                     // Im GNSS Modus ist die Objekt-Rotation statisch, aber zur Info zeigen wir sie an
                     Object.keys(gnssMeshes).forEach(id => {
                         if(gnssMeshes[id].visible) currentRotY = gnssMeshes[id].rotation.y;
                     });
                } 
                else if (isMarkerTracking && activeMindARId !== -1) {
                     Object.keys(mindARMeshes).forEach(idStr => {
                         const id = parseInt(idStr);
                         if (AR_MODELS[id].mindTargetIndexes.includes(activeMindARId) && mindARMeshes[id]) {
                             mindARMeshes[id].forEach(mesh => {
                                 if (mesh.visible) currentRotY = mesh.rotation.y;
                             });
                         }
                     });
                }
                else if (isMarkerTracking && currentTrackingID !== -1 && loadedMeshes[currentTrackingID]?.visible) {
                     currentRotY = loadedMeshes[currentTrackingID].rotation.z;
                }

                let angleSpan = document.getElementById('debugAngle');
                const displayDeg = Math.round(THREE.MathUtils.radToDeg(currentRotY) % 360);
                const finalDeg = displayDeg < 0 ? displayDeg + 360 : displayDeg;
                
                if(!angleSpan) {
                    const d = document.createElement('div');
                    d.style.marginTop = "8px"; d.style.borderTop = "1px solid rgba(255,255,255,0.3)"; d.style.paddingTop = "5px";
                    d.innerHTML = `<span class="label-small">Modell-Ausrichtung (Stehachse)</span><br><span id="debugAngle" class="val-highlight">${finalDeg}°</span>`;
                    document.getElementById('debugInfo').appendChild(d);
                } else {
                    angleSpan.innerText = finalDeg + "°";
                }

                // Aktualisierung des Richtungspfeils
                if (closestObjForArrow) updateArrow();
                else arrowContainer.style.opacity = 0;

                renderer.render(scene, camera);
            });
        }

        // Texterkennung (OCR) Logik
        async function runOcrCheck(canvas) {
            isOcrRunning = true;
            lastOcrTime = Date.now();
            
            // Status-Update im UI (optional, damit man sieht, dass er arbeitet)
            // statusText.innerHTML = "<span style='color:#aaa'>Scanne Text...</span>";

            try {
                // Tesseract scannt das Bild
                const { data: { text } } = await Tesseract.recognize(canvas, 'deu', { 
                    logger: m => {} // Logging deaktiviert lassen für Performance
                });
                
                // 1. Text bereinigen: Alles klein schreiben, Zeilenumbrüche (\n) durch Leerzeichen ersetzen
                const cleanText = text.toLowerCase().replace(/\s+/g, ' ');

                // Debugging: Zeigt in der Konsole an, was erkannt wurde (WICHTIG für Tests!)
                if(cleanText.length > 5) console.log("OCR Scan:", cleanText);

                // 2. Robuste Prüfung: Wir prüfen auf charakteristische Wortteile statt ganze Sätze.
                // Das hilft, wenn Tesseract z.B. "Blurnengarten" statt "Blumengarten" liest.
                // Prüft auf: ("nieder" UND "deut") ODER ("blumen" UND "garten")
                const matchNieder = cleanText.includes("nieder") && cleanText.includes("deut");
                const matchBlumen = cleanText.includes("blumen") && cleanText.includes("garten");

                if (matchNieder || matchBlumen) {
                    console.log("Texterkennung erfolgreich!");
                    statusText.innerHTML = "<span style='color:#4f4'>Text erkannt:<br>Niederdeutscher Blumengarten!</span>";
                    
                    // Simulation starten
                    activateSimulation(targetBlumengartenLat, targetBlumengartenLon, 22);
                }
            } catch (err) {
                console.warn("OCR Fehler:", err);
            }
            isOcrRunning = false;
        }


        /*
         * Funktion zur Berechnung der 3D-Kamera-Rotation (Quaternion) anhand der Smartphone-Sensoren.
         * Ein Quaternion ist ein mathematisches Konstrukt, das Drehungen im dreidimensionalen Raum 
         * berechnet, ohne Probleme durch blockierende Rotationsachsen (Gimbal Lock) zu verursachen.
         * 
         * Parameter:
         * - orientData: Enthält die rohen Neigungswerte des Smartphones (Beta für die Längsachse, 
         *   Gamma für die Querachse).
         * - correctedHeading: Der vollständig berechnete und bei Bedarf kalibrierte Kompasswert 
         *   in Grad (0-360), der immer verlässlich den geografischen Norden anzeigt.
         */
        function getDeviceQuaternion(orientData, correctedHeading) {
            /* 
             * Kompasswerte (correctedHeading) laufen auf der Kompassrose immer im Uhrzeigersinn 
             * (0 Grad = Nord, 90 Grad = Ost). Das mathematische System der 3D-Engine erwartet 
             * die Drehung um die sogenannte Hochachse (Z-Achse bzw. Alpha) jedoch gegen den Uhrzeigersinn.
             * Aus diesem Grund wird der Winkel umgedreht, indem der Wert von 360 subtrahiert wird. 
             * Der Modulo-Operator (% 360) stellt zusätzlich sicher, dass der errechnete Wert 
             * sicher im Rahmen von 0 bis 359 Grad bleibt.
             */
            const absoluteAlpha = (360 - correctedHeading) % 360;
            const alpha = THREE.MathUtils.degToRad(absoluteAlpha); 
            
            /* 
             * Beta beschreibt die Neigung nach vorne und hinten (Nicken des Smartphones).
             * Gamma beschreibt die Neigung nach links und rechts (Rollen des Smartphones).
             * Sensoren liefern diese Werte in Grad. Da 3D-Engines für ihre Berechnungen stets das 
             * Bogenmaß (Radiant) verwenden, werden die Variablen hier entsprechend umgerechnet.
             */
            const beta = orientData.beta ? THREE.MathUtils.degToRad(orientData.beta) : 0;   
            const gamma = orientData.gamma ? THREE.MathUtils.degToRad(orientData.gamma) : 0; 
            
            /*
             * Abfrage der Bildschirmorientierung (Hochformat oder Querformat).
             * Dies ist wichtig, damit die gerenderte 3D-Welt nicht versehentlich zur Seite kippt, 
             * wenn das Gerät vom Nutzer gedreht wird.
             */
            const orient = window.screen.orientation ? THREE.MathUtils.degToRad(window.screen.orientation.angle) : 0;

            /*
             * Ein Euler-Winkel führt die drei Rotationsachsen (Nicken, Gieren, Rollen) in einem 
             * Objekt zusammen. Das Minus vor dem Gammawert (-gamma) ist erforderlich, um die Richtung 
             * der Sensordaten an das zugrunde liegende Koordinatensystem der 3D-Engine anzugleichen.
             * Die Angabe 'YXZ' bestimmt die exakte Reihenfolge, in der die drei Drehungen ausgeführt werden.
             */
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            
            /*
             * Das Quaternion (q) wird initialisiert und aus den kombinierten Euler-Winkeln erstellt.
             */
            const q = new THREE.Quaternion();
            q.setFromEuler(euler);
            
            /*
             * Anpassung der berechneten Rotation an den Standard-Blickwinkel der verwendeten Three.js Engine.
             * Die Multiplikation mit dem Quaternion q1 dreht die Achsen so, dass die Ansicht der Smartphone-Kamera 
             * korrekt mit der Blickrichtung der virtuellen 3D-Kamera übereinstimmt (welche normalerweise 
             * entlang einer negativen Z-Achse schaut).
             */
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            q.multiply(q1);
            
            /*
             * Die finale Multiplikation mit q2 sorgt dafür, dass die weiter oben ermittelte Korrektur für 
             * das Bildschirmformat (Hoch- oder Querformat) angewendet wird.
             */
            const q2 = new THREE.Quaternion();
            q2.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
            q.multiply(q2);
            
            // Das vollständig berechnete Rotationsobjekt wird für die Anwendung zurückgegeben.
            return q;
        }

        /*
         * Startet die Simulation einer GNSS-Position für eine definierte Zeit.
         * Hier wird nun zusätzlich der physische Startpunkt (GNSS) gespeichert, 
         * um während der Simulation die Relativbewegung des Geräts errechnen zu können.
         */
        function activateSimulation(lat, lon, targetHeading) {
            isSimulatedPos = true;
            simulationEndTime = Date.now() + SIMULATION_PERSISTENCE; 
            
            // Wir definieren das Ziel, zu dem die Simulation initial springen soll.
            simulatedBaseCoords = { lat: lat, lon: lon };
            
            // Wir speichern die ECHTE Position im Moment des Auslösens.
            // Jeder Schritt von hier aus wird als "Delta" live auf simulatedBaseCoords addiert.
            if (realPos) {
                simulationStartRealPos = { lat: realPos.latitude, lon: realPos.longitude };
            } else {
                simulationStartRealPos = null; // Falls noch kein Fix da ist, wird dies später in der Loop nachgeholt.
            }

            activeMindARId = -1; 
            
            // Berechnung des Kompass-Offsets zur Kalibrierung
            if (typeof targetHeading === 'number') {
                compassOffset = (targetHeading - rawHeading + 360) % 360;
                console.log("Kompass kalibriert. Soll: " + targetHeading + ", Roh: " + rawHeading + ", Offset: " + compassOffset);
            }
        }

        // Laden aller definierten 3D-Modelle
        function loadModels() {
            const loader = new GLTFLoader();
            const ids = Object.keys(AR_MODELS);

            ids.forEach(idStr => {
                const id = parseInt(idStr);
                const config = AR_MODELS[id];
                
                loader.load(config.url, (gltf) => {
                    // 1. ArUco-Marker Version
                    const modelAruco = gltf.scene.clone();
                    modelAruco.scale.set(config.scale, config.scale, config.scale);
                    modelAruco.rotation.x = Math.PI / 2; 
                    if (id === 1 || id === 2 || id === 3 || id === 33) modelAruco.rotation.z += Math.PI;
                    
                    if (id === 3 || id === 33) {
                        const p = createWaterEffect();
                        modelAruco.add(p); 
                        p.position.set(0, 4.0, 0); 
                        p.rotation.x = -Math.PI / 2;
                        modelAruco.userData.particles = p;
                        // Das Maßband wird hinzugefügt
                        const measureBar = createMeasureBar();
                        modelAruco.add(measureBar);
                        modelAruco.userData.measureBar = measureBar;
                    }
                    modelAruco.visible = false;
                    markerGroup.add(modelAruco);
                    loadedMeshes[id] = modelAruco;

                    // 2. GNSS Version (Positionsbasiert)
                    if (config.lat && config.lon) {
                        const modelGNSS = gltf.scene.clone();
                        const gnssScale = config.scale * 0.05; 
                        modelGNSS.scale.set(gnssScale, gnssScale, gnssScale);
                        
                        const initRotDeg = config.initRotation || 0;
                        modelGNSS.rotation.y = THREE.MathUtils.degToRad(initRotDeg); 

                        if (id === 3 || id === 33) {
                             const pG = createWaterEffect();
                             modelGNSS.userData.particles = pG;
                             gnssGroup.add(pG);
                             // Das Maßband wird für GNSS hinzugefügt
                             const measureBar = createMeasureBar();
                             modelGNSS.add(measureBar);
                             modelGNSS.userData.measureBar = measureBar;
                        }
                        modelGNSS.visible = false;
                        gnssGroup.add(modelGNSS);
                        gnssMeshes[id] = modelGNSS;
                    }

                    // 3. MindAR Version (Bildbasiert)
                    if (config.mindTargetIndexes) {
                        if (!mindARMeshes[id]) mindARMeshes[id] =[];

                        config.mindTargetIndexes.forEach(targetIndex => {
                            if ([1, 2, 3, 4, 5, 6].includes(targetIndex) && mindarAnchors[targetIndex]) {
                                const modelMind = gltf.scene.clone();
                                let mindScale = config.scale * 0.015;

                                if (targetIndex >= 1 && targetIndex <= 3) {
                                    mindScale = mindScale * 0.5;
                                }

                                modelMind.scale.set(mindScale, mindScale, mindScale);
                                
                                let rotationY = Math.PI;
                                if (targetIndex === 1) rotationY = THREE.MathUtils.degToRad(357); 
                                if (targetIndex === 2) rotationY = THREE.MathUtils.degToRad(123); 
                                if (targetIndex === 3) rotationY = THREE.MathUtils.degToRad(265);

                                modelMind.rotation.y = rotationY; 
                                
                                if (id === 1 || [4,5,6].includes(targetIndex)) {
                                     modelMind.position.y = -2.0; 
                                }

                                if (id === 3 || id === 33) {
                                     const pM = createWaterEffect();
                                     modelMind.userData.particles = pM;
                                     mindarAnchors[targetIndex].group.add(pM);
                                     // Das Maßband wird für MindAR hinzugefügt
                                     const measureBar = createMeasureBar();
                                     modelMind.add(measureBar);
                                     modelMind.userData.measureBar = measureBar;
                                }

                                modelMind.userData.anchorIndex = targetIndex;
                                mindarAnchors[targetIndex].group.add(modelMind);
                                mindARMeshes[id].push(modelMind);
                                modelMind.visible = false;
                            }
                        });
                    }
                });
            });
        }

        function updateGNSSUI() {
            if (!lastPos) {
                 statusText.innerHTML = "Warte auf GNSS Signal...";
                 return;
            }

            let closestObj = null;

                    if(dist < closestDist) {

                        closestObj = m;

                }
            });

            if (closestObj) {

                const latStr = lastPos.latitude.toFixed(5) + "°";

        function updateArrow() {
            if (!lastPos || !closestObjForArrow) {
                arrowContainer.style.opacity = 0;
                return;
            }
            arrowContainer.style.opacity = 1;
            const bearing = calculateBearing(lastPos.latitude, lastPos.longitude, closestObjForArrow.lat, closestObjForArrow.lon);

        // Berechnung und Platzierung der GNSS-Modelle in der 3D-Szene
        function updateGNSSObjects() {
            if (!lastPos) return;

            // SCHRITT 1: Zuerst werden die Distanzen zu allen Modellen berechnet
            let modelsWithDistance =[];
            Object.keys(gnssMeshes).forEach(key => {
                const id = parseInt(key);
                const config = AR_MODELS[id];
                if (config.lat && config.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    modelsWithDistance.push({ id: id, dist: dist });
                }
            });

            // SCHRITT 2: Sortierung der Modelle nach Distanz (das nächste zuerst)
            modelsWithDistance.sort((a, b) => a.dist - b.dist);

            // SCHRITT 3: Nur das allernächste Modell wird angezeigt, sofern es nah genug ist
            let closestModelFound = false;

            modelsWithDistance.forEach((item) => {
                const id = item.id;
                const mesh = gnssMeshes[id];
                const config = AR_MODELS[id];
                const dist = item.dist;

                if (!closestModelFound && dist < VISIBILITY_DISTANCE) {
                    mesh.visible = true;
                    closestModelFound = true; // Markierung, dass ein Modell angezeigt wird

                    // Basis-Höhe für Objekte und den Boden.
                    const heightY = -2.0; 
                    
                    // WICHTIG: Berechnung des Offsets relativ zur aktuellen 'lastPos'.
                    const offset = calcOffset(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    
                    /* 
                     * OPTISCHE TIEFEN-KORREKTUR (NUR VERKLEINERN, KEIN HERANZIEHEN):
                     * Die Modelle liegen auf ihrer EXAKTEN GPS-Distanz. 
                     * (X und Z Achse bleiben zu 100% unangetastet!).
                     * Um den optischen Horizont-Effekt der Handykamera auszugleichen, 
                     * verkleinern wir das Modell stattdessen sanft und linear, je weiter es weg ist.
                     * Da es kleiner wird, aber auf der gleichen Position verbleibt, 
                     * wird es optisch sichtbar in Richtung Boden (Y=-2.0) gedrückt.
                     */
                    let perspectiveScale = 1.0;
                    if (dist > 10.0) {
                        // Leichte, lineare optische Verkleinerung für Objekte in der Ferne
                        perspectiveScale = 1.0 - (dist / 150.0); 
                        // Verhindern, dass das Modell zu winzig wird (Minimal auf 30% fixieren)
                        if (perspectiveScale < 0.3) perspectiveScale = 0.3; 
                    }
                    
                    // Finale Skalierung aus Basis-Skalierung und Tiefenkorrektur berechnen
                    const baseScale = config.scale * 0.05;
                    const finalScale = baseScale * perspectiveScale;
                    mesh.scale.set(finalScale, finalScale, finalScale);

                    // Positionierung anwenden (EXAKTE DISTANZ BLEIBT BEIBEHALTEN!)
                    mesh.position.set(offset.x, heightY, -offset.z);
                    
                    // Sauberes, zentrales UI-Update. "sourceName" wird genutzt um den Dauerschleifen-Fehler zu beheben.
                    updateUIForModel(id, isSimulatedPos ? "Pos. Simulation" : "GNSS"); 

                } else {
                    // Alle anderen Modelle werden ausgeblendet
                    mesh.visible = false;
                }
            });
            
            /* 
             * UI AUFRÄUMEN (BUGFIX):
             * Falls gar kein Objekt im GNSS-Modus in der Nähe ist, wird das UI sauber ausgeblendet.
             * WICHTIG: Dies passiert NUR, wenn der GNSS-Modus gerade das UI kontrolliert.
             * Das verhindert, dass der GNSS-Modus ein UI löscht, welches gerade vom ArUco-Modus geöffnet wurde!
             */
            if (!closestModelFound && currentTrackingID !== -1 && !isMarkerTracking) {
                 if (currentTrackingSource === "GNSS" || currentTrackingSource === "Pos. Simulation") {
                     currentTrackingID = -1;
                     currentTrackingSource = "";
                     modelInfo.style.display = 'none';
                     historicalInfo.style.display = 'none';
                     clickHint.style.opacity = "0"; // Sauberer CSS String
                 }
            }
        }

        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const rad = Math.PI/180;
            const dLat = (lat2-lat1)*rad; const dLon = (lon2-lon1)*rad;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcOffset(lat1, lon1, lat2, lon2) {
            const R = 6378137; 
            const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const dx = dLon * Math.cos(lat1Rad) * R; const dz = dLat * R; 
            return { x: dx, z: dz };
        }
        
        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * (Math.PI / 180); const startLngRad = startLng * (Math.PI / 180);
            const destLatRad = destLat * (Math.PI / 180); const destLngRad = destLng * (Math.PI / 180);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }

        function processArucoFrame(video) {
            if (!video || video.readyState < video.HAVE_METADATA) return false;

            const cw = videoCanvas.width; const ch = videoCanvas.height;
            if (cw !== window.innerWidth || ch !== window.innerHeight) {
                videoCanvas.width = window.innerWidth; videoCanvas.height = window.innerHeight;
                posit = new POS.Posit(markerSize, window.innerWidth);
            }

            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            
            context2D.clearRect(0, 0, cw, ch);
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            const imageData = context2D.getImageData(0, 0, cw, ch);
            context2D.clearRect(0, 0, cw, ch); 

            let markers = detector.detect(imageData);
            markers = markers.filter(m => {
                const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                return d > 30 && m.id !== 97; 
            });

            let found = false;
            if (markers.length > 0) {
                markers.forEach(marker => {
                    drawRedBox(marker.corners); drawIdText(marker.corners, marker.id);
                    const cornersCentered = marker.corners.map(c => ({ x: c.x - (cw / 2), y: (ch / 2) - c.y }));
                    const pose = posit.pose(cornersCentered);
                    
                    if (pose) {
                        const r = pose.bestRotation; const t = pose.bestTranslation;
                        drawAxis(r, t, markerSize);
                        const id = marker.id;
                        if (AR_MODELS[id] && marker === markers[0]) {
                            found = true; 
                            lossCounter = 0;
                            updatePoseUI(r, t, id, "ArUco");
                            const targetPos = new THREE.Vector3(t[0], -t[1], -t[2]);
                            const m = new THREE.Matrix4();
                            m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
                            const fullQuat = new THREE.Quaternion().setFromRotationMatrix(m);
                            const euler = new THREE.Euler().setFromQuaternion(fullQuat, 'YXZ');
                            const uprightQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, euler.y, 0));
                            updateActiveModelArUco(id, targetPos, uprightQuat);
                        }
                    }
                });
            }

            if (!found) {
                markerGroup.visible = false;
                lossCounter++;
                if (lossCounter > maxLossFrames) {
                    /*
                     * BUGFIX: Hier darf das UI nur zurückgesetzt werden, wenn es vorher auch
                     * tatsächlich durch einen ArUco-Marker geöffnet wurde! Das verhindert 
                     * die störende Dauerschleife im GNSS-Modus.
                     */
                    if (currentTrackingID !== -1 && currentTrackingSource === "ArUco") {
                            modelInfo.style.display = 'none';
                            clickHint.style.opacity = "0";
                            historicalInfo.style.display = 'none'; 
                            currentTrackingID = -1;
                            currentTrackingSource = ""; // Quelle nach dem Löschen zurücksetzen
                    }
                    if(statusText.innerHTML.includes("Gefunden") || statusText.innerHTML.includes("Tracking")) {
                            statusText.innerHTML = "Warte auf GNSS Signal...";
                    }
                }
            }
            return found;
        }

        function initMap() {
            mapStations = L.map(mapEl).setView([52.3895, 9.6975], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(mapStations);
            stations.forEach(s => { L.marker(s.coords).addTo(mapStations).bindPopup(`<strong>${s.title}</strong>`); });
            userLayer = L.layerGroup().addTo(mapStations);
            locateBtn.addEventListener('click', (e) => { e.stopPropagation(); if (lastPos) mapStations.setView([lastPos.latitude, lastPos.longitude], 17); else mapStations.locate({ setView: true, maxZoom: 17 }); });
            
            orientBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { 
                        const res = await DeviceOrientationEvent.requestPermission(); 
                        if (res === 'granted') { 
                            window.addEventListener('deviceorientation', onDeviceOrientation, true); 
                            orientBtn.style.background = '#4f4'; 
                        } 
                    } catch (err) { console.warn(err); }
                } else { 
                    if ('ondeviceorientationabsolute' in window) {
                        window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
                    } else {
                        window.addEventListener('deviceorientation', onDeviceOrientation, true);
                    }
                    orientBtn.style.background = '#4f4'; 
                }
            });
            setTimeout(() => { if (navigator.geolocation) { navigator.geolocation.watchPosition(onPos, err => console.warn(err), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }); } }, 1500);
        }

        function onPos(pos) {
            realPos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy || 5 };
            if (!isSimulatedPos) {
                lastPos = realPos;
                if (mapStations && !mapStations._userCentered) { mapStations.setView([lastPos.latitude, lastPos.longitude], 17); mapStations._userCentered = true; }
                drawUserOnMap(lastPos);
            } else {
                if (lastPos) drawUserOnMap(lastPos);
            }
        }

        function onDeviceOrientation(e) {
            lastDeviceOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
            if (e.webkitCompassHeading) rawHeading = e.webkitCompassHeading; else if (e.alpha !== null) rawHeading = (360 - e.alpha) % 360;
            heading = (rawHeading + magDeclination + compassOffset) % 360;
            if (lastPos) drawUserOnMap(lastPos);
        }

        function drawUserOnMap(p) {
            if (!userLayer) return; userLayer.clearLayers();
            L.circle([p.latitude, p.longitude], { radius: Math.max(p.accuracy, 4), color: 'rgba(255,0,0,0.6)', fillColor: 'rgba(255,0,0,0.12)', weight: 1 }).addTo(userLayer);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${heading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/><circle cx="0" cy="10" r="3" fill="red"/></g></svg>`;
            const url = 'data:image/svg+xml;base64,' + btoa(svg);
            const icon = L.icon({ iconUrl: url, iconSize:[48, 48], iconAnchor:[24, 24], className: 'user-arrow' });
            L.marker([p.latitude, p.longitude], { icon: icon, interactive: false }).addTo(userLayer);
        }

        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -1000, y: -1000 };
            const f = videoCanvas.width; const scale = f / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans);
            const ax = project([len, 0, 0], rot, trans);
            const ay = project([0, len, 0], rot, trans);
            const az = project([0, 0, len], rot, trans);
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            context2D.strokeStyle = "lime"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        function drawIdText(corners, id, source = "ArUco") {
            const pt = corners[0];
            context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        function updatePoseUI(r, t, id, source = "ArUco") {
            const m = new THREE.Matrix4();
            m.set(r[0][0], r[0][1], r[0][2], t[0], -r[1][0], -r[1][1], -r[1][2], -t[1], -r[2][0], -r[2][1], -r[2][2], -t[2], 0, 0, 0, 1);
            const inv = m.clone().invert();
            const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const sc = new THREE.Vector3();
            inv.decompose(pos, quat, sc);
            const euler = new THREE.Euler().setFromQuaternion(quat);
            const x = (pos.x / 10).toFixed(0); const y = (pos.y / 10).toFixed(0); const z = (pos.z / 10).toFixed(0);
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);
            statusText.innerHTML = `<span style="color:yellow;">Gefunden: ID ${id} (${source})</span><br><div style="margin-top:8px; padding-top:5px; border-top:1px solid #777;"><span class="label-small">Position (Relativ)</span><br>X: ${x} cm | Y: ${y} cm | Z: ${z} cm</div><div style="margin-top:8px;"><span class="label-small">Rotation (relativ)</span><br>Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°</div>`;
        }

        // Modifizierte Trigger-Funktion: Blendet den Hinweis sauber ein und lässt ihn ungestört ablaufen.
        function triggerHint() {
            // Wenn der Text gerade sichtbar ist, brechen wir hier sofort ab, um den Timer nicht ungewollt zu stören!
            if (clickHint.style.opacity === "1") return; 

            if (hintTimeout) {
                clearTimeout(hintTimeout); 
            }
            
            clickHint.style.opacity = "1";
            
            // Timeout auf 5000ms (5 Sekunden) gesetzt
            hintTimeout = setTimeout(() => { 
                clickHint.style.opacity = "0";
                hintTimeout = null; 
            }, 5000);
        }
        
        // ZENTRALE FUNKTION FÜR DAS UI (steuert Text, Kupferstich und den Klick-Hinweis)
        function updateUIForModel(id, sourceName) {

            }
        }

        document.body.addEventListener('click', (event) => {
            // FILTER: Klicks auf UI-Elemente ignorieren! 
            if (event.target.closest('.ui-panel') || 
                event.target.closest('#mapControls') || 
                event.target.closest('.leaflet-container') ||
                event.target.closest('.icon-btn')) {
                return;
            }

            if (!camera) return;
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            const raycaster = new THREE.Raycaster(); raycaster.setFromCamera(mouse, camera);
            let objectsToCheck =[];
            Object.values(loadedMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            Object.values(mindARMeshes).forEach(meshArray => {
                if (Array.isArray(meshArray)) { meshArray.forEach(m => { if(m.visible) objectsToCheck.push(m); }); }
            });
            Object.values(gnssMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            
            if(objectsToCheck.length === 0) return;
            const intersects = raycaster.intersectObjects(objectsToCheck, true);
            if (intersects.length > 0) {
                let clickedObj = intersects[0].object;
                while(clickedObj.parent && clickedObj.parent.type !== 'Scene') {
                     for(let[key, val] of Object.entries(gnssMeshes)) {
                         if(val === clickedObj) {
                             activeLink = AR_MODELS[key].link;
                             let label = isSimulatedPos ? "Pos. Simulation" : "GNSS";
                             updateUIForModel(parseInt(key), label);
                             window.open(activeLink, '_blank');
                             return;
                         }
                     }
                     for(let id in mindARMeshes) {
                         if(mindARMeshes[id].includes(clickedObj)) {
                             activeLink = AR_MODELS[id].link;
                             updateUIForModel(parseInt(id), "MindAR");
                             window.open(activeLink, '_blank');
                             return;
                         }
                     }
                     clickedObj = clickedObj.parent;
                }
                if (currentTrackingID !== -1 && activeLink) window.open(activeLink, '_blank');
            }
        });
    </script>
</body>
</html>
