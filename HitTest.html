<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel 8a Debug Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: monospace; overflow: hidden; }
        
        /* Video and Canvas stacked */
        #container { position: relative; width: 100vw; height: 100vh; background: #222; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* On-screen Debug Log */
        #logs {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: rgba(0, 0, 0, 0.85); overflow-y: scroll; 
            z-index: 10; padding: 10px; box-sizing: border-box; font-size: 11px;
            border-top: 2px solid #00ff00;
        }
        .log-entry { margin-bottom: 2px; border-bottom: 1px solid #333; }
        .error { color: #ff5555; }
        .success { color: #55ff55; }
        .info { color: #aaaaaa; }
    </style>
</head>
<body>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
    <div id="logs"></div>
</div>

<script>
    // --- UTILS: On-Screen Logging ---
    function log(msg, type='info') {
        const logDiv = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll
        console.log(msg);
    }
</script>

<!-- Load OpenCV -->
<script>
    var Module = {
        onRuntimeInitialized: function() {
            log("OpenCV WASM Loaded!", "success");
            startCamera();
        },
        onError: function(err) {
            log("OpenCV Failed to Load: " + err, "error");
        }
    };
</script>
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    
    // OpenCV objects
    let cap = null, src = null, dictionary = null, markerCorners = null, markerIds = null, detector = null;

    async function startCamera() {
        log("Requesting Camera Permission...", "info");

        // STRATEGY 1: Try Environment (Rear) loosely
        // We removed 'exact', 'width', and 'height' to prevent hanging
        const constraints1 = { 
            video: { facingMode: "environment" }, 
            audio: false 
        };

        // STRATEGY 2: Fallback to ANY camera
        const constraints2 = { 
            video: true, 
            audio: false 
        };

        let stream = null;

        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints1);
            log("Camera Access Granted (Strategy 1)", "success");
        } catch (err) {
            log("Strategy 1 Failed (" + err.name + "). Trying Strategy 2...", "error");
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints2);
                log("Camera Access Granted (Strategy 2)", "success");
            } catch (err2) {
                log("FATAL: Could not open any camera. " + err2.name, "error");
                return;
            }
        }

        // Attach stream
        video.srcObject = stream;
        
        // Wait for video to be ready
        video.onloadedmetadata = () => {
            log(`Video Metadata: ${video.videoWidth}x${video.videoHeight}`, "info");
            video.play().then(() => {
                log("Video Playing. Initializing OpenCV...", "success");
                initOpenCV(video.videoWidth, video.videoHeight);
                requestAnimationFrame(processVideo);
            }).catch(e => log("Play() Error: " + e, "error"));
        };
    }

    function initOpenCV(w, h) {
        if(src) src.delete();
        src = new cv.Mat(h, w, cv.CV_8UC4);
        markerCorners = new cv.MatVector();
        markerIds = new cv.Mat();
        
        // Setup Dictionary (6x6)
        dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);
        
        // Setup Detector Parameters
        let params = new cv.aruco_DetectorParameters();
        
        // Create Detector
        try {
            detector = new cv.aruco_ArucoDetector(dictionary, params);
            log("ArucoDetector Created", "success");
        } catch(e) {
            log("Failed to create detector: " + e, "error");
        }
        
        // Resize canvas
        canvas.width = w;
        canvas.height = h;
    }

    function processVideo() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            try {
                // Pixel Fix: Check for resolution change
                if (src.cols !== video.videoWidth || src.rows !== video.videoHeight) {
                    log(`Resizing: ${src.cols}x${src.rows} -> ${video.videoWidth}x${video.videoHeight}`, "info");
                    initOpenCV(video.videoWidth, video.videoHeight);
                    if(cap) { delete cap; cap = null; }
                    cap = new cv.VideoCapture(video);
                }

                if (!cap) cap = new cv.VideoCapture(video);
                cap.read(src);

                // Detect
                detector.detectMarkers(src, markerCorners, markerIds, new cv.MatVector());

                // Draw
                if (markerIds.rows > 0) {
                    cv.drawDetectedMarkers(src, markerCorners, markerIds);
                    // Check for ID 0
                    let found = false;
                    for(let i=0; i<markerIds.rows; i++) {
                        if(markerIds.data32S[i] === 0) found = true;
                    }
                    if(found) log("ID 0 Detected!", "success");
                }

                cv.imshow('canvasOutput', src);

            } catch (err) {
                log("Loop Error: " + err, "error");
            }
        }
        requestAnimationFrame(processVideo);
    }
</script>
</body>
</html>
