<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - AR (ArUco)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Keep video invisible but active */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #camBtn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 100;
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid #888;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <button id="camBtn">Kamera wechseln</button>

    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>

    <script>
        // --- CONFIGURATION ---
        
        // AVAILABLE DICTIONARIES: 
        // 'ARUCO_MIP_36h12' (Default, recommended)
        // 'ARUCO' (Original 7x7)
        const selectedDictionary = 'ARUCO_MIP_36h12'; 

        const markerSize = 100.0; // Physical marker size in mm

        // ---------------------

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const camBtn = document.getElementById('camBtn');

        let currentFacingMode = 'environment';
        let detector = null;
        let posit = null;
        let stream = null;
        let isVideoReady = false;

        window.onload = () => {
            // Initialize detector with the chosen dictionary
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            startCamera();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', resizeCanvas);

        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (canvas.width > 0) {
                posit = new POS.Posit(markerSize, canvas.width);
            }
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(track => track.stop());

            const constraints = {
                audio: false,
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    video.play().catch(e => console.log(e));
                })
                .catch(err => {
                    alert("Camera Error: " + err.name);
                });
        }

        video.addEventListener('loadedmetadata', resizeCanvas);
        video.addEventListener('canplay', () => isVideoReady = true);

        function tick() {
            requestAnimationFrame(tick);
            context.clearRect(0, 0, canvas.width, canvas.height);

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();
                processFrame();
            } else {
                drawLoading();
            }
        }

        function drawVideoFullscreen() {
            const cw = canvas.width;
            const ch = canvas.height;
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const rV = vw / vh;
            const rC = cw / ch;
            let sx, sy, sw, sh;

            if (rV < rC) {
                sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2;
            } else {
                sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0;
            }
            context.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function processFrame() {
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const markers = detector.detect(imageData);

            markers.forEach(marker => {
                // 1. Draw Red Box around the marker
                drawRedBox(marker.corners);

                // 2. Prepare for 3D Pose
                const cornersCentered = marker.corners.map(c => ({
                    x: c.x - (canvas.width / 2),
                    y: (canvas.height / 2) - c.y
                }));

                const pose = posit.pose(cornersCentered);

                if (pose) {
                    const rot = pose.bestRotation;
                    const trans = pose.bestTranslation;
                    drawAxis(rot, trans, markerSize);
                    drawMarkerID(rot, trans, marker.id);
                }
            });
        }

        function drawRedBox(corners) {
            context.lineWidth = 4;
            context.strokeStyle = "red"; // Red Box Color
            context.beginPath();
            
            corners.forEach((c, i) => {
                if (i === 0) context.moveTo(c.x, c.y);
                else context.lineTo(c.x, c.y);
            });
            
            context.closePath(); // Connect back to start
            context.stroke();
        }

        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -100, y: -100 };
            const scale = canvas.width / z;
            return { x: x * scale + (canvas.width / 2), y: (canvas.height / 2) - y * scale };
        }

        function drawAxis(rot, trans, len) {
            const origin = project([0, 0, 0], rot, trans);
            const axisX = project([len, 0, 0], rot, trans);
            const axisY = project([0, len, 0], rot, trans);
            const axisZ = project([0, 0, len], rot, trans);

            context.lineWidth = 5;
            
            context.strokeStyle = "red";
            context.beginPath(); context.moveTo(origin.x, origin.y); context.lineTo(axisX.x, axisX.y); context.stroke();

            context.strokeStyle = "green";
            context.beginPath(); context.moveTo(origin.x, origin.y); context.lineTo(axisY.x, axisY.y); context.stroke();

            context.strokeStyle = "blue";
            context.beginPath(); context.moveTo(origin.x, origin.y); context.lineTo(axisZ.x, axisZ.y); context.stroke();
        }

        function drawMarkerID(rot, trans, id) {
            const p0 = project([0, 0, 0], rot, trans);
            context.font = "bold 28px monospace";
            context.textAlign = "left";
            context.textBaseline = "bottom";
            context.lineWidth = 4;
            context.strokeStyle = "black";
            context.strokeText(`ID:${id}`, p0.x + 15, p0.y);
            context.fillStyle = "#00FFFF";
            context.fillText(`ID:${id}`, p0.x + 15, p0.y);
        }

        function drawLoading() {
            context.fillStyle = "black";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = "white";
            context.font = "20px sans-serif";
            context.textAlign = "center";
            context.fillText("Loading Camera...", canvas.width / 2, canvas.height / 2);
        }
    </script>
</body>
</html>
