<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArUcoJS mit 3D Achsen</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        
        #container { position: relative; width: 100vw; height: 100vh; }
        
        /* Video und Canvas liegen exakt übereinander */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }

        #status {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.6); color: #0f0; padding: 10px;
            border: 1px solid #0f0; border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="status">Starte Kamera...</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- 
    Wir laden die js-aruco Bibliothek UND die Mathe-Libs für 3D (SVD, POSIT)
-->
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/svd.js"></script>
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/posit1.js"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let ctx = canvas.getContext('2d');
    let status = document.getElementById('status');

    let detector = null;
    let posit = null; // NEU: Das Objekt für die 3D-Berechnung
    let stream = null;
    let modelSize = 35.0; // Größe des Markers (mm) -> Bestimmt Länge der Achsen

    // --- 1. KAMERA STARTEN (1:1 Dein Code) ---
    async function startCamera() {
        // Pixel Handys mögen "environment" am liebsten
        const constraints = {
            video: { facingMode: "environment" },
            audio: false
        };

        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            // Erst wenn Video läuft, starten wir die Erkennung
            video.addEventListener('loadeddata', function() {
                // Canvas Größe anpassen
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // ArUcoJS Detector initialisieren
                detector = new AR.Detector();

                // NEU: POSIT initialisieren (schätzt Brennweite anhand der Videobreite)
                posit = new POSIT(modelSize, video.videoWidth);
                
                status.innerText = "System Bereit. Suche Marker ID 0...";
                requestAnimationFrame(tick);
            });

        } catch (err) {
            status.innerText = "Kamera Fehler: " + err.name;
            status.style.color = "red";
            // Fallback für PC/Mac Webcams, falls Environment fehlschlägt
            if(err.name === "OverconstrainedError") {
                navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                    video.srcObject = s;
                    video.play();
                });
            }
        }
    }

    // --- 2. ERKENNUNGSSCHLEIFE ---
    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            
            // Canvas an Video-Größe anpassen (falls Auflösung wechselt)
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                // NEU: POSIT muss bei Größenänderung neu kalibriert werden
                posit = new POSIT(modelSize, video.videoWidth);
            }

            // 1. Bild vom Video auf Canvas zeichnen (für Bilddaten)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Wir löschen das Bild sofort wieder, damit wir nur die Linien sehen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. DETEKTION
            try {
                var markers = detector.detect(imageData);
                drawScene(markers); // Geänderter Funktionsaufruf
            } catch (e) {
                console.log("Fehler bei Erkennung:", e);
            }
        }
        requestAnimationFrame(tick);
    }

    // --- 3. ZEICHNEN (NEU: MIT 3D ACHSEN) ---
    function drawScene(markers) {
        if (markers.length > 0) {
            let foundID0 = false;
            
            // Status Text aktualisieren mit der ID des ersten Markers
            status.innerText = "Marker erkannt! ID: " + markers[0].id;
            status.style.color = "#00ff00";
            status.style.borderColor = "#00ff00";

            markers.forEach(function(marker) {
                // A. Pose berechnen (Rotation & Translation)
                var pose = posit.pose(marker.corners);

                // B. Achsen zeichnen (X=Rot, Y=Grün, Z=Blau)
                drawAxis(pose.bestRotation, pose.bestTranslation);
                
                // C. Rahmen zeichnen (Optional, zur Sicherheit)
                drawBorder(marker.corners);

                // D. ID ins Bild schreiben
                ctx.fillStyle = "red";
                ctx.font = "bold 24px monospace";
                ctx.fillText("ID: " + marker.id, marker.corners[0].x, marker.corners[0].y - 15);

                if (marker.id === 0) foundID0 = true;
            });

            if(foundID0) {
                status.innerText += " (Ziel gefunden)";
            } 
        } else {
            // Kein Marker
            status.innerText = "Suche Original Marker ID 0...";
            status.style.color = "#00ff00";
            status.style.borderColor = "#00ff00";
        }
    }

    // Malt den weißen Rahmen um den Marker
    function drawBorder(corners) {
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255,255,255,0.5)"; // Halb-transparent weiß
        
        ctx.moveTo(corners[0].x, corners[0].y);
        ctx.lineTo(corners[1].x, corners[1].y);
        ctx.lineTo(corners[2].x, corners[2].y);
        ctx.lineTo(corners[3].x, corners[3].y);
        ctx.closePath();
        ctx.stroke();
    }

    // Malt das Koordinatensystem
    function drawAxis(rotation, translation) {
        // 1. Zentrum berechnen (0,0,0)
        var center = posit.project(0, 0, 0, rotation, translation);
        
        // 2. Endpunkte der Achsen berechnen
        var xAxis = posit.project(modelSize, 0, 0, rotation, translation);
        var yAxis = posit.project(0, modelSize, 0, rotation, translation);
        var zAxis = posit.project(0, 0, -modelSize, rotation, translation); // -modelSize zeigt nach oben raus

        ctx.lineWidth = 5;

        // X-Achse (ROT)
        ctx.beginPath();
        ctx.strokeStyle = "red";
        ctx.moveTo(center.x, center.y);
        ctx.lineTo(xAxis.x, xAxis.y);
        ctx.stroke();

        // Y-Achse (GRÜN)
        ctx.beginPath();
        ctx.strokeStyle = "green";
        ctx.moveTo(center.x, center.y);
        ctx.lineTo(yAxis.x, yAxis.y);
        ctx.stroke();

        // Z-Achse (BLAU)
        ctx.beginPath();
        ctx.strokeStyle = "blue";
        ctx.moveTo(center.x, center.y);
        ctx.lineTo(zAxis.x, zAxis.y);
        ctx.stroke();
    }

    // Start
    startCamera();

</script>

</body>
</html>
