<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web ArUco Erkennung</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Container für Video und Canvas übereinander */
        #container { position: relative; width: 100vw; height: 100vh; background: black; }
        
        /* Das Video verstecken wir, wir zeigen nur das bemalte Canvas */
        video { display: none; }
        
        /* Canvas füllt den Screen */
        canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: contain; 
        }

        /* Status Anzeige */
        #status {
            position: absolute; top: 10px; left: 10px; 
            color: #00ff00; background: rgba(0,0,0,0.7); 
            padding: 8px 12px; border-radius: 6px; 
            font-size: 14px; pointer-events: none; z-index: 10;
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>

<div id="status">Lade OpenCV.js... (Bitte warten)</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- OpenCV Konfiguration -->
<script>
    var Module = {
        onRuntimeInitialized: function() {
            document.getElementById('status').innerText = "OpenCV bereit. Starte Kamera...";
            startCamera();
        }
    };
</script>
<!-- OpenCV.js laden (WebAssembly Version) -->
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let status = document.getElementById('status');

    // Globale Variablen für OpenCV Objekte (um Speicherlecks zu vermeiden)
    let src = null;
    let gray = null; // Wir brauchen Graustufen für die Erkennung
    let cap = null;
    let dictionary = null;
    let params = null;
    let detector = null;
    let markerCorners = null;
    let markerIds = null;
    let rejected = null;

    async function startCamera() {
        // Strategie für Pixel Handys: Erst "environment" versuchen, aber ohne strikte Auflösung
        const constraints = {
            video: { 
                facingMode: "environment" // Rückkamera
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            // Warten bis Video-Metadaten da sind, dann Loop starten
            video.addEventListener("loadeddata", () => {
                requestAnimationFrame(processVideo);
            });
            
        } catch (err) {
            status.innerText = "Kamera-Fehler: " + err.name;
            status.style.color = "red";
            console.error(err);
        }
    }

    function initOpenCV(width, height) {
        // 1. Alten Speicher freigeben (WICHTIG in JS!)
        if(src) src.delete();
        if(gray) gray.delete();
        if(markerCorners) markerCorners.delete();
        if(markerIds) markerIds.delete();
        if(rejected) rejected.delete();
        if(detector) detector.delete();
        if(dictionary) dictionary.delete();
        if(params) params.delete();

        // 2. Neue Matrizen erstellen
        src = new cv.Mat(height, width, cv.CV_8UC4);
        gray = new cv.Mat(); // Leere Matrix für Graustufen
        
        markerCorners = new cv.MatVector();
        markerIds = new cv.Mat();
        rejected = new cv.MatVector();

        // 3. ArUco Detektor konfigurieren (6x6 Dictionary)
        dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);
        params = new cv.aruco_DetectorParameters();
        
        // Detektor Klasse initialisieren
        detector = new cv.aruco_ArucoDetector(dictionary, params);

        // Canvas Größe anpassen
        canvas.width = width;
        canvas.height = height;
    }

    function processVideo() {
        try {
            // Prüfen ob Video läuft
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                
                // PIXEL FIX: Auflösung prüfen und ggf. Matrizen neu bauen
                // Handys ändern oft die Auflösung nach den ersten paar Frames
                if (!src || src.cols !== video.videoWidth || src.rows !== video.videoHeight) {
                    console.log(`Resize: ${video.videoWidth}x${video.videoHeight}`);
                    initOpenCV(video.videoWidth, video.videoHeight);
                    if(cap) { delete cap; cap = null; }
                    cap = new cv.VideoCapture(video);
                }

                // 1. Frame vom Video holen
                cap.read(src);

                // 2. In Graustufen umwandeln (besser für Erkennung)
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

                // 3. Marker erkennen
                detector.detectMarkers(gray, markerCorners, markerIds, rejected);

                // 4. Ergebnisse zeichnen
                if (markerIds.rows > 0) {
                    // Zeichnet grüne Rahmen um die Marker
                    cv.drawDetectedMarkers(src, markerCorners, markerIds);
                    
                    // Prüfen ob ID 0 dabei ist
                    let foundID0 = false;
                    for (let i = 0; i < markerIds.rows; i++) {
                        if (markerIds.data32S[i] === 0) foundID0 = true;
                    }

                    if (foundID0) {
                        status.innerText = "MARKE ID 0 GEFUNDEN!";
                        status.style.color = "#00ff00"; // Grün
                        status.style.borderColor = "#00ff00";
                    } else {
                        status.innerText = "Marker erkannt (nicht ID 0)";
                        status.style.color = "yellow";
                        status.style.borderColor = "yellow";
                    }
                } else {
                    status.innerText = "Suche Marker ID 0...";
                    status.style.color = "white";
                    status.style.borderColor = "white";
                }

                // 5. Bild auf dem Canvas anzeigen
                cv.imshow('canvasOutput', src);
            }
        } catch (err) {
            console.error(err);
        }

        // Loop wiederholen
        requestAnimationFrame(processVideo);
    }
</script>

</body>
</html>
