<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ArUco (DICT_6X6_250) + OpenCV.js + Three.js — Korrigiert & Funktional</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #overlay { position: absolute; top: 10px; left: 10px; z-index: 20; background: rgba(0,0,0,0.4); color: #fff; padding:8px; border-radius:6px; }
  /* Das Video und der Canvas werden versteckt, da sie nur als Datenquelle dienen */
  #video, #videoCanvas { display: none; }
  #three-container { width:100vw; height:100vh; }
  button { padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
  <div id="overlay">
    <button id="startBtn">Kamera starten & Erkennung</button>
    <div id="status">Status: bereit</div>
  </div>

  <!-- WICHTIG: 'autoplay' und 'playsinline' sind für Mobilgeräte entscheidend! -->
  <video id="video" autoplay playsinline muted></video>
  <canvas id="videoCanvas"></canvas>

  <div id="three-container"></div>

  <!-- OpenCV.js (offizielle Build) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

    // === Einstellungen ===
    const MARKER_SIZE_M = 0.10; // 10 cm Marker

    // DOM-Elemente
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const video = document.getElementById('video');
    const videoCanvas = document.getElementById('videoCanvas');
    const videoCtx = videoCanvas.getContext('2d');
    const container = document.getElementById('three-container');

    // Three.js Variablen
    let renderer, scene, camera, markerRoot, videoTexture;

    // OpenCV Variablen
    let cvReady = false;
    let dictionary = null;

    function setStatus(s){ statusEl.innerText = 'Status: ' + s; }

    // Globale Funktion, die vom OpenCV-Skript aufgerufen wird
    window.onOpenCvReady = function() {
      if (typeof cv === 'undefined') { setStatus('OpenCV.js konnte nicht geladen werden'); return; }
      setStatus('OpenCV geladen, initialisiere...');
      cv.onRuntimeInitialized = () => {
        cvReady = true;
        try {
          dictionary = cv.aruco.getPredefinedDictionary(cv.aruco.DICT_6X6_250);
          setStatus('Bereit. Drücke "Kamera starten".');
        } catch(e) {
          console.error(e);
          setStatus('Fehler beim Erstellen des ArUco-Wörterbuchs.');
        }
      };
    }

    startBtn.addEventListener('click', async () => {
      if (!cvReady) { setStatus('OpenCV noch nicht initialisiert'); return; }
      startBtn.style.display = 'none'; // Button nach Klick ausblenden
      setStatus('Starte Kamera...');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;

        // --- KORREKTUR 1: AUF METADATEN WARTEN ---
        // Wir warten, bis das Video seine Größe kennt, bevor wir weitermachen.
        await new Promise(resolve => {
            video.onloadedmetadata = () => {
                resolve();
            };
        });
        
        video.play();
        
        videoCanvas.width = video.videoWidth;
        videoCanvas.height = video.videoHeight;

        initThree();
        requestAnimationFrame(processFrame);

        setStatus('Läuft — Scanne einen ArUco 6x6 Marker (ID 0)');
      } catch (err) {
        console.error(err);
        setStatus('Kamerafehler: ' + err.message);
        startBtn.style.display = 'block';
      }
    });

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
      scene.add(camera);
      
      // Das Kamerabild wird als Hintergrund der Szene angezeigt.
      // Das ist der Schlüssel, um den weißen Bildschirm loszuwerden.
      videoTexture = new THREE.VideoTexture(video);
      scene.background = videoTexture;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
      scene.add(light);

      markerRoot = new THREE.Group();
      markerRoot.visible = false;
      scene.add(markerRoot);

      const cylGeo = new THREE.CylinderGeometry(MARKER_SIZE_M / 2, MARKER_SIZE_M / 2, MARKER_SIZE_M, 32);
      const cylMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.5 });
      const cyl = new THREE.Mesh(cylGeo, cylMat);
      cyl.position.y = MARKER_SIZE_M / 2;
      markerRoot.add(cyl);

      const axes = new THREE.AxesHelper(MARKER_SIZE_M);
      markerRoot.add(axes);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function processFrame() {
      // Nur fortfahren, wenn das Video bereit ist
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
          requestAnimationFrame(processFrame);
          return;
      }
      
      videoCtx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
      const imageData = videoCtx.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
      
      try {
        detectAndPose(imageData);
      } catch (e) {
        // Ignoriere Fehler, die auftreten können, bevor OpenCV vollständig initialisiert ist
      }
      
      // --- KORREKTUR 2: TEXTUR AKTUALISIEREN ---
      // Dieser Befehl ist entscheidend, damit das Video live angezeigt wird!
      videoTexture.needsUpdate = true;
      
      renderer.render(scene, camera);
      requestAnimationFrame(processFrame);
    }

    function detectAndPose(imageData) {
      const src = cv.matFromImageData(imageData);
      const gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      const corners = new cv.MatVector();
      const ids = new cv.Mat();
      const parameters = new cv.aruco.DetectorParameters();

      cv.aruco.detectMarkers(gray, dictionary, corners, ids, parameters);
      
      if (ids.rows > 0) {
          // Kamera-Parameter (grobe, aber funktionierende Annäherung)
          const w = imageData.width;
          const h = imageData.height;
          const f = Math.max(w, h); // Brennweite grob als längere Kante annehmen
          const cameraMatrix = cv.matFromArray(3, 3, cv.CV_64F, [f, 0, w/2, 0, f, h/2, 0, 0, 1]);
          const distCoeffs = cv.Mat.zeros(4, 1, cv.CV_64F);

          // Schätze die Pose für ALLE gefundenen Marker
          const rvecs = new cv.Mat();
          const tvecs = new cv.Mat();
          cv.aruco.estimatePoseSingleMarkers(corners, MARKER_SIZE_M, cameraMatrix, distCoeffs, rvecs, tvecs);
          
          // Suche nach der ID 0
          let foundIndex = -1;
          for (let i = 0; i < ids.rows; i++) {
              if (ids.data32S[i] === 0) {
                  foundIndex = i;
                  break;
              }
          }
          
          if (foundIndex !== -1) {
              // Extrahiere die Pose für den Marker mit ID 0
              const rvec = cv.matFromArray(3, 1, cv.CV_64F, [rvecs.data64F[foundIndex * 3], rvecs.data64F[foundIndex * 3 + 1], rvecs.data64F[foundIndex * 3 + 2]]);
              const tvec = cv.matFromArray(3, 1, cv.CV_64F, [tvecs.data64F[foundIndex * 3], tvecs.data64F[foundIndex * 3 + 1], tvecs.data64F[foundIndex * 3 + 2]]);

              // Konvertiere die Pose zu Three.js Koordinaten
              const position = new THREE.Vector3(tvec.data64F[0], -tvec.data64F[1], -tvec.data64F[2]);
              const R = new cv.Mat();
              cv.Rodrigues(rvec, R); // Konvertiert Rotationsvektor zu Rotationsmatrix
              const matrix = new THREE.Matrix4().fromArray([
                  R.data64F[0], R.data64F[1], R.data64F[2], 0,
                 -R.data64F[3],-R.data64F[4],-R.data64F[5], 0,
                 -R.data64F[6],-R.data64F[7],-R.data64F[8], 0,
                  0, 0, 0, 1
              ]);
              const quaternion = new THREE.Quaternion().setFromRotationMatrix(matrix);
              
              markerRoot.position.copy(position);
              markerRoot.quaternion.copy(quaternion);
              
              // Aktualisiere die Three.js Kamera-Perspektive basierend auf der Kalibrierung
              camera.fov = 2 * Math.atan(h / (2 * f)) * (180 / Math.PI);
              camera.aspect = w / h;
              camera.updateProjectionMatrix();

              markerRoot.visible = true;
              
              // Speicher freigeben
              rvec.delete(); tvec.delete(); R.delete();
          } else {
              markerRoot.visible = false;
          }

          // Speicher freigeben
          rvecs.delete(); tvecs.delete(); cameraMatrix.delete(); distCoeffs.delete();

      } else {
        markerRoot.visible = false;
      }
      
      src.delete(); gray.delete(); corners.delete(); ids.delete();
    }
  </script>
</body>
</html>
