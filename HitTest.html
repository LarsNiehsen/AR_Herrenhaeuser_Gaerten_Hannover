<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArUco 3D Stabilisiert</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #container { position: relative; width: 100vw; height: 100vh; }
        
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }

        #status {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.8); color: #fff; padding: 15px;
            border: 2px solid #0f0; border-radius: 8px;
            font-size: 16px; font-weight: bold; pointer-events: none;
        }
        .id-display { color: #0f0; font-size: 24px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div id="status">
    <span id="statusText">Lade Skripte...</span>
</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- Externe Bibliotheken laden -->
<script src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
<script src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>
<script src="https://raw.githack.com/jcmellado/js-aruco/master/src/svd.js"></script>
<script src="https://raw.githack.com/jcmellado/js-aruco/master/src/posit1.js"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let ctx = canvas.getContext('2d');
    let statusText = document.getElementById('statusText');

    let detector = null;
    let posit = null; 
    let modelSize = 35.0; // mm Größe des Markers

    // Warten bis Seite komplett geladen ist, damit Skripte da sind
    window.onload = function() {
        statusText.innerText = "Starte Kamera...";
        startCamera();
    };

    async function startCamera() {
        const constraints = {
            video: { facingMode: "environment" },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            // WICHTIGE ÄNDERUNG: Aktives Warten auf Videogröße
            checkVideoReady();

        } catch (err) {
            statusText.innerText = "Kamera Fehler: " + err.name;
            // Fallback PC
            if(err.name === "OverconstrainedError") {
                navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                    video.srcObject = s; video.play(); checkVideoReady();
                });
            }
        }
    }

    // Diese Funktion prüft so lange, bis das Video wirklich bereit ist
    function checkVideoReady() {
        // Wir brauchen width > 0, sonst stürzt POSIT ab
        if (video.readyState === 4 && video.videoWidth > 0) {
            initializeAR();
        } else {
            // Wenn noch nicht bereit, probiere es in 100ms nochmal
            console.log("Warte auf Video Maße...");
            setTimeout(checkVideoReady, 100);
        }
    }

    function initializeAR() {
        statusText.innerText = "Initialisiere AR...";
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        try {
            detector = new AR.Detector();
            posit = new POSIT(modelSize, video.videoWidth);
            
            statusText.innerText = "Suche Marker ID 0...";
            requestAnimationFrame(tick); // Loop starten
        } catch (e) {
            statusText.innerText = "Fehler init AR: " + e;
        }
    }

    function tick() {
        if (video.readyState === 4) {
            // Resize Check
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                posit = new POSIT(modelSize, video.videoWidth);
            }

            // Bilddaten holen
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Canvas leeren
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Marker suchen
            try {
                var markers = detector.detect(imageData);
                drawScene(markers);
            } catch(e) {
                console.log(e);
            }
        }
        requestAnimationFrame(tick);
    }

    function drawScene(markers) {
        if (markers.length > 0) {
            let id = markers[0].id;
            statusText.innerHTML = `ID: ${id} <br> <span style='font-size:12px; color:#aaa'>Distanz: ~${calculateDistance(markers[0]).toFixed(1)}cm</span>`;

            markers.forEach(function(marker) {
                drawBorder(marker.corners);
                var pose = posit.pose(marker.corners);
                drawAxis(pose.bestRotation, pose.bestTranslation);
            });
        } else {
            statusText.innerText = "Suche Marker...";
        }
    }

    // Hilfsfunktion: Distanz schätzen (Z-Achse)
    function calculateDistance(marker) {
        // Sehr grobe Schätzung basierend auf posit
        var pose = posit.pose(marker.corners);
        return pose.bestTranslation[2] / 10; // in cm umrechnen (grob)
    }

    function drawBorder(corners) {
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "white";
        ctx.moveTo(corners[0].x, corners[0].y);
        ctx.lineTo(corners[1].x, corners[1].y);
        ctx.lineTo(corners[2].x, corners[2].y);
        ctx.lineTo(corners[3].x, corners[3].y);
        ctx.closePath();
        ctx.stroke();
    }

    function drawAxis(rotation, translation) {
        var center = posit.project(0, 0, 0, rotation, translation);
        var xAxis = posit.project(modelSize, 0, 0, rotation, translation);
        var yAxis = posit.project(0, modelSize, 0, rotation, translation);
        var zAxis = posit.project(0, 0, -modelSize, rotation, translation);

        ctx.lineWidth = 5;

        // X Rot
        ctx.beginPath(); ctx.strokeStyle = "red";
        ctx.moveTo(center.x, center.y); ctx.lineTo(xAxis.x, xAxis.y); ctx.stroke();

        // Y Grün
        ctx.beginPath(); ctx.strokeStyle = "green";
        ctx.moveTo(center.x, center.y); ctx.lineTo(yAxis.x, yAxis.y); ctx.stroke();

        // Z Blau
        ctx.beginPath(); ctx.strokeStyle = "blue";
        ctx.moveTo(center.x, center.y); ctx.lineTo(zAxis.x, zAxis.y); ctx.stroke();
    }

</script>

</body>
</html>
