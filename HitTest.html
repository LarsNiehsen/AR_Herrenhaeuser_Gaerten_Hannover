<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera Debugger</title>
    <style>
        body { background-color: #000; color: white; font-family: monospace; margin: 0; padding: 0; overflow: hidden; }
        
        #container { position: relative; width: 100vw; height: 100vh; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }

        /* Das Log-Fenster zeigt uns den Fehler an */
        #debug-log {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
            background: rgba(0, 0, 0, 0.9); overflow-y: scroll; 
            z-index: 10; padding: 10px; border-top: 2px solid red;
            box-sizing: border-box; font-size: 12px;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; }
        .success { color: #00ff00; }
        .error { color: #ff5555; font-weight: bold; }
        .info { color: #aaa; }
    </style>
</head>
<body>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
    <!-- Hier erscheinen die Fehlermeldungen -->
    <div id="debug-log"></div>
</div>

<script>
    // --- Hilfsfunktion zum Schreiben ins Log-Fenster ---
    function log(msg, type = 'info') {
        const logDiv = document.getElementById('debug-log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.appendChild(entry);
        console.log(msg); // Auch in die Konsole schreiben
    }

    log("Initialisiere Seite...", "info");

    // OpenCV Config
    var Module = {
        onRuntimeInitialized: function() {
            log("OpenCV erfolgreich geladen!", "success");
            startCamera();
        },
        onError: function(err) {
            log("OpenCV konnte nicht laden: " + err, "error");
        }
    };
</script>

<!-- OpenCV laden -->
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let stream = null;
    
    // OpenCV Variablen
    let src = null, gray = null, cap = null;
    let dictionary = null, params = null, detector = null;
    let markerCorners = null, markerIds = null, rejected = null;

    async function startCamera() {
        log("Versuche Kamera zu starten...", "info");

        // STRATEGIE 1: Rückkamera anfordern (ohne strikte Auflösung)
        const constraintsEnv = { video: { facingMode: "environment" }, audio: false };
        
        // STRATEGIE 2: Irgendeine Kamera anfordern (Falls Rückkamera blockiert)
        const constraintsAny = { video: true, audio: false };

        try {
            // Versuch 1
            stream = await navigator.mediaDevices.getUserMedia(constraintsEnv);
            log("Kamera Zugriff (Environment) gewährt!", "success");
        } catch (err) {
            log("Rückkamera fehlgeschlagen (" + err.name + "). Versuche irgendeine Kamera...", "error");
            try {
                // Versuch 2 (Fallback)
                stream = await navigator.mediaDevices.getUserMedia(constraintsAny);
                log("Kamera Zugriff (Fallback) gewährt!", "success");
            } catch (err2) {
                log("FATAL: Kein Kamera-Zugriff möglich. " + err2.name + " - " + err2.message, "error");
                log("HINWEIS: Prüfe ob HTTPS genutzt wird!", "error");
                return; // Abbruch
            }
        }

        // Stream verbinden
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            log(`Kamera läuft: ${video.videoWidth}x${video.videoHeight}`, "success");
            video.play();
            requestAnimationFrame(processVideo);
            initOpenCV(video.videoWidth, video.videoHeight);
        };
        
        video.onerror = (e) => {
            log("Video Element Fehler: " + JSON.stringify(e), "error");
        };
    }

    function initOpenCV(w, h) {
        try {
            if(src) src.delete();
            src = new cv.Mat(h, w, cv.CV_8UC4);
            gray = new cv.Mat();
            markerCorners = new cv.MatVector();
            markerIds = new cv.Mat();
            rejected = new cv.MatVector();
            
            dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);
            params = new cv.aruco_DetectorParameters();
            detector = new cv.aruco_ArucoDetector(dictionary, params);
            
            canvas.width = w;
            canvas.height = h;
            log("OpenCV Matrizen initialisiert.", "info");
        } catch(e) {
            log("Fehler bei initOpenCV: " + e, "error");
        }
    }

    function processVideo() {
        try {
            if (video.readyState === 4) { // 4 = HAVE_ENOUGH_DATA
                
                // Resize Check (Pixel Handys ändern oft die Größe nach Start)
                if (src && (src.cols !== video.videoWidth || src.rows !== video.videoHeight)) {
                    log(`Auflösung geändert: ${src.cols}x${src.rows} -> ${video.videoWidth}x${video.videoHeight}`, "info");
                    initOpenCV(video.videoWidth, video.videoHeight);
                    if(cap) { delete cap; cap = null; }
                }

                if (!cap) cap = new cv.VideoCapture(video);
                cap.read(src);

                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                detector.detectMarkers(gray, markerCorners, markerIds, rejected);

                if (markerIds.rows > 0) {
                    cv.drawDetectedMarkers(src, markerCorners, markerIds);
                    
                    // Prüfe auf ID 0
                    let found = false;
                    for(let i=0; i<markerIds.rows; i++) {
                        if(markerIds.data32S[i] === 0) found = true;
                    }
                    if(found) {
                        // Visuelles Feedback oben im Log (spart Performance)
                        // Optional: Zeichnen Text ins Bild
                        cv.putText(src, "ID 0 GEFUNDEN", {x:50, y:100}, cv.FONT_HERSHEY_SIMPLEX, 1.5, [0,255,0,255], 3);
                    }
                }

                cv.imshow('canvasOutput', src);
            }
        } catch (err) {
            log("Loop Fehler: " + err, "error");
        }
        requestAnimationFrame(processVideo);
    }
</script>

</body>
</html>
