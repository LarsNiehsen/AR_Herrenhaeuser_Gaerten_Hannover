<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pixel 8a - ArUco Detection Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        /* Container keeps the video and canvas aligned */
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { display: none; } /* Hide raw video, we only see canvas */
        
        #status {
            position: absolute; top: 20px; left: 20px; 
            color: #00ff00; background: rgba(0,0,0,0.8); 
            padding: 10px 15px; font-family: monospace; font-size: 16px; font-weight: bold;
            z-index: 10; border: 2px solid #00ff00; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="status">Loading OpenCV...</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- Load OpenCV -->
<script>
    var Module = {
        onRuntimeInitialized: function() {
            document.getElementById('status').innerText = "OpenCV Ready. Opening Camera...";
            startCamera();
        }
    };
</script>
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script type="text/javascript">
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let status = document.getElementById('status');

    // OpenCV Objects
    let cap = null;
    let src = null;
    let dictionary = null;
    let markerCorners = null;
    let markerIds = null;

    async function startCamera() {
        const constraints = {
            video: {
                facingMode: { exact: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            requestAnimationFrame(processVideo);
        } catch(err) {
            // Fallback for phones that don't like "exact"
            console.warn("Retrying with loose constraints...");
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(s => {
                    video.srcObject = s;
                    video.play();
                    requestAnimationFrame(processVideo);
                })
                .catch(e => {
                    status.innerText = "Camera Error: " + e;
                    status.style.color = "red";
                    status.style.borderColor = "red";
                });
        }
    }

    function initMatrices(width, height) {
        // Clean up old memory
        if(src) src.delete();
        if(markerCorners) markerCorners.delete();
        if(markerIds) markerIds.delete();
        if(dictionary) dictionary.delete();

        // Create new matrices for the current resolution
        src = new cv.Mat(height, width, cv.CV_8UC4);
        markerCorners = new cv.MatVector();
        markerIds = new cv.Mat();
        
        // Load the 6x6 Dictionary (ID 0-249)
        dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);
        
        canvas.width = width;
        canvas.height = height;
        console.log(`Matrices initialized: ${width}x${height}`);
    }

    function processVideo() {
        try {
            // 1. Check if video is actually ready
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
                
                // 2. Pixel Fix: Re-init if resolution changed (or is first run)
                if (!src || src.cols !== video.videoWidth || src.rows !== video.videoHeight) {
                    initMatrices(video.videoWidth, video.videoHeight);
                    if(cap) { delete cap; cap = null; }
                    cap = new cv.VideoCapture(video);
                }

                // 3. Capture Frame
                cap.read(src);

                // 4. Detect Markers (2D Only)
                cv.detectMarkers(src, dictionary, markerCorners, markerIds);

                // 5. Draw Results
                if (markerIds.rows > 0) {
                    // Draws the green outline and the ID number
                    cv.drawDetectedMarkers(src, markerCorners, markerIds);
                    
                    // Check if ID 0 is present
                    let foundId0 = false;
                    for(let i=0; i < markerIds.rows; i++) {
                        if(markerIds.data32S[i] === 0) foundId0 = true;
                    }

                    if(foundId0) {
                        status.innerText = "Marker ID 0 Detected!";
                        status.style.color = "#00ff00";
                        status.style.borderColor = "#00ff00";
                    } else {
                        status.innerText = "Marker detected (Not ID 0)";
                        status.style.color = "yellow";
                        status.style.borderColor = "yellow";
                    }

                } else {
                    status.innerText = "Searching for Marker ID 0...";
                    status.style.color = "white";
                    status.style.borderColor = "white";
                }

                // 6. Display on Canvas
                cv.imshow('canvasOutput', src);
            }
        } catch (err) {
            console.error(err);
        }

        requestAnimationFrame(processVideo);
    }
</script>

</body>
</html>
