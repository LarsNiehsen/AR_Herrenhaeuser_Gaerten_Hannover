<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ArUco Marker Detection & Coordinate System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 10px; font-size: 1.2rem; }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 2px solid #444;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        #info {
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>JS-ArUco2: Local Coordinate System</h1>
    
    <div class="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>
    <div id="info">Waiting for marker...</div>

    <!-- Load js-aruco2 libraries directly from GitHub via CDN -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');

        let detector, posit;
        // Real physical size of the marker in millimeters (adjust as needed)
        const markerSize = 50.0; 

        // Initialize webcam
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Initialize ArUco detector
                    // Uses ARUCO_MIP_36h12 dictionary by default in js-aruco2
                    detector = new AR.Detector();

                    // Initialize POSIT for 3D pose estimation
                    // Arguments: Model size (mm), Focal length (approx canvas width)
                    posit = new POS.Posit(markerSize, canvas.width);

                    requestAnimationFrame(tick);
                };
            })
            .catch(err => console.error("Camera error:", err));

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                drawImage();
                detectAndDraw();
            }
            requestAnimationFrame(tick);
        }

        function drawImage() {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        function detectAndDraw() {
            // 1. Get image data for detection
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            
            // 2. Detect markers
            const markers = detector.detect(imageData);

            // 3. Draw results
            drawDebug(markers);
        }

        function drawDebug(markers) {
            if (markers.length > 0) {
                infoDiv.innerText = `Detected IDs: ${markers.map(m => m.id).join(', ')}`;
            } else {
                infoDiv.innerText = "No marker detected";
            }

            markers.forEach(marker => {
                // Draw 2D contour
                drawContour(marker.corners, marker.id);

                // Estimate Pose
                // We need to center the corners relative to the image center for POSIT
                const cornersCentered = marker.corners.map(c => {
                    return {
                        x: c.x - (canvas.width / 2),
                        y: (canvas.height / 2) - c.y
                    };
                });

                const pose = posit.pose(cornersCentered);

                if (pose) {
                    // Draw the local coordinate axes
                    // Rotation is a 3x3 matrix (array of 3 arrays), Translation is a vector [x,y,z]
                    const rot = pose.bestRotation;
                    const trans = pose.bestTranslation;

                    drawAxis(rot, trans, markerSize);
                }
            });
        }

        function drawContour(corners, id) {
            context.strokeStyle = "cyan";
            context.lineWidth = 2;
            context.beginPath();
            corners.forEach((c, i) => {
                if (i === 0) context.moveTo(c.x, c.y);
                else context.lineTo(c.x, c.y);
            });
            context.closePath();
            context.stroke();

            // Draw ID
            context.fillStyle = "cyan";
            context.font = "bold 20px Arial";
            context.fillText(`ID: ${id}`, corners[0].x, corners[0].y - 10);
        }

        // Helper to project a 3D point to 2D using the estimated pose
        function project(point3d, rot, trans) {
            // 3D rotation + translation
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];

            // Perspective projection (assuming focal length ~= canvas width)
            // The library assumes specific coordinate conventions, we map back to canvas pixels here
            const scale = canvas.width / z;
            const x2d = x * scale + (canvas.width / 2);
            const y2d = (canvas.height / 2) - y * scale; // Y is inverted in canvas

            return { x: x2d, y: y2d };
        }

        function drawAxis(rot, trans, length) {
            const origin = [0, 0, 0];
            const axisX = [length, 0, 0];
            const axisY = [0, length, 0];
            const axisZ = [0, 0, length];

            const pOrigin = project(origin, rot, trans);
            const pX = project(axisX, rot, trans);
            const pY = project(axisY, rot, trans);
            const pZ = project(axisZ, rot, trans);

            context.lineWidth = 4;

            // X Axis (Red)
            context.beginPath();
            context.strokeStyle = "red";
            context.moveTo(pOrigin.x, pOrigin.y);
            context.lineTo(pX.x, pX.y);
            context.stroke();

            // Y Axis (Green)
            context.beginPath();
            context.strokeStyle = "green";
            context.moveTo(pOrigin.x, pOrigin.y);
            context.lineTo(pY.x, pY.y);
            context.stroke();

            // Z Axis (Blue)
            context.beginPath();
            context.strokeStyle = "blue";
            context.moveTo(pOrigin.x, pOrigin.y);
            context.lineTo(pZ.x, pZ.y);
            context.stroke();
        }
    </script>
</body>
</html>
