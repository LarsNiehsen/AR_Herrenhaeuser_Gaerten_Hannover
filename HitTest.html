<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArUco Fullscreen Tracking</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Prevent scrolling */
        }

        /* The canvas fills the entire screen */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Hidden video element, used only as data source */
        video {
            display: none;
        }

        /* Floating camera switch button */
        #camBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #camBtn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Switch Camera Button -->
    <button id="camBtn">Switch Camera</button>

    <!-- Video Source (Hidden) -->
    <video id="video" playsinline muted autoplay></video>
    
    <!-- Fullscreen Drawing Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const camBtn = document.getElementById('camBtn');

        // Configuration
        let currentFacingMode = 'environment'; // Start with rear camera
        const markerSize = 50.0; // Physical marker size in mm

        let detector = null;
        let posit = null;
        let animationId = null;
        let stream = null;

        // 1. Initialize
        window.onload = () => {
            detector = new AR.Detector();
            startCamera();
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // Handle camera switch
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Re-initialize POSIT with new canvas width as focal length approximation
            if (canvas.width > 0) {
                posit = new POS.Posit(markerSize, canvas.width);
            }
        }

        function startCamera() {
            // Stop existing stream if any
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                cancelAnimationFrame(animationId);
            }

            const constraints = {
                audio: false,
                video: {
                    facingMode: currentFacingMode
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        resizeCanvas();
                        requestAnimationFrame(tick);
                    };
                })
                .catch(err => {
                    console.error("Camera Error:", err);
                    alert("Could not access camera. Ensure you are on HTTPS/Localhost.");
                });
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                drawVideoFullscreen();
                processFrame();
            }
            animationId = requestAnimationFrame(tick);
        }

        // Helper to draw video covering the canvas (like object-fit: cover)
        function drawVideoFullscreen() {
            const cw = canvas.width;
            const ch = canvas.height;
            const vw = video.videoWidth;
            const vh = video.videoHeight;

            const rV = vw / vh;
            const rC = cw / ch;

            let sx, sy, sw, sh;

            if (rV < rC) {
                // Video is taller than canvas (crop top/bottom)
                sw = vw;
                sh = vw / rC;
                sx = 0;
                sy = (vh - sh) / 2;
            } else {
                // Video is wider than canvas (crop left/right)
                sh = vh;
                sw = vh * rC;
                sx = (vw - sw) / 2;
                sy = 0;
            }

            context.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function processFrame() {
            // Get visual data from canvas
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const markers = detector.detect(imageData);

            drawDebug(markers);
        }

        function drawDebug(markers) {
            markers.forEach(marker => {
                // 1. Convert corners to centered coordinates for POSIT
                const cornersCentered = marker.corners.map(c => {
                    return {
                        x: c.x - (canvas.width / 2),
                        y: (canvas.height / 2) - c.y // Y axis inverted in standard CV/GL 
                    };
                });

                // 2. Estimate Pose
                const pose = posit.pose(cornersCentered);

                if (pose) {
                    const rot = pose.bestRotation;
                    const trans = pose.bestTranslation;

                    // 3. Draw Coordinate System
                    drawAxis(rot, trans, markerSize);

                    // 4. Draw ID next to the axis origin
                    drawMarkerID(rot, trans, marker.id);
                }
            });
        }

        // Project 3D point to 2D screen space
        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];

            const scale = canvas.width / z;
            
            return {
                x: x * scale + (canvas.width / 2),
                y: (canvas.height / 2) - y * scale
            };
        }

        function drawAxis(rot, trans, len) {
            const origin = [0, 0, 0];
            const axisX = [len, 0, 0];
            const axisY = [0, len, 0];
            const axisZ = [0, 0, len];

            const p0 = project(origin, rot, trans);
            const pX = project(axisX, rot, trans);
            const pY = project(axisY, rot, trans);
            const pZ = project(axisZ, rot, trans);

            context.lineWidth = 5;
            context.lineCap = "round";

            // X Axis (Red)
            context.beginPath();
            context.strokeStyle = "#ff0000";
            context.moveTo(p0.x, p0.y);
            context.lineTo(pX.x, pX.y);
            context.stroke();

            // Y Axis (Green)
            context.beginPath();
            context.strokeStyle = "#00ff00";
            context.moveTo(p0.x, p0.y);
            context.lineTo(pY.x, pY.y);
            context.stroke();

            // Z Axis (Blue)
            context.beginPath();
            context.strokeStyle = "#0000ff";
            context.moveTo(p0.x, p0.y);
            context.lineTo(pZ.x, pZ.y);
            context.stroke();
        }

        function drawMarkerID(rot, trans, id) {
            const origin = [0, 0, 0];
            const p0 = project(origin, rot, trans);

            context.font = "bold 24px monospace";
            context.textAlign = "left";
            context.textBaseline = "bottom";
            
            // Text Shadow (Stroke) for visibility
            context.strokeStyle = "black";
            context.lineWidth = 3;
            context.strokeText(`ID: ${id}`, p0.x + 10, p0.y - 10);

            // Text Fill
            context.fillStyle = "#00FFFF"; // Cyan
            context.fillText(`ID: ${id}`, p0.x + 10, p0.y - 10);
        }

    </script>
</body>
</html>
