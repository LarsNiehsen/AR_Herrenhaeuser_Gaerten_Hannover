<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pixel 8a ArUco Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { display: none; }
        #status {
            position: absolute; top: 20px; left: 20px; color: cyan; 
            background: rgba(0,0,0,0.8); padding: 10px; font-family: monospace; 
            font-size: 16px; z-index: 10; border: 1px solid cyan;
        }
    </style>
</head>
<body>

<div id="status">Initializing...</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- Config for OpenCV -->
<script>
    var Module = {
        onRuntimeInitialized: function() {
            document.getElementById('status').innerText = "OpenCV Ready. Starting Camera...";
            startCamera();
        }
    };
</script>
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script type="text/javascript">
    const MARKER_SIZE = 1.0; // Arbitrary unit size
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let ctx = canvas.getContext('2d');
    let status = document.getElementById('status');

    let stream = null;
    let cap = null;
    let src = null;
    let dictionary = null;
    let markerCorners = null;
    let markerIds = null;
    let rvecs = null;
    let tvecs = null;
    
    // Camera Internals (will be set dynamically)
    let cameraMatrix = null;
    let distCoeffs = null;

    async function startCamera() {
        // Pixel 8a prefers strict constraints to trigger the right lens
        const constraints = {
            video: {
                facingMode: { exact: "environment" },
                width: { ideal: 1920 }, 
                height: { ideal: 1080 } 
            },
            audio: false
        };

        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            requestAnimationFrame(processVideo);
        } catch(err) {
            status.innerText = "Rear camera error. Trying default...";
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(processVideo);
            } catch(e) {
                status.innerText = "Fatal Error: " + e;
            }
        }
    }

    function initMatrices(width, height) {
        // Delete old matrices if they exist to prevent memory leaks
        if(src) src.delete();
        if(cameraMatrix) cameraMatrix.delete();
        if(distCoeffs) distCoeffs.delete();
        if(markerCorners) markerCorners.delete();
        if(markerIds) markerIds.delete();
        if(rvecs) rvecs.delete();
        if(tvecs) tvecs.delete();
        if(dictionary) dictionary.delete();

        // Initialize new ones with correct dimensions
        src = new cv.Mat(height, width, cv.CV_8UC4);
        markerCorners = new cv.MatVector();
        markerIds = new cv.Mat();
        rvecs = new cv.Mat();
        tvecs = new cv.Mat();
        
        // Re-create dictionary
        dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);

        // Approximate Camera Matrix for the new resolution
        let cx = width / 2;
        let cy = height / 2;
        let fx = width; // Guessing focal length is roughly width
        let fy = width;

        cameraMatrix = cv.matFromArray(3, 3, cv.CV_64F, [
            fx, 0, cx,
            0, fy, cy,
            0, 0, 1
        ]);

        distCoeffs = cv.matFromArray(5, 1, cv.CV_64F, [0, 0, 0, 0, 0]);
        
        // Update Canvas to match
        canvas.width = width;
        canvas.height = height;
        
        console.log(`Initialized matrices for ${width}x${height}`);
        status.innerText = `Tracking ID 0 @ ${width}x${height}`;
    }

    function processVideo() {
        try {
            // 1. CRITICAL CHECK: Is video ready and has dimensions?
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                
                // 2. DYNAMIC RESIZE: Did resolution change? (Or is this the first run?)
                if (!src || src.cols !== video.videoWidth || src.rows !== video.videoHeight) {
                    initMatrices(video.videoWidth, video.videoHeight);
                    // Re-create capture object if size changed
                    if(cap) { delete cap; cap = null; } 
                    cap = new cv.VideoCapture(video);
                }

                // 3. Process Frame
                cap.read(src);

                // Detect
                cv.detectMarkers(src, dictionary, markerCorners, markerIds);

                if (markerIds.rows > 0) {
                    cv.drawDetectedMarkers(src, markerCorners, markerIds);
                    cv.estimatePoseSingleMarkers(markerCorners, MARKER_SIZE, cameraMatrix, distCoeffs, rvecs, tvecs);

                    for (let i = 0; i < markerIds.rows; ++i) {
                        let rvec = rvecs.row(i);
                        let tvec = tvecs.row(i);
                        cv.drawFrameAxes(src, cameraMatrix, distCoeffs, rvec, tvec, 1.0);
                        
                        if (markerIds.data32S[i] === 0) {
                            // Optional: Add specific text overlay
                            // cv.putText(src, "TARGET", {x: 10, y: 10}, cv.FONT_HERSHEY_SIMPLEX, 1, [0, 255, 0, 255], 2);
                        }
                        
                        rvec.delete();
                        tvec.delete();
                    }
                }

                cv.imshow('canvasOutput', src);
            } else {
                // Video not ready yet, wait...
                status.innerText = "Waiting for camera stream...";
            }
        } catch (err) {
            console.error(err);
            status.innerText = "Error: " + err;
        }

        requestAnimationFrame(processVideo);
    }
</script>

</body>
</html>
