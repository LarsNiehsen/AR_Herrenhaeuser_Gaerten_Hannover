<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpenCV 4.10.0 ArUco Pose Estimation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        #status {
            position: absolute; top: 20px; left: 20px; color: #00ff00; 
            background: rgba(0,0,0,0.8); padding: 12px; font-family: monospace; font-size: 14px; 
            z-index: 10; border-radius: 4px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="status">Initializing WebAssembly...</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline></video>
    <canvas id="canvasOutput"></canvas>
</div>

<script type="text/javascript">
    // Configuration
    const MARKER_SIZE = 1.0; // The size of the marker in 3D units (arbitrary)

    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let status = document.getElementById('status');
    let streaming = false;

    // OpenCV Objects
    let cap = null;
    let src = null;
    let dictionary = null;
    let markerCorners = null;
    let markerIds = null;
    let rvecs = null;
    let tvecs = null;
    let cameraMatrix = null;
    let distCoeffs = null;

    // 1. Define the Module config BEFORE loading the script
    var Module = {
        onRuntimeInitialized: function() {
            status.innerText = "OpenCV 4.10.0 Ready. Starting Camera...";
            startCamera();
        }
    };
</script>

<!-- Load OpenCV 4.10.0 -->
<script async src="https://docs.opencv.org/4.10.0/opencv.js" type="text/javascript"></script>

<script type="text/javascript">
    async function startCamera() {
        // Pixel phones work best with "environment" facing mode
        const constraints = {
            video: {
                facingMode: { exact: "environment" },
                width: { ideal: 1280 }, // HD resolution for better detection
                height: { ideal: 720 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            video.addEventListener("canplay", onVideoCanPlay, false);
        } catch(err) {
            status.innerText = "Camera Error: " + err.name;
            console.error(err);
            // Fallback for devices that don't support 'exact'
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    video.addEventListener("canplay", onVideoCanPlay, false);
                })
                .catch(e => status.innerText = "Fatal Camera Error: " + e);
        }
    }

    function onVideoCanPlay() {
        if (streaming) return;
        
        // Match canvas size to video resolution
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        streaming = true;
        initOpenCV();
        requestAnimationFrame(processVideo);
    }

    function initOpenCV() {
        status.innerText = "Detecting Marker ID 0 (6x6)...";

        // Initialize Matrices
        src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
        markerCorners = new cv.MatVector();
        markerIds = new cv.Mat();
        rvecs = new cv.Mat();
        tvecs = new cv.Mat();

        // Load ArUco Dictionary 6x6
        // Modern OpenCV Syntax: use getPredefinedDictionary
        dictionary = cv.getPredefinedDictionary(cv.DICT_6X6_250);

        // --- Approximate Camera Calibration ---
        // We fake the camera intrinsics based on screen size
        let width = video.videoWidth;
        let height = video.videoHeight;
        let cx = width / 2;
        let cy = height / 2;
        let fx = width; // Approx focal length
        let fy = width; 

        cameraMatrix = cv.matFromArray(3, 3, cv.CV_64F, [
            fx, 0, cx,
            0, fy, cy,
            0, 0, 1
        ]);

        distCoeffs = cv.matFromArray(5, 1, cv.CV_64F, [0, 0, 0, 0, 0]);
    }

    function processVideo() {
        if (!streaming) return;

        try {
            // Capture frame
            if (!cap) cap = new cv.VideoCapture(video);
            cap.read(src);

            // Detect Markers
            cv.detectMarkers(src, dictionary, markerCorners, markerIds);

            if (markerIds.rows > 0) {
                // Draw 2D Squares
                cv.drawDetectedMarkers(src, markerCorners, markerIds);

                // Pose Estimation
                // rvecs and tvecs are the Rotation and Translation vectors
                cv.estimatePoseSingleMarkers(markerCorners, MARKER_SIZE, cameraMatrix, distCoeffs, rvecs, tvecs);

                for (let i = 0; i < markerIds.rows; ++i) {
                    let id = markerIds.data32S[i];
                    
                    // Extract vectors for this specific marker
                    let rvec = rvecs.row(i);
                    let tvec = tvecs.row(i);

                    // Draw 3D Axis (Length of 1.0)
                    cv.drawFrameAxes(src, cameraMatrix, distCoeffs, rvec, tvec, 1.0);

                    if (id === 0) {
                        status.innerText = `ID 0 Found | Z-Dist: ${tvec.data64F[2].toFixed(2)}`;
                    }
                    
                    // Note: In C++ we clean up rows, but in JS 'row()' returns a view or a temp mat.
                    // Ideally we let them be GC'd or delete if explicitly creating new Mat objects per row.
                    rvec.delete(); 
                    tvec.delete();
                }
            } else {
                status.innerText = "Searching for Marker ID 0...";
            }

            // Render
            cv.imshow('canvasOutput', src);

        } catch (err) {
            console.error(err);
            status.innerText = "Error: " + err;
        }

        requestAnimationFrame(processVideo);
    }

    // Cleanup on exit (optional for web, but good practice)
    window.addEventListener('unload', () => {
        if(src) src.delete();
        if(markerCorners) markerCorners.delete();
        if(markerIds) markerIds.delete();
        if(rvecs) rvecs.delete();
        if(tvecs) tvecs.delete();
        if(dictionary) dictionary.delete();
    });
</script>

</body>
</html>
