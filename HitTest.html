<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ArUco (DICT_6X6_250) + OpenCV.js + Three.js — Beispiel</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #overlay { position: absolute; top: 10px; left: 10px; z-index: 20; background: rgba(0,0,0,0.4); color: #fff; padding:8px; border-radius:6px; }
  #video, #videoCanvas { display: none; } /* video & internal canvas hidden */
  #three-container { width:100vw; height:100vh; }
  button { padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
  <div id="overlay">
    <button id="startBtn">Kamera starten & Erkennung</button>
    <div id="status">Status: bereit</div>
  </div>

  <!-- Hidden video + canvas used als Quelle für OpenCV -->
  <video id="video" autoplay playsinline></video>
  <canvas id="videoCanvas"></canvas>

  <div id="three-container"></div>

  <!-- OpenCV.js (offizielle build) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" ></script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

    // === Einstellungen ===
    const MARKER_SIZE_M = 0.10; // 10 cm Marker — passe an, falls dein gedruckter Marker andere Größe hat

    // DOM
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const video = document.getElementById('video');
    const videoCanvas = document.getElementById('videoCanvas');
    const videoCtx = videoCanvas.getContext('2d');

    // Three.js
    const container = document.getElementById('three-container');
    let renderer, scene, camera, markerRoot;

    // OpenCV
    let cvReady = false;
    let dictionary = null;

    // Helper: set status
    function setStatus(s){ statusEl.innerText = 'Status: '+s; }

    // OpenCV ready callback (von <script onload>)
    function onOpenCvReady(){
      // opencv.js global: cv
      if (typeof cv === 'undefined') {
        setStatus('OpenCV.js konnte nicht geladen werden');
        return;
      }
      setStatus('OpenCV geladen — warte auf Benutzeraktion');
      cv['onRuntimeInitialized'] = () => {
        cvReady = true;
        // Erstelle ArUco-Dictionary DICT_6X6_250
        try {
          dictionary = new cv.aruco.Dictionary_get(cv.aruco.DICT_6X6_250);
        } catch(e) {
          // Fallback: je nach OpenCV.js-Build kann alternative API nötig sein
          try {
            dictionary = cv.aruco.getPredefinedDictionary(cv.aruco.DICT_6X6_250);
          } catch(e2) {
            console.error('Dictionary create error', e, e2);
            setStatus('OpenCV.js build ohne aruco? (benötigt opencv_contrib).');
            return;
          }
        }
        setStatus('OpenCV bereit. Drücke "Kamera starten".');
      };
    }

    // Start: Kamera anfordern, Three.js aufsetzen und Loop beginnen
    startBtn.addEventListener('click', async () => {
      if (!cvReady) { setStatus('OpenCV noch nicht initialisiert'); return; }
      startBtn.disabled = true;
      setStatus('Starte Kamera...');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        await video.play();

        // set canvas sizing
        videoCanvas.width = video.videoWidth;
        videoCanvas.height = video.videoHeight;

        initThree();
        requestAnimationFrame(processFrame);

        setStatus('Läuft — Marker scannen (DICT_6X6_250)');
      } catch (err) {
        console.error(err);
        setStatus('Kamerafehler: ' + err.message);
      }
    });

    // Three.js initialisieren
    function initThree() {
      scene = new THREE.Scene();

      const fov = 70;
      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(fov, aspect, 0.01, 50);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
      scene.add(light);

      // Marker root (wird die Pose vom ArUco erhalten)
      markerRoot = new THREE.Group();
      markerRoot.visible = false;
      scene.add(markerRoot);

      // Zylinder
      const cylGeo = new THREE.CylinderGeometry(MARKER_SIZE_M / 2, MARKER_SIZE_M / 2, MARKER_SIZE_M, 32);
      const cylMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.5 });
      const cyl = new THREE.Mesh(cylGeo, cylMat);
      cyl.position.y = MARKER_SIZE_M / 2; // steht auf Marker
      markerRoot.add(cyl);

      // Achsen
      const axes = new THREE.AxesHelper(MARKER_SIZE_M * 1.3);
      markerRoot.add(axes);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Frame-Loop: Bild holen, OpenCV ArUco detect, solvePnP, Three.js update
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Kopiere Video in Canvas
        videoCtx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

        try {
          detectAndPose();
        } catch (e) {
          console.error('Frame-Fehler', e);
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(processFrame);
    }

    // Kerndefinition: Erkennung + Pose
    function detectAndPose() {
      // Lese Frame in OpenCV Mat
      let src = cv.imread(videoCanvas); // cv.Mat, CV_8UC4 (RGBA)
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // ArUco detect
      let corners = new cv.MatVector();
      let ids = new cv.Mat();
      let rejected = new cv.MatVector();
      let parameters = new cv.aruco.DetectorParameters();

      try {
        // detectMarkers(image, dictionary, corners, ids, parameters, rejectedCandidates)
        cv.aruco.detectMarkers(gray, dictionary, corners, ids, parameters, rejected);

        if (ids.rows > 0) {
          // Wir suchen gezielt nach ID 0 — du kannst das anpassen
          let foundIndex = -1;
          for (let i = 0; i < ids.rows; i++) {
            if (ids.intAt(i, 0) === 0) { foundIndex = i; break; }
          }

          if (foundIndex !== -1) {
            // Lese imagePoints (4 Ecken)
            const cornerMat = corners.get(foundIndex); // Mat mit 4x1x2 (?) - wir extrahieren Daten32F
            // cornerMat.data32F enthält x0,y0,x1,y1,...
            const pts = Array.from(cornerMat.data32F);
            // reorganisiere in [ [x,y], ... ] für solvePnP
            const imagePoints = new cv.Mat(4, 2, cv.CV_32F);
            for (let i = 0; i < 4; i++) {
              imagePoints.floatPtr(i)[0] = pts[i*2];
              imagePoints.floatPtr(i)[1] = pts[i*2 + 1];
            }

            // Objektpunkte (Marker-Koordinaten in Metern)
            // Wir definieren Marker in Marker-Koordinatensystem: (−s/2, s/2, 0), (s/2, s/2, 0), (s/2, −s/2, 0), (−s/2, −s/2, 0)
            const s = MARKER_SIZE_M;
            const objPtsData = new Float32Array([
              -s/2,  s/2, 0,
               s/2,  s/2, 0,
               s/2, -s/2, 0,
              -s/2, -s/2, 0
            ]);
            const objectPoints = cv.matFromArray(4, 3, cv.CV_32F, objPtsData);

            // Kamera-Matrix (grob abgeschätzt)
            // Bessere Ergebnisse mit echter Kalibrierung.
            const w = videoCanvas.width;
            const h = videoCanvas.height;
            // Näherung: fx = fy = focal_length_pixels
            // Eine sinnvolle Schätzung: f = 0.5 * width / tan(fov/2). Wir nehmen fov ~ 60°.
            const fovRad = (60 * Math.PI/180);
            const f = 0.5 * w / Math.tan(fovRad/2);
            const cx = w / 2;
            const cy = h / 2;
            const cameraMat = cv.matFromArray(3, 3, cv.CV_32F, [f, 0, cx, 0, f, cy, 0, 0, 1]);

            const distCoeffs = cv.Mat.zeros(4, 1, cv.CV_32F);

            // solvePnP
            let rvec = new cv.Mat();
            let tvec = new cv.Mat();
            const useExtrinsicGuess = false;
            cv.solvePnP(objectPoints, imagePoints, cameraMat, distCoeffs, rvec, tvec, useExtrinsicGuess, cv.SOLVEPNP_ITERATIVE);

            // Rodrigues -> Rotationsmatrix 3x3
            let rotMat = new cv.Mat();
            cv.Rodrigues(rvec, rotMat);

            // Konvertiere rotMat + tvec zu three.js Matrix / Quaternion / Position
            // rotMat.data32F: [r00,r01,r02, r10,r11,r12, r20,r21,r22]
            const rm = rotMat.data32F;
            // Erzeuge THREE.Matrix4 (row-major -> set in column-major order)
            const threeMat = new THREE.Matrix4();
            // Three.js uses column-major. We'll set elements accordingly:
            // [ r00 r01 r02 0
            //   r10 r11 r12 0
            //   r20 r21 r22 0
            //   0   0   0   1 ]
            threeMat.set(
              rm[0], rm[1], rm[2], 0,
              rm[3], rm[4], rm[5], 0,
              rm[6], rm[7], rm[8], 0,
              0,     0,     0,     1
            );

            // In OpenCV: +X rechts, +Y down, +Z forwards (camera view).
            // In three.js: +X right, +Y up, -Z forward.
            // Wir convertieren Position: invertiere y und z
            const tv = tvec.data32F; // [tx,ty,tz]
            const position = new THREE.Vector3(tv[0], -tv[1], -tv[2]);

            // Für Rotation benötigen wir eventuell eine Achsenspiegelung.
            // Erzeuge Quaternion aus dreiMat, dann spiegele Y und Z
            const quaternion = new THREE.Quaternion();
            quaternion.setFromRotationMatrix(threeMat);

            // Anpassung: da wir y und z in Position gespiegelt haben, müssen wir die Rotation anpassen:
            // Spiegelung um X-Achse (negiert Y & Z) -> multipliziere mit Quaternion, welche 180° um X dreht?
            // Einfacher: invertiere Y und Z Achse in der Matrix:
            const fix = new THREE.Matrix4().makeScale(1, -1, -1);
            threeMat.premultiply(fix);
            quaternion.setFromRotationMatrix(threeMat);

            // Update markerRoot
            markerRoot.position.copy(position);
            markerRoot.quaternion.copy(quaternion);
            markerRoot.visible = true;

            // Cleanups (MUST)
            objectPoints.delete(); imagePoints.delete(); cameraMat.delete();
            distCoeffs.delete(); rvec.delete(); tvec.delete(); rotMat.delete();
          } else {
            markerRoot.visible = false;
          }
        } else {
          markerRoot.visible = false;
        }
      } finally {
        // free mats
        corners.delete(); ids.delete(); rejected.delete();
        parameters.delete();
        gray.delete(); src.delete();
      }
    }
  </script>
</body>
</html>
