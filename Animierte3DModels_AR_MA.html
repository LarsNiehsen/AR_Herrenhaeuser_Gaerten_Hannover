<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Animierte 3D-Modelle mit Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            /* Verhindert versehentliches Wischen/Zoomen auf dem Smartphone */
            touch-action: none; 
        }
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
        }
        button {
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 5;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
            pointer-events: none;
        }

        /* --- NEUE UI ELEMENTE FÜR STEUERUNG --- */
        
        /* Das Steuerkreuz (Laufen) unten rechts */
        #walk-controls {
            position: absolute; 
            bottom: 30px; 
            right: 20px; 
            z-index: 10;
            /* Zu Beginn unsichtbar */
            display: none; 
            /* Gitter-Layout für die Tastenanordnung */
            grid-template-columns: 50px 50px 50px; 
            grid-template-rows: 50px 50px 50px; 
            gap: 5px;
        }
        
        /* Aussehen der einzelnen Lauf-Tasten */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.3); 
            border: 2px solid white; 
            border-radius: 50%;
            color: white; 
            font-size: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            user-select: none;
        }
        /* Roter Hintergrund beim Drücken */
        .ctrl-btn:active { background: rgba(255, 0, 0, 0.6); }
        
        /* Platzierung der Tasten im Gitter */
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* Der Höhen-Regler auf der linken Seite */
        #height-control {
            position: absolute; 
            top: 50%; 
            left: 20px; 
            transform: translateY(-50%); 
            z-index: 10;
            /* Zu Beginn unsichtbar */
            display: none; 
            flex-direction: column; 
            align-items: center;
        }
        #height-control span { 
            color: white; 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 14px; 
            text-shadow: 1px 1px 2px black;
        }
        /* Dreht den Höhen-Regler in die Senkrechte (ohne appearance) */
        input[type=range][orient=vertical] {
            writing-mode: bt-lr; 
            width: 8px; 
            height: 150px; 
            padding: 0 5px;
        }

        /* Der Rotations-Regler am unteren Bildschirmrand */
        #rotation-control {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10;
            /* Zu Beginn unsichtbar */
            display: none; 
            flex-direction: column; 
            align-items: center;
            background: rgba(0, 0, 0, 0.6); 
            padding: 15px 25px; 
            border-radius: 30px;
        }
        #rotation-control span { 
            color: white; 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 16px; 
        }
        #rotationSlider { 
            width: 45vw; 
            max-width: 250px; 
            margin: 0; 
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.133.0/build/three.module.js",
                "GLTFLoader": "https://unpkg.com/three@0.133.0/examples/jsm/loaders/GLTFLoader.js",
                "DeviceOrientationControls": "https://unpkg.com/three@0.133.0/examples/jsm/controls/DeviceOrientationControls.js"
            }
        }
    </script>
</head>
<body>

    <div id="ui">
        <button id="startButton">AR Starten</button>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <div id="container"></div>
    <div id="info">Lade Modelle...</div>

    <!-- NEUE HTML ELEMENTE FÜR STEUERUNG -->
    <!-- Steuerkreuz -->
    <div id="walk-controls">
        <div class="ctrl-btn" id="btn-up">⬆️</div>
        <div class="ctrl-btn" id="btn-left">⬅️</div>
        <div class="ctrl-btn" id="btn-right">➡️</div>
        <div class="ctrl-btn" id="btn-down">⬇️</div>
    </div>

    <!-- Höhen-Slider -->
    <div id="height-control">
        <span>Höhe</span>
        <input type="range" orient="vertical" id="heightSlider" min="0.1" max="3.0" step="0.1" value="1.6">
    </div>

    <!-- Drehen-Slider -->
    <div id="rotation-control">
        <span>⟲ Drehen ⟳</span>
        <input type="range" id="rotationSlider" min="-180" max="180" value="0">
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'GLTFLoader';
        import { DeviceOrientationControls } from 'DeviceOrientationControls';

        let camera, scene, renderer, controls;
        let staticModel, animatedModel, mixer;
        let clock = new THREE.Clock();

        // Speichert ab, welche Lauf-Tasten gerade gedrückt werden
        let moveState = { forward: false, backward: false, left: false, right: false };
        // Legt die Lauf-Geschwindigkeit fest
        const MOVE_SPEED = 0.05;

        const startButton = document.getElementById('startButton');
        const ui = document.getElementById('ui');
        const webcam = document.getElementById('webcam');
        const info = document.getElementById('info');

        // ---- MODELLE HIER DEFINIERT ----
        const URL_STATIC_MODEL = '3D_models/BorghesischerFechter_WebAR.glb';
        const URL_ANIMATED_MODEL = '3D_models/BorghesischerFechter_iPhone17Pro_animiert_JumpDown.glb';
        // --------------------------------

        startButton.addEventListener('click', async () => {
            // Sensoren-Anfrage (für iOS wichtig)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('Zugriff auf Gerätesensoren wurde verweigert.');
                        return;
                    }
                } catch (error) {
                    console.error('Fehler bei Sensoren-Freigabe:', error);
                }
            }

            // Kamera-Zugriff anfragen
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                webcam.srcObject = stream;
            } catch (error) {
                alert('Kamera konnte nicht gestartet werden.');
                console.error(error);
                return;
            }

            // Startbildschirm ausblenden
            ui.style.display = 'none';
            info.style.display = 'block';

            // Menüs einblenden (mit Sicherheits-Checks, falls HTML fehlt)
            const walkMenu = document.getElementById('walk-controls');
            if (walkMenu) walkMenu.style.display = 'grid';
            
            const heightMenu = document.getElementById('height-control');
            if (heightMenu) heightMenu.style.display = 'flex';
            
            const rotationMenu = document.getElementById('rotation-control');
            if (rotationMenu) rotationMenu.style.display = 'flex';

            // 3D-Welt aufbauen und Laufsteuerung aktivieren
            initThreeJS();
            setupVirtualWalking();
        });

        function initThreeJS() {
            const container = document.getElementById('container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000000);
            camera.position.set(0, 1.6, 0);

            // Renderer mit Schatten-Aktivierung
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Weiche Schattenränder
            container.appendChild(renderer.domElement);

            // --- BELEUCHTUNG UND SCHATTEN ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(ambientLight);

            // Licht links oben neben dem Modell (X=-3, Y=4, Z=-1)
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(-3, 4, -1);
            dirLight.castShadow = true;

            // Richtung des Lichts auf das Modell zielen (Z=-2)
            dirLight.target.position.set(0, 0, -2);
            scene.add(dirLight.target);

            // Schatten-Qualität und Bereich
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 15;
            dirLight.shadow.camera.left = -5;
            dirLight.shadow.camera.right = 5;
            dirLight.shadow.camera.top = 5;
            dirLight.shadow.camera.bottom = -5;
            dirLight.shadow.bias = -0.001; 
            scene.add(dirLight);

            // --- BODEN (RASTER & SCHATTEN-EMPFÄNGER) ---
            
            // 1. ShadowMaterial (Schatten auf dem Kamera-Hintergrund)
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); 
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            floorMesh.rotation.x = -Math.PI / 2; // Liegend
            floorMesh.position.y = 0;
            floorMesh.receiveShadow = true; // Boden empfängt den Schatten
            scene.add(floorMesh);

            // 2. Dünnes Meter-Raster
            const grid1m = new THREE.GridHelper(100, 100, 0x888888, 0x555555);
            grid1m.position.y = 0;
            scene.add(grid1m);

            // 3. Dickes 5-Meter-Raster (Rot)
            for (let xOffset = -0.02; xOffset <= 0.02; xOffset += 0.02) {
                for (let zOffset = -0.02; zOffset <= 0.02; zOffset += 0.02) {
                    const grid5m = new THREE.GridHelper(100, 20, 0xff0000, 0xff0000);
                    grid5m.position.set(xOffset, 0.01, zOffset);
                    scene.add(grid5m);
                }
            }

            // --- MODELLE LADEN ---
            const loader = new GLTFLoader();
            const modelScale = 200.0;

            // Aktiviert Schattenwurf für alle Mesh-Teile
            const enableShadows = (modelObj) => {
                modelObj.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true; 
                    }
                });
            };

            // Statisches Modell laden
            loader.load(URL_STATIC_MODEL, (gltf) => {
                staticModel = gltf.scene;
                staticModel.scale.set(modelScale, modelScale, modelScale);
                staticModel.position.set(0, 0, -2);
                
                enableShadows(staticModel); 
                scene.add(staticModel);

                info.innerText = 'Statisches Modell geladen. Lade animiertes...';

                // Animiertes Modell laden
                loader.load(URL_ANIMATED_MODEL, (gltfAnim) => {
                    animatedModel = gltfAnim.scene;
                    animatedModel.scale.set(modelScale, modelScale, modelScale);
                    animatedModel.position.set(0, 0, -2);
                    
                    enableShadows(animatedModel); 
                    animatedModel.visible = false; 
                    scene.add(animatedModel);

                    // Animation vorbereiten, aber nicht sofort starten
                    if (gltfAnim.animations && gltfAnim.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(animatedModel);
                        const action = mixer.clipAction(gltfAnim.animations[0]);
                        action.play();
                    }

                    info.innerText = '1. Modell drehen\n2. Modell antippen!';
                    setTimeout(() => info.style.display = 'none', 4000);
                }, undefined, (error) => {
                    console.error("Fehler beim Laden des animierten Modells", error);
                    info.innerText = 'Statisches Modell bereit. (Animiertes Modell nicht gefunden)';
                });

            }, undefined, (error) => {
                console.error("Fehler beim Laden des statischen Modells:", error);
                info.innerText = 'Fehler beim Laden des Modells!';
            });

            controls = new DeviceOrientationControls(camera);
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);

            // Höhen-Regler Logik (mit Sicherheits-Check)
            const hSlider = document.getElementById('heightSlider');
            if (hSlider) {
                hSlider.addEventListener('input', (e) => {
                    camera.position.y = parseFloat(e.target.value);
                });
            }

            // Rotations-Regler Logik (mit Sicherheits-Check)
            const rSlider = document.getElementById('rotationSlider');
            if (rSlider) {
                rSlider.addEventListener('input', (e) => {
                    // Grad in Radiant umrechnen
                    const radians = parseFloat(e.target.value) * (Math.PI / 180);
                    // Beide Modelle synchron drehen
                    if (staticModel) staticModel.rotation.y = radians;
                    if (animatedModel) animatedModel.rotation.y = radians;
                });
            }

            animate();
        }

        // --- STEUERUNGS-LOGIK ---
        function setupVirtualWalking() {
            // Hilfsfunktion zur Verbindung von Button und Lauf-Befehl
            const bindBtn = (id, action) => {
                const btn = document.getElementById(id);
                // Überspringt Fehler, falls der HTML-Button fehlt
                if (!btn) return;
                
                // Touch/Maus Events
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = true; }, {passive: false});
                btn.addEventListener('mousedown', (e) => { e.stopPropagation(); moveState[action] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = false; }, {passive: false});
                btn.addEventListener('mouseup', (e) => { e.stopPropagation(); moveState[action] = false; });
                btn.addEventListener('mouseleave', () => { moveState[action] = false; });
            };
            
            bindBtn('btn-up', 'forward');
            bindBtn('btn-down', 'backward');
            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');
        }

        // --- KLICK/TOUCH LOGIK ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            // Verhindert Klicks durch UI-Elemente hindurch
            if (event.target.className.includes('ctrl-btn') || event.target.tagName === 'INPUT' || event.target.closest('#rotation-control')) return;

            // Pixelkoordinaten umrechnen
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Klick auf statisches Modell prüfen
            if (staticModel && staticModel.visible) {
                const intersects = raycaster.intersectObject(staticModel, true);
                
                if (intersects.length > 0) {
                    // Statisches Modell ausblenden
                    staticModel.visible = false;
                    // Animiertes Modell einblenden
                    if (animatedModel) {
                        animatedModel.visible = true;
                    }
                    // Drehregler ausblenden
                    const rControl = document.getElementById('rotation-control');
                    if (rControl) rControl.style.display = 'none';
                }
            }
        }

        // --- LAUFEN BERECHNEN ---
        function applyMovement() {
            // Nichts tun, wenn keine Taste gedrückt ist
            if(!moveState.forward && !moveState.backward && !moveState.left && !moveState.right) return;
            
            // Blickrichtung der Kamera ermitteln
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            // Höhe ignorieren, damit man geradeaus läuft
            dir.y = 0; 
            dir.normalize();
            
            // Richtung für Seitwärtsbewegung ermitteln
            const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            // Kamera verschieben
            if (moveState.forward) camera.position.addScaledVector(dir, MOVE_SPEED);
            if (moveState.backward) camera.position.addScaledVector(dir, -MOVE_SPEED);
            if (moveState.left) camera.position.addScaledVector(right, -MOVE_SPEED);
            if (moveState.right) camera.position.addScaledVector(right, MOVE_SPEED);
        }

        // Fenstergröße anpassen
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Endlos-Zeichenschleife
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // Animation des Modells abspielen
            if (mixer && animatedModel && animatedModel.visible) {
                mixer.update(delta);
            }

            // Sensoren auslesen (Kameradrehung)
            if (controls) {
                controls.update();
            }

            // Gehen ausführen
            applyMovement();

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
