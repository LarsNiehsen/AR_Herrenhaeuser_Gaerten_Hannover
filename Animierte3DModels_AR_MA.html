    <!-- Hier beginnt das CSS, welches das Aussehen der HTML-Elemente definiert -->
    <style>
        /* Bezieht sich auf den gesamten sichtbaren Bereich (body) */
        body { 
            /* Entfernt den unsichtbaren Standard-Rand des Browsers */
            margin: 0; 
            /* Verhindert das Auftauchen von Scrollbalken */
            overflow: hidden; 
            /* Setzt die Hintergrundfarbe auf Schwarz (Hex-Code #000) */
            background-color: #000; 
            /* Setzt eine serifenlose Standardschriftart */
            font-family: sans-serif; 
            /* Deaktiviert Standard-Touch-Gesten wie das Zoomen mit zwei Fingern */

        }
        
        /* Gestaltet das Video-Element für das Live-Kamerabild */
        #webcam { 
            /* Positioniert das Video absolut im Fenster, unabhängig von anderen Elementen */
            position: absolute; 
            /* Setzt das Video ganz nach oben an den Rand */
            top: 0; 
            /* Setzt das Video ganz nach links an den Rand */
            left: 0; 
            /* Zwingt das Video, 100% der Bildschirmbreite einzunehmen */
            width: 100vw; 
            /* Zwingt das Video, 100% der Bildschirmhöhe einzunehmen */
            height: 100vh; 
            /* Schneidet das Video ab, falls das Seitenverhältnis nicht genau passt, ohne es zu verzerren */
            object-fit: cover;

        }
        
        /* Container für das virtuelle 3D-Bild (Three.js) */
        #container { 
            /* Wird ebenfalls absolut über das gesamte Fenster gelegt */
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            /* Legt das 3D-Bild eine Ebene ÜBER das Kamera-Video */
            z-index: 2; 
        }
        
        /* Startbildschirm, der vor der Kamera-Freigabe angezeigt wird */
        #ui { 
            /* Legt sich über den gesamten Bildschirm */
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            /* Legt dieses Menü ganz nach vorne (höchster z-index) */
            z-index: 20; 
            /* Nutzt Flexbox, um den Inhalt (den Start-Button) leicht zu zentrieren */
            display: flex; 
            /* Zentriert horizontal */
            justify-content: center; 
            /* Zentriert vertikal */

        }
        
        /* Das Aussehen des Start-Buttons */
        button.start { 
            /* Innenabstand (Padding): 15 Pixel oben/unten, 40 Pixel links/rechts */
            padding: 15px 40px; 
            /* Textgröße des Buttons */
            font-size: 20px;

            cursor: pointer;

        /* Ein kleines Textfeld, das Lade-Informationen anzeigt */
        #info {

            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: white; 
            /* Liegt über den 3D-Modellen, aber unter dem Startbildschirm */
            z-index: 5; 
            /* Halbtransparenter schwarzer Hintergrund zur besseren Lesbarkeit */
            background: rgba(0,0,0,0.5); 
            /* Innenabstand des Textes zum Rand */

        /* Container für die Steuerungs-Buttons (virtuelles Laufen) */
        #controls {
            /* Positioniert die Steuerung unten rechts auf dem Bildschirm */
            position: absolute;

            z-index: 10;
            /* Verwendet das CSS Grid-Layout (Kasten-Raster) zur Anordnung der Tasten */
            display: grid; 
            /* Definiert 3 Spalten mit je 50 Pixel Breite */
            grid-template-columns: 50px 50px 50px; 
            /* Definiert 3 Zeilen mit je 50 Pixel Höhe */
            grid-template-rows: 50px 50px 50px;

        /* Das Aussehen der einzelnen Richtungs-Tasten */
        .ctrl-btn {
            /* Leicht durchsichtiges Weiß als Hintergrund */
            background: rgba(255, 255, 255, 0.3); 
            /* Ein 2 Pixel dicker, durchgehender weißer Rahmen */

            display: flex;

        /* Wenn eine Taste aktiv gedrückt wird, ändert sich die Hintergrundfarbe zu Rot */
        .ctrl-btn:active { background: rgba(255, 0, 0, 0.6); }
        
        /* Platzierung der Tasten im Grid (Raster) */
        /* Pfeil-Hoch kommt in die mittlere Spalte (2), erste Zeile (1) */
        #btn-up { grid-column: 2; grid-row: 1; }
        /* Pfeil-Links kommt in die erste Spalte (1), zweite Zeile (2) */
        #btn-left { grid-column: 1; grid-row: 2; }
        /* Pfeil-Rechts kommt in die rechte Spalte (3), zweite Zeile (2) */

        /* Container für den Slider zur Kamera-Höhenverstellung */

            display: none;

        /* Styling für den Text über dem Höhen-Slider */
        #height-control span { 
            color: white; 
            /* Schwarzer Schatten, damit die weiße Schrift auf jedem Hintergrund lesbar ist */
            text-shadow: 1px 1px 2px black; 
            margin-bottom: 10px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 14px;
        }
        
        /* Spezielles Styling für den vertikalen Schieberegler (Slider) */
        input[type=range][orient=vertical] {
            /* Macht den Standard-Slider für verschiedene Browser vertikal */
            writing-mode: bt-lr; 
            -webkit-appearance: slider-vertical; 
            appearance: slider-vertical;

            height: 150px;

        }

        /* Container für den Slider zum Drehen des Modells */
        #rotation-control {
            /* Positioniert das Element unten, mittig */
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            /* Zentriert das Element exakt auf der eigenen Mitte */
            transform: translateX(-50%); 
            z-index: 10;
            display: none; 
            /* Ordnet Text und Regler untereinander an */
            flex-direction: column; 
            align-items: center;
            /* Hintergrundbox mit runden Ecken und Schatten */
            background: rgba(0, 0, 0, 0.6); 
            padding: 15px 25px; 
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        /* Styling des Textes für den Rotations-Slider */
        #rotation-control span {
            color: white; 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 16px; 
            /* Zieht die Buchstaben minimal auseinander */
            letter-spacing: 1px;
        }
        
        /* Styling des eigentlichen Rotations-Reglers */
        #rotationSlider {
            /* Setzt das Aussehen auf den Browser-Standard zurück */
            -webkit-appearance: auto;
            appearance: auto; 
            /* Nimmt 45% der Bildschirmbreite ein, aber maximal 250 Pixel */
            width: 45vw; 
            max-width: 250px; 
            margin: 0;
        }
    </style>
    
    <!-- Die "importmap" teilt dem Browser mit, woher er die Three.js Dateien laden soll -->

        {
            "imports": {

                "three": "https://unpkg.com/three@0.133.0/build/three.module.js",

                "GLTFLoader": "https://unpkg.com/three@0.133.0/examples/jsm/loaders/GLTFLoader.js",
                /* Erweiterung zum Auslesen der Smartphone-Rotations-Sensoren */
                "DeviceOrientationControls": "https://unpkg.com/three@0.133.0/examples/jsm/controls/DeviceOrientationControls.js"

</head>
<body>

    <!-- Der Container für das Start-Menü, der den Button enthält -->
    <div id="ui"><button class="start" id="startButton">AR Starten</button></div>

    <!-- Das Video-Element, welches den Live-Feed der Handy-Kamera abspielt. 
         "autoplay" startet es automatisch, "playsinline" verhindert den Vollbild-Videoplayer bei iOS -->
    <video id="webcam" autoplay playsinline></video>
    
    <!-- Der Bereich, in dem Three.js die 3D-Grafik zeichnen (rendern) wird -->
    <div id="container"></div>
    
    <!-- Informations-Textfeld oben links -->
    <div id="info">Lade Modelle...</div>

    <!-- Steuerelemente für das virtuelle Laufen (Steuerkreuz) -->
    <div id="controls">
        <div class="ctrl-btn" id="btn-up">⬆️</div>
        <div class="ctrl-btn" id="btn-left">⬅️</div>
        <div class="ctrl-btn" id="btn-right">➡️</div>
        <div class="ctrl-btn" id="btn-down">⬇️</div>
    </div>

    <!-- Steuerelement zur Höhenverstellung der Kamera -->
    <div id="height-control">
        <span>Höhe</span>
        <!-- type="range" erzeugt einen Schieberegler. Min=0.1, Max=3.0 Meter, Startwert=1.6 Meter -->
        <input type="range" orient="vertical" id="heightSlider" min="0.1" max="3.0" step="0.1" value="1.6">
    </div>

    <!-- Steuerelement zum Rotieren des Modells vor Animationsstart -->
    <div id="rotation-control">
        <span>⟲ Modell drehen ⟳</span>
        <!-- Der Slider geht von -180 Grad bis +180 Grad. Start bei 0. -->
        <input type="range" id="rotationSlider" min="-180" max="180" value="0">
    </div>

    <!-- Hier beginnt die eigentliche Logik für Three.js als JavaScript-Modul -->
    <script type="module">
        // Importiert die benötigten Funktionen aus den oben definierten Paketen
        import * as THREE from 'three';
        import { GLTFLoader } from 'GLTFLoader';
        import { DeviceOrientationControls } from 'DeviceOrientationControls';

        // Deklaration der globalen Variablen für die 3D-Umgebung
        let camera, scene, renderer, controls;
        // Variablen für die beiden Modelle (statisches und animiertes)
        let staticModel, animatedModel;
        // Der Mixer steuert das Abspielen von Animationen
        let mixer;
        // Die Uhr (Clock) wird benötigt, um Animationen gleichmäßig über die Zeit ablaufen zu lassen
        let clock = new THREE.Clock();

        // Hier werden die Dateipfade der 3D-Modelle definiert
        const URL_STATIC_MODEL = '3D_models/BorghesischerFechter_WebAR.glb';
        const URL_ANIMATED_MODEL = '3D_models/BorghesischerFechter_iPhone17Pro_animiert_JumpDown.glb';

        // Ein Objekt speichert ab, in welche Richtungen aktuell "gelaufen" wird
        let moveState = { forward: false, backward: false, left: false, right: false };
        // Legt fest, wie schnell gelaufen wird (in virtuellen Metern pro Bildaufbau/Frame)
        const MOVE_SPEED = 0.05;

        // Wartet auf den Klick auf den "AR Starten" Button
        // Es muss eine User-Aktion sein (Klick), weil Browser sonst den Kamera/Sensor-Zugriff aus Sicherheitsgründen blockieren
        document.getElementById('startButton').addEventListener('click', async () => {
            
            // Prüft, ob das Gerät die Erlaubnis für Bewegungssensoren (DeviceOrientation) abfragen muss (vorgeschrieben bei iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    // Fordert die Erlaubnis vom Nutzer an
                    const permission = await DeviceOrientationEvent.requestPermission();
                    // Wenn abgelehnt, wird eine Meldung gezeigt und abgebrochen
                    if (permission !== 'granted') { alert('Zugriff auf Sensoren verweigert.'); return; }
                } catch (e) { 
                    // Fängt Fehler bei der Sensorabfrage ab und schreibt sie in die Konsole
                    console.error('Sensoren Fehler:', e); 
                }
            }
            
            try {
                // Fragt beim Browser den Videostream der Handykamera (Rückseite: 'environment') an
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                // Weist den Videostream dem <video> HTML-Element als Quelle zu
                document.getElementById('webcam').srcObject = stream;
            } catch (e) {
                // Wenn keine Kamera gefunden wurde oder Zugriff abgelehnt ist
                alert('Kamera Fehler.'); return;
            }

            // Blendet den Startbildschirm aus
            document.getElementById('ui').style.display = 'none';
            // Blendet das Info-Feld ein
            document.getElementById('info').style.display = 'block';
            
            // Blendet alle Steuerungs-Elemente (Laufen, Höhe, Rotation) ein
            document.getElementById('controls').style.display = 'grid';
            document.getElementById('height-control').style.display = 'flex';
            document.getElementById('rotation-control').style.display = 'flex';

            // Startet die Funktion, die die gesamte 3D-Szene aufbaut
            initThreeJS();
            // Startet die Funktion, die die Buttons für das Laufen konfiguriert
            setupVirtualWalking();
        });

        // Die Hauptfunktion zum Vorbereiten der Three.js-Szene
        function initThreeJS() {
            // Holt das leere <div>, in das die 3D-Inhalte gezeichnet werden sollen
            const container = document.getElementById('container');
            
            // Erstellt eine neue, leere 3D-Szene
            scene = new THREE.Scene();

            // Erstellt eine Kamera, die Perspektive nutzt (wie ein menschliches Auge)
            // 55 ist das Sichtfeld (Field of View) in Grad, ähnlich wie bei Smartphone-Kameras
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000000);
            // Setzt die Startposition der Kamera auf X=0, Y=1.6 (Höhe in Metern), Z=0
            camera.position.set(0, 1.6, 0);

            // Erstellt den Renderer, der die 3D-Daten in 2D-Pixel für den Bildschirm umrechnet
            // alpha: true bedeutet, dass der Hintergrund durchsichtig ist (somit sieht man das Video dahinter)
            // antialias: true glättet Treppeneffekte an Kanten
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            // Setzt die Auflösung auf Fenstergröße
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Passt das Rendering an die Pixeldichte des Handys (z.B. Retina-Displays) an
            renderer.setPixelRatio(window.devicePixelRatio);
            // Aktiviert das Berechnen von Schatten
            renderer.shadowMap.enabled = true;
            // Nutzt eine Methode, um Schattenkanten weicher darzustellen
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            // Fügt das vom Renderer erzeugte 3D-Zeichenfeld (Canvas) in die HTML-Seite ein
            container.appendChild(renderer.domElement);

            // Fügt ein schwaches Umgebungslicht hinzu, damit nicht alles im Schatten pechschwarz ist
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            
            // Erstellt ein gerichtetes Licht (ähnlich wie Sonnenlicht) von links oben
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            // Positioniert das Licht bei X=-3 (Links), Y=4 (Oben), Z=-1 (Leicht vor dem Zentrum)
            dirLight.position.set(-3, 4, -1);
            // Erlaubt diesem Licht, Schatten zu werfen
            dirLight.castShadow = true;
            // Zielt mit dem Licht exakt auf die Stelle, wo das Modell steht (Z=-2)
            dirLight.target.position.set(0, 0, -2);
            // Fügt das Ziel des Lichts zur Szene hinzu
            scene.add(dirLight.target);

            // Definiert die Qualität und Ausdehnung der Schattenberechnung
            // Je höher MapSize, desto schärfer der Schatten
            dirLight.shadow.mapSize.width = 1024; 
            dirLight.shadow.mapSize.height = 1024;
            // Definiert den Bereich der virtuellen Kamera, die für den Schatten genutzt wird
            dirLight.shadow.camera.near = 0.5; 
            dirLight.shadow.camera.far = 15;
            dirLight.shadow.camera.left = -5; 
            dirLight.shadow.camera.right = 5;
            dirLight.shadow.camera.top = 5; 
            dirLight.shadow.camera.bottom = -5;
            // Vermeidet Grafikfehler (Schattenstreifen), indem der Schatten minimal versetzt wird
            dirLight.shadow.bias = -0.001; 
            // Fügt das fertige Licht der Szene hinzu
            scene.add(dirLight);

            // --- BODEN (Schattenfänger) ---
            // Erstellt eine ebene Fläche von 200x200 Metern
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            // ShadowMaterial ist ein spezielles Material, das an sich unsichtbar ist, aber dunkler wird, wenn Schatten darauf fallen
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.5 }); 
            // Kombiniert Form und Material zu einem 3D-Objekt (Mesh)
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            // Rotiert die Fläche um 90 Grad (-Pi/2), damit sie flach wie ein Boden liegt (standardmäßig steht sie aufrecht wie eine Wand)
            floorMesh.rotation.x = -Math.PI / 2;
            // Sagt der Fläche, dass sie aufprallende Schatten anzeigen soll
            floorMesh.receiveShadow = true;
            // Fügt den Boden zur Szene hinzu
            scene.add(floorMesh);

            // --- RASTER (Grid) ---
            // Erstellt ein dünnes Hilfs-Raster (100 Meter groß, in 100 Felder unterteilt, grau)
            const grid1m = new THREE.GridHelper(100, 100, 0x888888, 0x555555);
            scene.add(grid1m);

            // Da WebGL standardmäßig keine dicken Linien zeichnen kann, werden hier mehrere Linien leicht versetzt gezeichnet
            // Dies erzeugt den Effekt von dicken, roten Linien im 5-Meter-Abstand
            for (let xOffset = -0.02; xOffset <= 0.02; xOffset += 0.02) {
                for (let zOffset = -0.02; zOffset <= 0.02; zOffset += 0.02) {
                    // Erstellt ein rotes Raster (100 Meter groß, 20 Felder = alle 5 Meter ein Strich)
                    const grid5m = new THREE.GridHelper(100, 20, 0xff0000, 0xff0000);
                    // Setzt die Höhe auf Y=0.01, damit das rote Raster leicht über dem grauen liegt (verhindert Grafikflackern)
                    grid5m.position.set(xOffset, 0.01, zOffset);
                    scene.add(grid5m);
                }
            }

            // --- 3D MODELLE LADEN ---
            // Erstellt das Modul, das Dateien im GLTF/GLB-Format verarbeiten kann
            const loader = new GLTFLoader();
            // Bestimmt den genauen Skalierungsfaktor für das Modell laut Vorgabe
            const modelScale = 200.0;
            
            // Eine kleine Hilfsfunktion, die durch alle Bausteine eines 3D-Modells geht...
            const enableShadows = (obj) => { 
                obj.traverse((child) => { 
                    // ...und sobald ein sichtbares Element (Mesh) gefunden wird,
                    if (child.isMesh) { 
                        // ...darf dieses Schatten werfen
                        child.castShadow = true; 
                        // ...und Schatten von anderen Teilen auf sich selbst anzeigen (Selbstabschattung)
                        child.receiveShadow = true; 
                    } 
                }); 
            };

            // Lade das erste, statische Modell
            loader.load(URL_STATIC_MODEL, (gltf) => {
                // Nimmt die 3D-Szene aus der geladenen Datei
                staticModel = gltf.scene;
                // Skaliert das Modell auf die berechnete Größe für alle Achsen (X, Y, Z)
                staticModel.scale.set(modelScale, modelScale, modelScale);
                // Platziert das Modell 2 Meter vor der Kamera (Z = -2 bedeutet tief in den Bildschirm hinein)
                staticModel.position.set(0, 0, -2);
                // Wendet die Schatten-Hilfsfunktion auf dieses Modell an
                enableShadows(staticModel); 
                // Fügt das Modell sichtbar in die Spielwelt ein
                scene.add(staticModel);
                
                // Informiert den Nutzer, dass nun das animierte Modell im Hintergrund lädt
                document.getElementById('info').innerText = 'Lade animiertes Modell...';

                // Lädt direkt im Anschluss das animierte Modell
                loader.load(URL_ANIMATED_MODEL, (gltfAnim) => {
                    // Nimmt auch hier die geladene Szene
                    animatedModel = gltfAnim.scene;
                    // Gleiche Skalierung wie das statische Modell
                    animatedModel.scale.set(modelScale, modelScale, modelScale);
                    // Gleiche Startposition, also exakt ineinander stehend
                    animatedModel.position.set(0, 0, -2);
                    // Auch hier Schatten aktivieren
                    enableShadows(animatedModel); 
                    // WICHTIG: Dieses Modell wird zunächst komplett unsichtbar geschaltet
                    animatedModel.visible = false; 
                    scene.add(animatedModel);

                    // Prüft, ob in der Datei Animationen gespeichert sind
                    if (gltfAnim.animations && gltfAnim.animations.length > 0) {
                        // Der Mixer verbindet das Modell mit der Animationslogik
                        mixer = new THREE.AnimationMixer(animatedModel);
                        // Startet die allererste enthaltene Animation (Index 0), spielt sie aber versteckt ab
                        mixer.clipAction(gltfAnim.animations[0]).play();
                    }

                    // Informiert den Nutzer über die nächsten Schritte
                    document.getElementById('info').innerText = '1. Modell drehen\n2. Tippe das Modell an!';
                    // Lässt diesen Text nach 4 Sekunden automatisch verschwinden
                    setTimeout(() => document.getElementById('info').style.display = 'none', 4000);
                });
            });

            // Aktiviert die Verknüpfung der virtuellen Kamera mit den Gyro-Sensoren des Smartphones
            // Wenn man das Handy neigt, dreht sich die virtuelle Kamera mit
            controls = new DeviceOrientationControls(camera);
            
            // Reagiert auf Tipp-Gesten (Touch) auf dem gesamten Fenster
            window.addEventListener('pointerdown', onPointerDown);
            // Reagiert darauf, falls sich die Fenstergröße ändert (Handy wird gedreht)
            window.addEventListener('resize', () => { 
                // Passt das Seitenverhältnis der Kamera an
                camera.aspect = window.innerWidth / window.innerHeight; 
                // Aktualisiert die Berechnungen der Kamera
                camera.updateProjectionMatrix(); 
                // Passt auch die Größe des Renderers an das neue Fenster an
                renderer.setSize(window.innerWidth, window.innerHeight); 
            });

            // Reagiert darauf, wenn der seitliche Höhen-Slider bewegt wird
            document.getElementById('heightSlider').addEventListener('input', (e) => {
                // Liest den aktuellen Wert aus und weist ihn der Y-Position (Höhe) der Kamera zu
                camera.position.y = parseFloat(e.target.value);
            });

            // Reagiert darauf, wenn der untere Dreh-Slider bewegt wird
            document.getElementById('rotationSlider').addEventListener('input', (e) => {
                // Rechnet Grad-Angaben (-180 bis 180) in Radiant (Bogenmaß) um (mathematischer Standard für Three.js)
                const radians = parseFloat(e.target.value) * (Math.PI / 180);
                // Dreht das statische Modell um die Y-Achse
                if (staticModel) staticModel.rotation.y = radians;
                // Dreht das (noch unsichtbare) animierte Modell exakt identisch mit
                if (animatedModel) animatedModel.rotation.y = radians;
            });

            // Startet die Endlos-Schleife, die das Bild kontinuierlich neu zeichnet (meist 60 mal pro Sekunde)
            animate();
        }

        // Funktion zur Verknüpfung der HTML-Tasten mit dem Lauf-Mechanismus
        function setupVirtualWalking() {
            // Eine kleine Hilfsfunktion, die Touch/Maus-Ereignisse an eine spezifische Richtung bindet
            const bindBtn = (id, action) => {
                const btn = document.getElementById(id);
                // Wenn Finger die Taste berührt: Bewegung aktivieren
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = true; }, {passive: false});
                // Alternative für Klick mit einer Maus (falls man am PC testet)
                btn.addEventListener('mousedown', (e) => { e.stopPropagation(); moveState[action] = true; });
                // Wenn Finger angehoben wird: Bewegung stoppen
                btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); moveState[action] = false; }, {passive: false});
                // Maus losgelassen
                btn.addEventListener('mouseup', (e) => { e.stopPropagation(); moveState[action] = false; });
                // Maus verlässt das Button-Feld
                btn.addEventListener('mouseleave', () => { moveState[action] = false; });
            };
            
            // Verknüpft die entsprechenden Tasten mit den jeweiligen Laufrichtungen
            bindBtn('btn-up', 'forward'); 
            bindBtn('btn-down', 'backward');
            bindBtn('btn-left', 'left'); 
            bindBtn('btn-right', 'right');
        }

        // Der Raycaster sendet einen unsichtbaren Strahl in die 3D-Szene aus, um Klicks zu erkennen
        const raycaster = new THREE.Raycaster();
        // Speichert die Koordinaten, wo auf dem Bildschirm getippt wurde
        const mouse = new THREE.Vector2();

        // Wird aufgerufen, wenn auf den Bildschirm getippt oder geklickt wird
        function onPointerDown(event) {
            // Wenn man auf ein Steuerungs-Button oder einen Slider tippt, soll NICHT das Modell ausgelöst werden
            // Bricht in diesem Fall sofort ab (return)
            if(event.target.className.includes('ctrl-btn') || event.target.tagName === 'INPUT' || event.target.closest('#rotation-control')) return;

            // Rechnet die Bildschirm-Pixelkoordinaten in genormte Koordinaten (-1 bis +1) um
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            // Richtet den Strahl anhand der berechneten Koordinaten aus der Kameraposition aus
            raycaster.setFromCamera(mouse, camera);

            // Wenn das statische Modell geladen ist und aktuell sichtbar ist
            if (staticModel && staticModel.visible) {
                // Prüft, ob der ausgesandte Strahl das statische Modell schneidet (trifft)
                const intersects = raycaster.intersectObject(staticModel, true);
                
                // Wenn mindestens ein Teilstrich das Modell getroffen hat
                if (intersects.length > 0) {
                    // Macht das statische Modell unsichtbar
                    staticModel.visible = false;
                    // Macht stattdessen das animierte Modell sichtbar
                    if (animatedModel) animatedModel.visible = true;
                    
                    // Blendet das Slider-Menü zum Drehen des Modells aus, da die Animation gestartet wurde
                    document.getElementById('rotation-control').style.display = 'none';
                }
            }
        }

        // Berechnet jeden Frame, ob und wohin die Kamera bewegt werden soll (virtuelles Laufen)
        function applyMovement() {
            // Wenn keine einzige Taste gedrückt ist, direkt abbrechen
            if(!moveState.forward && !moveState.backward && !moveState.left && !moveState.right) return;
            
            // Berechnet die exakte Blickrichtung der Kamera im 3D-Raum
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            // Zwingt die Y-Bewegung auf 0, damit man nicht in den Himmel fliegen oder in den Boden sinken kann
            dir.y = 0; 
            // Normalisiert den Vektor (stellt sicher, dass die Länge exakt 1 ist)
            dir.normalize();
            
            // Berechnet den Vektor, der exakt nach "rechts" relativ zur Blickrichtung zeigt (Kreuzprodukt)
            const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            // Wenn Vorwärts gedrückt, verschiebt die Kamera entlang des Richtungsvektors mal der Laufgeschwindigkeit
            if (moveState.forward) camera.position.addScaledVector(dir, MOVE_SPEED);
            // Rückwärts: Das Gleiche mit Minus
            if (moveState.backward) camera.position.addScaledVector(dir, -MOVE_SPEED);
            // Links: Bewegt die Kamera entlang des Rechts-Vektors, aber negativ (nach links)
            if (moveState.left) camera.position.addScaledVector(right, -MOVE_SPEED);
            // Rechts: Entlang des Rechts-Vektors
            if (moveState.right) camera.position.addScaledVector(right, MOVE_SPEED);
        }

        // Diese Funktion läuft in einer Endlosschleife und zeichnet die Bilder (Animation Loop)
        function animate() {
            // Sagt dem Browser, dass er im nächsten freien Augenblick diese Funktion erneut ausführen soll
            requestAnimationFrame(animate);
            // Berechnet die Zeit, die seit dem letzten Bild vergangen ist
            const delta = clock.getDelta();
            
            // Wenn der Animationsmixer und das animierte Modell existieren und das Modell eingeblendet ist
            // Wird das Modell im Zeitverlauf weiterbewegt (die Knochen/Gelenke werden geupdatet)
            if (mixer && animatedModel && animatedModel.visible) mixer.update(delta);
            
            // Wenn die Sensorsteuerung geladen ist, wird die Kameradrehung auf das aktuelle Handyneigen angepasst
            if (controls) controls.update();
            
            // Prüft, ob die Lauf-Tasten gedrückt werden, und verschiebt die Kamera
            applyMovement();

            // Der eigentliche Zeichenbefehl: Erstellt das finale Bild aus Sicht der Kamera und packt es auf den Bildschirm
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
