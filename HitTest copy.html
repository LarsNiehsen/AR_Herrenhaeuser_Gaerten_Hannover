<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leichte ArUcoJS Erkennung</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        
        #container { position: relative; width: 100vw; height: 100vh; }
        
        /* Video und Canvas liegen exakt übereinander */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }

        #status {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.6); color: #0f0; padding: 10px;
            border: 1px solid #0f0; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="status">Starte Kamera...</div>

<div id="container">
    <video id="videoInput" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="canvasOutput"></canvas>
</div>

<!-- 
    Wir laden die js-aruco Bibliothek von Juan Mellado.
    Da es keine offizielle "minified" Datei gibt, laden wir die Source Files via RawGit.
-->
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
<script type="text/javascript" src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>

<script>
    let video = document.getElementById('videoInput');
    let canvas = document.getElementById('canvasOutput');
    let ctx = canvas.getContext('2d');
    let status = document.getElementById('status');

    let detector = null;
    let stream = null;

    // --- 1. KAMERA STARTEN (Pixel 8a Optimiert) ---
    async function startCamera() {
        // Pixel Handys mögen "environment" am liebsten
        const constraints = {
            video: { facingMode: "environment" },
            audio: false
        };

        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            // Erst wenn Video läuft, starten wir die Erkennung
            video.addEventListener('loadeddata', function() {
                // Canvas Größe anpassen
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // ArUcoJS Detector initialisieren
                detector = new AR.Detector();
                
                status.innerText = "System Bereit. Suche Marker ID 0...";
                requestAnimationFrame(tick);
            });

        } catch (err) {
            status.innerText = "Kamera Fehler: " + err.name;
            status.style.color = "red";
            // Fallback für PC/Mac Webcams, falls Environment fehlschlägt
            if(err.name === "OverconstrainedError") {
                navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                    video.srcObject = s;
                    video.play();
                });
            }
        }
    }

    // --- 2. ERKENNUNGSSCHLEIFE ---
    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            
            // Canvas an Video-Größe anpassen (falls Auflösung wechselt)
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            // 1. Bild vom Video auf Canvas zeichnen (für Bilddaten)
            // Hinweis: Wir malen das Video nicht sichtbar, wir holen nur Daten.
            // Die Linien malen wir direkt aufs transparente Canvas.
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Alles löschen
            
            // Um Bilddaten zu lesen, müssen wir das Video einmal "unsichtbar" in den Speicher zeichnen
            // Wir nutzen ein temporäres Canvas oder zeichnen und holen Daten:
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Wir löschen das Bild sofort wieder, damit wir nur die roten Linien sehen 
            // (und das Video-Element darunter sichtbar bleibt)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. DETEKTION
            try {
                var markers = detector.detect(imageData);
                drawCorners(markers);
            } catch (e) {
                console.log("Fehler bei Erkennung:", e);
            }
        }
        requestAnimationFrame(tick);
    }

    // --- 3. ZEICHNEN ---
    function drawCorners(markers) {
        if (markers.length > 0) {
            let foundID0 = false;

            markers.forEach(function(marker) {
                // Rote Linie um den Marker
                ctx.beginPath();
                
                // js-aruco gibt marker.corners als Array [{x,y}, ...] zurück
                ctx.moveTo(marker.corners[0].x, marker.corners[0].y);
                ctx.lineTo(marker.corners[1].x, marker.corners[1].y);
                ctx.lineTo(marker.corners[2].x, marker.corners[2].y);
                ctx.lineTo(marker.corners[3].x, marker.corners[3].y);
                ctx.closePath();
                
                ctx.lineWidth = 5;
                ctx.strokeStyle = "red";
                ctx.stroke();

                // ID schreiben
                ctx.fillStyle = "red";
                ctx.font = "bold 24px monospace";
                ctx.fillText("ID: " + marker.id, marker.corners[0].x, marker.corners[0].y - 10);

                if (marker.id === 0) foundID0 = true;
            });

            if(foundID0) {
                status.innerText = "MARKER ID 0 GEFUNDEN!";
                status.style.color = "#00ff00";
                status.style.borderColor = "#00ff00";
            } else {
                status.innerText = "Marker ID __ erkannt";
                status.style.color = "yellow";
            }
        } else {
            // Kein Marker
            status.innerText = "Suche ArUco Marker original ...";
            status.style.color = "#00ff00";
            status.style.borderColor = "#00ff00";
        }
    }

    // Start
    startCamera();

</script>

</body>
</html>
