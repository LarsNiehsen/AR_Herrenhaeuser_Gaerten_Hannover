<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Herrenhäuser Gärten - Virtueller Rundgang AR (GNSS)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Basis ArUco Bibliothek -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/js-aruco2@0.2.0/src/cv.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/js-aruco2@0.2.0/src/aruco.js"></script>
  
  <!-- ERGÄNZUNG: Notwendig für 3D Achsen Berechnung (SVD & POSIT) -->
  <script type="text/javascript" src="https://unpkg.com/js-aruco@0.1.0/src/svd.js"></script>
  <script type="text/javascript" src="https://unpkg.com/js-aruco@0.1.0/src/posit1.js"></script>

  <style>
    /* --- CSS DESIGN BEREICH --- */
    body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; color: white; }
    
    #bg-video {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 0; opacity: 0.6;
    }

    /* Canvas für ArUco Zeichnungen (Roter Rahmen & Achsen) */
    #aruco-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 50; pointer-events: none;
    }

    #ar-overlay-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .info-wrapper { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

    .info-box {
      background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 12px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; align-self: center; min-width: 280px; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    h1 { margin: 0 0 8px 0; font-size: 1.1rem; line-height: 1.3; white-space: normal; overflow-wrap: break-word; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; padding: 2px 0; }
    
    #status { color: #ccc; font-weight: bold; }
    .active-target { color: #4f4; font-weight: bold; } 

    #debug-console {
        font-family: monospace; font-size: 10px; color: #ffff00;
        background: rgba(0,0,0,0.8); padding: 5px; margin-top: 10px;
        text-align: left; white-space: pre-wrap; pointer-events: none;
        max-height: 80px; overflow: hidden; border-radius: 4px;
    }

    .button-wrapper { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

    .ar-btn {
        position: absolute; z-index: 200; color: white; padding: 12px 20px;
        border-radius: 30px; font-weight: bold; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px); pointer-events: auto; text-transform: uppercase;
        font-size: 12px; letter-spacing: 1px;
    }
    #closeBtn { top: 20px; right: 20px; background: rgba(200, 40, 40, 0.85); }
    #resetBtn { bottom: 30px; right: 20px; background: rgba(40, 40, 40, 0.8); }

    .controls-wrapper {
      position: absolute; bottom: 100px; left: 0; width: 100%;
      display: none; 
      justify-content: center; gap: 40px; pointer-events: none;
      z-index: 300;
    }
    .rotate-btn {
      width: 75px; height: 75px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.6);
      color: white; font-size: 32px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; pointer-events: auto;
      backdrop-filter: blur(10px); user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .rotate-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }

    #direction-indicator {
        position: absolute; bottom: 30px; left: 20px; width: 80px; height: 80px;
        background: rgba(0,0,0,0.4); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
        display: none; justify-content: center; align-items: center; pointer-events: none;
        backdrop-filter: blur(5px); z-index: 400;
    }
    #arrow {
        width: 0; height: 0; 
        border-left: 15px solid transparent; border-right: 15px solid transparent;
        border-bottom: 30px solid white; transform-origin: center center;
    }
  </style>
</head>
<body>
  
  <video id="bg-video" autoplay muted playsinline></video>
  <canvas id="aruco-canvas"></canvas>

  <div id="ar-overlay-container">
      <div id="direction-indicator">
          <div id="arrow"></div>
      </div>

      <div class="button-wrapper">
          <button id="closeBtn" class="ar-btn">✕ Schließen</button>
          <button id="resetBtn" class="ar-btn">↺ Neustart</button>
      </div>

      <div class="controls-wrapper" id="rotation-controls">
          <div class="rotate-btn" id="rotateLeft">←</div>
          <div class="rotate-btn" id="rotateRight">→</div>
      </div>

      <div class="info-wrapper">
        <div class="info-box">
          <h1>Herrenhäuser Gärten - Virtueller Rundgang AR</h1>
          <p id="msg">Initialisiere Anwendung...</p>
          <p>Nächstes Ziel: <span id="targetName">Wird berechnet...</span></p>
          <p>Entfernung: <span id="dist">-</span> Meter</p>
          <p>Ausrichtung: <span id="rotationDisplay">-</span>°</p>
          <p>Status: <span id="status">Warte auf GNSS-Signal...</span></p>
          <div id="debug-console">Lade Systemkomponenten...</div>
        </div>
      </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- KONFIGURATION DER ORTE ---
    const LOCATIONS = [
        {
        title: 'Niederdeutscher Blumengarten',
        lat: 52.388194, 
        lon: 9.697861,
        url: '3D_models/Statue_3D.glb', 
        infoText: 'Sandsteinstatue "Veritas" von 1730',
        link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Gro%C3%9Fer-Garten/Der-Niederdeutsche-Blumengarten',
        rotation: 215,
        object3D: null,
        infoSprite: null,
        loaded: false,
        locked: false,
        arucoId: 1 
      },
      {
        title: 'Borghesischer Fechter',
        lat: 52.389472, 
        lon: 9.699222,
        url: '3D_models/BorghesischerFechter_3D.glb', 
        infoText: 'Borghesischer Fechter',
        link: 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen',
        rotation: 295,
        object3D: null,
        infoSprite: null,
        loaded: false,
        locked: false,
        arucoId: 2 
      },
      {
        title: 'Große Fontäne',
        lat: 52.385968,
        lon: 9.695931,
        url: '3D_models/GrosseFontaine.glb',
        infoText: 'Große Fontäne',
        link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
        rotation: 180, 
        object3D: null,
        infoSprite: null,
        loaded: false,
        locked: false,
        isAnimated: true, 
        arucoId: 3 
      },
      {
        title: 'Große Fontäne',
        lat: 52.388754,
        lon: 9.817867,
        url: '3D_models/GrosseFontaine.glb',
        infoText: 'Große Fontäne',
        link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
        rotation: 180, 
        object3D: null,
        infoSprite: null,
        loaded: false,
        locked: false,
        isAnimated: true
      }
    ];

    // --- EINSTELLUNGEN ---
    const VISIBILITY_DISTANCE = 75.0; 
    const LOCK_DISTANCE = 0.5; 
    const TARGET_HEIGHT = 3.0; 
    const DEFAULT_ROTATION = 180; 

    // Globale Variablen für Three.js
    let camera, scene, renderer, raycaster;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let positionHistory = []; 
    const MAX_HISTORY = 5; 
    let modelsReady = false;
    let gnssReady = false;
    let closestLocRef = null;

    // ArUco Variablen
    let arucoDetector = null;
    let arucoCanvas, arucoCtx;
    let posit = null; // Für 3D Pose

    let waterParticles = null;

    start2DCamera(); 
    init();
    animate();

    function start2DCamera() {
        const video = document.getElementById('bg-video');
        arucoCanvas = document.getElementById('aruco-canvas');
        arucoCtx = arucoCanvas.getContext('2d');

        // ArUco Initialisierung
        if (window.AR) {
            console.log("Initialisiere ArUco...");
            arucoDetector = new AR.Detector({
                dictionaryName: 'ARUCO_MIP_36h12',
                maxHammingDistance: 2
            });
            // POSIT Initialisierung (Modellgröße z.B. 35mm, Brennweite = Canvas Breite)
            // Hinweis: Falls POSIT Script nicht lädt, wird das hier übersprungen
            if (typeof POSIT !== 'undefined') {
                posit = new POSIT(35, video.videoWidth); 
            }
            requestAnimationFrame(processArucoVideo);
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(err) {
                console.error("Kamera-Zugriff verweigert:", err);
            });
        }
    }

    // --- ARUCO VERARBEITUNGSSCHLEIFE ---
    function processArucoVideo() {
        const video = document.getElementById('bg-video');
        
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Canvas Größe an Video anpassen
            if (arucoCanvas.width !== video.videoWidth || arucoCanvas.height !== video.videoHeight) {
                arucoCanvas.width = video.videoWidth;
                arucoCanvas.height = video.videoHeight;
                // POSIT Focal length aktualisieren wenn sich Größe ändert
                if(posit) posit.focalLength = video.videoWidth;
            }

            try {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                
                const markers = arucoDetector.detect(imageData);
                
                arucoCtx.clearRect(0, 0, arucoCanvas.width, arucoCanvas.height);

                drawMarkers(markers);
                handleArucoLogic(markers);

            } catch (e) {
                // Fehler ignorieren
            }
        }
        requestAnimationFrame(processArucoVideo);
    }

    // Zeichnet rote Rahmen und 3D Achsen
    function drawMarkers(markers) {
        if (!markers || markers.length === 0) return;

        markers.forEach(marker => {
            const corners = marker.corners;
            
            // 1. Roter Rahmen um den Marker
            arucoCtx.strokeStyle = "red";
            arucoCtx.lineWidth = 3;
            arucoCtx.beginPath();
            arucoCtx.moveTo(corners[0].x, corners[0].y);
            arucoCtx.lineTo(corners[1].x, corners[1].y);
            arucoCtx.lineTo(corners[2].x, corners[2].y);
            arucoCtx.lineTo(corners[3].x, corners[3].y);
            arucoCtx.closePath();
            arucoCtx.stroke();

            // 2. ID Text
            arucoCtx.fillStyle = "red";
            arucoCtx.font = "bold 20px sans-serif";
            arucoCtx.fillText("ID: " + marker.id, corners[0].x, corners[0].y - 15);

            // 3. 3D Achsen Zeichnen (X=Rot, Y=Grün, Z=Blau)
            if (posit) {
                drawAxis(marker);
            }
        });
    }

    // Berechnet und zeichnet die 3D Achsen
    function drawAxis(marker) {
        const pose = posit.pose(marker.corners);
        const rotation = pose.bestRotation;
        const translation = pose.bestTranslation;
        const center = {x: 0, y: 0, z: 0};
        const xAxis = {x: 35/2, y: 0, z: 0}; // Länge der Achsen (halbe Markergröße)
        const yAxis = {x: 0, y: 35/2, z: 0};
        const zAxis = {x: 0, y: 0, z: -35/2};

        const center2D = project(center, rotation, translation);
        const x2D = project(xAxis, rotation, translation);
        const y2D = project(yAxis, rotation, translation);
        const z2D = project(zAxis, rotation, translation);

        if(!center2D || !x2D || !y2D || !z2D) return;

        arucoCtx.lineWidth = 3;

        // X-Achse (Rot)
        arucoCtx.strokeStyle = "red";
        arucoCtx.beginPath();
        arucoCtx.moveTo(center2D.x, center2D.y);
        arucoCtx.lineTo(x2D.x, x2D.y);
        arucoCtx.stroke();

        // Y-Achse (Grün)
        arucoCtx.strokeStyle = "#0f0";
        arucoCtx.beginPath();
        arucoCtx.moveTo(center2D.x, center2D.y);
        arucoCtx.lineTo(y2D.x, y2D.y);
        arucoCtx.stroke();

        // Z-Achse (Blau)
        arucoCtx.strokeStyle = "blue";
        arucoCtx.beginPath();
        arucoCtx.moveTo(center2D.x, center2D.y);
        arucoCtx.lineTo(z2D.x, z2D.y);
        arucoCtx.stroke();
    }

    // Hilfsfunktion: 3D Punkt auf 2D Screen projizieren
    function project(point, r, t) {
        const x = point.x, y = point.y, z = point.z;
        const focalLength = arucoCanvas.width; // Annahme: Focal Length = Breite
        const canvasWidth = arucoCanvas.width;
        const canvasHeight = arucoCanvas.height;

        // Rotation + Translation
        const x2 = x * r[0][0] + y * r[0][1] + z * r[0][2] + t[0];
        const y2 = x * r[1][0] + y * r[1][1] + z * r[1][2] + t[1];
        const z2 = x * r[2][0] + y * r[2][1] + z * r[2][2] + t[2];

        if (z2 <= 0) return null; // Hinter der Kamera

        // Projektion
        const x3 = (x2 * focalLength) / z2;
        const y3 = (y2 * focalLength) / z2;

        return {
            x: x3 + canvasWidth / 2,
            y: -y3 + canvasHeight / 2
        };
    }

    function handleArucoLogic(markers) {
        if (!markers || markers.length === 0) return;

        markers.forEach(marker => {
            const id = marker.id;
            
            if (id === 0) {
                if (!gnssReady) {
                    gnssReady = true;
                    document.getElementById('status').innerText = "Scan ID 0: Startposition fixiert";
                    document.getElementById('status').style.color = "#4f4";
                    checkReadyStatus();
                    logToDebug("ArUco ID 0 erkannt: Kalibrierung/Start.");
                }
            }
            else if (id >= 1 && id <= 3) {
                const targetLoc = LOCATIONS.find(l => l.arucoId === id);
                if (targetLoc && targetLoc.loaded) {
                    if (!targetLoc.locked) {
                        targetLoc.locked = true;
                        targetLoc.object3D.visible = true;
                        document.getElementById('targetName').innerText = targetLoc.title;
                        document.getElementById('status').innerText = "Marker ID " + id + " erkannt!";
                        document.getElementById('status').style.color = "#4f4";
                        logToDebug("ArUco ID " + id + " erkannt: " + targetLoc.title + " aktiviert.");
                    }
                }
            }
        });
    }

    function createWaterEffect() {
        const geometry = new THREE.BufferGeometry();
        const count = 500;
        const positions = new Float32Array(count * 3);
        const velocities = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = 0;
            positions[i * 3 + 2] = 0;
            velocities[i * 3] = (Math.random() - 0.5) * 0.1; 
            velocities[i * 3 + 1] = Math.random() * 0.3 + 0.2; 
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.1; 
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            color: 0x88ccff,
            size: 0.1,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geometry, material);
        points.userData.velocities = velocities;
        return points;
    }

    function updateWaterEffect(points) {
        const positions = points.geometry.attributes.position.array;
        const velocities = points.userData.velocities;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
            positions[i * 3] += velocities[i * 3];
            positions[i * 3 + 1] += velocities[i * 3 + 1];
            positions[i * 3 + 2] += velocities[i * 3 + 2];
            velocities[i * 3 + 1] -= 0.01;
            if (positions[i * 3 + 1] < 0) {
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = 0;
                velocities[i * 3] = (Math.random() - 0.5) * 0.05;
                velocities[i * 3 + 1] = Math.random() * 0.3 + 0.2;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05;
            }
        }
        points.geometry.attributes.position.needsUpdate = true;
    }

    function createInfoWindow(text) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;
        context.fillStyle = 'rgba(0, 0, 0, 0.7)';
        roundRect(context, 0, 0, 512, 128, 20, true, false);
        context.font = 'bold 26px sans-serif';
        context.fillStyle = 'white';
        context.textAlign = 'center';
        context.fillText(text, 256, 75); 
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(2.0, 0.5, 1);
        sprite.position.y = 3.5; 
        sprite.name = "info_sprite"; 
        return sprite;
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);
      raycaster = new THREE.Raycaster();

      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 4);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(0, 20, 10);
      scene.add(dirLight);

      const reticleGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0x44ff44 }); 
      const reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false; 
      scene.add(reticle);
      window.arReticle = reticle; 

      const loader = new GLTFLoader();
      let loadedCount = 0;
      
      LOCATIONS.forEach((loc) => {
        const group = new THREE.Group();
        group.visible = false; 
        scene.add(group);
        loc.object3D = group; 

        loader.load(loc.url, (gltf) => {
          const model = gltf.scene;
          
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          let scaleFactor = size.y > 0 ? TARGET_HEIGHT / size.y : 1.0;
          model.scale.set(scaleFactor, scaleFactor, scaleFactor);
          
          const scaledBox = new THREE.Box3().setFromObject(model);
          const minY = scaledBox.min.y;
          model.position.y -= minY; 
          
          const rotationToUse = loc.rotation !== undefined ? loc.rotation : DEFAULT_ROTATION;
          model.rotation.y = THREE.MathUtils.degToRad(rotationToUse);
          
          group.add(model);
          
          if (loc.isAnimated) {
              waterParticles = createWaterEffect();
              group.add(waterParticles);
          }

          const info = createInfoWindow(loc.infoText);
          group.add(info);
          loc.infoSprite = info;
          
          loc.loaded = true;
          loadedCount++;
          if (loadedCount === LOCATIONS.length) {
              modelsReady = true;
              checkReadyStatus();
          }
        }, undefined, (err) => {
            logToDebug(`Ladefehler bei ${loc.title}`);
        });
      });

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor'); 
      container.appendChild(renderer.domElement);

      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'dom-overlay'],
        domOverlay: { root: document.getElementById('ar-overlay-container') } 
      });
      
      btn.addEventListener('click', () => {
          const video = document.getElementById('bg-video');
          if(video) {
              video.style.opacity = '0'; 
          }
          document.getElementById('rotation-controls').style.display = 'flex';
          document.getElementById('direction-indicator').style.display = 'flex';
      });
      
      document.body.appendChild(btn);

      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      document.getElementById('rotateLeft').addEventListener('pointerdown', () => changeRotation(-5));
      document.getElementById('rotateRight').addEventListener('pointerdown', () => changeRotation(5));
      
      document.getElementById('closeBtn').addEventListener('click', async () => {
          const session = renderer.xr.getSession();
          if (session) await session.end();
          window.close(); 
      });
      
      document.getElementById('resetBtn').addEventListener('click', () => location.reload());

      startGNSS();
      window.addEventListener('resize', onWindowResize);
    }

    function checkReadyStatus() {
        if (modelsReady && gnssReady) {
            updateUI("GNSS ist aktiv");
            document.getElementById('debug-console').innerText = "System bereit. Objekte sichtbar ab " + VISIBILITY_DISTANCE + "m.";
        }
    }

    function onSelect() {
        raycaster.setFromCamera({ x: 0, y: 0 }, camera);
        LOCATIONS.forEach(loc => {
            if (loc.object3D && loc.object3D.visible) {
                const intersects = raycaster.intersectObjects(loc.object3D.children, true);
                if (intersects.length > 0) {
                    console.log("Objekt getroffen: " + loc.title);
                    if(loc.link) {
                        window.open(loc.link, '_blank');
                    }
                }
            }
        });
    }

    function changeRotation(delta) {
        if(!closestLocRef || !closestLocRef.object3D) return;
        const model = closestLocRef.object3D.children.find(child => child.type === 'Group' || child.type === 'Scene'); 
        if(model) {
            model.rotation.y += THREE.MathUtils.degToRad(delta);
            const deg = Math.round(THREE.MathUtils.radToDeg(model.rotation.y) % 360);
            document.getElementById('rotationDisplay').innerText = deg;
        }
    }

    function startGNSS() {
      if (!navigator.geolocation) {
          updateUI("GNSS nicht unterstützt", "error");
          return;
      }
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        positionHistory.push({ lat, lon });
        if (positionHistory.length > MAX_HISTORY) positionHistory.shift();
        let avgLat = 0, avgLon = 0;
        positionHistory.forEach(p => { avgLat += p.lat; avgLon += p.lon; });
        avgLat /= positionHistory.length;
        avgLon /= positionHistory.length;

        if (!gnssReady) {
            gnssReady = true;
            document.getElementById('status').innerText = "GNSS aktiv"; 
            checkReadyStatus();
        }

        let closestDist = 99999;
        let closestLoc = null;

        LOCATIONS.forEach(loc => {
            const dist = haversineDist(avgLat, avgLon, loc.lat, loc.lon);
            const offset = calcOffset(avgLat, avgLon, loc.lat, loc.lon);
            
            if (dist < closestDist) {
                closestDist = dist;
                closestLoc = loc;
                closestLocRef = loc;
            }

            if (dist < VISIBILITY_DISTANCE) {
                if (dist < LOCK_DISTANCE && loc.loaded && window.arReticle && window.arReticle.visible) {
                    if (!loc.locked) {
                        loc.locked = true;
                        document.getElementById('status').innerText = "Objektposition fixiert";
                        document.getElementById('status').style.color = "#4f4";
                    }
                } else if (!loc.locked) {
                    loc.object3D.position.x = offset.x;
                    loc.object3D.position.z = offset.z;
                }
                loc.object3D.visible = true;
            } else {
                if(!loc.locked) {
                    loc.object3D.visible = false;
                }
            }
        });

        let debugMsg = `GNSS: ${avgLat.toFixed(6)}, ${avgLon.toFixed(6)} (±${Math.round(acc)}m)\n`;
        if (closestLoc) {
            document.getElementById('targetName').innerText = closestLoc.title;
            document.getElementById('dist').innerText = Math.round(closestDist);
            
            if(closestLoc.object3D && closestLoc.object3D.children[0]) {
                 const model = closestLoc.object3D.children.find(c => c.type === 'Group' || c.type === 'Scene');
                 if(model) {
                    const deg = Math.round(THREE.MathUtils.radToDeg(model.rotation.y) % 360);
                    document.getElementById('rotationDisplay').innerText = deg;
                 }
            }
            debugMsg += `Nächstes Ziel: ${closestLoc.title} (${Math.round(closestDist)}m)`;
        }
        document.getElementById('debug-console').innerText = debugMsg;

      }, (err) => {
          logToDebug("GNSS-Signal verloren.");
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          const reticle = window.arReticle;

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const refSpace = renderer.xr.getReferenceSpace();
            const hitPose = hit.getPose(refSpace);

            if (hitPose) {
               const normalY = hitPose.transform.matrix[5]; 
               if (normalY > 0.9) { 
                   reticle.visible = true;
                   reticle.matrix.fromArray(hitPose.transform.matrix);
                   
                   const hitPos = hitPose.transform.position;
                   LOCATIONS.forEach(loc => {
                       if (loc.object3D && loc.object3D.visible && !loc.locked) {
                           loc.object3D.position.y = THREE.MathUtils.lerp(loc.object3D.position.y, hitPos.y, 0.1);
                       }
                   });
               } else {
                   reticle.visible = false;
               }
            }
          } else {
              reticle.visible = false;
          }
        }

        if (waterParticles && waterParticles.parent && waterParticles.parent.visible) {
            updateWaterEffect(waterParticles);
        }

        if (closestLocRef && closestLocRef.object3D) {
            const camPos = new THREE.Vector3();
            camera.getWorldPosition(camPos);
            const targetPos = new THREE.Vector3();
            closestLocRef.object3D.getWorldPosition(targetPos);
            
            const dx = targetPos.x - camPos.x;
            const dz = targetPos.z - camPos.z;
            const bearingToTarget = Math.atan2(dx, dz);
            
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const camBearing = Math.atan2(forward.x, forward.z);
            
            const arrowRotation = bearingToTarget - camBearing;
            document.getElementById('arrow').style.transform = `rotate(${arrowRotation}rad)`;
        }
      }
      renderer.render(scene, camera);
    }

    function logToDebug(text) {
        const el = document.getElementById('debug-console');
        if (el) el.innerText = text + "\n" + el.innerText.substring(0, 200);
    }

    function calcOffset(lat1, lon1, lat2, lon2) {
      const R = 6378137; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const dx = dLon * Math.cos(lat1Rad) * R;
      const dz = -dLat * R; 
      return { x: dx, z: dz };
    }

    function haversineDist(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const rad = Math.PI/180;
      const dLat = (lat2-lat1)*rad;
      const dLon = (lon2-lon1)*rad;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateUI(txt, type="normal") {
      const el = document.getElementById('msg');
      if(el) {
          el.innerText = txt;
          el.style.color = type === "error" ? "red" : "#ccc";
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }
  </script>
