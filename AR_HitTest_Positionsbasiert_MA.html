<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Herrenhäuser Gärten - markerloses AR</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <style>
    body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; color: white; }
    
    #ar-overlay-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .info-wrapper { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

    .info-box {
      background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; align-self: center; min-width: 250px; text-align: center;
    }
    
    h1 { margin: 0 0 5px 0; font-size: 1.1rem; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; }
    #status { color: #888; font-weight: bold; }
    .active-target { color: #4f4; } 

    .button-wrapper { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

    .ar-btn {
        position: absolute; z-index: 200; color: white; padding: 12px 20px;
        border-radius: 30px; font-weight: bold; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px); pointer-events: auto; text-transform: uppercase;
        font-size: 12px; letter-spacing: 1px;
    }
    #closeBtn { top: 20px; right: 20px; background: rgba(200, 40, 40, 0.85); }
    #camBtn { bottom: 30px; right: 20px; background: rgba(40, 40, 40, 0.8); }
  </style>
</head>
<body>
  
  <div id="ar-overlay-container">
      <div class="button-wrapper">
          <button id="closeBtn" class="ar-btn">✕ Schließen</button>
          <button id="camBtn" class="ar-btn">📷 Kamera</button>
      </div>
      <div class="info-wrapper">
        <div class="info-box">
          <h1>Herrenhäuser Gärten - Virtueller Rundgang in AR</h1>
          <p id="msg">Initialisiere...</p>
          <p>Nächstes Ziel: <span id="targetName">-</span></p>
          <p>Distanz: <span id="dist">-</span> m</p>
          <p>Status: <span id="status">Warte auf GPS</span></p>
        </div>
      </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- EINSTELLUNGEN ---
    const LOCATIONS = [
      {
        title: 'Erste Statue',
        lat: 52.388754, 
        lon: 9.817867,
        url: './3D_models/Statue_3D.glb', 
        scale: 1.5, // HIER ERHÖHT: Falls Modell zu klein war
        rotation: 0, 
        object3D: null 
      },
      {
        title: 'Borghesischer Fechter',
        lat: 52.389472, 
        lon: 9.699222,
        url: './3D_models/BorghesischerFechter_3D.glb', 
        scale: 1.5, // HIER ERHÖHT
        rotation: 180, 
        object3D: null
      }
    ];

    const VISIBILITY_DISTANCE = 50.0; // Sicherstellen, dass es früh genug sichtbar ist
    const FREEZE_DISTANCE_METERS = 10.0; 

    // Globale Variablen
    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let positionHistory = []; 
    const MAX_HISTORY = 5; // Weniger History für schnellere Reaktion
    let isPositionLocked = false; 

    init();
    animate();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

      // Licht verstärken, falls Modelle schwarz sind
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(0, 10, 5);
      scene.add(dirLight);

      // --- MODELLE LADEN ---
      const loader = new GLTFLoader();
      
      LOCATIONS.forEach((loc, index) => {
        const group = new THREE.Group();
        group.visible = false; 
        scene.add(group);
        loc.object3D = group; 

        // 1. DEBUG WÜRFEL (Rote Box)
        // Falls das Modell nicht lädt, sieht man zumindest diesen roten Würfel!
        const debugBox = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1), // 1 Meter groß
            new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true })
        );
        debugBox.position.y = 0.5; // Auf den Boden setzen
        group.add(debugBox);
        // -----------------------

        loader.load(loc.url, (gltf) => {
          // Wenn Modell geladen: Rote Box entfernen (oder verstecken)
          debugBox.visible = false;

          const model = gltf.scene;
          model.scale.set(loc.scale, loc.scale, loc.scale);
          model.rotation.y = loc.rotation * (Math.PI / 180);
          group.add(model);
          
          console.log(`${loc.title} erfolgreich geladen.`);
          
          if(index === LOCATIONS.length - 1) {
             updateUI("Daten geladen. Prüfe Standort...", "normal");
          }
        }, undefined, (err) => {
          console.error(`Fehler bei ${loc.title}:`, err);
          updateUI(`Ladefehler: ${loc.title} (siehe Konsole)`, "error");
          // Rote Box bleibt sichtbar als Fallback
        });
      });

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor'); 
      container.appendChild(renderer.domElement);

      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'dom-overlay'],
        domOverlay: { root: document.getElementById('ar-overlay-container') } 
      });
      document.body.appendChild(btn);

      // Buttons
      document.getElementById('closeBtn').addEventListener('click', async () => {
          const session = renderer.xr.getSession();
          if (session) await session.end();
          try { window.close(); } catch(e) {}
          window.history.back();
      });
      document.getElementById('camBtn').addEventListener('click', () => {
          setTimeout(() => location.reload(), 300);
      });

      startGPS();
      window.addEventListener('resize', onWindowResize);
    }

    function startGPS() {
      if (!navigator.geolocation) {
        updateUI("GPS Fehler: Nicht unterstützt", "error");
        return;
      }
      
      navigator.geolocation.watchPosition((pos) => {
        // FIX: Text aktualisieren, sobald GPS da ist
        const msgEl = document.getElementById('msg');
        if(msgEl.innerText.includes("Warte") || msgEl.innerText.includes("Prüfe")) {
            updateUI("GPS Signal aktiv. Suche Ziele...", "normal");
        }

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        positionHistory.push({ lat, lon });
        if (positionHistory.length > MAX_HISTORY) positionHistory.shift();

        let avgLat = 0, avgLon = 0;
        positionHistory.forEach(p => { avgLat += p.lat; avgLon += p.lon; });
        avgLat /= positionHistory.length;
        avgLon /= positionHistory.length;

        let closestDist = 99999;
        let closestLoc = null;

        LOCATIONS.forEach(loc => {
            if (!loc.object3D) return;

            const dist = haversineDist(avgLat, avgLon, loc.lat, loc.lon);
            
            if (dist < closestDist) {
                closestDist = dist;
                closestLoc = loc;
            }

            // Sichtbarkeitsprüfung
            if (dist < VISIBILITY_DISTANCE) {
                if (!isPositionLocked) {
                    const offset = calcOffset(avgLat, avgLon, loc.lat, loc.lon);
                    loc.object3D.position.x = offset.x;
                    loc.object3D.position.z = offset.z;
                }
                loc.object3D.visible = true;
                
                // Debug Ausgabe in der Konsole wenn sichtbar
                // console.log("Objekt sichtbar bei Distanz:", dist);

            } else {
                loc.object3D.visible = false;
            }
        });

        if (closestLoc) {
            document.getElementById('targetName').innerText = closestLoc.title;
            const distRounded = Math.round(closestDist);
            document.getElementById('dist').innerText = distRounded;
            
            // Färbe Text grün wenn nah genug
            if(closestDist < VISIBILITY_DISTANCE) {
                document.getElementById('targetName').classList.add("active-target");
                document.getElementById('msg').innerText = "Ziel in Sichtweite!";
            } else {
                document.getElementById('targetName').classList.remove("active-target");
            }
        }

        if (closestDist < FREEZE_DISTANCE_METERS && acc < 25) {
            if (!isPositionLocked) {
                isPositionLocked = true;
                document.getElementById('status').innerText = "SLAM Lock (Fixiert)";
                document.getElementById('status').style.color = "#0ff";
            }
        } else if (closestDist > VISIBILITY_DISTANCE + 5) {
            isPositionLocked = false;
            document.getElementById('status').innerText = "GPS Tracking";
            document.getElementById('status').style.color = "#888";
        }

      }, (err) => {
        updateUI("GPS Fehler: " + err.message, "error");
      }, { enableHighAccuracy: true, maximumAge: 0 });
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const hitPos = hit.getPose(renderer.xr.getReferenceSpace()).transform.position;
               
            LOCATIONS.forEach(loc => {
               if (loc.object3D && loc.object3D.visible) {
                   const distToModel = Math.sqrt(Math.pow(hitPos.x - loc.object3D.position.x, 2) + Math.pow(hitPos.z - loc.object3D.position.z, 2));
                   // Radius für Höhenanpassung vergrößert
                   if (distToModel < 5.0) {
                       loc.object3D.position.y = THREE.MathUtils.lerp(loc.object3D.position.y, hitPos.y, 0.1);
                   }
               }
            });
          }
        }
      }
      renderer.render(scene, camera);
    }

    function calcOffset(lat1, lon1, lat2, lon2) {
      const R = 6378137; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const dx = dLon * Math.cos(lat1Rad) * R;
      const dz = -dLat * R; 
      return { x: dx, z: dz };
    }

    function haversineDist(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const rad = Math.PI/180;
      const dLat = (lat2-lat1)*rad;
      const dLon = (lon2-lon1)*rad;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateUI(txt, type="normal") {
      const el = document.getElementById('msg');
      if(el) {
          el.innerText = txt;
          el.style.color = type === "error" ? "red" : "#ccc";
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }
  </script>
</body>
</html>
