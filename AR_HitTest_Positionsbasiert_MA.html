<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Herrenhäuser Gärten - AR</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <style>
    /* Basis-Styling */
    body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; color: white; }
    
    /* 
       Hintergrund-Video für den Start-Screen 
       (Damit man die Kamera sieht, bevor AR startet)
    */
    #bg-video {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 0; opacity: 0.6; /* Leicht abgedunkelt für Lesbarkeit */
    }

    /* Container für UI Elemente (über dem Video/WebGL) */
    #ar-overlay-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* Info Bereich */
    .info-wrapper { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

    .info-box {
      background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; align-self: center; min-width: 250px; text-align: center;
    }
    
    h1 { margin: 0 0 5px 0; font-size: 1.1rem; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; }
    #status { color: #888; font-weight: bold; }
    .active-target { color: #4f4; } 

    /* Debug Text für GNSS Infos */
    #debug-console {
        font-family: monospace; font-size: 10px; color: #ffff00;
        background: rgba(0,0,0,0.8); padding: 5px; margin-top: 5px;
        text-align: left; white-space: pre-wrap; pointer-events: none;
    }

    /* Buttons */
    .button-wrapper { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

    .ar-btn {
        position: absolute; z-index: 200; color: white; padding: 12px 20px;
        border-radius: 30px; font-weight: bold; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px); pointer-events: auto; text-transform: uppercase;
        font-size: 12px; letter-spacing: 1px;
    }
    #closeBtn { top: 20px; right: 20px; background: rgba(200, 40, 40, 0.85); }
    #resetBtn { bottom: 30px; right: 20px; background: rgba(40, 40, 40, 0.8); }
  </style>
</head>
<body>
  
  <!-- PRE-AR KAMERA FEED -->
  <video id="bg-video" autoplay muted playsinline></video>

  <!-- UI OVERLAY -->
  <div id="ar-overlay-container">
      <div class="button-wrapper">
          <button id="closeBtn" class="ar-btn">✕ Schließen</button>
          <button id="resetBtn" class="ar-btn">↺ Neustart</button>
      </div>
      <div class="info-wrapper">
        <div class="info-box">
          <h1>Herrenhäuser Gärten AR</h1>
          <p id="msg">Initialisiere...</p>
          <p>Ziel: <span id="targetName">-</span> (<span id="dist">-</span> m)</p>
          <p>Status: <span id="status">Warte auf GNSS</span></p>
          <div id="debug-console">System startklar...</div>
        </div>
      </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- EINSTELLUNGEN ---
    const LOCATIONS = [
      {
        title: 'Erste Statue',
        lat: 52.388754, 
        lon: 9.817867,
        url: './3D_models/Statue_3D.glb', 
        object3D: null,
        loaded: false
      },
      {
        title: 'Borghesischer Fechter',
        lat: 52.389472, 
        lon: 9.699222,
        url: './3D_models/BorghesischerFechter_3D.glb', 
        object3D: null,
        loaded: false
      }
    ];

    const VISIBILITY_DISTANCE = 500.0; 
    
    // HIER GEÄNDERT: Lock erst unter 3 Metern
    const FREEZE_DISTANCE_METERS = 3.0; 

    // --- GLOBALE VARIABLEN ---
    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let positionHistory = []; 
    const MAX_HISTORY = 5; 
    let isPositionLocked = false; 

    // Startet die 2D Kamera (für den Hintergrund vor AR Start)
    start2DCamera();

    init();
    animate();

    // Funktion für das Hintergrund-Video vor AR-Start
    function start2DCamera() {
        const video = document.getElementById('bg-video');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(err) {
                console.log("Kamera Fehler (Pre-AR):", err);
            });
        }
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);

      // Licht Setup
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 4);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(0, 20, 10);
      scene.add(dirLight);

      // --- RETICLE (Boden-Cursor) ---
      const reticleGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial(); 
      const reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false; 
      scene.add(reticle);
      window.arReticle = reticle; 

      // --- MODELLE LADEN ---
      const loader = new GLTFLoader();
      
      LOCATIONS.forEach((loc) => {
        const group = new THREE.Group();
        group.visible = false; 
        scene.add(group);
        loc.object3D = group; 

        logToDebug(`Lade: ${loc.title}...`);

        loader.load(loc.url, (gltf) => {
          const model = gltf.scene;

          // Auto-Scaling auf 2 Meter Höhe
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          
          let scaleFactor = 1.0;
          if(size.y > 0) scaleFactor = 2.0 / size.y; // Zielhöhe 2m
          
          model.scale.set(scaleFactor, scaleFactor, scaleFactor);
          model.position.y = 0; 
          
          group.add(model);
          loc.loaded = true;
          logToDebug(`OK: ${loc.title}`);

        }, undefined, (err) => {
          logToDebug(`FEHLER: ${loc.title} nicht geladen.`);
        });
      });

      // --- RENDERER ---
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor'); 
      container.appendChild(renderer.domElement);

      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'dom-overlay'],
        domOverlay: { root: document.getElementById('ar-overlay-container') } 
      });
      
      // Beim Klick auf "Start AR" das Hintergrund-Video stoppen
      btn.addEventListener('click', () => {
          const video = document.getElementById('bg-video');
          if(video.srcObject) {
              video.srcObject.getTracks().forEach(track => track.stop());
              video.style.display = 'none';
          }
      });
      
      document.body.appendChild(btn);

      // Buttons
      document.getElementById('closeBtn').addEventListener('click', async () => {
          const session = renderer.xr.getSession();
          if (session) await session.end();
          try { window.close(); } catch(e) {}
          window.history.back();
      });
      document.getElementById('resetBtn').addEventListener('click', () => {
          location.reload();
      });

      startGNSS();
      window.addEventListener('resize', onWindowResize);
    }

    function startGNSS() {
      if (!navigator.geolocation) return;

      navigator.geolocation.watchPosition((pos) => {
        if(document.getElementById('status').innerText.includes("Warte")) {
             document.getElementById('status').innerText = "GNSS Aktiv";
        }

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        positionHistory.push({ lat, lon });
        if (positionHistory.length > MAX_HISTORY) positionHistory.shift();

        let avgLat = 0, avgLon = 0;
        positionHistory.forEach(p => { avgLat += p.lat; avgLon += p.lon; });
        avgLat /= positionHistory.length;
        avgLon /= positionHistory.length;

        let closestDist = 99999;
        let closestLoc = null;
        let debugTxt = `GNSS: ${avgLat.toFixed(5)}, ${avgLon.toFixed(5)} (±${Math.round(acc)}m)\n`;

        LOCATIONS.forEach(loc => {
            const dist = haversineDist(avgLat, avgLon, loc.lat, loc.lon);
            const offset = calcOffset(avgLat, avgLon, loc.lat, loc.lon);
            
            debugTxt += `${loc.title.substr(0,7)}: ${Math.round(dist)}m\n`;

            if (dist < closestDist) {
                closestDist = dist;
                closestLoc = loc;
            }

            if (dist < VISIBILITY_DISTANCE) {
                // GNSS Positionierung (X/Z)
                if (!isPositionLocked) {
                    loc.object3D.position.x = offset.x;
                    loc.object3D.position.z = offset.z;
                }
                loc.object3D.visible = true;
            } else {
                loc.object3D.visible = false;
            }
        });

        document.getElementById('debug-console').innerText = debugTxt;

        if (closestLoc) {
            document.getElementById('targetName').innerText = closestLoc.title;
            document.getElementById('dist').innerText = Math.round(closestDist);
            
            if(closestDist < 15.0) {
                 document.getElementById('targetName').classList.add("active-target");
            } else {
                 document.getElementById('targetName').classList.remove("active-target");
            }
        }

        // Lock Logic (Jetzt < 3 Meter)
        if (closestDist < FREEZE_DISTANCE_METERS && acc < 25) {
            if (!isPositionLocked) {
                isPositionLocked = true;
                document.getElementById('status').innerText = "SLAM Lock";
                document.getElementById('status').style.color = "#0ff";
            }
        } else if (closestDist > 5.0) { 
            // Entsperren, wenn man sich wieder leicht entfernt
            isPositionLocked = false;
            if(document.getElementById('status').innerText.includes("Lock")) {
                 document.getElementById('status').innerText = "GNSS Tracking";
                 document.getElementById('status').style.color = "#888";
            }
        }

      }, (err) => {
        logToDebug("GNSS Error: " + err.message);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          
          const reticle = window.arReticle;

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const refSpace = renderer.xr.getReferenceSpace();
            const hitPose = hit.getPose(refSpace);

            if (hitPose) {
               reticle.visible = true;
               reticle.matrix.fromArray(hitPose.transform.matrix);
               const hitPos = hitPose.transform.position;
               
               LOCATIONS.forEach(loc => {
                   if (loc.object3D && loc.object3D.visible) {
                       const distToModel = Math.sqrt(Math.pow(hitPos.x - loc.object3D.position.x, 2) + Math.pow(hitPos.z - loc.object3D.position.z, 2));
                       
                       // Höhenanpassung via Hit-Test
                       if (distToModel < 5.0) {
                           loc.object3D.position.y = THREE.MathUtils.lerp(loc.object3D.position.y, hitPos.y, 0.2);
                       }
                   }
               });
            }
          } else {
              reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }

    function logToDebug(text) {
        const el = document.getElementById('debug-console');
        el.innerText = text + "\n" + el.innerText;
    }

    function calcOffset(lat1, lon1, lat2, lon2) {
      const R = 6378137; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const dx = dLon * Math.cos(lat1Rad) * R;
      const dz = -dLat * R; 
      return { x: dx, z: dz };
    }

    function haversineDist(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const rad = Math.PI/180;
      const dLat = (lat2-lat1)*rad;
      const dLon = (lon2-lon1)*rad;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }
  </script>
</body>
</html>
