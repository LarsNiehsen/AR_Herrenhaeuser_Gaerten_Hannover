<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Herrenhäuser Gärten - markerloses AR</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <style>
    /* Basis-Styling */
    body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; color: white; }
    
    /* Container für UI Elemente */
    #ar-overlay-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* Info Bereich */
    .info-wrapper { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

    .info-box {
      background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; align-self: center; min-width: 250px; text-align: center;
    }
    
    h1 { margin: 0 0 5px 0; font-size: 1.1rem; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; }
    #status { color: #888; font-weight: bold; }
    .active-target { color: #4f4; } 
    
    /* DEBUG TEXT (NEU: Zeigt Koordinaten an) */
    #debug-console {
        font-family: monospace; font-size: 10px; color: #ff5555;
        background: rgba(0,0,0,0.8); padding: 5px; margin-top: 5px;
        text-align: left; white-space: pre-wrap;
    }

    /* Buttons */
    .button-wrapper { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

    .ar-btn {
        position: absolute; z-index: 200; color: white; padding: 12px 20px;
        border-radius: 30px; font-weight: bold; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px); pointer-events: auto; text-transform: uppercase;
        font-size: 12px; letter-spacing: 1px;
    }
    #closeBtn { top: 20px; right: 20px; background: rgba(200, 40, 40, 0.85); }
    #resetBtn { bottom: 30px; right: 20px; background: rgba(40, 40, 40, 0.8); }
  </style>
</head>
<body>
  
  <div id="ar-overlay-container">
      <div class="button-wrapper">
          <button id="closeBtn" class="ar-btn">✕ Schließen</button>
          <button id="resetBtn" class="ar-btn">↺ Neustart</button>
      </div>
      <div class="info-wrapper">
        <div class="info-box">
          <h1>Herrenhäuser Gärten - Virtueller Rundgang in AR</h1>
          <p id="msg">Initialisiere...</p>
          <p>Nächstes Ziel: <span id="targetName">-</span></p>
          <p>Distanz: <span id="dist">-</span> m</p>
          <p>Status: <span id="status">Warte auf GPS</span></p>
          <!-- DEBUG OUTPUT -->
          <div id="debug-console">Warte auf Daten...</div>
        </div>
      </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- EINSTELLUNGEN ---
    const LOCATIONS = [
      {
        title: 'Erste Statue',
        lat: 52.388754, 
        lon: 9.817867,
        url: './3D_models/Statue_3D.glb', 
        scale: 2.0, // Skalierung deutlich erhöht für Sichtbarkeit
        rotation: 0, 
        object3D: null 
      },
      {
        title: 'Borghesischer Fechter',
        lat: 52.389472, 
        lon: 9.699222,
        url: './3D_models/BorghesischerFechter_3D.glb', 
        scale: 2.0, 
        rotation: 180, 
        object3D: null
      }
    ];

    // Sichtbarkeit drastisch erhöht, damit man auch weit entfernte Objekte sieht
    const VISIBILITY_DISTANCE = 500.0; 
    const FREEZE_DISTANCE_METERS = 10.0; 

    // --- GLOBALE VARIABLEN ---
    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    
    // GPS
    let positionHistory = []; 
    const MAX_HISTORY = 5; 
    let isPositionLocked = false; 

    init();
    animate();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      // Far Plane auf 2000m erhöht, damit entfernte Objekte nicht abgeschnitten werden
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);

      // Starkes Licht für bessere Sichtbarkeit
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(0, 20, 10);
      scene.add(dirLight);

      // --- 1. REFERENZ WÜRFEL (GELB) ---
      // Dieser Würfel ist NICHT GPS gesteuert. Er muss SOFORT sichtbar sein.
      // Er schwebt 2 Meter VOR dem Startpunkt (z = -2).
      const refGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const refMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Leuchtendes Gelb
      const refCube = new THREE.Mesh(refGeo, refMat);
      refCube.position.set(0, 0, -2); 
      scene.add(refCube);
      // ----------------------------------

      // --- MODELLE LADEN ---
      const loader = new GLTFLoader();
      
      LOCATIONS.forEach((loc, index) => {
        const group = new THREE.Group();
        group.visible = false; 
        scene.add(group);
        loc.object3D = group; 

        // Rote Wireframe Box um jedes Modell (Debugging)
        // Hilft zu sehen, wo das Modell ist, auch wenn Texturen fehlen
        const debugBox = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2), 
            new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true })
        );
        debugBox.position.y = 1; 
        group.add(debugBox);

        loader.load(loc.url, (gltf) => {
          // debugBox.visible = false; // Wir lassen die Box an zum Testen!
          const model = gltf.scene;
          model.scale.set(loc.scale, loc.scale, loc.scale);
          model.rotation.y = loc.rotation * (Math.PI / 180);
          group.add(model);
          console.log(`${loc.title} geladen.`);
          
          if(index === LOCATIONS.length - 1) {
             updateUI("Daten bereit. Suche GPS...", "normal");
          }
        }, undefined, (err) => {
          console.error(`Fehler bei ${loc.title}:`, err);
          document.getElementById('debug-console').innerText += `\nFehler Laden: ${loc.title}`;
        });
      });

      // --- RENDERER ---
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor'); 
      container.appendChild(renderer.domElement);

      // --- AR BUTTON ---
      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'dom-overlay'],
        domOverlay: { root: document.getElementById('ar-overlay-container') } 
      });
      document.body.appendChild(btn);

      // --- BUTTON EVENTS ---
      document.getElementById('closeBtn').addEventListener('click', async () => {
          const session = renderer.xr.getSession();
          if (session) await session.end();
          try { window.close(); } catch(e) {}
          window.history.back();
      });

      // Umbenannt in "Neustart"
      document.getElementById('resetBtn').addEventListener('click', () => {
          location.reload();
      });

      startGPS();
      window.addEventListener('resize', onWindowResize);
    }

    // --- GPS ---
    function startGPS() {
      if (!navigator.geolocation) {
        updateUI("GPS nicht unterstützt", "error");
        return;
      }

      // Timeout Warnung
      setTimeout(() => {
          if(document.getElementById('status').innerText.includes("Warte")) {
              updateUI("Kein GPS Empfang. Draußen?", "error");
          }
      }, 8000);
      
      navigator.geolocation.watchPosition((pos) => {
        // UI Fix
        const statusEl = document.getElementById('status');
        if(statusEl.innerText.includes("Warte")) {
            statusEl.innerText = "GPS Aktiv";
            statusEl.style.color = "#fff";
        }

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        positionHistory.push({ lat, lon });
        if (positionHistory.length > MAX_HISTORY) positionHistory.shift();

        let avgLat = 0, avgLon = 0;
        positionHistory.forEach(p => { avgLat += p.lat; avgLon += p.lon; });
        avgLat /= positionHistory.length;
        avgLon /= positionHistory.length;

        let closestDist = 99999;
        let closestLoc = null;
        let debugText = `GPS: ${avgLat.toFixed(5)}, ${avgLon.toFixed(5)} (±${Math.round(acc)}m)\n`;

        LOCATIONS.forEach(loc => {
            if (!loc.object3D) return;

            const dist = haversineDist(avgLat, avgLon, loc.lat, loc.lon);
            const offset = calcOffset(avgLat, avgLon, loc.lat, loc.lon);
            
            // DEBUG: Zeige wo das Objekt relativ zu dir sein sollte
            debugText += `${loc.title.substr(0,5)}: Dist=${Math.round(dist)}m | X=${Math.round(offset.x)} Z=${Math.round(offset.z)}\n`;

            if (dist < closestDist) {
                closestDist = dist;
                closestLoc = loc;
            }

            if (dist < VISIBILITY_DISTANCE) {
                if (!isPositionLocked) {
                    loc.object3D.position.x = offset.x;
                    loc.object3D.position.z = offset.z;
                }
                loc.object3D.visible = true;
            } else {
                loc.object3D.visible = false;
            }
        });

        // Debug Text ausgeben
        document.getElementById('debug-console').innerText = debugText;

        if (closestLoc) {
            document.getElementById('targetName').innerText = closestLoc.title;
            const distRounded = Math.round(closestDist);
            document.getElementById('dist').innerText = distRounded;
            
            if(closestDist < 15.0) {
                updateUI("Ziel erreicht!", "normal");
                document.getElementById('targetName').classList.add("active-target");
            } else {
                updateUI(`Gehe zum Ziel (${distRounded}m)`, "normal");
                document.getElementById('targetName').classList.remove("active-target");
            }
        }

        // Lock Logik
        if (closestDist < FREEZE_DISTANCE_METERS && acc < 25) {
            if (!isPositionLocked) {
                isPositionLocked = true;
                document.getElementById('status').innerText = "SLAM Lock";
                document.getElementById('status').style.color = "#0ff";
            }
        } else if (closestDist > 20) {
            isPositionLocked = false;
        }

      }, (err) => {
        updateUI("GPS Error: " + err.code, "error");
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const hitPos = hit.getPose(renderer.xr.getReferenceSpace()).transform.position;
               
            LOCATIONS.forEach(loc => {
               if (loc.object3D && loc.object3D.visible) {
                   const distToModel = Math.sqrt(Math.pow(hitPos.x - loc.object3D.position.x, 2) + Math.pow(hitPos.z - loc.object3D.position.z, 2));
                   // Wenn wir Boden in der Nähe des Objekts sehen, Höhe anpassen
                   if (distToModel < 5.0) {
                       loc.object3D.position.y = THREE.MathUtils.lerp(loc.object3D.position.y, hitPos.y, 0.1);
                   }
               }
            });
          }
        }
      }
      renderer.render(scene, camera);
    }

    function calcOffset(lat1, lon1, lat2, lon2) {
      const R = 6378137; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const dx = dLon * Math.cos(lat1Rad) * R;
      const dz = -dLat * R; 
      return { x: dx, z: dz };
    }

    function haversineDist(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const rad = Math.PI/180;
      const dLat = (lat2-lat1)*rad;
      const dLon = (lon2-lon1)*rad;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateUI(txt, type="normal") {
      const el = document.getElementById('msg');
      if(el) {
          el.innerText = txt;
          el.style.color = type === "error" ? "red" : "#ccc";
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }
  </script>
</body>
</html>
