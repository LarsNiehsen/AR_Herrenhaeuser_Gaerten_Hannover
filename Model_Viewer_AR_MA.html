<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Model-Viewer (Android & IOS)</title>
    
    <!-- Model-Viewer Bibliothek -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            font-family: sans-serif; 
            background: #fff; 
        }
        
        .viewer-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden; /* Sorgt dafür, dass nichts über die Ecken hinausragt */
        }

        /* --- Die Beschriftung OBERHALB des Modells --- */
        .model-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none; /* Blockiert keine Berührungen für das 3D-Modell */
            text-align: center;
        }

        /* --- NEU: Schließen Button oben rechts mit rotem Ring --- */
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: 2px solid red;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: red;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
            text-decoration: none;
        }

        /* Leichtes Feedback beim Antippen */
        .close-button:active {
            background: red;
            color: white;
        }

        model-viewer {
            width: 100%;
            height: 700px;
            background-color: #f4f4f4;
            border-radius: 12px;
        }

        /* Der Button, um in den AR-Modus zu wechseln */
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .ar-button:focus {
            outline: none;
        }

        /* --- NEU: Erklärungstext unter dem Viewer --- */
        .explanation-text {
            max-width: 800px;
            margin: 15px auto;
            padding: 0 15px;
            text-align: center;
            font-size: 15px;
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        
        <!-- Die sichtbare Beschriftung für den Browser -->
        <div class="model-title">Niederdeutscher Blumengarten</div>

        <!-- Der Schließen-Button (Roter Ring) -->
        <!-- "onclick='window.close()'" schließt den Tab. Alternativ "history.back()" verwenden -->
        <a href="javascript:window.close();" class="close-button" title="Schließen">&times;</a>

        <model-viewer 
            id="Veritas-modell"
            src="3D_models/Statue_3D.glb" 
            ios-src="3D_models/Erde_Kybele.usdz#checkoutTitle=Kybele/Erde%20Fechter&checkoutSubtitle=Borghesischer%20Fechter%20am%20Gartentheater&callToAction=Mehr%20erfahren"
            title="Sandsteinstatue &quot;Veritas&quot; von 1730"
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            ar-placement="floor" 
            camera-controls 
            scale="1 1 1" 
            
            /* HIER GEÄNDERT: X-Achse auf -90deg aufgerichtet, damit es in Android richtig steht */
            orientation="-90deg 96deg 0deg"
            
            alt="Niederdeutscher Blumengarten">

            <!-- Der HTML Button, der den AR-Modus startet -->
            <button slot="ar-button" class="ar-button">
                AR Modus starten
            </button>
            
        </model-viewer>
        
    </div>

    <!-- Die Erklärung unter der Vorschau -->
    <p class="explanation-text">
        <strong>Tipp:</strong> Klicke auf "AR Modus starten". Dein Handy erkennt den Fußboden automatisch 
        und projiziert das 3D-Modell lebensgroß direkt in deinen virtuellen Raum!
    </p>

    <script>
        const modelViewer = document.getElementById('Veritas-modell');
        
        // Link-Klick für iOS Quick-Look (den "Mehr erfahren" Button) abfangen
        modelViewer.addEventListener('message', function(event) {
            if (event.data === '_apple_ar_quicklook_button_tapped') {
                window.open('https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen', '_blank');
            }
        });
    </script>
</body>
</html>
