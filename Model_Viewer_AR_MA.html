<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Model-Viewer (Android & IOS)</title>
    
    <!-- Model-Viewer Bibliothek -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            font-family: sans-serif; 
            background: #fff; 
        }
        
        .viewer-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }

        /* --- NEU: Die Beschriftung OBERHALB des Modells --- */
        .model-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none; /* Wichtig: Verhindert, dass die Box das Drehen des Modells blockiert */
        }

        model-viewer {
            width: 100%;
            height: 700px;
            background-color: #f4f4f4;
            border-radius: 12px;
        }

        /* Der Button, um in den AR-Modus zu wechseln */
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .ar-button:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        
        <!-- Die sichtbare Beschriftung für den Browser -->
        <div class="model-title">Niederdeutscher Blumengarten</div>

        <model-viewer 
            id="Veritas-modell"
            src="3D_models/Statue_3D.glb" 
            ios-src="3D_models/Erde_Kybele.usdz#checkoutTitle=Kybele/Erde%20Fechter&checkoutSubtitle=Borghesischer%20Fechter%20am%20Gartentheater&callToAction=Mehr%20erfahren"
            title="Sandsteinstatue &quot;Veritas&quot; von 1730"
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            ar-placement="floor" 
            camera-controls 
            scale="1 1 1" 
            orientation="0deg 96deg 0deg"
            alt="Niederdeutscher Blumengarten">

            <!-- Der HTML Button, der den AR-Modus startet -->
            <button slot="ar-button" class="ar-button">
                AR Modus starten
            </button>
            
        </model-viewer>
        
    </div>

    <script>
        const modelViewer = document.getElementById('Veritas-modell');
        
        // Link-Klick für iOS Quick-Look (den "Mehr erfahren" Button) abfangen
        modelViewer.addEventListener('message', function(event) {
            if (event.data === '_apple_ar_quicklook_button_tapped') {
                window.open('https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen', '_blank');
            }
        });
    </script>
</body>
</html>
