<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Fechter WebXR</title>
    
    <!-- Model-Viewer Bibliothek -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: sans-serif; background: #fff; }
        
        .viewer-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }

        model-viewer {
            width: 100%;
            height: 700px;
            background-color: #f4f4f4;
            border-radius: 12px;
        }

        /* Der Button, um in den AR-Modus zu wechseln */
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Animation: Aufforderung das Handy zu bewegen (wird im AR-Modus gezeigt) */
        #ar-prompt {
            position: absolute;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            display: none;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* Wird nur eingeblendet, wenn das Gerät den Raum scannt */
        model-viewer[ar-status="session-started"] > #ar-prompt {
            display: block;
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        
        <model-viewer 
            id="fechter-modell"
            src="3D_models/BorghesischerFechter_WebAR.glb" 
            ios-src="3D_models/Erde_Kybele.usdz#checkoutTitle=Borghesischer%20Fechter&checkoutSubtitle=Borghesischer%20Fechter%20am%20Gartentheater&callToAction=Mehr%20erfahren"
            
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor" 
            
            camera-controls 
            scale="1 1 1" 
            orientation="0deg 96deg 0deg">
            
            <!-- Der HTML Button, der den Kamera-Modus startet -->
            <button slot="ar-button" class="ar-button">
                AR Modus starten
            </button>

            <!-- Einblendung im Kamerabild: Hilft dem Nutzer bei der Bodensuche -->
            <div id="ar-prompt" slot="ar-prompt">
                Handy leicht kreisen lassen,<br>um den Boden zu scannen.
            </div>
            
        </model-viewer>
        
    </div>

    <script>
        const modelViewer = document.getElementById('fechter-modell');
        
        // Link für iOS Quick-Look
        modelViewer.addEventListener('message', function(event) {
            if (event.data === '_apple_ar_quicklook_button_tapped') {
                window.open('https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen', '_blank');
            }
        });
    </script>
</body>
</html>
