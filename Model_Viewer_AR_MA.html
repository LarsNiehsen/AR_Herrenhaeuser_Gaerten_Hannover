<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Borghesischer Fechter</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        .viewer-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .model-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none; 
        }

        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #f4f4f4;
            --poster-color: transparent;
            border-radius: 12px;
        }

        .ar-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        <div class="model-title">Borghesischer Fechter</div>

        <model-viewer 
            id="fechter-modell"
            
            src="3D_models/BorghesischerFechter_WebAR.glb" 
            ios-src="3D_models/Erde_Kybele.usdz#checkoutTitle=Borghesischer%20Fechter&checkoutSubtitle=Borghesischer%20Fechter%20am%20Gartentheater&callToAction=Mehr%20erfahren"
            title="Borghesischer Fechter"
            
            /* HIER GEÄNDERT: webxr muss an erster Stelle stehen für den Kamera-Stream im Browser! */
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            
            /* ar-placement="floor" erzwingt das Erkennen des Bodens, bevor man klicken kann */
            ar-placement="floor" 
            
            camera-controls 
            scale="26000 26000 26000" 
            orientation="0deg 96deg 0deg" 
            alt="Borghesischer Fechter">
            
            <button slot="ar-button" class="ar-button">
                In deinem Raum ansehen (AR)
            </button>
            
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.getElementById('fechter-modell');
        const externerLink = 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen';

        modelViewer.addEventListener('message', function(event) {
            if (event.data === '_apple_ar_quicklook_button_tapped') {
                window.open(externerLink, '_blank');
            }
        });
    </script>
</body>
</html>
