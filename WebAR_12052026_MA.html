<!DOCTYPE html>
<!-- Deklariert das Dokument als HTML5-Standard -->
<html lang="de">
<head>
    <!-- Legt die Zeichencodierung auf UTF-8 fest, damit Umlaute korrekt dargestellt werden -->
    <meta charset="UTF-8">
    <!-- 
        Viewport-Einstellungen: 
        Definiert den sichtbaren Bereich auf mobilen Geräten. 
        'user-scalable=no' verhindert das manuelle Zoomen.
        'maximum-scale=1.0' und 'initial-scale=1.0' erzwingen die originale Darstellungsgröße.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Der Titel des Browser-Tabs -->
    <title>Herrenhäuser Gärten Hannover - Augmented Reality (AR)</title>
    
    <!-- Leaflet CSS: Stilvorlagen für die 2D-Karte. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importmap: Definiert Speicherorte für externe Module (Three.js und MindAR). 
         Erlaubt es, in JavaScript Module einfach über ihren Namen zu importieren. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    
    <!-- ANPASSUNG 4: Tesseract-Bibliothek wurde entfernt, da die Live-Auswertung im Code entfernt wurde. -->

    <!-- CSS Styles: Festlegung der visuellen Gestaltung der Benutzeroberfläche. -->
    <style>
        /* Basis-Layout: Hintergrundfarbe Schwarz, Scrollleisten ausgeblendet. */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Das Video-Element wird von der AR-Engine verwaltet und hier standardmäßig ausgeblendet. */
        #videoElement { display: none; }

        /* Canvas-Ebene für Debug-Linien (ArUco Visualisierung). 
           Liegt über den unteren Ebenen. 'pointer-events: none' leitet Klicks hindurch. */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; pointer-events: none;
        }

        /* Canvas-Element für die Deep-Learning-Rahmen (Bounding Boxes) */
        #box-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 35; pointer-events: none; 
        }

        /* Container für die 3D-Szene (Three.js Layer). Hier werden alle 3D-Modelle gezeichnet. */
        #container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: auto; overflow: hidden;
        }

        /* Standard-Design für UI-Elemente (halbtransparentes Schwarz mit Unschärfe-Effekt). */
        .ui-panel {
            position: absolute; z-index: 100; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2); color: white;
            border-radius: 12px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }

        /* Debug-Informationen, oben links positioniert. */
        #debugInfo {
            top: 20px; left: 20px; padding: 15px; min-width: 200px;
            max-width: calc(100% - 100px); font-size: 13px; pointer-events: none;
        }

        /* Styling für Überschriften innerhalb der Debug-Info Box */
        #debugInfo strong {
            display: block; margin-bottom: 8px; color: #ffffff;
            font-weight: bold; font-size: 11px; 
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px; line-height: 1.3;
        }

        /* Schließen-Button, oben rechts positioniert. */
        #closeBtn {
            top: 20px; right: 20px; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px; cursor: pointer;
            background: rgba(200, 40, 40, 0.85);
            border: 1px solid rgba(255, 100, 100, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        /* Animation bei Klick auf den Button */
        #closeBtn:active { transform: scale(0.95); }

        /* Texterkennung-Button */
        #ocrBtn {
            top: 75px; right: 20px; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; cursor: pointer;
            background: rgba(40, 100, 200, 0.85);
            border: 1px solid rgba(100, 150, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #ocrBtn:active { transform: scale(0.95); }

        /* 3D-Viewer-Button */
        #viewerBtn {
            top: 115px; right: 20px; width: 30px; height: 30px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; cursor: pointer;
            background: rgba(40, 180, 100, 0.85); 
            border: 1px solid rgba(100, 255, 150, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
        }
        #viewerBtn:active { transform: scale(0.95); }

        /* Deep-Learning Aktivierungs-Button. Wird direkt unter dem 3D-Viewer platziert. */
        #dlToggleBtn {
            top: 155px; right: 20px; width: 30px; height: 30px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; cursor: pointer;
            background: rgba(255, 140, 0, 0.85); /* Standard: Orange (deaktiviert) */
            border: 1px solid rgba(255, 170, 50, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0; line-height: 1;
            transition: background 0.3s, transform 0.1s;
        }
        #dlToggleBtn:active { transform: scale(0.95); }

        /* Informationsfeld für 3D-Modelle. Mittig am unteren Rand platziert. */
        #modelInfo {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 400px; text-align: center; display: none; cursor: pointer; z-index: 200;

        #modelInfo h3 { color: #4f4; margin: 0 0 4px 0; font-size: 18px; font-weight: bold; }
        #modelInfo p { color: #eee; margin: 0; font-size: 14px; line-height: 1.3; }

        /* Anzeige für ein historisches Bild. */

            transform: translateY(-50%); width: 180px; padding: 10px; text-align: center; z-index: 250;

        #historicalInfo img {

        /* Container für die Kartensteuerung unten rechts. */
        #mapControls {
            position: absolute; bottom: 20px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
        }

        /* Karten-Container, anfangs ausgeblendet. */
        #mapContainer {
            position: relative; width: 240px; height: 180px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);

        /* HTML-Element für die Leaflet-Karte */

        /* Overlay für Buttons innerhalb der Karte */
        .map-btn-overlay {

            display: flex; flex-direction: column; gap: 4px; z-index: 1000;

        /* Kleine Icon-Buttons auf der Karte */
        .icon-btn {

        #heightSlider {

        /* Hinweis-Text in der Bildschirmmitte (wird temporär eingeblendet). */
        #clickHint {

            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);

            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Richtungspfeil für GNSS-Navigation. */
        #direction-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 95;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); transition: opacity 0.5s; opacity: 0;

        /* Das CSS-Dreieck für den Richtungspfeil. */
        #arrow {

            backdrop-filter: blur(8px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.1s;

        /* Hilfsklassen zur Textformatierung */

        .val-highlight { color: #fff; font-weight: bold; }
        .val-green { color: #4f4; font-weight: bold; }

    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>

    <!-- Hauptlogik der Anwendung. -->
    <script type="module">
        // Import von Modulen.
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // ==========================================
        // SYSTEM-ERKENNUNG FÜR SPEICHER-OPTIMIERUNG
        // ==========================================
        // Überprüfung des User-Agents zur Identifikation von iOS-Geräten.
        // iOS besitzt strikte Limits für den Arbeitsspeicher pro Tab.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // Die Auflösung des Bildes, das an das Deep-Learning-Modell übergeben wird.
        // Auf iOS-Geräten wird eine reduzierte Größe verwendet, um Rechenkapazitäten zu schonen.
        const WORKER_SIZE = isIOS ? 320 : 640;

        // Wartezeit in Millisekunden zwischen zwei Deep-Learning-Auswertungen.
        // Eine längere Pause bei iOS verhindert eine Überlastung der Systemressourcen.
        const DL_DELAY = isIOS ? 300 : 100;

        // Deep-Learning Konstanten und Variablen
        let aiWorker;
        let isDetectingDL = false;
        
        // Schalter für die Deep-Learning-Erkennung. Startet deaktiviert, um Ressourcen zu schonen.
        let isDLDetectorEnabled = false; 
        
        // Variablen zur Speicherung der geschätzten Entfernung zur erkannten Statue.
        let dlStatueDistance = null;
        let dlStatueDistanceTime = 0;
        
        let latestDLPredictions = null;
        const curtainImg = new Image();
        curtainImg.src = 'ImageMatching/Vorhang_rot.png'; 

        // Die verborgene Zeichenfläche wird einmalig global angelegt.
        // Würde diese für jedes Bild neu erstellt, entstünde ein enormes Speicherleck, welches iPhones massiv verlangsamt.
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        // Initialisierung des Web-Workers für das Deep-Learning.
        function initAI() {
            const boxCanvas = document.getElementById('box-canvas');
            boxCanvas.width = window.innerWidth;
            boxCanvas.height = window.innerHeight;

            aiWorker = new Worker('worker.js');
            
            aiWorker.onmessage = function(event) {
                if (event.data.type === 'ready') {
                    console.log("Deep-Learning bereit!");
                } 
                else if (event.data.type === 'result') {
                    latestDLPredictions = event.data.data;
                    
                    // Implementierung einer Verzögerung, bevor das nächste Bild analysiert werden darf.
                    setTimeout(() => {
                        isDetectingDL = false; 
                    }, DL_DELAY); 
                }
            };
        }

        // Bereitet den aktuellen Frame auf und sendet ihn zur Analyse.
        function requestNextFrame(video) {
            // Wird abgebrochen, falls Deep-Learning deaktiviert ist, eine Abfrage läuft oder das Video nicht existiert.
            if (!isDLDetectorEnabled || isDetectingDL || !video || video.readyState < 2) return;
            
            const cw = window.innerWidth;
            const ch = window.innerHeight;
            const vw = video.videoWidth; 
            const vh = video.videoHeight;
            if(!vw || !vh) return;

            // Zuweisung der berechneten Dimensionen, um Speicherplatz zu sparen.
            hiddenCanvas.width = WORKER_SIZE;
            hiddenCanvas.height = WORKER_SIZE;

            // Das Seitenverhältnis des originalen Videos und des Bildschirms wird verglichen.
            const rV = vw / vh; 
            const rC = cw / ch;
            let sx, sy, sw, sh;
            
            // Berechnung des sichtbaren Bildschirmausschnitts (Zuschneiden analog zu 'object-fit: cover').
            // Dies ist ein kritischer Schritt: Anstatt das verzerrte Video zu analysieren,
            // wird exakt der Bereich ausgeschnitten, der auch dem Nutzer angezeigt wird.
            // Dadurch werden Positionsfehler am Bildschirmrand unter iOS vollständig behoben.
            if (rV < rC) { 
                sw = vw; 
                sh = vw / rC; 
                sx = 0; 
                sy = (vh - sh) / 2; 
            } else { 
                sh = vh; 
                sw = vh * rC; 
                sx = (vw - sw) / 2; 
                sy = 0; 
            }

            // Zeichnen des korrigierten Ausschnitts auf das Analyse-Canvas.
            hiddenCtx.drawImage(video, sx, sy, sw, sh, 0, 0, WORKER_SIZE, WORKER_SIZE);
            const imageData = hiddenCtx.getImageData(0, 0, WORKER_SIZE, WORKER_SIZE);
            
            isDetectingDL = true;
            // Die Pixeldaten werden als Transferable Object übergeben, um ein Kopieren im Speicher zu vermeiden.
            aiWorker.postMessage({ type: 'predict', image: imageData }, [imageData.data.buffer]);
        }

        // Verarbeitet die Auswertungsdaten und visualisiert die Bounding-Boxes.
        function drawDeepLearningBoxes() {
            const boxCanvas = document.getElementById('box-canvas');
            const boxCtx = boxCanvas.getContext('2d');
            
            // Wenn das Deep-Learning deaktiviert wurde, wird die visuelle Anzeige sofort geleert.
            if (!isDLDetectorEnabled) {
                boxCtx.clearRect(0, 0, boxCanvas.width, boxCanvas.height);
                return;
            }
            
            const cw = window.innerWidth;
            const ch = window.innerHeight;

            // Fortlaufende Synchronisierung der Canvas-Größe mit dem Bildschirm.
            if(boxCanvas.width !== cw || boxCanvas.height !== ch){
                boxCanvas.width = cw;

        // Erstellt das Partikelsystem für die Fontäne
        function createWaterEffect() {
            const particleCount = 15000; 
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3); 
            const velocities = new Float32Array(particleCount * 3); 

            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                velocities[i*3] = (Math.random() - 0.5) * 0.036;     
                velocities[i*3+1] = (Math.random() * 0.3 + 0.15);    
                velocities[i*3+2] = (Math.random() - 0.5) * 0.036;   
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xaaddff, size: 0.03, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geometry, material);
            points.userData.vels = velocities; 
            points.frustumCulled = false; 
            return points;
        }

        // Berechnet die physikalische Bewegung des Wassereffekts pro Bildwiederholung
        function updateWaterEffect(points) {
            const pos = points.geometry.attributes.position.array;
            const vels = points.userData.vels;
            const gravity = 0.003; 

            for (let i = 0; i < pos.length / 3; i++) {
                pos[i*3] += vels[i*3];     
                pos[i*3+1] += vels[i*3+1]; 
                pos[i*3+2] += vels[i*3+2]; 
                vels[i*3+1] -= gravity; 

                if (pos[i*3+1] < 0) {
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
                    vels[i*3] = (Math.random() - 0.5) * 0.036; 
                    vels[i*3+1] = (Math.random() * 0.3 + 0.15); 
                    vels[i*3+2] = (Math.random() - 0.5) * 0.036; 
                }
            }
            points.geometry.attributes.position.needsUpdate = true; 
        }

                         if (AR_MODELS[id].mindTargetIndexes && AR_MODELS[id].mindTargetIndexes.includes(activeMindARId) && mindARMeshes[id]) {
                             mindARMeshes[id].forEach(mesh => {
                                 if (mesh.visible) currentRotY = mesh.rotation.y;
                             });
                         }
                     });
                }
                else if (isMarkerTracking && currentTrackingID !== -1 && loadedMeshes[currentTrackingID]?.visible) {
                     currentRotY = loadedMeshes[currentTrackingID].rotation.z;
                }

                let angleSpan = document.getElementById('debugAngle');
                const displayDeg = Math.round(THREE.MathUtils.radToDeg(currentRotY) % 360);
                const finalDeg = displayDeg < 0 ? displayDeg + 360 : displayDeg;
                
                if(!angleSpan) {
                    const d = document.createElement('div');
                    d.style.marginTop = "8px"; d.style.borderTop = "1px solid rgba(255,255,255,0.3)"; d.style.paddingTop = "5px";
                    d.innerHTML = `<span class="label-small">Modell-Ausrichtung (Stehachse)</span><br><span id="debugAngle" class="val-highlight">${finalDeg}°</span>`;
                    document.getElementById('debugInfo').appendChild(d);
                } else {

                }

                if (closestObjForArrow || isFechterPlacedLocally) updateArrow();
                else arrowContainer.style.opacity = 0;

                renderer.render(scene, camera);
            });
        }

        // Berechnung der Kamerarotation aus den Sensordaten.
        function getDeviceQuaternion(orientData, correctedHeading) {
            const absoluteAlpha = (360 - correctedHeading) % 360;
            const alpha = THREE.MathUtils.degToRad(absoluteAlpha); 
            
            const beta = orientData.beta ? THREE.MathUtils.degToRad(orientData.beta) : 0;   
            const gamma = orientData.gamma ? THREE.MathUtils.degToRad(orientData.gamma) : 0; 
            
            const orient = window.screen.orientation ? THREE.MathUtils.degToRad(window.screen.orientation.angle) : 0;

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            
            const q = new THREE.Quaternion();
            q.setFromEuler(euler);
            
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            q.multiply(q1);
            
            const q2 = new THREE.Quaternion();
            q2.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
            q.multiply(q2);
            
            return q;
        }

        // Ladevorgang für 3D-Modelle.
        function loadModels() {
            const loader = new GLTFLoader(); 
            const ids = Object.keys(AR_MODELS); 
            
            const enableShadows = (modelObj) => {
                modelObj.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true; 
                    }
                });
            };

            ids.forEach(idStr => {
                const id = parseInt(idStr);
                const config = AR_MODELS[id]; 
                
                loader.load(config.url, (gltf) => {
                    
                    const modelAruco = gltf.scene.clone();
                    modelAruco.scale.set(config.scale, config.scale, config.scale); 
                    modelAruco.rotation.x = Math.PI / 2; 
                    if (id === 1 || id === 2 || id === 3 || id === 33) modelAruco.rotation.z += Math.PI; 
                    
                    if (id === 3 || id === 33) {
                        const p = createWaterEffect(); 
                        modelAruco.add(p); 
                        p.position.set(0, 4.0, 0); 
                        p.rotation.x = -Math.PI / 2; 
                        modelAruco.userData.particles = p; 
                        
                        const measureBar = createMeasureBar();
                        modelAruco.add(measureBar);
                        modelAruco.userData.measureBar = measureBar;
                    }
                    modelAruco.visible = false; 
                    markerGroup.add(modelAruco); 
                    loadedMeshes[id] = modelAruco; 

                    if (config.lat && config.lon) {
                        const modelGNSS = gltf.scene.clone();
                        let finalScale = config.scale * 0.05; 
                        
                        if (id === 1) {
                            finalScale = config.scale * 0.015; 
                        }
                        
                        modelGNSS.scale.set(finalScale, finalScale, finalScale);
                        
                        let initRotDeg = config.initRotation || 0;
                        
                        if (id === 2 && isSimulatedPos && simulatedBaseCoords && simulatedBaseCoords.lat === targetFechterLat) {
                            initRotDeg = 275;
                        }
                        
                        modelGNSS.rotation.y = THREE.MathUtils.degToRad(initRotDeg); 

                        if (id === 3 || id === 33) {
                             const pG = createWaterEffect();
                             modelGNSS.userData.particles = pG;
                             gnssGroup.add(pG);
                             const measureBar = createMeasureBar();
                             modelGNSS.add(measureBar);
                             modelGNSS.userData.measureBar = measureBar;
                        }
                        
                        enableShadows(modelGNSS);
                        
                        if (id === 2) {
                            loader.load('3D_models/BorghesischerFechter_iPhone17Pro_animiert_JumpDown.glb', (gltfAnim) => {
                                const animGNSS = gltfAnim.scene;
                                animGNSS.scale.copy(modelGNSS.scale);
                                animGNSS.rotation.copy(modelGNSS.rotation);
                                animGNSS.position.copy(modelGNSS.position);
                                animGNSS.visible = false;
                                enableShadows(animGNSS);
                                
                                if (gltfAnim.animations && gltfAnim.animations.length > 0) {
                                    const mixer = new THREE.AnimationMixer(animGNSS);
                                    mixers.push(mixer);
                                    const action = mixer.clipAction(gltfAnim.animations[0]);
                                    action.setLoop(THREE.LoopOnce, 1);
                                    action.clampWhenFinished = true;
                                    
                                    modelGNSS.userData.animMesh = animGNSS;
                                    modelGNSS.userData.animAction = action;
                                    gnssGroup.add(animGNSS);

                                    animGNSS.scale.set(0.0001, 0.0001, 0.0001);
                                    animGNSS.visible = true;
                                    mixer.update(0.01);
                                    renderer.compile(scene, camera);
                                    renderer.render(scene, camera);
                                    
                                    animGNSS.visible = false;
                                    animGNSS.scale.copy(modelGNSS.scale);
                                    
                                    action.stop(); 
                                    action.reset(); 
                                    
                                    mixer.addEventListener('finished', () => {
                                        animGNSS.visible = false;
                                        modelGNSS.visible = true;
                                    });
                                }
                            });
                        }

                        modelGNSS.visible = false;
                        gnssGroup.add(modelGNSS);
                        gnssMeshes[id] = modelGNSS;
                    }

                    if (config.mindTargetIndexes) {
                        if (!mindARMeshes[id]) mindARMeshes[id] =[];

                        config.mindTargetIndexes.forEach(targetIndex => {
                            // ANPASSUNG 3: Arrays erweitert
                            if ([1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 12].includes(targetIndex) && mindarAnchors[targetIndex]) {
                                const modelMind = gltf.scene.clone();
                                let mindScale = config.scale * 0.015; 

                                // ANPASSUNG 3: Mappings für Indizes ergänzt
                                if ((targetIndex >= 1 && targetIndex <= 3) || targetIndex === 7 || targetIndex === 8 || targetIndex === 10 || targetIndex === 11 || targetIndex === 12) {
                                    mindScale = mindScale * 0.5;
                                }

                                modelMind.scale.set(mindScale, mindScale, mindScale);
                                
                                let rotationY = Math.PI; 
                                if (targetIndex === 1 || targetIndex === 7 || targetIndex === 8 || targetIndex === 10) rotationY = THREE.MathUtils.degToRad(357); 
                                if (targetIndex === 2 || targetIndex === 11) rotationY = THREE.MathUtils.degToRad(123); 
                                if (targetIndex === 3 || targetIndex === 12) rotationY = THREE.MathUtils.degToRad(265);

                                modelMind.rotation.y = rotationY; 
                                
                                if (id === 1 ||[4,5,6].includes(targetIndex)) {
                                     modelMind.position.y = -2.0; 
                                }

                                if (id === 3 || id === 33) {
                                     const pM = createWaterEffect();
                                     modelMind.userData.particles = pM;
                                     mindarAnchors[targetIndex].group.add(pM);
                                     const measureBar = createMeasureBar();
                                     modelMind.add(measureBar);
                                     modelMind.userData.measureBar = measureBar;
                                }

                                modelMind.userData.anchorIndex = targetIndex; 
                                mindarAnchors[targetIndex].group.add(modelMind); 
                                mindARMeshes[id].push(modelMind); 
                                modelMind.visible = false;
                            }
                        });
                    }
                });
            });
        }

        // Aktualisiert die Ausrichtung des Navigationspfeils.
        function updateArrow() {
            if (isFechterPlacedLocally && Date.now() < localFechterEndTime && gnssMeshes[2]) {
                arrowContainer.style.opacity = 1;
                
                const camPos = new THREE.Vector3();
                camera.getWorldPosition(camPos);
                
                const targetPos = new THREE.Vector3();
                gnssMeshes[2].getWorldPosition(targetPos);
                
                const toTarget = new THREE.Vector3().subVectors(targetPos, camPos);
                toTarget.y = 0;
                toTarget.normalize();
                
                const camDir = new THREE.Vector3(0, 0, -1);
                camDir.applyQuaternion(camera.quaternion);
                camDir.y = 0;
                camDir.normalize();

                const angle = camDir.angleTo(toTarget);
                const cross = new THREE.Vector3().crossVectors(camDir, toTarget);
                let relativeAngle = THREE.MathUtils.radToDeg(angle);
                
                if (cross.y > 0) {
                    relativeAngle = 360 - relativeAngle;
                }
                
                arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
                return; 
            }

            if (!lastPos || !closestObjForArrow) {
                arrowContainer.style.opacity = 0; 
                return;
            }
            arrowContainer.style.opacity = 1;
            const bearing = calculateBearing(lastPos.latitude, lastPos.longitude, closestObjForArrow.lat, closestObjForArrow.lon);
            const relativeAngle = (bearing - heading + 360) % 360;
            arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
        }

                            if (mesh.userData.animMesh) mesh.userData.animMesh.visible = false;

                        gnssMeshes[2].userData.animMesh.rotation.y = THREE.MathUtils.degToRad(AR_MODELS[2].initRotation);
                    }
                }
            }

            if (!lastPos) return;

            let modelsWithDistance =[];
            Object.keys(gnssMeshes).forEach(key => {
                const id = parseInt(key);
                const config = AR_MODELS[id];
                if (config.lat && config.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    modelsWithDistance.push({ id: id, dist: dist });
                }
            });

            modelsWithDistance.sort((a, b) => a.dist - b.dist);

            let closestModelFound = false;

            modelsWithDistance.forEach((item) => {
                const id = item.id;
                const mesh = gnssMeshes[id];

                    if (!closestModelFound && dist < VISIBILITY_DISTANCE) {
                        isAllowedToShow = true;
                    }
                }

                if (isAllowedToShow) {
                    closestModelFound = true; 

                    const heightY = 0.0; 
                    const offset = calcOffset(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    let finalScale = config.scale * 0.05;

                    }
                    
                    if (mesh.userData.animMesh && mesh.userData.animMesh.visible) {

            if (!closestModelFound && currentTrackingID !== -1 && !isMarkerTracking) {
                 if (currentTrackingSource === "GNSS" || currentTrackingSource === "Pos. Simulation") {

                 }
            }
        }

        // Berechnet Entfernungen auf der Erdoberfläche.
        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const rad = Math.PI/180;
            const dLat = (lat2-lat1)*rad; const dLon = (lon2-lon1)*rad;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        // Wandelt Koordinaten in ein metrisches Format um.
        function calcOffset(lat1, lon1, lat2, lon2) {
            const R = 6378137; 
            const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const dx = dLon * Math.cos(lat1Rad) * R; const dz = dLat * R; 
            return { x: dx, z: dz };
        }
        
        // Berechnet den Kompasswinkel zum Ziel.
        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * (Math.PI / 180); const startLngRad = startLng * (Math.PI / 180);
            const destLatRad = destLat * (Math.PI / 180); const destLngRad = destLng * (Math.PI / 180);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }

        // Durchsucht das Kamera-Bild nach ArUco-Markern.
        function processArucoFrame(video) {
            if (!video || video.readyState < video.HAVE_METADATA) return false;

            const cw = videoCanvas.width; const ch = videoCanvas.height;
            if (cw !== window.innerWidth || ch !== window.innerHeight) {
                videoCanvas.width = window.innerWidth; videoCanvas.height = window.innerHeight;
                posit = new POS.Posit(markerSize, window.innerWidth);
            }

            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            
            context2D.clearRect(0, 0, cw, ch);
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            const imageData = context2D.getImageData(0, 0, cw, ch);
            context2D.clearRect(0, 0, cw, ch); 

            let markers = detector.detect(imageData);
            markers = markers.filter(m => {
                const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                return d > 30 && m.id !== 97; 
            });

            let found = false;
            if (markers.length > 0) {
                markers.forEach(marker => {
                    drawRedBox(marker.corners); drawIdText(marker.corners, marker.id);
                    const cornersCentered = marker.corners.map(c => ({ x: c.x - (cw / 2), y: (ch / 2) - c.y }));
                    const pose = posit.pose(cornersCentered);
                    
                    if (pose) {
                        const r = pose.bestRotation; const t = pose.bestTranslation;
                        drawAxis(r, t, markerSize); 
                        const id = marker.id;
                        if (AR_MODELS[id] && marker === markers[0]) {
                            found = true; 
                            lossCounter = 0; 
                            updatePoseUI(r, t, id, "ArUco"); 
                            
                            const targetPos = new THREE.Vector3(t[0], -t[1], -t[2]);
                            const m = new THREE.Matrix4();
                            m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
                            const fullQuat = new THREE.Quaternion().setFromRotationMatrix(m);
                            const euler = new THREE.Euler().setFromQuaternion(fullQuat, 'YXZ');
                            const uprightQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, euler.y, 0));
                            updateActiveModelArUco(id, targetPos, uprightQuat);
                        }
                    }
                });
            }

            if (!found) {
                markerGroup.visible = false;
                lossCounter++; 
                if (lossCounter > maxLossFrames) {
                    if (currentTrackingID !== -1 && currentTrackingSource === "ArUco") {
                            modelInfo.style.display = 'none';
                            clickHint.style.opacity = "0";
                            historicalInfo.style.display = 'none'; 
                            currentTrackingID = -1;
                            currentTrackingSource = ""; 
                    }
                    if(statusText.innerHTML.includes("Gefunden") || statusText.innerHTML.includes("Tracking")) {
                            statusText.innerHTML = "Warte auf GNSS Signal...";
                    }
                }
            }
            return found; 
        }

        // Bereitet die interaktive Karte vor.
        function initMap() {
            mapStations = L.map(mapEl).setView([52.3895, 9.6975], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(mapStations);
            stations.forEach(s => { L.marker(s.coords).addTo(mapStations).bindPopup(`<strong>${s.title}</strong>`); });
            userLayer = L.layerGroup().addTo(mapStations); 
            
            locateBtn.addEventListener('click', (e) => { e.stopPropagation(); if (lastPos) mapStations.setView([lastPos.latitude, lastPos.longitude], 17); else mapStations.locate({ setView: true, maxZoom: 17 }); });
            
            // ANPASSUNG 5: Kompass verwendet nun korrekte absolute Sensordaten, falls verfügbar.
            orientBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { 
                        const res = await DeviceOrientationEvent.requestPermission(); 
                        if (res === 'granted') { 
                            window.addEventListener('deviceorientation', onDeviceOrientation, true); 
                            orientBtn.style.background = '#4f4'; 
                        } 
                    } catch (err) { console.warn(err); }
                } else { 
                    if ('ondeviceorientationabsolute' in window) {
                        window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
                    } else {
                        window.addEventListener('deviceorientation', onDeviceOrientation, true);
                    }
                    orientBtn.style.background = '#4f4'; 
                }
            });
            setTimeout(() => { if (navigator.geolocation) { navigator.geolocation.watchPosition(onPos, err => console.warn(err), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }); } }, 1500);
        }

        // Aktualisiert die gespeicherte Nutzer-Position.
        function onPos(pos) {
            realPos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy || 5 };
            if (!isSimulatedPos) {
                lastPos = realPos;
                if (mapStations && !mapStations._userCentered) { mapStations.setView([lastPos.latitude, lastPos.longitude], 17); mapStations._userCentered = true; }
                drawUserOnMap(lastPos);
            } else {
                if (lastPos) drawUserOnMap(lastPos);
            }
        }

        // Verarbeitet die Neigungsdaten des Geräts.
        function onDeviceOrientation(e) {
            lastDeviceOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
            if (e.webkitCompassHeading) rawHeading = e.webkitCompassHeading; else if (e.alpha !== null) rawHeading = (360 - e.alpha) % 360;
            heading = (rawHeading + magDeclination + compassOffset) % 360;
            if (lastPos) drawUserOnMap(lastPos);
        }

        // Zeichnet das Nutzer-Icon auf der Karte.
        function drawUserOnMap(p) {
            if (!userLayer) return; userLayer.clearLayers(); 
            L.circle([p.latitude, p.longitude], { radius: Math.max(p.accuracy, 4), color: 'rgba(255,0,0,0.6)', fillColor: 'rgba(255,0,0,0.12)', weight: 1 }).addTo(userLayer);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${heading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/><circle cx="0" cy="10" r="3" fill="red"/></g></svg>`;
            const url = 'data:image/svg+xml;base64,' + btoa(svg);
            const icon = L.icon({ iconUrl: url, iconSize:[48, 48], iconAnchor:[24, 24], className: 'user-arrow' });
            L.marker([p.latitude, p.longitude], { icon: icon, interactive: false }).addTo(userLayer);
        }

        // Unterstützungsfunktion zur Berechnung von 2D-Projektionen im Sichtfeld.
        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -1000, y: -1000 }; 
            const f = videoCanvas.width; const scale = f / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        // Erstellt die visuellen X-Y-Z Achsen auf den Marker-Flächen.
        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans); 
            const ax = project([len, 0, 0], rot, trans); 
            const ay = project([0, len, 0], rot, trans); 
            const az = project([0, 0, len], rot, trans); 
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            context2D.strokeStyle = "lime"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        // Zeichnet einen roten Rahmen um erkannte Markierungen.
        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        // Zeichnet die Identifikationsnummer an den Bereich des Markers.
        function drawIdText(corners, id, source = "ArUco") {
            const pt = corners[0];
            context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10); 
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10); 
        }

        // Aktualisiert die Anzeige der räumlichen Lage eines ArUco-Markers.
        function updatePoseUI(r, t, id, source = "ArUco") {
            const m = new THREE.Matrix4();
            m.set(r[0][0], r[0][1], r[0][2], t[0], -r[1][0], -r[1][1], -r[1][2], -t[1], -r[2][0], -r[2][1], -r[2][2], -t[2], 0, 0, 0, 1);
            const inv = m.clone().invert();
            const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const sc = new THREE.Vector3();
            inv.decompose(pos, quat, sc);
            const euler = new THREE.Euler().setFromQuaternion(quat);
            const x = (pos.x / 10).toFixed(0); const y = (pos.y / 10).toFixed(0); const z = (pos.z / 10).toFixed(0);
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);
            statusText.innerHTML = `<span style="color:yellow;">Gefunden: ID ${id} (${source})</span><br><div style="margin-top:8px; padding-top:5px; border-top:1px solid #777;"><span class="label-small">Position (Relativ)</span><br>X: ${x} cm | Y: ${y} cm | Z: ${z} cm</div><div style="margin-top:8px;"><span class="label-small">Rotation (relativ)</span><br>Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°</div>`;
        }

        // Modifiziert die Ansicht, um einen Hinweis auf Interaktionsmöglichkeiten anzuzeigen.
        function triggerHint() {
            if (clickHint.style.opacity === "1") return; 

            if (hintTimeout) {
                clearTimeout(hintTimeout); 
            }
            
            clickHint.style.opacity = "1"; 
            
            hintTimeout = setTimeout(() => { 
                clickHint.style.opacity = "0"; 
                hintTimeout = null; 
            }, 5000);
        }
        
        // Verwaltet die Anzeige der Titel und Texte auf dem Bildschirm.
        function updateUIForModel(id, sourceName) {
            if (currentTrackingID !== id || currentTrackingSource !== sourceName) {
                currentTrackingID = id;
                currentTrackingSource = sourceName;
                
                modelInfo.style.display = (id === 0 ? 'none' : 'block');
                
                if (id === 3 || id === 33) {
                    historicalInfo.style.display = 'block';
                } else {
                    historicalInfo.style.display = 'none';
                }

                objTitle.innerText = AR_MODELS[id].title;
                objText.innerText = AR_MODELS[id].info;
                activeLink = AR_MODELS[id].link;
                
                triggerHint();
            }
        }

        // Setzt das Modell anhand der ArUco-Marker Position glatt an seinen Ort.
        function updateActiveModelArUco(id, pos, quat) {
            if (AR_MODELS[id]) {
                Object.keys(loadedMeshes).forEach(key => { loadedMeshes[key].visible = (parseInt(key) === id); });
                updateUIForModel(id, "ArUco");
                markerGroup.visible = true;
                markerGroup.position.lerp(pos, 0.2);
                markerGroup.quaternion.slerp(quat, 0.2);
            }
        }

        // Verknüpft die Schaltfläche mit einer Funktion zum Umschalten der Deep-Learning-Erkennung.
        document.getElementById('dlToggleBtn').addEventListener('click', function() {
            isDLDetectorEnabled = !isDLDetectorEnabled;
            
            if (isDLDetectorEnabled) {
                // Grüner Hintergrund signalisiert den aktiven Zustand.
                this.style.background = 'rgba(40, 180, 100, 0.85)';
                this.title = "Deep-Learning Objekterkennung (Bounding Boxes) deaktivieren";
            } else {
                // Der orangefarbene Ursprungszustand wird wiederhergestellt.
                this.style.background = 'rgba(255, 140, 0, 0.85)';
                this.title = "Deep-Learning Objekterkennung (Bounding Boxes) aktivieren";
                // Bei Deaktivierung muss die Anzeige sofort bereinigt werden, damit keine Rahmen auf dem Bildschirm verbleiben.
                const boxCanvas = document.getElementById('box-canvas');
                const boxCtx = boxCanvas.getContext('2d');
                boxCtx.clearRect(0, 0, boxCanvas.width, boxCanvas.height);
            }
        });

        detector = new AR.Detector({ dictionaryName: selectedDictionary });
        posit = new POS.Posit(markerSize, window.innerWidth);
        
        initMap();
        startAR();
        initAI(); 

        // Logik für den Klick auf das Routen-Icon.
        arrowContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!lastPos) return;

            let modelsWithDist =[];
            Object.keys(AR_MODELS).forEach(key => {
                const id = parseInt(key);
                const config = AR_MODELS[id];
                if (id !== 0 && config.lat && config.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    modelsWithDist.push({ id: id, dist: dist, title: config.title });
                }
            });

            modelsWithDist.sort((a, b) => a.dist - b.dist);
            const top2 = modelsWithDist.slice(0, 2);

            tourOptions.innerHTML = '';
            top2.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'tour-btn';
                const distStr = item.dist < 1000 ? Math.round(item.dist) + " m" : (item.dist/1000).toFixed(1) + " km";
                btn.innerHTML = `🚶 ${item.title} (${distStr})`;
                btn.onclick = (ev) => {
                    ev.stopPropagation();
                    manualTargetId = item.id;
                    tourSelection.style.display = 'none'; 
                    updateGNSSUI(); 
                    if(gnssGroup.visible) updateGNSSObjects(); 
                };
                tourOptions.appendChild(btn);
            });

            tourSelection.style.display = tourSelection.style.display === 'flex' ? 'none' : 'flex';
        });

        // Abbruch der Touren-Auswahl.
        cancelTourBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            manualTargetId = null;
            tourSelection.style.display = 'none';
            updateGNSSUI();
            if(gnssGroup.visible) updateGNSSObjects();
        });

        // ANPASSUNG 4: Klick-Ereignis des Texterkennungs-Buttons, leitet nur noch zur Info-Tafel HTML weiter.
        document.getElementById('ocrBtn').addEventListener('click', () => {
            window.open('Texterkennung_Informationstafeln.html', '_blank');
        });

        document.getElementById('viewerBtn').addEventListener('click', () => {
            window.open('Model_Viewer_AR_MA.html', '_blank');
        });

        switchCamBtn.addEventListener('click', () => { mindarThree.switchCamera(); });
        
        toggleMapBtn.addEventListener('click', () => {
            const isVisible = mapContainer.style.display === 'block';
            if (isVisible) { mapContainer.style.display = 'none'; toggleMapBtn.innerText = '🗺️'; toggleMapBtn.style.background = 'rgba(30, 30, 30, 0.85)'; }
            else { mapContainer.style.display = 'block'; toggleMapBtn.innerText = '✖'; toggleMapBtn.style.background = 'rgba(150, 0, 0, 0.85)'; if (mapStations) { setTimeout(() => mapStations.invalidateSize(), 50); } }
        });

        rotLeftBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
            ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z -= 0.2;
                
                if(gnssMeshes[id]) {
                    if (gnssMeshes[id].visible) gnssMeshes[id].rotation.y -= 0.2;
                    if (gnssMeshes[id].userData.animMesh && gnssMeshes[id].userData.animMesh.visible) gnssMeshes[id].userData.animMesh.rotation.y -= 0.2;
                }
                
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { 
                    if(m.visible) m.rotation.y -= 0.2; 
                });
            });
        });
        
        rotRightBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
             ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z += 0.2;
                
                if(gnssMeshes[id]) {
                    if (gnssMeshes[id].visible) gnssMeshes[id].rotation.y += 0.2;
                    if (gnssMeshes[id].userData.animMesh && gnssMeshes[id].userData.animMesh.visible) gnssMeshes[id].userData.animMesh.rotation.y += 0.2;
                }
                
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { 
                    if(m.visible) m.rotation.y += 0.2; 
                });
            });
        });

        modelInfo.addEventListener('click', () => { if (activeLink) window.open(activeLink, '_blank'); });
        
        // Raycaster: Ermittelt, welches 3D-Objekt auf dem Bildschirm berührt wurde.
        document.body.addEventListener('click', (event) => {
            if (event.target.closest('.ui-panel') || 
                event.target.closest('#mapControls') || 
                event.target.closest('.leaflet-container') ||
                event.target.closest('.icon-btn') ||
                event.target.closest('#tourSelection')) { 
                return;
            }

            if (!camera) return;
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster(); raycaster.setFromCamera(mouse, camera);
            
            let objectsToCheck =[];
            Object.values(loadedMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            Object.values(mindARMeshes).forEach(meshArray => {
                if (Array.isArray(meshArray)) { meshArray.forEach(m => { if(m.visible) objectsToCheck.push(m); }); }
            });
            
            Object.values(gnssMeshes).forEach(m => { 
                if(m.visible) objectsToCheck.push(m); 
                if(m.userData.animMesh && m.userData.animMesh.visible) objectsToCheck.push(m.userData.animMesh);
            });
            
            if(objectsToCheck.length === 0) return;
            const intersects = raycaster.intersectObjects(objectsToCheck, true);
            
            if (intersects.length > 0) {
                let clickedObj = intersects[0].object;
                
                while(clickedObj.parent && clickedObj.parent.type !== 'Scene') {
                     
                     for(let[key, val] of Object.entries(gnssMeshes)) {
                         
                         let isStaticHit = (val === clickedObj);
                         let isAnimHit = (val.userData.animMesh === clickedObj);
                         
                         if(isStaticHit || isAnimHit) {
                             
                             if (val.userData.animMesh && !val.userData.animMesh.visible) {
                                 val.visible = false;
                                 
                                 val.userData.animMesh.position.copy(val.position);
                                 val.userData.animMesh.rotation.copy(val.rotation);
                                 val.userData.animMesh.scale.copy(val.scale);
                                 
                                 val.userData.animMesh.visible = true;
                                 
                                 if (val.userData.animAction) {
                                     val.userData.animAction.reset();
                                     val.userData.animAction.play();
                                 }
                                 
                                 let label = isSimulatedPos ? "Pos. Simulation" : "GNSS";
                                 updateUIForModel(parseInt(key), label);
                                 return; 
                             } 
                             else {
                                 activeLink = AR_MODELS[key].link;
                                 let label = isSimulatedPos ? "Pos. Simulation" : "GNSS";
                                 updateUIForModel(parseInt(key), label);
                                 window.open(activeLink, '_blank');
                                 return;
                             }
                         }
                     }
                     
                     for(let id in mindARMeshes) {
                         if(mindARMeshes[id].includes(clickedObj)) {
                             activeLink = AR_MODELS[id].link;
                             updateUIForModel(parseInt(id), "MindAR");
                             window.open(activeLink, '_blank');
                             return;
                         }
                     }
                     
                     clickedObj = clickedObj.parent;
                }
                if (currentTrackingID !== -1 && activeLink) window.open(activeLink, '_blank');
            }
        });
    </script>
</body>
