<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- 
      Das hier ist wichtig für Handys. 
      Es sorgt dafür, dass die Webseite genau so breit ist wie der Bildschirm 
      und dass der Benutzer nicht versehentlich rein- oder rauszoomen kann.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - AR Marker Viewer</title>
    
    <style>
        /* --- DESIGN UND AUSSEHEN (CSS) --- */

        /* Grundeinstellungen: Alles soll den vollen Bildschirm füllen, keine Ränder. */
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background-color: #000; /* Schwarzer Hintergrund */
            overflow: hidden; /* Verhindert Scrollbalken */
            font-family: 'Segoe UI', sans-serif; /* Schriftart */
        }

        /* Der Hauptcontainer, in dem alles passiert */
        #container { position: relative; width: 100%; height: 100%; }
        
        /* 
           Wir arbeiten mit Schichten (Layern), wie bei einem Sandwich:
           
           Schicht 1 (Unten): Das Video-Canvas.
           Hier wird das Kamerabild gezeichnet und der rote Rahmen um den Marker.
           'pointer-events: none' bedeutet: Man kann nicht draufklicken, Klicks gehen durch.
        */
        #videoCanvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1; 
            pointer-events: none; 
        }
        
        /* 
           Schicht 2 (Oben): Das 3D-Canvas (Three.js).
           Hier schweben die 3D-Modelle. 
           'pointer-events: auto' bedeutet: Hier kann man klicken (z.B. auf die Statue).
        */
        #threeCanvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 2; 
            pointer-events: auto; 
        }
        
        /* 
           Das eigentliche Video-Element verstecken wir. 
           Wir brauchen es nur als Datenquelle, sehen wollen wir es aber im 'videoCanvas'.
        */
        video { 
            position: absolute; top: 0; left: 0; 
            width: 1px; height: 1px; 
            opacity: 0; 
            pointer-events: none; 
        }
        
        /* Der Text, der beim Laden in der Mitte steht */
        #loadingText {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); /* Exakt zentrieren */
            color: white; 
            z-index: 50; /* Liegt über allem */
            pointer-events: none; 
            text-align: center;
        }

        /* Aussehen für die dunklen Info-Boxen und Buttons */
        .ui-box {
            position: absolute; 
            z-index: 100; /* Ganz weit oben */
            background: rgba(30, 30, 30, 0.85); /* Dunkelgrau, leicht durchsichtig */
            border: 1px solid #888; 
            color: white; 
            border-radius: 8px; /* Abgerundete Ecken */
            backdrop-filter: blur(5px); /* Milchglas-Effekt */
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); /* Schatten */
        }

        /* Positionierung der Buttons */
        #camBtn { bottom: 20px; right: 20px; padding: 12px 20px; font-weight: bold; cursor: pointer; }
        #closeBtn { top: 20px; right: 20px; width: 40px; height: 40px; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        /* Buttons zum Drehen der Statue */
        .rot-btn {
            bottom: 20px; width: 50px; height: 50px; 
            font-size: 24px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none; /* Text kann nicht markiert werden */
        }
        #rotLeft { left: 20px; }
        #rotRight { left: 80px; }

        /* Die technische Info-Box oben links (Koordinaten) */
        #poseInfo {
            top: 20px; left: 20px; padding: 12px; font-size: 13px; line-height: 1.4; 
            pointer-events: none; min-width: 200px; font-family: monospace; /* Schreibmaschinen-Schrift */
        }
        #poseInfo strong { 
            display: block; margin-bottom: 8px; color: #00ffff; font-family: sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        /* Die Info-Box für das erkannte Objekt (unten Mitte) */
        #objectInfo {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; text-align: center;
            display: none; /* Ist am Anfang unsichtbar */
            padding: 15px;
        }
        #objTitle { margin: 0 0 5px 0; font-size: 1.1rem; color: #4f4; /* Hellgrün */ }
        #objText { margin: 0; font-size: 0.9rem; color: #ddd; }

        /* Der Hinweis "Tippe auf das Modell" */
        #clickHint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: yellow; text-shadow: 1px 1px 2px black; font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0; transition: opacity 0.5s;
            font-size: 1.2rem; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Das Gerüst unserer App -->
    <div id="container">
        <!-- Button zum Schließen -->
        <button id="closeBtn" class="ui-box">✕</button>
        
        <!-- Info-Box oben links (zeigt Koordinaten X, Y, Z an) -->
        <div id="poseInfo" class="ui-box">
            <strong>Status</strong>
            <div id="infoContent">Warte auf Marker (ID 0-3)...</div>
        </div>

        <!-- Info-Box unten (zeigt Name der Statue an) -->
        <div id="objectInfo" class="ui-box">
            <h3 id="objTitle">Titel</h3>
            <p id="objText">Beschreibung</p>
            <small style="color:#aaa; display:block; margin-top:5px;">(Tippen zum Öffnen)</small>
        </div>

        <!-- Hinweis in der Mitte des Bildschirms -->
        <div id="clickHint">👆 Tippe auf das Modell!</div>

        <!-- Bedien-Buttons unten -->
        <button id="camBtn" class="ui-box">📷</button>
        <button id="rotLeft" class="ui-box rot-btn">↺</button>
        <button id="rotRight" class="ui-box rot-btn">↻</button>
        
        <!-- Ladebildschirm -->
        <div id="loadingText">
            Starte System...<br>
            <span id="modelStatus" style="color: yellow;">Lade Ressourcen...</span>
        </div>
        
        <!-- Die technische Basis: Video und Zeichenflächen -->
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- 
      Hier laden wir fremde Programme (Bibliotheken), die uns Arbeit abnehmen.
      - aruco.js / cv.js: Erkennt die schwarz-weißen Marker im Bild.
      - svd.js / posit1.js: Berechnet Mathe, um zu wissen, wo der Marker im 3D-Raum ist.
      - three.js: Eine sehr bekannte Bibliothek, um 3D-Grafik im Browser anzuzeigen.
    -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // ==========================================
        // TEIL 1: EINSTELLUNGEN & DATEN
        // ==========================================

        // Welches Marker-Set nutzen wir? (MIP_36h12 ist sehr stabil)
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        
        // Wie groß ist der ausgedruckte Marker in echt? (in Millimetern)
        // Das ist wichtig, damit die App weiß, wie weit weg der Marker ist.
        const markerSize = 100.0; 
        
        // Hier speichern wir alle Infos zu unseren 3D-Modellen
        // ID ist die Nummer des ArUco-Markers.
        const AR_MODELS = {
            0: {
                url: '3D_models/Koenig.glb', // Wo liegt die Datei?
                scale: 500.0,                // Wie groß soll sie sein?
                title: 'König Georg I.',
                info: 'Referenzmodell (ID 0)',
                link: null                   // Kein Link bei Klick
            },
            1: {
                url: '3D_models/Statue_3D.glb',
                scale: 500.0, 
                title: 'Niederdeutscher Blumengarten',
                info: 'Sandsteinstatue "Veritas" von 1730',
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Gro%C3%9Fer-Garten/Der-Niederdeutsche-Blumengarten'
            },
            2: {
                url: '3D_models/BorghesischerFechter_3D.glb',
                scale: 500.0,
                title: 'Borghesischer Fechter',
                info: 'Borghesischer Fechter am Gartentheater',
                link: 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen'
            },
            3: {
                url: '3D_models/GrosseFontaine.glb',
                scale: 500.0,
                title: 'Große Fontäne',
                info: 'Große Fontäne - Wahrzeichen des Großen Gartens',
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst'
            }
        };

        // Filter: Marker, die kleiner als 30 Pixel im Bild sind, ignorieren wir (zu weit weg/Rauschen)
        const minMarkerSize = 30; 
        
        // Wenn der Marker mal kurz nicht erkannt wird (z.B. Hand davor),
        // warten wir 30 Bilder lang, bevor wir das 3D-Modell ausblenden.
        const maxLossFrames = 30; 

        // Wir holen uns die HTML-Elemente in JavaScript-Variablen, damit wir sie steuern können.
        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const loadingText = document.getElementById('loadingText');
        const modelStatus = document.getElementById('modelStatus');
        const infoContent = document.getElementById('infoContent');
        const clickHint = document.getElementById('clickHint');
        const objectInfo = document.getElementById('objectInfo');
        
        // Der "Pinsel" für das 2D-Zeichnen (roter Rahmen)
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        // Globale Variablen (Behälter für Daten, die wir überall brauchen)
        let detector, posit;      // ArUco Erkennung & Positionsberechnung
        let renderer, scene, camera; // Three.js Grundbausteine
        let markerGroup;          // Eine Gruppe, in die wir alle Modelle stecken
        
        // Hier merken wir uns die geladenen 3D-Modelle, damit wir sie nicht immer neu laden müssen
        const loadedMeshes = {}; 
        
        // Status-Variablen
        let currentTrackingID = -1; // Welche ID sehen wir gerade? (-1 = keine)
        let lossCounter = 0;        // Zähler: Wie lange ist der Marker schon weg?
        let activeLink = null;      // Welcher Link soll bei Klick geöffnet werden?

        let currentFacingMode = 'environment'; // 'environment' = Rückkamera, 'user' = Frontkamera
        let stream = null;          // Der Videostream der Kamera
        let isVideoReady = false;   // Ist das Video bereit?

        // Glättung (Smoothing): Damit das Modell nicht zittert, bewegen wir es sanft zur neuen Position
        const lerpFactor = 0.15; // Wir bewegen uns pro Bild 15% der Strecke zum Ziel
        let targetPosition = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion(); // Quaternion ist Mathe für Drehungen
        
        // Raycaster: Brauchen wir, um zu erkennen, ob der Nutzer auf ein 3D-Objekt tippt
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ==========================================
        // TEIL 2: START (INITIALISIERUNG)
        // ==========================================

        // Sobald die Webseite fertig geladen ist, geht es los:
        window.onload = () => {
            // ArUco Detektor starten
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            
            // 3D-Welt aufbauen
            initThreeJS();
            
            // Alle 3D-Modelle herunterladen und vorbereiten
            loadAllModels(); 
            
            // Kamera einschalten
            startCamera();
            
            // Klick-Events einrichten
            setupInteractions();
            
            // Die Endlosschleife starten (Animation Loop)
            requestAnimationFrame(tick);
        };

        // Wenn man das Fenstergröße ändert, passen wir alles an
        window.addEventListener('resize', onResize);
        
        // Schließen-Button Funktion
        document.getElementById('closeBtn').addEventListener('click', () => {
            // Wenn möglich zurück, sonst Fenster schließen
            if(window.history.length > 1) window.history.back(); else window.close();
        });

        // Kamera wechseln Button
        camBtn.addEventListener('click', () => {
            // Wechsel zwischen Front- und Rückkamera
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        // Rotations Buttons (Links / Rechts drehen)
        document.getElementById('rotLeft').addEventListener('click', () => rotateCurrentModel(-0.2));
        document.getElementById('rotRight').addEventListener('click', () => rotateCurrentModel(0.2));

        // Funktion zum Drehen des Modells
        function rotateCurrentModel(amount) {
            // Wir drehen nur, wenn wir gerade ein Modell anzeigen
            if (currentTrackingID !== -1 && loadedMeshes[currentTrackingID]) {
                loadedMeshes[currentTrackingID].rotation.z += amount;
            }
        }

        // Klicks auf das 3D-Canvas und die Info-Box abfangen
        function setupInteractions() {
            threeCanvas.addEventListener('click', onCanvasClick, false);
            objectInfo.addEventListener('click', () => {
                if (activeLink) window.open(activeLink, '_blank'); // Link im neuen Tab öffnen
            });
        }

        // Was passiert beim Klick auf den Bildschirm?
        function onCanvasClick(event) {
            if (currentTrackingID === -1 || !activeLink) return;
            event.preventDefault(); // Standardverhalten verhindern

            // Wo wurde geklickt? (Maus oder Finger)
            let clientX = event.clientX;
            let clientY = event.clientY;
            if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            }

            // Umrechnung der Klick-Koordinaten für Three.js (-1 bis +1)
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            // Wir schießen einen unsichtbaren Strahl von der Kamera durch den Klickpunkt
            raycaster.setFromCamera(mouse, camera);
            
            // Prüfen, ob der Strahl das aktuelle 3D-Modell trifft
            const currentMesh = loadedMeshes[currentTrackingID];
            if (currentMesh && currentMesh.visible) {
                const intersects = raycaster.intersectObjects([currentMesh], true);
                if (intersects.length > 0) {
                    // Treffer! Link öffnen.
                    window.open(activeLink, '_blank');
                }
            }
        }

        // Three.js (3D-Engine) vorbereiten
        function initThreeJS() {
            // Der Renderer malt das 3D-Bild. alpha: true macht den Hintergrund durchsichtig (für AR).
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // Scharfes Bild auf Handys

            // Die Szene ist unsere Welt
            scene = new THREE.Scene();
            
            // Die Kamera in der 3D-Welt
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000); 
            scene.add(camera);
            
            // Licht hinzufügen, sonst ist alles schwarz
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // Grundlicht
            const dl = new THREE.DirectionalLight(0xffffff, 2.0); // "Sonnenlicht"
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            // Eine Gruppe erstellen. Wir bewegen später die ganze Gruppe, nicht jedes Modell einzeln.
            markerGroup = new THREE.Group();
            scene.add(markerGroup);
            markerGroup.visible = false; // Am Anfang unsichtbar
        }

        // Alle Modelle aus der Liste laden
        function loadAllModels() {
            const loader = new THREE.GLTFLoader(); // Werkzeug zum Laden von .glb Dateien
            const ids = Object.keys(AR_MODELS); // Liste aller IDs (0, 1, 2, 3)
            let loadedCount = 0;

            ids.forEach(id => {
                const config = AR_MODELS[id];
                loader.load(config.url, (gltf) => {
                    const model = gltf.scene;
                    // Modell skalieren und drehen, damit es aufrecht auf dem Marker steht
                    model.scale.set(config.scale, config.scale, config.scale);
                    model.position.z = 0; 
                    model.rotation.x = Math.PI / 2; // 90 Grad drehen

                    // --- SPEZIALFALL: Fontäne (ID 3) ---
                    // Wenn es die Fontäne ist, fügen wir den Wasser-Effekt hinzu
                    if (id === '3') {
                        const particles = createWaterEffect();
                        model.add(particles); // Partikel an das Modell kleben
                        model.userData.particles = particles; // Merken, damit wir sie animieren können
                    }
                    // -----------------------------------

                    model.visible = false; // Erstmal verstecken
                    
                    markerGroup.add(model); // Zur Gruppe hinzufügen
                    loadedMeshes[id] = model; // In unserer Liste speichern

                    loadedCount++;
                    // Ladeanzeige aktualisieren
                    modelStatus.innerText = `Lade Modelle (${loadedCount}/${ids.length})...`;
                    
                    // Wenn alle fertig sind:
                    if(loadedCount === ids.length) {
                        modelStatus.innerText = "Bereit! Scanne Marker.";
                        modelStatus.style.color = "#00ff00";
                        // Text nach 2 Sekunden ausblenden
                        setTimeout(() => { loadingText.style.display = 'none'; }, 2000);
                    }
                }, undefined, (err) => {
                    console.error("Fehler bei ID " + id, err);
                });
            });
        }

        // ==========================================
        // TEIL 3: WASSER EFFEKT (PARTIKEL)
        // ==========================================
        
        // Erstellt viele kleine Punkte (Partikel) für das Wasser
        function createWaterEffect() {
            const geometry = new THREE.BufferGeometry();
            const count = 500; // 500 Wassertropfen
            const positions = new Float32Array(count * 3); // X, Y, Z für jeden Tropfen
            const velocities = new Float32Array(count * 3); // Geschwindigkeit für jeden Tropfen

            for (let i = 0; i < count; i++) {
                // Startposition: 0,0,0 (Mitte der Fontäne)
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = 0;
                
                // Zufällige Geschwindigkeit geben, damit es spritzt
                velocities[i * 3] = (Math.random() - 0.5) * 0.1; // Streuung zur Seite
                velocities[i * 3 + 1] = Math.random() * 0.3 + 0.2; // Schnell nach oben
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.1; // Streuung zur Seite
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // Aussehen der Tropfen
            const material = new THREE.PointsMaterial({
                color: 0x88ccff, // Hellblau
                size: 0.2, 
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending // Lässt überlappende Tropfen heller leuchten
            });

            const points = new THREE.Points(geometry, material);
            points.userData.velocities = velocities; // Geschwindigkeiten merken
            
            return points;
        }

        // Bewegt die Wassertropfen (wird jedes Bild aufgerufen)
        function updateWaterEffect(points) {
            const positions = points.geometry.attributes.position.array;
            const velocities = points.userData.velocities;
            const count = positions.length / 3;

            for (let i = 0; i < count; i++) {
                // Position ändern basierend auf Geschwindigkeit
                positions[i * 3] += velocities[i * 3];
                positions[i * 3 + 1] += velocities[i * 3 + 1];
                positions[i * 3 + 2] += velocities[i * 3 + 2];

                // Schwerkraft simulieren (zieht nach unten)
                velocities[i * 3 + 1] -= 0.01;

                // Wenn der Tropfen den Boden berührt (Y < 0)
                if (positions[i * 3 + 1] < 0) {
                    // Zurücksetzen zur Quelle und neu starten
                    positions[i * 3] = 0;
                    positions[i * 3 + 1] = 0;
                    positions[i * 3 + 2] = 0;
                    velocities[i * 3] = (Math.random() - 0.5) * 0.05;
                    velocities[i * 3 + 1] = Math.random() * 0.3 + 0.2;
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05;
                }
            }
            // Three.js sagen, dass sich die Positionen geändert haben
            points.geometry.attributes.position.needsUpdate = true;
        }

        // ==========================================
        // TEIL 4: KAMERA & BILDVERARBEITUNG
        // ==========================================

        // Passt alles an, wenn sich die Fenstergröße ändert
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                // POSIT ist der Algorithmus, der aus dem 2D-Bild die 3D-Position berechnet
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        // Stellt die virtuelle Kamera so ein, dass sie zur echten Kamera passt
        function updateThreeJSCamera(cw, ch) {
            const focalLength = cw; 
            // Berechnet den Sichtwinkel (FOV - Field of View)
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            camera.fov = fovRad * (180 / Math.PI);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        // Startet den Zugriff auf die Webcam
        function startCamera() {
            isVideoReady = false;
            // Falls schon ein Stream läuft (z.B. beim Wechseln), stoppen wir ihn
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        // Feuert, wenn das Video bereit ist
        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
        });

        // ==========================================
        // TEIL 5: DIE HAUPTSCHLEIFE (TICK)
        // ==========================================
        // Diese Funktion wird ca. 60 Mal pro Sekunde aufgerufen.
        // Hier passiert die ganze Magie.

        function tick() {
            requestAnimationFrame(tick); // Sagt dem Browser: Ruf mich beim nächsten Bild wieder auf

            // --- ANIMATIONEN ---
            // König (ID 0) dreht sich immer
            if (loadedMeshes[0] && loadedMeshes[0].visible) {
                loadedMeshes[0].rotation.z += 0.01; 
            }

            // Fontäne (ID 3) Wasser animieren
            if (loadedMeshes[3] && loadedMeshes[3].visible && loadedMeshes[3].userData.particles) {
                updateWaterEffect(loadedMeshes[3].userData.particles);
            }

            let markerFound = false;

            // Wenn die Kamera läuft und ein Bild hat
            if (isVideoReady && video.videoWidth > 0) {
                // 1. Videobild auf den 2D-Canvas malen
                drawVideoFullscreen();

                // 2. Bilddaten auslesen für die Analyse
                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                
                // 3. ArUco Marker suchen
                let markers = detector.detect(imageData);

                // Filter: Zu kleine Marker rauswerfen (Rauschen)
                markers = markers.filter(m => {
                    const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                    return d > minMarkerSize;
                });

                // Filter: ID 97 ignorieren (wie gewünscht)
                markers = markers.filter(m => m.id !== 97);

                // Wenn wir gültige Marker gefunden haben:
                if (markers.length > 0) {
                    markerFound = true;
                    lossCounter = 0; // Verlust-Zähler zurücksetzen
                    
                    const marker = markers[0]; // Wir nehmen den ersten gefundenen Marker
                    const id = marker.id;

                    // Rote Box und Text zeichnen (Visuelles Feedback)
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, id);

                    // Ecken für die Mathe-Berechnung zentrieren
                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));
                    
                    // 4. Position und Drehung im 3D-Raum berechnen (POSIT)
                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        // Achsen (Rot/Grün/Blau) zeichnen
                        drawAxis(pose.bestRotation, pose.bestTranslation, markerSize);
                        // Text oben links aktualisieren (Koordinaten)
                        updatePoseUI(pose.bestRotation, pose.bestTranslation, id);
                        
                        // Zielposition für die 3D-Gruppe setzen
                        updateObjectTargets(pose.bestRotation, pose.bestTranslation);

                        // Wenn wir ein Modell für diese ID haben:
                        if (AR_MODELS[id]) {
                            // Wenn wir auf einen neuen Marker gewechselt haben:
                            if (currentTrackingID !== id) {
                                // Altes Modell verstecken
                                if (currentTrackingID !== -1 && loadedMeshes[currentTrackingID]) {
                                    loadedMeshes[currentTrackingID].visible = false;
                                }
                                
                                currentTrackingID = id;
                                
                                // Neues Modell anzeigen
                                if (loadedMeshes[id]) {
                                    loadedMeshes[id].visible = true;
                                }

                                // Info-Boxen und Links aktualisieren
                                updateInfoUI(id);
                            }

                            markerGroup.visible = true; // Die ganze Gruppe sichtbar machen
                        }
                    }
                }
            }

            // Wenn kein Marker gefunden wurde
            if (!markerFound) {
                lossCounter++;
                // Wenn der Marker länger als 30 Bilder (ca. 0,5 Sek) weg ist:
                if (lossCounter > maxLossFrames) {
                    markerGroup.visible = false; // Modell verstecken
                    clickHint.style.opacity = 0; // Hinweis verstecken
                    objectInfo.style.display = 'none'; // Info-Box verstecken
                    infoContent.innerText = "Kein Marker erkannt";
                    currentTrackingID = -1;
                    activeLink = null;
                }
            }

            // Glättung anwenden (Modell bewegt sich sanft zum Ziel)
            if (markerGroup.visible) {
                markerGroup.position.lerp(targetPosition, lerpFactor);
                markerGroup.quaternion.slerp(targetQuaternion, lerpFactor);
            }

            // Das 3D-Bild berechnen und anzeigen
            renderer.render(scene, camera);
        }

        // ==========================================
        // TEIL 6: HELFER-FUNKTIONEN UND UI
        // ==========================================

        // Aktualisiert Titel und Text unten, wenn ein Marker erkannt wurde
        function updateInfoUI(id) {
            const data = AR_MODELS[id];
            if (!data) return;
            activeLink = data.link;

            // ID 0 (König) soll keine Info-Box haben
            if (id === 0) {
                clickHint.style.opacity = 0;
                objectInfo.style.display = 'none'; 
                return;
            }

            // Text setzen
            document.getElementById('objTitle').innerText = data.title;
            document.getElementById('objText').innerText = data.info;
            objectInfo.style.display = 'block'; // Box anzeigen
            
            // "Tippe auf Modell" Hinweis anzeigen
            clickHint.style.opacity = 1;
        }

        // Mathe-Hilfe: Rechnet 3D-Koordinaten in 2D-Bildschirmkoordinaten um
        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -1000, y: -1000 }; // Hinter der Kamera
            const f = videoCanvas.width; 
            const scale = f / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        // Zeichnet die bunten Achsen auf den Marker
        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans); // Ursprung
            const ax = project([len, 0, 0], rot, trans); // X-Achse
            const ay = project([0, len, 0], rot, trans); // Y-Achse
            const az = project([0, 0, len], rot, trans); // Z-Achse
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            context2D.strokeStyle = "lime"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        // Zeigt Koordinaten in der Box oben links an
        function updatePoseUI(r, t, id) {
            // Wir müssen die Koordinaten umrechnen, um sie verständlich anzuzeigen
            const m = new THREE.Matrix4();
            m.set(r[0][0], r[0][1], r[0][2], t[0], -r[1][0], -r[1][1], -r[1][2], -t[1], -r[2][0], -r[2][1], -r[2][2], -t[2], 0, 0, 0, 1);
            const inv = m.invert();
            const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const scale = new THREE.Vector3();
            inv.decompose(pos, quat, scale);
            // Umrechnung in cm für bessere Lesbarkeit
            const x = (pos.x / 10).toFixed(0); const y = (pos.y / 10).toFixed(0); const z = (pos.z / 10).toFixed(0);
            
            infoContent.innerHTML = `<span style="color:yellow;">Marker ID: ${id}</span><br>X: ${x}cm Y: ${y}cm Z: ${z}cm`;
        }

        // Malt das Video so, dass es den ganzen Bildschirm füllt (wie 'object-fit: cover' in CSS)
        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            // Mathematik um das Seitenverhältnis zu berechnen
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        // Malt den roten Rahmen um den Marker
        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)"; context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        // Schreibt die ID (Nummer) an den Marker
        function drawIdText(corners, id) {
            const pt = corners[0]; context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black"; context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        // Berechnet die Ziel-Position für unser 3D-Modell aus den Marker-Daten
        function updateObjectTargets(r, t) {
            targetPosition.set(t[0], -t[1], -t[2]); // Achsen anpassen
            const m = new THREE.Matrix4();
            // Rotationsmatrix füllen
            m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
            targetQuaternion.setFromRotationMatrix(m);
        }
    </script>
