<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Viewport-Einstellungen für mobile Geräte (verhindert Zoomen durch den Nutzer) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - Augmented Reality (AR)</title>
    
    <!-- Leaflet CSS: Stylesheet für die Kartenansicht (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importmap: Definiert, woher die Browser-Module für Three.js und MindAR geladen werden -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <!-- Styles (CSS): Definiert das Aussehen der Benutzeroberfläche -->
    <style>
        /* Grundlegendes Layout: Vollbild, schwarzer Hintergrund, keine Scrollbalken */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Das eigentliche Video-Element wird versteckt, da Three.js es auf den Canvas zeichnet */
        #videoElement { display: none; }

        /* Canvas für Debugging-Linien (ArUco Marker Erkennung) */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; pointer-events: none; /* Klicks gehen durch */
        }

        /* Der Hauptcontainer für die 3D-Szene (MindAR / Three.js) */
        #container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: auto; overflow: hidden;
        }

        /* Gemeinsame Klasse für alle halbtransparenten UI-Boxen */
        .ui-panel {
            position: absolute;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6); /* Halbtransparentes Schwarz */
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            backdrop-filter: blur(8px); /* Weichzeichner für den Hintergrund */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Info-Fenster oben links (Titel und Status) */
        #debugInfo {
            top: 20px; left: 20px;
            padding: 15px;
            min-width: 200px;
            max-width: calc(100% - 100px); 
            font-size: 13px;
            pointer-events: none;
        }

        /* Titelformatierung im Info-Fenster */
        #debugInfo strong {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px; /* Kleine Schriftgröße wie gewünscht */
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
            line-height: 1.3;
        }

        /* Roter Schließen-Button oben rechts */
        #closeBtn {
            top: 20px; right: 20px;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px;
            cursor: pointer;
            background: rgba(200, 40, 40, 0.85);
            border: 1px solid rgba(255, 100, 100, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #closeBtn:active { transform: scale(0.95); } /* Klick-Effekt */

        /* Informations-Popup für 3D-Modelle (unten mittig) */
        #modelInfo {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%; max-width: 400px;
            text-align: center;
            display: none; cursor: pointer;
            z-index: 200; 
        }
        #modelInfo h3 { color: #4f4; margin: 0 0 4px 0; font-size: 18px; font-weight: bold; }
        #modelInfo p { color: #eee; margin: 0; font-size: 14px; line-height: 1.3; }

        /* Historisches Bild (Kupferstich) - Rechts mittig positioniert */
        #historicalInfo {
            display: none; 
            top: 50%; 
            right: 20px;
            left: auto;
            transform: translateY(-50%); /* Exakte vertikale Zentrierung */
            width: 180px; 
            padding: 10px;
            text-align: center;
            z-index: 250;
        }
        #historicalInfo h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #ffda85; 
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 4px;
        }
        #historicalInfo img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Container für Karte und Buttons unten rechts */
        #mapControls {
            position: absolute; bottom: 20px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
        }

        /* Container für die Leaflet-Karte */
        #mapContainer {
            position: relative; width: 240px; height: 180px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; pointer-events: auto;
        }

        #mapStations { width: 100%; height: 100%; }

        /* Buttons innerhalb der Karte (Overlay) */
        .map-btn-overlay {
            position: absolute; top: 5px; right: 5px;
            display: flex; flex-direction: column; gap: 4px; z-index: 1000;
        }

        /* Styling für kleine Icons */
        .icon-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 4px; padding: 6px;
            cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 14px;
        }

        .bottom-right-btns { display: flex; gap: 12px; }

        .action-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer; position: relative;
        }

        /* Buttons zum Rotieren der Modelle unten links */
        #rotationControls {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            display: flex; gap: 12px;
        }

        .rotate-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 26px; cursor: pointer; position: relative;
        }

        /* Hinweis-Text "Tippe auf das Modell" */
        #clickHint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; font-size: 1.3rem;
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Pfeil für die Richtung zum nächsten GPS-Ziel */
        #direction-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 95;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); pointer-events: none;
            transition: opacity 0.5s; opacity: 0;
        }
        #arrow {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 30px solid #00ff00; /* Grüner Pfeil */
            transform-origin: center 20px; /* Drehpunkt für Rotation */
            filter: drop-shadow(0 0 4px #00ff00);
            transform: rotate(0deg);
            transition: transform 0.2s ease-out;
        }

        /* Hilfsklassen für Textfarben */
        .label-small { font-size: 11px; color: #bbb; margin-right: 5px; text-transform: uppercase; }
        .val-highlight { color: #fff; font-weight: bold; }
        .val-green { color: #4f4; font-weight: bold; }

    </style>
</head>
<body>

    <!-- HTML Elemente -->
    <video id="videoElement" playsinline muted autoplay></video>
    <div id="container"></div>
    <canvas id="videoCanvas"></canvas>

    <!-- Info Panel oben links -->
    <div id="debugInfo" class="ui-panel">
        <strong id="debugTitle">Herrenhäuser Gärten - Augmented Reality (AR)</strong>
        <div id="statusText">Starte System...<br><span style='color: #aaa;'>Initialisiere...</span></div>
    </div>

    <!-- Schließen Button -->
    <div id="closeBtn" class="ui-panel" title="Schließen" onclick="window.history.length > 1 ? window.history.back() : window.close()">✕</div>

    <!-- Panel für das historische Bild (nur bei Fontäne sichtbar) -->
    <div id="historicalInfo" class="ui-panel">
        <h4>Kupferstich Große Fontäne um 1800</h4>
        <img src="https://herrenhaeuser-gaerten.hannover.de/var/storage/images/_aliases/alias_1600xVariabel/9/4/8/5/25555849-2-ger-DE/a12171440e88-Stich_Grosse_Fontaene.jpg" alt="Historischer Stich">

    <!-- Einbindung externer Bibliotheken (Leaflet für Karte, ArUco für Marker) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    
    <!-- Hauptskript als ES6 Modul -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // --- KONFIGURATIONSEINSTELLUNGEN ---
        const markerSize = 100.0; // Größe des physischen Markers in Millimetern
        const selectedDictionary = 'ARUCO_MIP_36h12'; // ArUco Marker Typ
        const VISIBILITY_DISTANCE = 75.0; // Entfernung in Metern, ab der GPS-Objekte sichtbar werden
        
        // Definition der 3D-Modelle und ihrer Eigenschaften
        const AR_MODELS = {
            0: { 
                url: '3D_models/Koenig.glb', 
                scale: 150.0, 
                title: 'König Georg I.', 
                info: 'Referenzmodell (ID 0)', 
                link: null,
                lat: null, lon: null 
            },
            1: { 
                url: '3D_models/Statue_3D.glb', 
                scale: 90.0, 
                title: 'Niederdeutscher Blumengarten', 
                info: 'Sandsteinstatue "Veritas" von 1730', 
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Gro%C3%9Fer-Garten/Der-Niederdeutsche-Blumengarten',
                useMindAR: true, // Nutzt auch Bilderkennung
                lat: 52.388194, lon: 9.697861 
            },
            2: { 
                url: '3D_models/BorghesischerFechter_WebAR.glb', 
                scale: 26000.0, 
                title: 'Borghesischer Fechter', 
                info: 'Borghesischer Fechter am Gartentheater', 
                link: 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen',
                lat: 52.389472, lon: 9.699222 
            },
            3: { 
                url: '3D_models/GrosseFontaine_WebAR.glb', 
                scale: 8000.0, // Sehr große Skalierung für die Fontäne
                title: 'Große Fontäne', 
                info: 'Große Fontäne - Wahrzeichen des Großen Gartens', 
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
                isAnimated: true,
                lat: 52.385968, lon: 9.695931 
            },
            33: {
                url: '3D_models/GrosseFontaine_WebAR.glb',
                scale: 8000.0,
                title: 'Große Fontäne',
                info: 'Große Fontäne (Standort 2)',
                link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst',
                isAnimated: true,
                lat: 52.388778, lon: 9.817775
            }
        };

        // Stationen für die Kartenansicht
        const stations = [
            { title: 'Große Fontaine', coords: [52.385968, 9.695931] },
            { title: 'Goldenes Tor', coords: [52.390184, 9.699546] },
            { title: 'Haupteingang mit Kasse', coords: [52.391185, 9.698368] },
            { title: 'Niki de Saint Phalle - Grotte', coords: [52.390713, 9.696767] },
            { title: 'Sommer - Statue', coords: [ 52.389583, 9.697833] },
            { title: 'Borghesischer Fechter', coords: [52.389472, 9.699222] },
            { title: 'Niederdeutscher Blumengarten', coords: [52.388194, 9.697861] }
        ];

        // --- ZUGRIFF AUF HTML ELEMENTE ---
        const videoCanvas = document.getElementById('videoCanvas');
        const statusText = document.getElementById('statusText');
        const modelInfo = document.getElementById('modelInfo');
        const objTitle = document.getElementById('objTitle');
        const objText = document.getElementById('objText');
        const clickHint = document.getElementById('clickHint');
        const arrowContainer = document.getElementById('direction-indicator');
        const arrowEl = document.getElementById('arrow');
        const historicalInfo = document.getElementById('historicalInfo');

        const switchCamBtn = document.getElementById('switchCamBtn');
        const toggleMapBtn = document.getElementById('toggleMapBtn');
        const rotLeftBtn = document.getElementById('rotLeftBtn');
        const rotRightBtn = document.getElementById('rotRightBtn');
        const mapEl = document.getElementById('mapStations');
        const mapContainer = document.getElementById('mapContainer');
        const locateBtn = document.getElementById('locateBtn');
        const orientBtn = document.getElementById('orientBtn');

        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        // --- STATUS VARIABLEN ---
        let activeLink = null;
        let loadedMeshes = {}; // Gespeicherte 3D-Modelle
        let mindARMeshes = {}; 
        let gpsMeshes = {};    
        let detector, posit; // ArUco Erkennung
        let mindarThree, renderer, scene, camera, mindarAnchor;
        let markerGroup, gpsGroup;
        
        let lastPos = null; // Letzte bekannte GPS Position
        let heading = 0; // Kompass-Ausrichtung
        let mapStations, userLayer;
        let currentTrackingID = -1;
        let lossCounter = 0;
        const maxLossFrames = 30; // Frames warten, bevor Marker als verloren gilt
        let hintTimeout = null;
        let isMarkerTracking = false;
        let closestObjForArrow = null;

        // --- PARTIKELSYSTEM FÜR WASSEREFFEKT ---
        // Erstellt die Wasser-Partikel für die Fontäne
        function createWaterEffect() {
            const particleCount = 5000; // Anzahl der Wassertropfen erhöht
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3); // X, Y, Z für jeden Punkt
            const velocities = new Float32Array(particleCount * 3); // Geschwindigkeit für jeden Punkt

            for (let i = 0; i < particleCount; i++) {
                // Startposition aller Tropfen ist 0,0,0 (Ursprung der Fontäne)
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                
                // --- GESCHWINDIGKEIT UND RICHTUNG ---
                
                // Breite/Streuung (X und Y): Wert erhöht für breiteren Strahl
                // (Math.random() - 0.5) erzeugt Werte zwischen -0.5 und 0.5
                velocities[i*3] = (Math.random() - 0.5) * 0.0008; 
                velocities[i*3+1] = (Math.random() - 0.5) * 0.0008;
                
                // Höhe (Z): Negativ, da das Modell um 180 Grad gedreht ist
                // Wert erhöht (0.01 bis 0.03), damit es höher spritzt
                velocities[i*3+2] = -(Math.random() * 0.02 + 0.01); 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // Material (Aussehen) der Wassertropfen
            const material = new THREE.PointsMaterial({
                color: 0xaaddff,  // Hellblau
                size: 0.0025,     // Dickerer Strahl: Größe angepasst an Skalierung 8000
                transparent: true,
                opacity: 0.6,     // Leicht durchsichtig
                blending: THREE.AdditiveBlending, // Leucht-Effekt bei Überlagerung
                depthWrite: false
            });

            const points = new THREE.Points(geometry, material);
            // Speichern der Geschwindigkeiten im Objekt für späteren Zugriff
            points.userData.vels = velocities;
            
            // WICHTIG: Frustum Culling ausschalten, damit Partikel immer sichtbar bleiben
            points.frustumCulled = false;

            return points;
        }

        // Aktualisiert die Position der Wassertropfen in jedem Frame (Animation)
        function updateWaterEffect(points) {
            const pos = points.geometry.attributes.position.array;
            const vels = points.userData.vels;
            // Schwerkraft: Zieht die Tropfen nach unten (in positive Z-Richtung, da gedreht)
            const gravity = 0.0005; 

            for (let i = 0; i < pos.length / 3; i++) {
                // Position um Geschwindigkeit verschieben
                pos[i*3] += vels[i*3];     // X
                pos[i*3+1] += vels[i*3+1]; // Y
                pos[i*3+2] += vels[i*3+2]; // Z (Höhe)

                // Schwerkraft anwenden (Beschleunigung nach unten)
                vels[i*3+2] += gravity; 

                // Wenn der Tropfen den Boden erreicht (Z > 0, da wir ins Negative schießen)
                if (pos[i*3+2] > 0) {
                    // Reset auf Startposition
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
                    
                    // Neue zufällige Geschwindigkeit vergeben (Reset)
                    // Breite Streuung
                    vels[i*3] = (Math.random() - 0.5) * 0.0008;
                    vels[i*3+1] = (Math.random() - 0.5) * 0.0008;
                    // Hoher Ausstoß
                    vels[i*3+2] = -(Math.random() * 0.02 + 0.01);
                }
            }
            // Three.js mitteilen, dass sich die Positionen geändert haben
            points.geometry.attributes.position.needsUpdate = true;
        }

        // --- STARTFUNKTION FÜR AR ---
        const startAR = async () => {
            // Initialisierung von MindAR
            mindarThree = new MindARThree({
                container: document.querySelector("#container"),
                imageTargetSrc: 'ImageMatching/NiederdeutscherBlumengarten_targets.mind',
                uiLoading: "no", uiScanning: "no", uiError: "no",
                filterMinCF: 0.0001, filterBeta: 0.001 // Filter für ruhigeres Tracking
            });

            renderer = mindarThree.renderer;
            scene = mindarThree.scene;
            camera = mindarThree.camera;

            // Hintergrund transparent machen (für Kamera-Feed)
            renderer.setClearColor(0x000000, 0);
            
            // Licht zur Szene hinzufügen
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // Grundhelligkeit
            const dl = new THREE.DirectionalLight(0xffffff, 2.0); // Sonnenlicht
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            // Gruppen für Marker und GPS Objekte erstellen
            markerGroup = new THREE.Group(); markerGroup.visible = false; scene.add(markerGroup);
            gpsGroup = new THREE.Group(); gpsGroup.visible = true; scene.add(gpsGroup);
            
            // MindAR Anker setzen (für Bilderkennung)
            mindarAnchor = mindarThree.addAnchor(0); 

            // Modelle laden
            loadModels();
            
            // AR System starten
            await mindarThree.start();

            // Render-Schleife (wird ca. 60 mal pro Sekunde ausgeführt)
            renderer.setAnimationLoop(() => {
                const video = mindarThree.video;
                
                // Animation der Fontänen aktualisieren, falls sichtbar
                if (loadedMeshes[3]?.visible && loadedMeshes[3].userData.particles) updateWaterEffect(loadedMeshes[3].userData.particles);
                if (gpsMeshes[3]?.visible && gpsMeshes[3].userData.particles) updateWaterEffect(gpsMeshes[3].userData.particles);
                if (gpsMeshes[33]?.visible && gpsMeshes[33].userData.particles) updateWaterEffect(gpsMeshes[33].userData.particles);

                // Suche nach ArUco Markern im Videobild
                const arucoFound = processArucoFrame(video);
                const mindActive = mindarAnchor && mindarAnchor.group.visible;

                isMarkerTracking = arucoFound || mindActive;

                // Umschalten zwischen Marker-Modus und GPS-Modus
                if (isMarkerTracking) {
                    gpsGroup.visible = false; 
                    arrowContainer.style.opacity = 0; // Pfeil ausblenden
                } else {
                    gpsGroup.visible = true;
                    updateGPSUI();
                    updateGPSObjects();
                    updateArrow(); // Pfeil aktualisieren
                }

                renderer.render(scene, camera);
            });
        }

        // Lädt alle in AR_MODELS definierten 3D-Modelle
        function loadModels() {
            const loader = new GLTFLoader();
            const ids = Object.keys(AR_MODELS);
            let loadedCount = 0;

            ids.forEach(idStr => {
                const id = parseInt(idStr);
                const config = AR_MODELS[id];
                
                // Laden des Modells
                loader.load(config.url, (gltf) => {
                    
                    // 1. Version für Marker (ArUco)
                    const modelAruco = gltf.scene.clone();
                    modelAruco.scale.set(config.scale, config.scale, config.scale);
                    modelAruco.rotation.x = Math.PI / 2; // Aufrichten
                    
                    // Spezielle Rotation um Z-Achse für bestimmte Modelle (z.B. Fontäne)
                    if (id === 1 || id === 2 || id === 3 || id === 33) modelAruco.rotation.z += Math.PI;

                    // Partikelsystem hinzufügen für Fontäne (ID 3 und 33)
                    if (id === 3 || id === 33) {
                        const p = createWaterEffect();
                        modelAruco.add(p); 
                        modelAruco.userData.particles = p; // Referenz speichern für Animation
                    }

                    modelAruco.visible = false;
                    markerGroup.add(modelAruco);
                    loadedMeshes[id] = modelAruco;

                    // 2. Version für GPS
                    if (config.lat && config.lon) {
                        const modelGPS = gltf.scene.clone();
                        // GPS Modelle sind kleiner skaliert in dieser Logik
                        const gpsScale = config.scale * 0.05; 
                        modelGPS.scale.set(gpsScale, gpsScale, gpsScale);
                        
                        if (id === 3 || id === 33) {
                             const pG = createWaterEffect();
                             modelGPS.add(pG); modelGPS.userData.particles = pG;
                        }
                        modelGPS.visible = false;
                        gpsGroup.add(modelGPS);
                        gpsMeshes[id] = modelGPS;
                    }

                    // 3. Version für MindAR (Bilderkennung)
                    if (config.useMindAR) {
                        const modelMind = gltf.scene.clone();
                        const mindScale = config.scale * 0.015;
                        modelMind.scale.set(mindScale, mindScale, mindScale);
                        modelMind.rotation.y = Math.PI; // Zum Nutzer drehen
                        mindarAnchor.group.add(modelMind);
                        mindARMeshes[id] = modelMind;
                        
                        // Event wenn Bild erkannt wird
                        mindarAnchor.onTargetFound = () => {
                            updateUIForModel(id, "MindAR Image");
                            modelAruco.visible = false; 
                        };
                    }
                    
                    loadedCount++;
                    if (loadedCount === ids.length) {
                        statusText.innerHTML = `System bereit.<br><span class="val-green">Warte auf Marker oder GNSS...</span>`;
                    }
                });
            });
        }

        // Aktualisiert die UI-Anzeige für GPS Daten
        function updateGPSUI() {
            if (!lastPos) {
                 statusText.innerHTML = "Warte auf GPS Signal...";
                 return;
            }

            // Finde das nächstgelegene Objekt
            let closestDist = 99999;
            let closestObj = null;

            Object.keys(AR_MODELS).forEach(key => {
                const m = AR_MODELS[key];
                if(m.lat && m.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, m.lat, m.lon);
                    if(dist < closestDist) {
                        closestDist = dist;
                        closestObj = m;
                    }
                }
            });
            
            closestObjForArrow = closestObj;

            if (closestObj) {
                const distStr = closestDist < 1000 ? Math.round(closestDist) + " m" : (closestDist/1000).toFixed(1) + " km";
                const latStr = lastPos.latitude.toFixed(5) + "°";
                const lonStr = lastPos.longitude.toFixed(5) + "°";
                const accStr = "± " + Math.round(lastPos.accuracy || 0) + " m";
                const compassStr = Math.round(heading) + "°";

                statusText.innerHTML = `
                    <span class="label-small">Position (GNSS)</span> <span class="val-highlight">${latStr}, ${lonStr}</span><br>
                    <span class="label-small">Genauigkeit</span> <span class="val-highlight">${accStr}</span><br>
                    <span class="label-small">Kompass</span> <span class="val-highlight">${compassStr}</span><br>
                    <div style="margin: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2);"></div>
                    <span class="label-small">POI</span> <span class="val-green">${closestObj.title}</span><br>
                    <span class="label-small">Entfernung</span> <span class="val-highlight">${distStr}</span>
                `;
            }
        }
        
        // Rotiert den grünen Pfeil in Richtung des Ziels
        function updateArrow() {
            if (!lastPos || !closestObjForArrow) {
                arrowContainer.style.opacity = 0;
                return;
            }
            arrowContainer.style.opacity = 1;
            // Berechnet Winkel zum Ziel
            const bearing = calculateBearing(lastPos.latitude, lastPos.longitude, closestObjForArrow.lat, closestObjForArrow.lon);
            // Zieht eigene Kompassrichtung ab
            const relativeAngle = bearing - heading;
            arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
        }

        // Prüft, ob GPS Objekte in der Nähe sind und zeigt sie an
        function updateGPSObjects() {
            if (!lastPos || isMarkerTracking) return;
            
            // Rotiert die gesamte GPS-Gruppe entsprechend dem Kompass
            gpsGroup.rotation.y = THREE.MathUtils.degToRad(heading);

            Object.keys(gpsMeshes).forEach(key => {
                const id = parseInt(key);
                const mesh = gpsMeshes[id];
                const config = AR_MODELS[id];

                if (config.lat && config.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    
                    // Sichtbarkeitsprüfung (75 Meter)
                    if (dist < VISIBILITY_DISTANCE) {
                        mesh.visible = true;
                        
                        // Historisches Bild anzeigen, wenn es die Fontäne ist
                        if (id === 3 || id === 33) {
                             historicalInfo.style.display = 'block';
                        } else if ((currentTrackingID === 3 || currentTrackingID === 33) && (id !== 3 && id !== 33)) {
                             // Bild ausblenden, wenn ein anderes Objekt getrackt wird
                             historicalInfo.style.display = 'none';
                        }

                        // Position berechnen relativ zum Nutzer
                        const offset = calcOffset(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                        mesh.position.set(offset.x * 2, -10, -offset.z * 2); 
                        mesh.lookAt(0, mesh.position.y, 0);
                    } else {
                        mesh.visible = false;
                        if (id === 3 || id === 33) historicalInfo.style.display = 'none';
                    }
                }
            });
        }

        // Berechnet Entfernung zwischen zwei GPS Punkten (Haversine Formel)
        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Erdradius in Metern
            const rad = Math.PI/180;
            const dLat = (lat2-lat1)*rad;
            const dLon = (lon2-lon1)*rad;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Berechnet X/Z Versatz in Metern für Three.js Szene
        function calcOffset(lat1, lon1, lat2, lon2) {
            const R = 6378137; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const dx = dLon * Math.cos(lat1Rad) * R;
            const dz = dLat * R; 
            return { x: dx, z: dz };
        }
        
        // Berechnet den Kompasswinkel zum Ziel
        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * (Math.PI / 180);
            const startLngRad = startLng * (Math.PI / 180);
            const destLatRad = destLat * (Math.PI / 180);
            const destLngRad = destLng * (Math.PI / 180);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            let brng = Math.atan2(y, x);
            brng = brng * (180 / Math.PI);
            return (brng + 360) % 360;
        }

        // Analysiert das Video auf ArUco Marker
        function processArucoFrame(video) {
            if (!video || video.readyState < video.HAVE_METADATA) return false;

            const cw = videoCanvas.width; const ch = videoCanvas.height;
            if (cw !== window.innerWidth || ch !== window.innerHeight) {
                videoCanvas.width = window.innerWidth;
                videoCanvas.height = window.innerHeight;
                posit = new POS.Posit(markerSize, window.innerWidth);
            }

            // Video auf den Canvas zeichnen zur Analyse
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            
            context2D.clearRect(0, 0, cw, ch);
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            const imageData = context2D.getImageData(0, 0, cw, ch);
            context2D.clearRect(0, 0, cw, ch); 

            // Marker erkennen
            let markers = detector.detect(imageData);
            markers = markers.filter(m => {
                const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                return d > 30 && m.id !== 97; // Filtert zu kleine Marker und ID 97
            });

            let found = false;

            if (markers.length > 0) {
                markers.forEach(marker => {
                    // Zeichnet roten Rahmen um Marker
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);
                    const cornersCentered = marker.corners.map(c => ({ x: c.x - (cw / 2), y: (ch / 2) - c.y }));
                    const pose = posit.pose(cornersCentered);
                    
                    if (pose) {
                        const r = pose.bestRotation; const t = pose.bestTranslation;
                        drawAxis(r, t, markerSize);
                        const id = marker.id;
                        
                        if (AR_MODELS[id] && marker === markers[0]) {
                            found = true; lossCounter = 0;
                            updatePoseUI(r, t, id, "ArUco");
                            
                            // Berechnet Position und Rotation für Three.js
                            const targetPos = new THREE.Vector3(t[0], -t[1], -t[2]);
                            const m = new THREE.Matrix4();
                            m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
                            const fullQuat = new THREE.Quaternion().setFromRotationMatrix(m);
                            
                            // Nur die Y-Rotation (Gieren) übernehmen, damit Modell gerade steht
                            const euler = new THREE.Euler().setFromQuaternion(fullQuat, 'YXZ');
                            const uprightQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, euler.y, 0));
                            
                            updateActiveModelArUco(id, targetPos, uprightQuat);
                        }
                    }
                });
            }

            const mindActive = mindarAnchor && mindarAnchor.group.visible;
            if (!found) {
                if (mindActive) {
                    lossCounter = 0;
                    statusText.innerHTML = `
                        <span class="val-green">Gefunden: Image Target (MindAR)</span><br>
                        <div style="margin-top:8px; padding-top:5px; border-top:1px solid #777;">
                            <span class="label-small">Tracking</span><br>
                            Optische Bilderkennung aktiv
                        </div>
                    `;
                } else {
                    // Marker Verlust Zähler
                    lossCounter++;
                    if (lossCounter > maxLossFrames) {
                        markerGroup.visible = false;
                        if (currentTrackingID !== -1) {
                             modelInfo.style.display = 'none';
                             clickHint.style.opacity = 0;
                             historicalInfo.style.display = 'none'; 
                             currentTrackingID = -1;
                        }
                    }
                }
            }
            return found;
        }

        // --- KARTEN FUNKTIONEN ---
        function initMap() {
            mapStations = L.map(mapEl).setView([52.3895, 9.6975], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(mapStations);
            stations.forEach(s => { L.marker(s.coords).addTo(mapStations).bindPopup(`<strong>${s.title}</strong>`); });
            userLayer = L.layerGroup().addTo(mapStations);

            // Button: Zum eigenen Standort springen
            locateBtn.addEventListener('click', (e) => { e.stopPropagation(); if (lastPos) mapStations.setView([lastPos.latitude, lastPos.longitude], 17); else mapStations.locate({ setView: true, maxZoom: 17 }); });
            
            // Button: Karte nach Kompass ausrichten
            orientBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { const res = await DeviceOrientationEvent.requestPermission(); if (res === 'granted') { window.addEventListener('deviceorientation', onDeviceOrientation, true); orientBtn.style.background = '#4f4'; } } catch (err) { console.warn(err); }
                } else { window.addEventListener('deviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onDeviceOrientation, true); orientBtn.style.background = '#4f4'; }
            });
            setTimeout(() => { if (navigator.geolocation) { navigator.geolocation.watchPosition(onPos, err => console.warn(err), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }); } }, 1500);
        }

        // Wird aufgerufen, wenn neue GPS Daten da sind
        function onPos(pos) {
            lastPos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy || 5 };
            drawUserOnMap(lastPos);
            if (mapStations && !mapStations._userCentered) { mapStations.setView([lastPos.latitude, lastPos.longitude], 17); mapStations._userCentered = true; }
        }

        // Wird aufgerufen, wenn sich der Kompass ändert
        function onDeviceOrientation(e) {
            let alpha = e.alpha; 
            if (e.webkitCompassHeading) alpha = e.webkitCompassHeading; 
            if (alpha == null) return;
            heading = (360 - alpha) % 360; 
            if (lastPos) drawUserOnMap(lastPos);
        }

        // Zeichnet den Nutzer auf der Karte ein (Pfeil)
        function drawUserOnMap(p) {
            if (!userLayer) return; userLayer.clearLayers();
            L.circle([p.latitude, p.longitude], { radius: Math.max(p.accuracy, 4), color: 'rgba(255,0,0,0.6)', fillColor: 'rgba(255,0,0,0.12)', weight: 1 }).addTo(userLayer);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${heading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/><circle cx="0" cy="10" r="3" fill="red"/></g></svg>`;
            const url = 'data:image/svg+xml;base64,' + btoa(svg);
            const icon = L.icon({ iconUrl: url, iconSize: [48, 48], iconAnchor: [24, 24], className: 'user-arrow' });
            L.marker([p.latitude, p.longitude], { icon: icon, interactive: false }).addTo(userLayer);
        }

        // --- HELFER FUNKTIONEN FÜR VISUALISIERUNG ---
        // Projiziert 3D Punkt auf 2D Canvas
        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -1000, y: -1000 };
            const f = videoCanvas.width; const scale = f / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        // Zeichnet Koordinatenachsen auf dem Marker
        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans);
            const ax = project([len, 0, 0], rot, trans);
            const ay = project([0, len, 0], rot, trans);
            const az = project([0, 0, len], rot, trans);
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            context2D.strokeStyle = "lime"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        // Zeichnet roten Rahmen um Marker
        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        // Zeichnet ID Text über Marker
        function drawIdText(corners, id, source = "ArUco") {
            const pt = corners[0];
            context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        // Aktualisiert die Debug-Informationen oben links
        function updatePoseUI(r, t, id, source = "ArUco") {
            const m = new THREE.Matrix4();
            m.set(r[0][0], r[0][1], r[0][2], t[0], -r[1][0], -r[1][1], -r[1][2], -t[1], -r[2][0], -r[2][1], -r[2][2], -t[2], 0, 0, 0, 1);
            const inv = m.clone().invert();
            const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const sc = new THREE.Vector3();
            inv.decompose(pos, quat, sc);
            const euler = new THREE.Euler().setFromQuaternion(quat);
            const x = (pos.x / 10).toFixed(0); const y = (pos.y / 10).toFixed(0); const z = (pos.z / 10).toFixed(0);
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);

            statusText.innerHTML = `
                <span style="color:yellow;">Gefunden: ID ${id} (${source})</span><br>
                <div style="margin-top:8px; padding-top:5px; border-top:1px solid #777;">
                    <span class="label-small">Position (Relativ zw. Smartphone - Marker)</span><br>X: ${x} cm | Y: ${y} cm | Z: ${z} cm
                </div>
                <div style="margin-top:8px;">
                    <span class="label-small">Rotation (relativ)</span><br>Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°
                </div>
            `;
        }

        // Zeigt kurz den Hinweis zum Klicken an
        function triggerHint() {
            clickHint.style.opacity = 1;
            if (hintTimeout) clearTimeout(hintTimeout);
            hintTimeout = setTimeout(() => { clickHint.style.opacity = 0; }, 10000);
        }

        // Aktualisiert das Info-Fenster unten
        function updateUIForModel(id, sourceName) {
            if (currentTrackingID !== id) {
                currentTrackingID = id;
                modelInfo.style.display = (id === 0 ? 'none' : 'block');
                
                if (id === 3 || id === 33) {
                    historicalInfo.style.display = 'block';
                } else {
                    historicalInfo.style.display = 'none';
                }

                objTitle.innerText = AR_MODELS[id].title;
                objText.innerText = AR_MODELS[id].info;
                activeLink = AR_MODELS[id].link;
                triggerHint();
            }
        }

        // Positioniert das gefundene Marker-Modell
        function updateActiveModelArUco(id, pos, quat) {
            if (AR_MODELS[id]) {
                Object.keys(loadedMeshes).forEach(key => { loadedMeshes[key].visible = (parseInt(key) === id); });
                updateUIForModel(id, "ArUco");
                markerGroup.visible = true;
                markerGroup.position.lerp(pos, 0.2);
                markerGroup.quaternion.slerp(quat, 0.2);
            }
        }

        // Initialisierung des Trackers
        detector = new AR.Detector({ dictionaryName: selectedDictionary });
        posit = new POS.Posit(markerSize, window.innerWidth);
        initMap();
        startAR();

        // Event Listeners für Buttons
        switchCamBtn.addEventListener('click', () => { mindarThree.switchCamera(); });
        toggleMapBtn.addEventListener('click', () => {
            const isVisible = mapContainer.style.display === 'block';
            if (isVisible) { mapContainer.style.display = 'none'; toggleMapBtn.innerText = '🗺️'; toggleMapBtn.style.background = 'rgba(30, 30, 30, 0.85)'; }
            else { mapContainer.style.display = 'block'; toggleMapBtn.innerText = '✖'; toggleMapBtn.style.background = 'rgba(150, 0, 0, 0.85)'; if (mapStations) { setTimeout(() => mapStations.invalidateSize(), 50); } }
        });

        rotLeftBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
            ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z -= 0.2;
                if(mindARMeshes[id] && mindARMeshes[id].parent.visible) mindARMeshes[id].rotation.y -= 0.2;
                if(gpsMeshes[id] && gpsMeshes[id].visible) gpsMeshes[id].rotation.y -= 0.2;
            });
        });
        rotRightBtn.addEventListener('click', () => { 
            const ids = Object.keys(AR_MODELS);
             ids.forEach(id => {
                if(loadedMeshes[id] && loadedMeshes[id].visible) loadedMeshes[id].rotation.z += 0.2;
                if(mindARMeshes[id] && mindARMeshes[id].parent.visible) mindARMeshes[id].rotation.y += 0.2;
                if(gpsMeshes[id] && gpsMeshes[id].visible) gpsMeshes[id].rotation.y += 0.2;
            });
        });

        // Interaktion mit 3D Objekten (Raycasting)
        modelInfo.addEventListener('click', () => { if (activeLink) window.open(activeLink, '_blank'); });
        
        document.body.addEventListener('click', (event) => {
            if (!camera) return;
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            const raycaster = new THREE.Raycaster(); raycaster.setFromCamera(mouse, camera);
            let objectsToCheck = [];
            Object.values(loadedMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            Object.values(mindARMeshes).forEach(m => { if(m.parent && m.parent.visible) objectsToCheck.push(m); });
            Object.values(gpsMeshes).forEach(m => { if(m.visible) objectsToCheck.push(m); });
            if(objectsToCheck.length === 0) return;
            const intersects = raycaster.intersectObjects(objectsToCheck, true);
            if (intersects.length > 0) {
                let clickedObj = intersects[0].object;
                while(clickedObj.parent && clickedObj.parent.type !== 'Scene') {
                     for(let [key, val] of Object.entries(gpsMeshes)) {
                         if(val === clickedObj) {
                             activeLink = AR_MODELS[key].link;
                             updateUIForModel(parseInt(key), "GNSS");
                             window.open(activeLink, '_blank');
                             return;
                         }
                     }
                     clickedObj = clickedObj.parent;
                }
                if (currentTrackingID !== -1 && activeLink) window.open(activeLink, '_blank');
            }
        });

    </script>
