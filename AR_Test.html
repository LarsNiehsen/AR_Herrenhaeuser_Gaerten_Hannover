<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & ThreeJS</title>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        
        /* Layer 1: 2D Canvas (Video) */
        #videoCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* Layer 2: 3D Canvas - WICHTIG: pointer-events: auto damit Klicks ankommen! */
        #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto; }
        
        video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        
        #loadingText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 50; pointer-events: none; text-align: center;
        }

        .ui-box {
            position: absolute; z-index: 100; background: rgba(30, 30, 30, 0.85); 
            border: 1px solid #888; color: white; border-radius: 8px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        #camBtn { bottom: 20px; right: 20px; padding: 12px 20px; font-weight: bold; cursor: pointer; }
        #closeBtn { top: 20px; right: 20px; width: 40px; height: 40px; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        #poseInfo {
            top: 20px; left: 20px; padding: 15px; font-size: 14px; line-height: 1.5; 
            pointer-events: none; min-width: 260px; font-family: monospace;
        }
        #poseInfo strong { 
            display: block; margin-bottom: 8px; color: #00ffff; font-family: sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; 
        }
        
        /* Hinweis für Klickbarkeit */
        #clickHint {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: yellow; text-shadow: 1px 1px 2px black; font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="container">
        <button id="closeBtn" class="ui-box">✕</button>
        
        <div id="poseInfo" class="ui-box">
            <strong>Relative Lage (Cam -> Marker)</strong>
            <div id="infoContent">Suche Marker...</div>
        </div>

        <div id="clickHint">👆 Tippe auf die Statue für mehr Infos!</div>

        <button id="camBtn" class="ui-box">Kamera wechseln</button>
        <div id="loadingText">
            Systemstart...<br>
            <span id="modelStatus" style="color: yellow;">Lade Modell...</span>
        </div>
        
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 100.0; // mm
        
        const modelPath = '3D_models/Koenig.glb';
        const targetUrl = "https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst";

        // Skalierung
        const modelScale = 500.0; 
        
        const minMarkerSize = 30; 
        const maxLossFrames = 30; 
        // ---------------------

        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const closeBtn = document.getElementById('closeBtn');
        const loadingText = document.getElementById('loadingText');
        const modelStatus = document.getElementById('modelStatus');
        const infoContent = document.getElementById('infoContent');
        const clickHint = document.getElementById('clickHint');
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        let detector, posit;
        let renderer, scene, camera;
        let markerGroup, koenigModel; 
        
        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;
        let isModelLoaded = false;

        // Smoothing Variablen (nur für das 3D Modell)
        const lerpFactor = 0.15; 
        let targetPosition = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion();
        let isTrackingID0 = false;
        let lossCounter = 0; 

        // Raycaster für Klick-Erkennung
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();
            startCamera();
            setupInteractions();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);
        
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        closeBtn.addEventListener('click', () => {
            if(window.history.length > 1) window.history.back();
            else window.close();
        });

        function setupInteractions() {
            threeCanvas.addEventListener('click', onCanvasClick, false);
        }

        function onCanvasClick(event) {
            // Nur klicken, wenn Tracking aktiv und Modell sichtbar
            if (!isTrackingID0 || !koenigModel || !markerGroup.visible) return;

            event.preventDefault();

            let clientX, clientY;
            if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([koenigModel], true);

            if (intersects.length > 0) {
                console.log("Modell angeklickt! Öffne URL...");
                window.open(targetUrl, '_blank');
            }
        }

        function initThreeJS() {
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000); 
            scene.add(camera);
            
            // Licht
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); 
            const dl = new THREE.DirectionalLight(0xffffff, 2.0);
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // GLB Laden
            const loader = new THREE.GLTFLoader();
            loader.load(modelPath, function (gltf) {
                koenigModel = gltf.scene;
                koenigModel.scale.set(modelScale, modelScale, modelScale);
                koenigModel.position.z = 0; 
                koenigModel.rotation.x = Math.PI / 2; 

                markerGroup.add(koenigModel);
                
                isModelLoaded = true;
                modelStatus.innerText = "Modell bereit!";
                modelStatus.style.color = "#00ff00";
            }, undefined, function (error) {
                console.error(error);
                modelStatus.innerText = "FEHLER: Datei nicht gefunden!";
                modelStatus.style.color = "red";
            });

            markerGroup.visible = false;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        function updateThreeJSCamera(cw, ch) {
            const focalLength = cw;
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            camera.fov = fovRad * (180 / Math.PI);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        function tick() {
            requestAnimationFrame(tick);

            // Animation
            if (koenigModel) {
                koenigModel.rotation.z += 0.05; 
            }

            let detectedID0 = false;

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();

                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                // Filter
                markers = markers.filter(m => {
                    const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                    return d > minMarkerSize;
                });

                if (markers.length > 0) {
                    const marker = markers[0]; // Nimm den besten Marker
                    
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);

                    // --- POSE BERECHNUNG FÜR ALLE MARKER ---
                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));
                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        // 1. UI Update: Zeige Daten für JEDEN Marker an
                        updatePoseUI(pose.bestRotation, pose.bestTranslation, marker.id);

                        // 2. Spezialbehandlung für ID 0 (König)
                        if (marker.id === 0 && isModelLoaded) {
                            detectedID0 = true;
                            lossCounter = 0;
                            
                            // Setze Zielposition für 3D Modell
                            updateObjectTargets(pose.bestRotation, pose.bestTranslation);
                            
                            markerGroup.visible = true;
                            isTrackingID0 = true;
                            clickHint.style.opacity = 1; 
                        }
                    }
                } else {
                    // Kein Marker im Bild? Text zurücksetzen
                    if (!isTrackingID0) {
                         // Nur überschreiben, wenn wir nicht gerade ID 0 tracken (wegen Glättung)
                         // Oder einfach stehen lassen. Hier setzen wir es zurück:
                         // infoContent.innerHTML = "Suche Marker...";
                    }
                }
            }

            // --- TRACKING STATUS ID 0 ---
            if (!detectedID0 && isTrackingID0) {
                lossCounter++;
                if (lossCounter > maxLossFrames) {
                    isTrackingID0 = false;
                    markerGroup.visible = false;
                    clickHint.style.opacity = 0;
                    infoContent.innerHTML = "Marker verloren.";
                }
            }

            // Glättung anwenden (nur für das 3D Modell)
            if (isTrackingID0) {
                markerGroup.position.lerp(targetPosition, lerpFactor);
                markerGroup.quaternion.slerp(targetQuaternion, lerpFactor);
            }

            renderer.render(scene, camera);
        }

        // --- UI UPDATER: KAMERA RELATIV ZU MARKER ---
        function updatePoseUI(r, t, id) {
            // Wir bauen eine Matrix aus Rotation und Translation des Markers relativ zur Kamera
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], t[0],
                -r[1][0], -r[1][1], -r[1][2], -t[1],
                -r[2][0], -r[2][1], -r[2][2], -t[2],
                 0,        0,        0,       1
            );
            
            // Wir invertieren die Matrix, um die Kamera relativ zum Marker zu bekommen
            const inv = m.invert();
            
            // Zerlegen in Position, Rotation, Skalierung
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();
            const scale = new THREE.Vector3();
            inv.decompose(pos, quat, scale);
            
            // Euler Winkel für Anzeige
            const euler = new THREE.Euler().setFromQuaternion(quat);
            
            const x = (pos.x / 10).toFixed(0); // mm -> cm
            const y = (pos.y / 10).toFixed(0);
            const z = (pos.z / 10).toFixed(0);
            
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);

            infoContent.innerHTML = `
                <span style="color:yellow;">Gefunden: ID ${id}</span><br>
                <div style="margin-top:5px; border-top:1px solid #555; padding-top:5px;">
                Position (cm)<br>
                X: ${x} | Y: ${y} | Z: ${z}<br>
                </div>
                <div style="margin-top:5px;">
                Winkel (°)<br>
                P: ${pitch} | Y: ${yaw} | R: ${roll}
                </div>
            `;
        }

        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)"; context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        function drawIdText(corners, id) {
            const pt = corners[0]; context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black"; context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        // --- UPDATER FÜR 3D MODELL (NUR ID 0) ---
        function updateObjectTargets(r, t) {
            // Hier nutzen wir die Logic um das Objekt RELATIV zur Kamera zu platzieren
            // (ThreeJS Szene: Kamera ist 0,0,0, Marker bewegt sich)
            targetPosition.set(t[0], -t[1], -t[2]);
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            targetQuaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
