<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & ThreeJS</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Layer 1: 2D Canvas */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* Layer 2: 3D Canvas */
        #threeCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
        }

        video {
            position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }

        #loadingText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 50; pointer-events: none;
        }

        /* --- UI KLASSEN FÜR EINHEITLICHES DESIGN --- */
        .ui-box {
            position: absolute;
            z-index: 100;
            background: rgba(40, 40, 40, 0.85); 
            border: 1px solid #fff;
            color: white; 
            border-radius: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 1. Kamera Button (Unten Rechts) */
        #camBtn {
            bottom: 20px; 
            right: 20px; 
            padding: 12px 20px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 14px;
        }

        /* 2. Schließen Button (Oben Rechts) */
        #closeBtn {
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* 3. Info Box (Oben Links) */
        #poseInfo {
            top: 20px; 
            left: 20px; 
            padding: 15px; 
            font-size: 13px;
            line-height: 1.5;
            min-width: 220px;
            pointer-events: none; /* Klicks gehen durch */
        }
        
        #poseInfo strong {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 4px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="container">
        
        <!-- UI Elemente -->
        <button id="closeBtn" class="ui-box" title="Tab schließen">✕</button>
        
        <div id="poseInfo" class="ui-box">
            <strong>Kameraposition zu Marker</strong>
            <div id="infoContent">Warte auf Marker...</div>
        </div>

        <button id="camBtn" class="ui-box">Kamera wechseln</button>

        <div id="loadingText">Kamera wird geladen...</div>
        
        <!-- Rendering -->
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 100.0; // mm
        // ---------------------

        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const closeBtn = document.getElementById('closeBtn');
        const loadingText = document.getElementById('loadingText');
        const infoContent = document.getElementById('infoContent');
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        let detector, posit;
        let renderer, scene, camera;
        
        let markerGroup; // Die gesamte Gruppe (Marker Ursprung)
        let cubeGroup;   // Nur der drehende Würfel
        
        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;

        // Smoothing Variablen
        const lerpFactor = 0.15; 
        let targetPosition = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion();
        let isTracking = false;

        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();
            startCamera();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);
        
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        closeBtn.addEventListener('click', () => {
            // Versucht Fenster zu schließen. 
            // Hinweis: Browser blockieren dies oft, wenn Script das Fenster nicht selbst geöffnet hat.
            if(window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
                alert("Bitte Tab manuell schließen (Browser-Sicherheitsrichtlinie).");
            }
        });

        function initThreeJS() {
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
            scene.add(camera);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(0, 0, 10);
            scene.add(dl);

            // --- HAUPTGRUPPE ---
            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // 1. DICKES KOORDINATENSYSTEM (Statisch am Marker-Ursprung)
            // Wir bauen eigene Zylinder statt AxesHelper
            const axisLength = markerSize * 0.8;
            const axisThickness = markerSize * 0.04;
            const axesMesh = createThickAxes(axisLength, axisThickness);
            markerGroup.add(axesMesh);

            // 2. GELBER WÜRFEL GRUPPE (Für Animation)
            cubeGroup = new THREE.Group();
            markerGroup.add(cubeGroup);

            // Der eigentliche Würfel
            const geometry = new THREE.BoxGeometry(markerSize, markerSize, markerSize);
            const material = new THREE.MeshPhongMaterial({ color: 0xffff00, opacity: 0.5, transparent: true });
            const mesh = new THREE.Mesh(geometry, material);
            
            // Kanten
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
            
            // Würfel sitzt AUF dem Marker (z verschoben um halbe Höhe)
            mesh.position.z = markerSize / 2;
            line.position.z = markerSize / 2;

            cubeGroup.add(mesh);
            cubeGroup.add(line);

            markerGroup.visible = false;
        }

        // Hilfsfunktion für dickes Achsenkreuz
        function createThickAxes(len, thick) {
            const group = new THREE.Group();

            // Material
            const matX = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Rot
            const matY = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Grün
            const matZ = new THREE.MeshBasicMaterial({ color: 0x0000ff }); // Blau
            const geo = new THREE.CylinderGeometry(thick, thick, len, 12);
            
            // X-Achse (Rot) - muss um Z gedreht werden
            const meshX = new THREE.Mesh(geo, matX);
            meshX.rotation.z = -Math.PI / 2;
            meshX.position.x = len / 2;
            group.add(meshX);

            // Y-Achse (Grün) - Standard Zylinder ist Y-Up, aber wir wollen Y "nach oben" im 2D Sinne?
            // ThreeJS Y ist oben. Zylinder ist Y-orientiert.
            // Posit Y zeigt im Bild nach UNTEN (Image Space), aber im 3D Space nach OBEN.
            // Wir lassen Y entlang der Y-Achse.
            const meshY = new THREE.Mesh(geo, matY);
            meshY.position.y = len / 2;
            group.add(meshY);

            // Z-Achse (Blau) - muss um X gedreht werden
            const meshZ = new THREE.Mesh(geo, matZ);
            meshZ.rotation.x = Math.PI / 2;
            meshZ.position.z = len / 2;
            group.add(meshZ);

            return group;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        function updateThreeJSCamera(cw, ch) {
            const fov = 60; 
            camera.fov = fov;
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        function tick() {
            requestAnimationFrame(tick);

            // Animation NUR für den Würfel, nicht für die Achsen
            if (cubeGroup) cubeGroup.rotation.z += 0.02;

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();

                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                markers = markers.filter(m => {
                    const dx = m.corners[0].x - m.corners[1].x;
                    const dy = m.corners[0].y - m.corners[1].y;
                    return Math.sqrt(dx*dx + dy*dy) > 30;
                });

                if (markers.length > 0) {
                    const marker = markers[0];

                    drawRedBox(marker.corners);
                    // ID Text optional, da wir jetzt UI haben
                    // drawIdText(marker.corners, marker.id);

                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));

                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        updateObjectTargets(pose.bestRotation, pose.bestTranslation);
                        markerGroup.visible = true;
                        cubeGroup.visible = (marker.id === 0);
                        isTracking = true;
                    }
                }
            }

            if (isTracking) {
                // Glätten der Hauptgruppe (Achsen + Würfel bewegen sich mit Marker)
                markerGroup.position.lerp(targetPosition, lerpFactor);
                markerGroup.quaternion.slerp(targetQuaternion, lerpFactor);

                updateInfoDisplay();
            }

            renderer.render(scene, camera);
        }

        function updateInfoDisplay() {
            markerGroup.updateMatrix();
            markerGroup.updateMatrixWorld();

            const invMatrix = new THREE.Matrix4();
            invMatrix.copy(markerGroup.matrix).invert();

            const camPos = new THREE.Vector3();
            const camQuat = new THREE.Quaternion();
            const camScale = new THREE.Vector3();
            invMatrix.decompose(camPos, camQuat, camScale);
            
            const x = (camPos.x / 10).toFixed(0);
            const y = (camPos.y / 10).toFixed(0);
            const z = (camPos.z / 10).toFixed(0);

            const euler = new THREE.Euler().setFromQuaternion(camQuat, 'XYZ');
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);

            infoContent.innerHTML = `
                <div class="data-row"><span>X:</span> <span>${x} cm</span></div>
                <div class="data-row"><span>Y:</span> <span>${y} cm</span></div>
                <div class="data-row"><span>Z:</span> <span>${z} cm</span></div>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin: 6px 0;">
                <div class="data-row"><span>Pitch:</span> <span>${pitch}°</span></div>
                <div class="data-row"><span>Yaw:</span> <span>${yaw}°</span></div>
                <div class="data-row"><span>Roll:</span> <span>${roll}°</span></div>
            `;
        }

        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4;
            context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            corners.forEach((c, i) => {
                if (i === 0) context2D.moveTo(c.x, c.y);
                else context2D.lineTo(c.x, c.y);
            });
            context2D.closePath();
            context2D.stroke();
        }

        function updateObjectTargets(r, t) {
            targetPosition.set(t[0], -t[1], -t[2]);
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            targetQuaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
