<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & ThreeJS</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* Layer 1: 2D Canvas (Video, Roter Kasten, Koordinatenachsen) */
        #videoCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Layer 2: 3D Canvas (Nur der schwebende Würfel) */
        #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        #loadingText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 50; pointer-events: none;
        }

        /* --- UI DESIGN --- */
        .ui-box {
            position: absolute;
            z-index: 100;
            background: rgba(40, 40, 40, 0.9); 
            border: 1px solid #aaa;
            color: white; 
            border-radius: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        #camBtn {
            bottom: 20px; right: 20px; padding: 12px 20px; 
            font-weight: bold; cursor: pointer; font-size: 14px;
        }

        #closeBtn {
            top: 20px; right: 20px; width: 40px; height: 40px;
            font-weight: bold; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }

        #poseInfo {
            top: 20px; left: 20px; padding: 15px; 
            font-size: 13px; line-height: 1.6; pointer-events: none;
            min-width: 250px;
        }
        
        #poseInfo strong {
            display: block; margin-bottom: 8px; color: #00ffff;
            text-transform: uppercase; font-size: 11px; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="container">
        <button id="closeBtn" class="ui-box" title="Tab schließen">✕</button>
        
        <div id="poseInfo" class="ui-box">
            <strong>Relative Kameraposition - Marker</strong>
            <div id="infoContent">Suche Marker...</div>
        </div>

        <button id="camBtn" class="ui-box">Kamera wechseln</button>
        <div id="loadingText">Kamera wird geladen...</div>
        
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 100.0; // mm
        
        // FILTER & TRACKING
        const minMarkerSize = 40; 
        const maxDistortion = 0.3; 
        const maxLossFrames = 30; // Ca. 0.5 Sekunden Toleranz bevor Objekt ausgeblendet wird
        // ---------------------

        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const closeBtn = document.getElementById('closeBtn');
        const loadingText = document.getElementById('loadingText');
        const infoContent = document.getElementById('infoContent');
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        let detector, posit;
        let renderer, scene, camera;
        let markerGroup, cubeGroup; 
        
        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;

        // Smoothing & Logic Variablen
        const lerpFactor = 0.15; 
        let targetPosition = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion();
        let isTracking = false;
        let lossCounter = 0; // Zählt hoch, wenn kein Marker gefunden wird

        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();
            startCamera();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);
        
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        closeBtn.addEventListener('click', () => {
            if(window.history.length > 1) window.history.back();
            else { window.close(); alert("Bitte Tab manuell schließen."); }
        });

        function initThreeJS() {
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
            scene.add(camera);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(0, 0, 10);
            scene.add(dl);

            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // Würfel Gruppe (20cm Höhe)
            cubeGroup = new THREE.Group();
            cubeGroup.position.z = 200.0; 
            markerGroup.add(cubeGroup);

            const geometry = new THREE.BoxGeometry(markerSize, markerSize, markerSize);
            const material = new THREE.MeshPhongMaterial({ color: 0xffff00, opacity: 0.6, transparent: true });
            const mesh = new THREE.Mesh(geometry, material);
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
            
            cubeGroup.add(mesh);
            cubeGroup.add(line);
            markerGroup.visible = false;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        function updateThreeJSCamera(cw, ch) {
            // Anti-Rutsch-Korrektur: FOV berechnen basierend auf Bildbreite
            const focalLength = cw;
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            const fovDeg = fovRad * (180 / Math.PI);
            camera.fov = fovDeg; 
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        function tick() {
            requestAnimationFrame(tick);

            // Animation Würfel
            if (cubeGroup) { cubeGroup.rotation.z += 0.02; cubeGroup.rotation.x += 0.01; }

            let markerDetectedThisFrame = false;

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();

                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                // --- FILTER ---
                markers = markers.filter(m => {
                    const d1 = dist(m.corners[0], m.corners[1]);
                    if (d1 < minMarkerSize) return false;
                    const d2 = dist(m.corners[1], m.corners[2]);
                    const d3 = dist(m.corners[2], m.corners[3]);
                    const d4 = dist(m.corners[3], m.corners[0]);
                    const perimeter = d1 + d2 + d3 + d4;
                    const avg = perimeter / 4;
                    if (Math.abs(d1 - avg) > avg * maxDistortion) return false;
                    return true;
                });

                if (markers.length > 0) {
                    const marker = markers[0];
                    markerDetectedThisFrame = true;
                    lossCounter = 0; // Reset Counter

                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);

                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));

                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        updateObjectTargets(pose.bestRotation, pose.bestTranslation);
                        
                        // Sichtbarkeit aktivieren
                        markerGroup.visible = true;
                        cubeGroup.visible = (marker.id === 0);
                        isTracking = true;

                        drawAxis(pose.bestRotation, pose.bestTranslation, markerSize);
                    }
                }
            }

            // --- LOGIK FÜR TRACKING-VERLUST ---
            if (!markerDetectedThisFrame && isTracking) {
                lossCounter++;
                if (lossCounter > maxLossFrames) {
                    // Wenn zu lange kein Marker gesehen wurde: Ausblenden
                    isTracking = false;
                    markerGroup.visible = false;
                    infoContent.innerHTML = "Signal verloren.<br>Suche Marker...";
                }
            }

            if (isTracking) {
                markerGroup.position.lerp(targetPosition, lerpFactor);
                markerGroup.quaternion.slerp(targetQuaternion, lerpFactor);
                updateInfoDisplay();
            }

            renderer.render(scene, camera);
        }

        // --- HILFSFUNKTIONEN ---
        function dist(p1, p2) {
            const dx = p1.x - p2.x; const dy = p1.y - p2.y;
            return Math.sqrt(dx*dx + dy*dy);
        }

        function project(point3d, rot, trans) {
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            if (z <= 0) return { x: -100, y: -100 };
            const scale = videoCanvas.width / z;
            return { x: x * scale + (videoCanvas.width / 2), y: (videoCanvas.height / 2) - y * scale };
        }

        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans);
            const ax = project([len, 0, 0], rot, trans);
            const ay = project([0, len, 0], rot, trans);
            const az = project([0, 0, len], rot, trans);
            context2D.lineWidth = 5;
            context2D.strokeStyle = "red"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();
            context2D.strokeStyle = "green"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();
            context2D.strokeStyle = "blue"; context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        function updateInfoDisplay() {
            markerGroup.updateMatrix();
            markerGroup.updateMatrixWorld();
            const invMatrix = new THREE.Matrix4().copy(markerGroup.matrix).invert();
            const camPos = new THREE.Vector3();
            const camQuat = new THREE.Quaternion();
            const camScale = new THREE.Vector3();
            invMatrix.decompose(camPos, camQuat, camScale);
            
            const x = (camPos.x / 10).toFixed(0);
            const y = (camPos.y / 10).toFixed(0);
            const z = (camPos.z / 10).toFixed(0);
            const euler = new THREE.Euler().setFromQuaternion(camQuat, 'XYZ');
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);

            // NEUE FORMATIERUNG WIE GEWÜNSCHT
            infoContent.innerHTML = `
                Position<br>
                X: ${x} cm | Y: ${y} cm | Z: ${z} cm<br>
                <div style="margin-top:6px;"></div>
                Rotation<br>
                Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°
            `;
        }

        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4;
            context2D.strokeStyle = "rgba(255, 0, 0, 0.7)";
            context2D.beginPath();
            corners.forEach((c, i) => {
                if (i === 0) context2D.moveTo(c.x, c.y);
                else context2D.lineTo(c.x, c.y);
            });
            context2D.closePath();
            context2D.stroke();
        }

        function drawIdText(corners, id) {
            const pt = corners[0]; 
            context2D.font = "bold 24px monospace";
            context2D.textAlign = "left";
            context2D.textBaseline = "bottom";
            context2D.lineWidth = 4;
            context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; 
            context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        function updateObjectTargets(r, t) {
            targetPosition.set(t[0], -t[1], -t[2]);
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            targetQuaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
