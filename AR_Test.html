<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- 
      Viewport-Einstellungen für mobile Geräte:
      - width=device-width: Passt die Breite an den Bildschirm an.
      - user-scalable=no: Verhindert, dass der Nutzer rein/rauszoomt (wichtig für AR-Haptik).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & ThreeJS</title>
    
    <style>
        /* Grundlegendes Reset und Vollbild-Styling */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        
        /* 
           Layer 1: 2D Canvas 
           Hier wird das Kamerabild und die 2D-Zeichnungen (rote Box, Achsen) dargestellt.
           pointer-events: none ist wichtig, damit Klicks durch diesen Layer hindurchgehen.
        */
        #videoCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* 
           Layer 2: 3D Canvas (Three.js)
           Hier wird das 3D-Modell gerendert.
           pointer-events: auto aktiviert Interaktionen (Klicks auf das Modell).
        */
        #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto; }
        
        /* Das Video-Element dient nur als Datenquelle und ist unsichtbar */
        video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        
        /* Ladebildschirm-Text zentriert */
        #loadingText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 50; pointer-events: none; text-align: center;
        }

        /* Styling für UI-Elemente (halbtransparente Boxen) */
        .ui-box {
            position: absolute; z-index: 100; background: rgba(30, 30, 30, 0.85); 
            border: 1px solid #888; color: white; border-radius: 8px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Buttons positionieren */
        #camBtn { bottom: 20px; right: 20px; padding: 12px 20px; font-weight: bold; cursor: pointer; }
        #closeBtn { top: 20px; right: 20px; width: 40px; height: 40px; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        /* Info-Box oben links für Koordinaten */
        #poseInfo {
            top: 20px; left: 20px; padding: 12px; font-size: 13px; line-height: 1.4; 
            pointer-events: none; min-width: 200px; font-family: monospace;
        }
        #poseInfo strong { 
            display: block; margin-bottom: 8px; color: #00ffff; font-family: sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        /* Hinweis-Text unten mittig für Interaktion */
        #clickHint {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: yellow; text-shadow: 1px 1px 2px black; font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- UI Elemente -->
        <button id="closeBtn" class="ui-box">✕</button>
        
        <div id="poseInfo" class="ui-box">
            <strong>Relative Lage Smartphone - Marker</strong>
            <div id="infoContent">Kein ArUco Marker erkannt</div>
        </div>

        <div id="clickHint">👆 Tippe auf die Statue für weitere Informationen!</div>

        <button id="camBtn" class="ui-box">Kamera wechseln</button>
        
        <div id="loadingText">
            Starte Augemented Reality<br>
            <span id="modelStatus" style="color: yellow;">Lade 3D-Modelle ...</span>
        </div>
        
        <!-- Verstecktes Video & Zeichenflächen -->
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- 
       Externe Bibliotheken laden:
       - CV.js / ARuco.js / SVD.js / POSIT1.js: Für Bildverarbeitung und Marker-Erkennung.
       - Three.js: Für die 3D-Darstellung.
       - GLTFLoader: Um .glb/.gltf 3D-Modelle in Three.js zu laden.
    -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- KONFIGURATION ---
        // Welches ArUco-Wörterbuch verwendet wird (36h12 ist robust und schnell)
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        
        // Die reale Größe des ausgedruckten Markers in Millimetern.
        // Wichtig für die korrekte Tiefenberechnung (Z-Achse).
        const markerSize = 100.0; 
        
        // Pfad zum 3D-Modell (muss relativ zur HTML-Datei liegen)
        const modelPath = '3D_models/Koenig.glb';
        // URL, die beim Klick geöffnet wird
        const targetUrl = "https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst";

        // Skalierungsfaktor für das 3D-Modell (da GLBs oft in Metern sind, ArUco aber mm nutzt)
        const modelScale = 500.0; 
        
        // Filter-Parameter: Marker unter 30px Größe ignorieren (Rauschen vermeiden)
        const minMarkerSize = 30; 
        // Anzahl Frames, die gewartet wird, bevor das Modell ausgeblendet wird, wenn Marker verloren geht
        const maxLossFrames = 30; 
        // ---------------------

        // Referenzen auf HTML-Elemente
        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const closeBtn = document.getElementById('closeBtn');
        const loadingText = document.getElementById('loadingText');
        const modelStatus = document.getElementById('modelStatus');
        const infoContent = document.getElementById('infoContent');
        const clickHint = document.getElementById('clickHint');
        // 2D-Kontext für Zeichnungen auf dem Video-Layer
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        // Globale Variablen für ArUco und ThreeJS
        let detector, posit;
        let renderer, scene, camera;
        let markerGroup, koenigModel; 
        
        // Kamerasteuerung
        let currentFacingMode = 'environment'; // Startet mit Rückkamera
        let stream = null;
        let isVideoReady = false;
        let isModelLoaded = false;

        // Glättung (Smoothing) der Bewegung
        const lerpFactor = 0.15; // 15% Annäherung pro Frame (niedriger = weicher, aber mehr Latenz)
        let targetPosition = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion();
        
        // Status-Variablen für das Tracking
        let isTrackingID0 = false; // Wird true, wenn Marker ID 0 gefunden wurde
        let lossCounterID0 = 0;    // Zählt Frames ohne Marker ID 0

        // Zähler für allgemeinen Marker-Verlust (für Textanzeige)
        let generalLossCounter = 0;

        // Raycaster für die Klick-Interaktion im 3D-Raum
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Haupt-Initialisierung beim Laden der Seite
        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();      // 3D Szene aufbauen
            startCamera();      // Webcam starten
            setupInteractions();// Klick-Events registrieren
            requestAnimationFrame(tick); // Render-Schleife starten
        };

        // Bei Fenstergrößenänderung Canvas anpassen
        window.addEventListener('resize', onResize);
        
        // Kamera wechseln Button
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        // Schließen Button (Browser-History zurück oder Tab schließen)
        closeBtn.addEventListener('click', () => {
            if(window.history.length > 1) window.history.back();
            else window.close();
        });

        // Klick-Events auf dem 3D-Canvas registrieren
        function setupInteractions() {
            threeCanvas.addEventListener('click', onCanvasClick, false);
        }

        // Funktion zur Behandlung von Klicks auf das 3D-Modell
        function onCanvasClick(event) {
            // Nur ausführen, wenn wir gerade ID 0 tracken und das Modell sichtbar ist
            if (!isTrackingID0 || !koenigModel || !markerGroup.visible) return;
            event.preventDefault();

            // Klick-Koordinaten ermitteln (Maus oder Touch)
            let clientX, clientY;
            if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            // Umrechnung in normalisierte Gerätekoordinaten (-1 bis +1) für Three.js
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            // Raycaster von der Kamera durch den Klickpunkt schießen
            raycaster.setFromCamera(mouse, camera);
            // Prüfen, ob der Strahl das Modell trifft (rekursiv für alle Unterobjekte)
            const intersects = raycaster.intersectObjects([koenigModel], true);

            // Wenn getroffen, URL öffnen
            if (intersects.length > 0) {
                window.open(targetUrl, '_blank');
            }
        }

        // Initialisierung der Three.js Szene
        function initThreeJS() {
            // Renderer mit Transparenz (alpha: true), damit man das Video dahinter sieht
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            // Kamera-Setup (wird später in updateThreeJSCamera basierend auf Video-FOV korrigiert)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000); 
            scene.add(camera);
            
            // Beleuchtung hinzufügen
            scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // Grundhelligkeit
            const dl = new THREE.DirectionalLight(0xffffff, 2.0); // Sonne
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            // Eine Gruppe, die später die Position des Markers einnimmt
            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // GLB Modell laden
            const loader = new THREE.GLTFLoader();
            loader.load(modelPath, function (gltf) {
                koenigModel = gltf.scene;
                koenigModel.scale.set(modelScale, modelScale, modelScale);
                koenigModel.position.z = 0; // Auf dem Marker
                koenigModel.rotation.x = Math.PI / 2; // Modell aufrichten (oft nötig bei GLTF)

                markerGroup.add(koenigModel);
                
                isModelLoaded = true;
                modelStatus.innerText = "Modell bereit!";
                modelStatus.style.color = "#00ff00";
            }, undefined, function (error) {
                console.error(error);
                modelStatus.innerText = "FEHLER: Datei nicht gefunden!";
                modelStatus.style.color = "red";
            });

            // Gruppe standardmäßig verstecken
            markerGroup.visible = false;
        }

        // Fenstergrößenänderung behandeln
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                // Posit-Algorithmus neu initialisieren mit neuer Breite
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        // Three.js Kamera an die Video-Dimensionen anpassen (Field of View)
        function updateThreeJSCamera(cw, ch) {
            const focalLength = cw; // Annahme: Brennweite entspricht Bildbreite (Standard POSIT Annahme)
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            camera.fov = fovRad * (180 / Math.PI);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        // Webcam starten
        function startCamera() {
            isVideoReady = false;
            // Alten Stream stoppen falls vorhanden
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        // Wenn Video-Metadaten geladen sind (Auflösung bekannt)
        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        // --- HAUPTSCHLEIFE (Rendering Loop) ---
        function tick() {
            requestAnimationFrame(tick);

            // Animation: König drehen lassen
            if (koenigModel) {
                koenigModel.rotation.z += 0.05; 
            }

            let detectedID0 = false;
            let anyMarkerDetected = false;

            if (isVideoReady && video.videoWidth > 0) {
                // Video auf den 2D-Canvas zeichnen
                drawVideoFullscreen();

                // Bilddaten holen und Marker suchen
                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                // Filter: Zu kleine Marker ignorieren (vermeidet Fehlerkennung bei Rauschen)
                markers = markers.filter(m => {
                    const d = Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2));
                    return d > minMarkerSize;
                });

                if (markers.length > 0) {
                    anyMarkerDetected = true;
                    // Reset des allgemeinen Verlust-Zählers, da wir etwas sehen
                    generalLossCounter = 0;

                    // Wir nehmen den ersten gefundenen Marker für die Berechnungen
                    const marker = markers[0]; 
                    
                    // 2D-Feedback zeichnen (Roter Rahmen, ID-Text)
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);

                    // Ecken für POSIT zentrieren (Koordinatensystem-Mitte = Bildmitte)
                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));
                    
                    // 3D-Pose (Rotation & Translation) berechnen
                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        // 1. Lokales Koordinatensystem (Achsen) anzeigen
                        drawAxis(pose.bestRotation, pose.bestTranslation, markerSize);

                        // 2. UI-Text aktualisieren (Koordinaten & Winkel)
                        updatePoseUI(pose.bestRotation, pose.bestTranslation, marker.id);

                        // 3. Spezialbehandlung: Nur bei Marker ID 0 und geladenem Modell
                        if (marker.id === 0 && isModelLoaded) {
                            detectedID0 = true;
                            lossCounterID0 = 0;
                            
                            // Zielposition für die Glättung (Smoothing) setzen
                            updateObjectTargets(pose.bestRotation, pose.bestTranslation);
                            
                            markerGroup.visible = true;
                            isTrackingID0 = true;
                            clickHint.style.opacity = 1; // Hinweis einblenden
                        }
                    }
                }
            }

            // --- Logik wenn KEIN Marker erkannt wird ---
            if (!anyMarkerDetected) {
                generalLossCounter++;
                // Kurze Toleranz (10 Frames) gegen Flackern, dann Text anzeigen
                if (generalLossCounter > 10) { 
                    infoContent.innerHTML = "Kein ArUco Marker erkannt";
                }
            }

            // --- Logik wenn Marker ID 0 verloren geht ---
            if (!detectedID0 && isTrackingID0) {
                lossCounterID0++;
                // Wenn ID 0 länger als maxLossFrames weg ist, Modell ausblenden
                if (lossCounterID0 > maxLossFrames) {
                    isTrackingID0 = false;
                    markerGroup.visible = false;
                    clickHint.style.opacity = 0;
                }
            }

            // --- Glättung (Linear Interpolation) ---
            // Bewegt das Modell weich zur neuen Zielposition, statt zu springen
            if (isTrackingID0) {
                markerGroup.position.lerp(targetPosition, lerpFactor);
                markerGroup.quaternion.slerp(targetQuaternion, lerpFactor);
            }

            // 3D-Szene rendern
            renderer.render(scene, camera);
        }

        // Hilfsfunktion: Projiziert einen 3D-Punkt auf den 2D-Bildschirm
        function project(point3d, rot, trans) {
            // 3D Transformation anwenden
            const x = rot[0][0] * point3d[0] + rot[0][1] * point3d[1] + rot[0][2] * point3d[2] + trans[0];
            const y = rot[1][0] * point3d[0] + rot[1][1] * point3d[1] + rot[1][2] * point3d[2] + trans[1];
            const z = rot[2][0] * point3d[0] + rot[2][1] * point3d[1] + rot[2][2] * point3d[2] + trans[2];
            
            // Punkt hinter der Kamera ignorieren
            if (z <= 0) return { x: -1000, y: -1000 };
            
            const f = videoCanvas.width; // Focal Length
            const scale = f / z;
            
            // Auf 2D projizieren
            return { 
                x: x * scale + (videoCanvas.width / 2), 
                y: (videoCanvas.height / 2) - y * scale 
            };
        }

        // Zeichnet das Koordinatensystem (Rot=X, Grün=Y, Blau=Z)
        function drawAxis(rot, trans, len) {
            const o = project([0, 0, 0], rot, trans);
            const ax = project([len, 0, 0], rot, trans);
            const ay = project([0, len, 0], rot, trans);
            const az = project([0, 0, len], rot, trans);

            context2D.lineWidth = 4;

            context2D.strokeStyle = "red";
            context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ax.x, ax.y); context2D.stroke();

            context2D.strokeStyle = "lime";
            context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(ay.x, ay.y); context2D.stroke();

            context2D.strokeStyle = "blue";
            context2D.beginPath(); context2D.moveTo(o.x, o.y); context2D.lineTo(az.x, az.y); context2D.stroke();
        }

        // Aktualisiert die Textanzeige mit Position und Rotation
        function updatePoseUI(r, t, id) {
            // Matrix erstellen aus Rotation und Translation
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], t[0],
                -r[1][0], -r[1][1], -r[1][2], -t[1],
                -r[2][0], -r[2][1], -r[2][2], -t[2],
                 0,        0,        0,       1
            );
            
            // Matrix invertieren: Wir wollen die Kamera-Position RELATIV zum Marker
            const inv = m.invert();
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();
            const scale = new THREE.Vector3();
            inv.decompose(pos, quat, scale);
            
            // In Euler-Winkel umwandeln für lesbare Grad-Zahlen
            const euler = new THREE.Euler().setFromQuaternion(quat);
            
            // Werte formatieren (mm in cm umrechnen)
            const x = (pos.x / 10).toFixed(0); 
            const y = (pos.y / 10).toFixed(0);
            const z = (pos.z / 10).toFixed(0);
            
            const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(0);
            const yaw   = THREE.MathUtils.radToDeg(euler.y).toFixed(0);
            const roll  = THREE.MathUtils.radToDeg(euler.z).toFixed(0);

            infoContent.innerHTML = `
                <span style="color:yellow;">Gefunden: ID ${id}</span><br>
                <div style="margin-top:8px; padding-top:5px; border-top:1px solid #555;">
                    <span style="color:#aaa;">Position:</span><br>
                    X: ${x} cm | Y: ${y} cm | Z: ${z} cm
                </div>
                <div style="margin-top:8px;">
                    <span style="color:#aaa;">Rotation:</span><br>
                    Pitch: ${pitch}° | Yaw: ${yaw}° | Roll: ${roll}°
                </div>
            `;
        }

        // Zeichnet das Video so, dass es den Canvas füllt (object-fit: cover Simulation)
        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        // Zeichnet den roten Rahmen um den Marker
        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "rgba(255, 0, 0, 0.7)"; context2D.beginPath();
            corners.forEach((c, i) => { if (i === 0) context2D.moveTo(c.x, c.y); else context2D.lineTo(c.x, c.y); });
            context2D.closePath(); context2D.stroke();
        }

        // Zeichnet die Marker-ID als Text
        function drawIdText(corners, id) {
            const pt = corners[0]; context2D.font = "bold 24px monospace"; context2D.textAlign = "left"; context2D.textBaseline = "bottom";
            context2D.lineWidth = 4; context2D.strokeStyle = "black"; context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        // Konvertiert die Pose-Daten von POSIT in Three.js kompatible Vektoren/Quaternionen
        function updateObjectTargets(r, t) {
            // Translation übernehmen (Y und Z invertieren für Three.js Koordinatensystem)
            targetPosition.set(t[0], -t[1], -t[2]);
            
            // Rotation Matrix aufbauen
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            targetQuaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
