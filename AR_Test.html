<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & threeJs</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Layer 1: 2D Canvas (Video + Rote Boxen + Text) */
        #videoCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Layer 2: 3D Canvas (Würfel + Achsen) */
        #threeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Klicks durchlassen */
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            opacity: 0; pointer-events: none;
        }

        #camBtn {
            position: absolute;
            bottom: 30px; right: 20px;
            z-index: 100;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid #fff;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
        }

        #loadingText {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loadingText">Kamera wird geladen...</div>
        <button id="camBtn">Kamera wechseln</button>

        <!-- Video-Quelle -->
        <video id="video" playsinline muted autoplay></video>
        
        <!-- Layer 1 -->
        <canvas id="videoCanvas"></canvas>
        
        <!-- Layer 2 -->
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- ArUco & Three.js -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 100.0; // mm
        // ---------------------

        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const loadingText = document.getElementById('loadingText');

        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });
        
        let detector, posit;
        let renderer, scene, camera;
        let cubeGroup, axisHelper, rotatingMesh;
        
        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;

        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();
            startCamera();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);

        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        // --- Three.js Initialisierung ---
        function initThreeJS() {
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            
            // Kamera (FOV wird später dynamisch angepasst)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
            scene.add(camera);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 0, 10);
            scene.add(dirLight);

            // 1. Der Gelbe Würfel (für ID 0)
            cubeGroup = new THREE.Group();
            const geometry = new THREE.BoxGeometry(markerSize, markerSize, markerSize);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xffff00, opacity: 0.6, transparent: true 
            });
            
            rotatingMesh = new THREE.Mesh(geometry, material);
            rotatingMesh.position.z = markerSize / 2; 

            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
            line.position.z = markerSize / 2;

            const innerGroup = new THREE.Group();
            innerGroup.add(rotatingMesh);
            innerGroup.add(line);
            
            cubeGroup.add(innerGroup);
            scene.add(cubeGroup);

            // 2. Das Achsenkreuz (für alle Marker)
            axisHelper = new THREE.AxesHelper(markerSize * 1.2);
            // Wir machen die Linien etwas dicker (simuliert durch Skalierung, ThreeJS Lines sind immer 1px)
            scene.add(axisHelper);
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        function updateThreeJSCamera(cw, ch) {
            const focalLength = cw; 
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            camera.fov = fovRad * (180 / Math.PI);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        // --- Hauptschleife ---
        function tick() {
            requestAnimationFrame(tick);

            // Würfel-Animation
            if (rotatingMesh) {
                rotatingMesh.rotation.z += 0.05;
                rotatingMesh.rotation.x += 0.02;
                rotatingMesh.parent.children[1].rotation.z += 0.05;
                rotatingMesh.parent.children[1].rotation.x += 0.02;
            }

            // Reset Visibility
            cubeGroup.visible = false;
            axisHelper.visible = false;

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();

                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                // Filter
                markers = markers.filter(m => {
                    const dx = m.corners[0].x - m.corners[1].x;
                    const dy = m.corners[0].y - m.corners[1].y;
                    return Math.sqrt(dx*dx + dy*dy) > 30;
                });

                markers.forEach(marker => {
                    // 1. 2D Layer Zeichnung (Rote Box & Text)
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);

                    // 2. 3D Layer Berechnung
                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));

                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        const rot = pose.bestRotation;
                        const trans = pose.bestTranslation;

                        // Achsenkreuz IMMER anzeigen (folgt dem aktuellen Marker)
                        axisHelper.visible = true;
                        updateObjectPose(axisHelper, rot, trans);

                        // Wenn ID 0, dann ZUSÄTZLICH den Würfel anzeigen
                        if (marker.id === 0) {
                            cubeGroup.visible = true;
                            updateObjectPose(cubeGroup, rot, trans);
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }

        // Zeichnet das Video in "cover" Manier
        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        // Zeichnet die rote Box (2D)
        function drawRedBox(corners) {
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red";
            context2D.beginPath();
            corners.forEach((c, i) => {
                if (i === 0) context2D.moveTo(c.x, c.y);
                else context2D.lineTo(c.x, c.y);
            });
            context2D.closePath();
            context2D.stroke();
        }

        // Zeichnet die ID als Text (2D)
        function drawIdText(corners, id) {
            // Wir nehmen die erste Ecke als Ankerpunkt für den Text
            const pt = corners[0]; 
            context2D.font = "bold 24px monospace";
            context2D.textAlign = "left";
            context2D.textBaseline = "bottom";
            
            context2D.strokeStyle = "black";
            context2D.lineWidth = 4;
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            
            context2D.fillStyle = "#00FFFF"; // Cyan
            context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        // Positioniert Three.js Objekte passend zur ArUco Pose
        function updateObjectPose(obj, r, t) {
            obj.position.x = t[0];
            obj.position.y = -t[1];
            obj.position.z = -t[2];
            
            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            obj.quaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
