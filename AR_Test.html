<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Herrenhäuser Gärten Hannover - AR mit ArUco & ThreeJS</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Layer 1: 2D Canvas (Video, roter Rand) */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* Layer 2: 3D Canvas (Achsen, Würfel) */
        #threeCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
        }

        video {
            position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }

        #camBtn {
            position: absolute; bottom: 30px; right: 20px; z-index: 100;
            background: rgba(40, 40, 40, 0.8); border: 1px solid #fff;
            color: white; padding: 12px 24px; border-radius: 30px;
            font-family: sans-serif; font-weight: bold; cursor: pointer;
        }

        #loadingText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loadingText">Kamera wird geladen...</div>
        <button id="camBtn">Kamera wechseln</button>
        <video id="video" playsinline muted autoplay></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>

    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 100.0; // mm
        // ---------------------

        const video = document.getElementById('video');
        const videoCanvas = document.getElementById('videoCanvas');
        const threeCanvas = document.getElementById('threeCanvas');
        const camBtn = document.getElementById('camBtn');
        const loadingText = document.getElementById('loadingText');
        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        let detector, posit;
        let renderer, scene, camera;
        
        // Die Hauptgruppe (Ankerpunkt)
        let markerGroup; 
        let cubeMesh; 

        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;

        window.onload = () => {
            detector = new AR.Detector({ dictionaryName: selectedDictionary });
            initThreeJS();
            startCamera();
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);
        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        function initThreeJS() {
            renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
            scene.add(camera);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(0, 0, 10);
            scene.add(dl);

            // --- MARKER ANKER ---
            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // 1. DAS LOKALE KOORDINATENSYSTEM (Raw Axes)
            // Three.js AxesHelper erstellt Linien vom Ursprung (0,0,0) in X, Y, Z Richtung.
            // Wir fügen es direkt zur markerGroup hinzu.
            // Da markerGroup exakt auf dem Marker-Zentrum liegt, starten die Achsen genau dort.
            // Rot = X, Grün = Y, Blau = Z
            const axes = new THREE.AxesHelper(markerSize * 1.0); 
            
            // Optional: Liniendicke erzwingen (WebGL bedingt oft nur 1px, aber wir setzen Material colors hart)
            // Hinweis: AxesHelper ist von Haus aus "unverschoben".
            markerGroup.add(axes);


            // 2. Der Gelbe Würfel (ID 0)
            // Dieser muss leicht verschoben werden (um markerSize/2 nach oben), 
            // damit er AUF dem Papier steht und nicht IN dem Papier.
            // Aber das Koordinatensystem (Punkt 1) bleibt unten am Papier kleben.
            const geometry = new THREE.BoxGeometry(markerSize, markerSize, markerSize);
            const material = new THREE.MeshPhongMaterial({ color: 0xffff00, opacity: 0.5, transparent: true });
            
            cubeMesh = new THREE.Group();
            const mesh = new THREE.Mesh(geometry, material);
            
            // Kanten
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
            
            // Würfel anheben
            mesh.position.z = markerSize / 2;
            line.position.z = markerSize / 2;

            cubeMesh.add(mesh);
            cubeMesh.add(line);
            
            markerGroup.add(cubeMesh);

            markerGroup.visible = false;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            videoCanvas.width = w;
            videoCanvas.height = h;
            renderer.setSize(w, h);
            if (w > 0) {
                posit = new POS.Posit(markerSize, w);
                updateThreeJSCamera(w, h);
            }
        }

        function updateThreeJSCamera(cw, ch) {
            const focalLength = cw; 
            const fovRad = 2 * Math.atan((ch / 2) / focalLength);
            camera.fov = fovRad * (180 / Math.PI);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                video.play().catch(e => console.log(e));
            }).catch(err => alert("Kamera Fehler: " + err.name));
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            isVideoReady = true;
            loadingText.style.display = 'none';
        });

        function tick() {
            requestAnimationFrame(tick);

            // Animation
            if (cubeMesh) cubeMesh.rotation.z += 0.02;

            markerGroup.visible = false;

            if (isVideoReady && video.videoWidth > 0) {
                drawVideoFullscreen();

                const imageData = context2D.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
                let markers = detector.detect(imageData);

                markers = markers.filter(m => {
                    const dx = m.corners[0].x - m.corners[1].x;
                    const dy = m.corners[0].y - m.corners[1].y;
                    return Math.sqrt(dx*dx + dy*dy) > 30;
                });

                if (markers.length > 0) {
                    const marker = markers[0];

                    // 2D Zeichnung
                    drawRedBox(marker.corners);
                    drawIdText(marker.corners, marker.id);

                    // 3D Pose
                    const cornersCentered = marker.corners.map(c => ({
                        x: c.x - (videoCanvas.width / 2),
                        y: (videoCanvas.height / 2) - c.y
                    }));

                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        markerGroup.visible = true;
                        updateObjectPose(markerGroup, pose.bestRotation, pose.bestTranslation);
                        
                        // Würfel nur bei ID 0
                        cubeMesh.visible = (marker.id === 0);
                        // Das Achsenkreuz ist immer sichtbar, da es Teil der markerGroup ist
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function drawVideoFullscreen() {
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4;
            context2D.strokeStyle = "red";
            context2D.beginPath();
            corners.forEach((c, i) => {
                if (i === 0) context2D.moveTo(c.x, c.y);
                else context2D.lineTo(c.x, c.y);
            });
            context2D.closePath();
            context2D.stroke();
        }

        function drawIdText(corners, id) {
            const pt = corners[0]; 
            context2D.font = "bold 24px monospace";
            context2D.textAlign = "left";
            context2D.textBaseline = "bottom";
            context2D.lineWidth = 4;
            context2D.strokeStyle = "black";
            context2D.strokeText(`ID: ${id}`, pt.x, pt.y - 10);
            context2D.fillStyle = "#00FFFF"; 
            context2D.fillText(`ID: ${id}`, pt.x, pt.y - 10);
        }

        function updateObjectPose(obj, r, t) {
            // Wir übertragen die Pose auf das Root-Objekt.
            // Dies ist notwendig, um vom "Bild-Koordinatensystem" (Y unten) 
            // ins "3D-Welt-Koordinatensystem" (Y oben) zu kommen.
            // Das Achsenkreuz INNERHALB von 'obj' bleibt lokal bei (0,0,0).
            
            obj.position.x = t[0];
            obj.position.y = -t[1];
            obj.position.z = -t[2];

            const m = new THREE.Matrix4();
            m.set(
                 r[0][0],  r[0][1],  r[0][2], 0,
                -r[1][0], -r[1][1], -r[1][2], 0,
                -r[2][0], -r[2][1], -r[2][2], 0,
                 0,        0,        0,       1
            );
            obj.quaternion.setFromRotationMatrix(m);
        }
    </script>
</body>
</html>
