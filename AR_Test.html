<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArUco mit Three.js</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* Container für Video und 3D-Canvas übereinander */
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Das Webcam-Video im Hintergrund */
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Füllt den Bildschirm */
            z-index: 1;
        }

        /* Das Three.js Canvas transparent darüber */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Klicks gehen durch zum Video/UI */
        }

        /* UI Button */
        #camBtn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 100;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid #fff;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
        }
        
        #loadingText {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            z-index: 50;
            display: block;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loadingText">Kamera wird geladen...</div>
        <button id="camBtn">Kamera wechseln</button>
        
        <!-- Video sichtbar im Hintergrund -->
        <video id="video" playsinline muted autoplay></video>
        
        <!-- Three.js rendert hier hinein -->
        <canvas id="canvas"></canvas>
    </div>

    <!-- 1. JS-ArUco Bibliotheken -->
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>

    <!-- 2. Three.js Bibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- KONFIGURATION ---
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const markerSize = 50.0; // mm
        // ---------------------

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const camBtn = document.getElementById('camBtn');
        const loadingText = document.getElementById('loadingText');

        // ArUco Variablen
        let detector, posit;
        
        // Three.js Variablen
        let renderer, scene, camera;
        let cubeGroup; // Container für den gelben Würfel (ID 0)
        let axisHelper; // Standard Achsenkreuz für andere IDs
        let rotatingMesh; // Der eigentliche Würfel, der sich dreht

        let currentFacingMode = 'environment';
        let stream = null;
        let isVideoReady = false;

        // Initialisierung
        window.onload = () => {
            // 1. ArUco initialisieren
            detector = new AR.Detector({ dictionaryName: selectedDictionary });

            // 2. Three.js initialisieren
            initThreeJS();

            // 3. Kamera starten
            startCamera();

            // 4. Loop starten
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', onResize);

        camBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        function initThreeJS() {
            // Renderer mit transparentem Hintergrund
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Szene
            scene = new THREE.Scene();

            // Kamera
            // Wir setzen FOV auf ca 40-45 Grad. Das POSIT-System nimmt die Bildbreite als Brennweite an.
            // Um das exakt zu matchen, müsste man FOV dynamisch berechnen, aber 42° ist ein guter Startwert für Handys.
            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 10000);
            scene.add(camera);

            // Licht
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            // --- OBJEKT 1: Der gelbe Würfel (für ID 0) ---
            cubeGroup = new THREE.Group(); // Container für Positionierung
            
            // Geometrie
            const geometry = new THREE.BoxGeometry(markerSize, markerSize, markerSize);
            // Halbtransparentes gelbes Material
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xffff00, 
                opacity: 0.7, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            rotatingMesh = new THREE.Mesh(geometry, material);
            // Den Würfel um die Hälfte nach oben schieben, damit er AUF dem Marker steht, nicht halb darin
            rotatingMesh.position.z = markerSize / 2; 
            
            // Drahtgitter (Edges) für schönere Optik
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
            line.position.z = markerSize / 2;
            
            // Alles in eine Gruppe packen, damit wir "rotatingMesh" drehen können, 
            // während "cubeGroup" dem Marker folgt.
            const innerGroup = new THREE.Group();
            innerGroup.add(rotatingMesh);
            innerGroup.add(line);
            
            cubeGroup.add(innerGroup);
            
            scene.add(cubeGroup);
            cubeGroup.visible = false; // Startet unsichtbar

            // --- OBJEKT 2: Achsenkreuz (für andere IDs) ---
            axisHelper = new THREE.AxesHelper(markerSize * 1.5);
            scene.add(axisHelper);
            axisHelper.visible = false;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();

            if (w > 0) {
                // POSIT neu initialisieren mit aktueller Breite als Brennweite
                posit = new POS.Posit(markerSize, w);
            }
        }

        function startCamera() {
            isVideoReady = false;
            if (stream) stream.getTracks().forEach(t => t.stop());

            const constraints = {
                audio: false,
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    alert("Kamera Fehler: " + err.name);
                });
        }

        video.addEventListener('loadedmetadata', () => {
            onResize();
            loadingText.style.display = 'none';
            isVideoReady = true;
        });

        function tick() {
            requestAnimationFrame(tick);

            // 1. Drehanimation aktualisieren (Mesh dreht sich im lokalen System)
            if (rotatingMesh) {
                rotatingMesh.rotation.z += 0.05;
                rotatingMesh.rotation.x += 0.02;
                // Das Drahtgitter auch mitdrehen (es ist im gleichen Parent, aber wir haben es getrennt angelegt)
                // Besser: Wir drehen die innerGroup, siehe initThreeJS.
                rotatingMesh.parent.rotation.z += 0.02; 
            }

            // 2. Objekte ausblenden (werden aktiviert, wenn Marker gefunden)
            cubeGroup.visible = false;
            axisHelper.visible = false;

            if (isVideoReady && video.videoWidth > 0) {
                
                // --- AR Logik ---
                // Wir nutzen ein unsichtbares 2D-Canvas für die Bilddaten-Analyse
                // Hier erstellen wir es on-the-fly oder nutzen ein kleines Helper-Canvas
                // Da getImageData teuer ist, ist es besser, ein kleines Canvas zu haben.
                // Der Einfachheit halber lesen wir direkt vom Renderer-Canvas Kontext? Nein, das ist leer.
                // Wir müssen ein temporäres Canvas erstellen, um das Video zu lesen.
                
                const cvCanvas = document.createElement('canvas');
                cvCanvas.width = video.videoWidth;
                cvCanvas.height = video.videoHeight;
                const cvContext = cvCanvas.getContext('2d', { willReadFrequently: true });
                cvContext.drawImage(video, 0, 0);
                const imageData = cvContext.getImageData(0, 0, cvCanvas.width, cvCanvas.height);

                let markers = detector.detect(imageData);

                // Filter: Kleine Marker ignorieren
                markers = markers.filter(m => {
                    const dx = m.corners[0].x - m.corners[1].x;
                    const dy = m.corners[0].y - m.corners[1].y;
                    return Math.sqrt(dx*dx + dy*dy) > 30;
                });

                markers.forEach(marker => {
                    // Pose berechnen
                    // POSIT erwartet zentrierte Koordinaten relativ zum Bild
                    const corners = marker.corners;
                    
                    // Skalierung beachten! Das Video hat videoWidth, der Screen hat window.innerWidth.
                    // POSIT arbeitet auf Pixeln. Wir müssen die Pose basierend auf den Videopixeln berechnen
                    // und dann Three.js anpassen.
                    // Da unser Three.js Canvas den ganzen Screen füllt und das Video "covered",
                    // ist es einfacher, die Pose basierend auf der angezeigten Größe zu berechnen.
                    
                    // Wir müssen die Video-Koordinaten in Screen-Koordinaten umrechnen ("object-fit: cover" Logik)
                    const screenCorners = convertVideoToScreenCoords(corners);

                    const cornersCentered = screenCorners.map(c => ({
                        x: c.x - (canvas.width / 2),
                        y: (canvas.height / 2) - c.y
                    }));

                    const pose = posit.pose(cornersCentered);

                    if (pose) {
                        const rot = pose.bestRotation;
                        const trans = pose.bestTranslation;

                        let targetObj = null;

                        if (marker.id === 0) {
                            targetObj = cubeGroup;
                        } else {
                            targetObj = axisHelper;
                        }

                        if (targetObj) {
                            targetObj.visible = true;
                            updateObjectPose(targetObj, rot, trans);
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Hilfsfunktion: Video-Pixelkoordinaten -> Screen-Koordinaten (wegen object-fit: cover)
        function convertVideoToScreenCoords(corners) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const cw = canvas.width;
            const ch = canvas.height;

            const rV = vw / vh;
            const rC = cw / ch;

            // Skalierungsfaktor berechnen
            let scale, offsetX, offsetY;

            if (rV < rC) {
                // Video ist schmaler als Screen -> Breite wird angepasst
                scale = cw / vw;
                offsetX = 0;
                offsetY = (ch - (vh * scale)) / 2;
            } else {
                // Video ist breiter als Screen -> Höhe wird angepasst
                scale = ch / vh;
                offsetX = (cw - (vw * scale)) / 2;
                offsetY = 0;
            }

            return corners.map(c => ({
                x: c.x * scale + offsetX,
                y: c.y * scale + offsetY
            }));
        }

        // Kernfunktion: Überträgt ArUco Pose auf Three.js Objekt
        function updateObjectPose(object3D, rotation, translation) {
            // 1. Position übertragen
            // ArUco: X rechts, Y unten, Z vorwärts
            // Three.js Kamera schaut nach -Z. 
            // Umrechnung: x -> x, y -> -y, z -> -z
            
            object3D.position.x = translation[0];
            object3D.position.y = -translation[1]; // Y invertieren
            object3D.position.z = -translation[2]; // Z invertieren

            // 2. Rotation übertragen
            // ArUco liefert eine 3x3 Rotationsmatrix [row][col]
            // Wir bauen eine Three.js Matrix4
            const m = new THREE.Matrix4();
            const r = rotation;

            // Wir füllen die Matrix. 
            // Dabei müssen wir die gleichen Achsen-Invertierungen (Y und Z) auf die Rotation anwenden.
            // Das entspricht einer Rotation der Basisvektoren.
            
            m.set(
                 r[0][0],  r[0][1],  r[0][2],  0,
                -r[1][0], -r[1][1], -r[1][2],  0, // Y-Zeile invertiert
                -r[2][0], -r[2][1], -r[2][2],  0, // Z-Zeile invertiert
                 0,        0,        0,        1
            );

            // Da die Rotation relativ zum Objektzentrum ist, wenden wir sie an
            object3D.quaternion.setFromRotationMatrix(m);
        }

    </script>
</body>
</html>
