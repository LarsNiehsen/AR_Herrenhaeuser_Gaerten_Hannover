<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Viewport-Einstellungen: Wichtig für mobile Geräte. 
         'user-scalable=no' verhindert, dass der Benutzer reinzoomt, was die AR-Erfahrung stören würde. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herrenhäuser Gärten Hannover - Augmented Reality (AR)</title>
    
    <!-- Leaflet CSS: Das Stylesheet für die 2D-Karte (OpenStreetMap Integration) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importmap: Definiert, woher der Browser moderne JavaScript-Module laden soll.
         Hier werden Three.js (für 3D) und MindAR (für Bilderkennung) verknüpft. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <!-- CSS Styles: Hier wird das Aussehen der Anwendung definiert -->
    <style>
        /* Grundlegendes Layout: Vollbild, schwarzer Hintergrund, keine Scrollbalken */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Das Standard-Videoelement von MindAR wird ausgeblendet, da Three.js den Feed verarbeitet */
        #videoElement { display: none; }

        /* Ein Canvas-Element, das über dem Video liegt. 
           Es wird genutzt, um Debug-Linien (rote Boxen, Achsen) für ArUco-Marker zu zeichnen. */
        #videoCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; pointer-events: none; /* Mausklicks gehen durch dieses Element hindurch */
        }

        /* Der Hauptcontainer für die 3D-Szene. Hier zeichnet Three.js die Modelle. */
        #container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: auto; overflow: hidden;
        }

        /* Gemeinsame Klasse für alle halbtransparenten Benutzeroberflächen-Boxen (UI) */
        .ui-panel {
            position: absolute;
            z-index: 100; /* Liegt über der 3D-Szene */
            background: rgba(0, 0, 0, 0.6); /* Halbtransparentes Schwarz */
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px; /* Abgerundete Ecken */
            backdrop-filter: blur(8px); /* Weichzeichner für den Hintergrund (Milchglas-Effekt) */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease; /* Weiche Animation bei Änderungen */
        }

        /* Info-Fenster oben links für technische Daten und Status */
        #debugInfo {
            top: 20px; left: 20px;
            padding: 15px;
            min-width: 200px;
            max-width: calc(100% - 100px); 
            font-size: 13px;
            pointer-events: none; /* Klicks gehen durch */
        }

        #debugInfo strong {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px; 
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
            line-height: 1.3;
        }

        /* Schließen-Button oben rechts */
        #closeBtn {
            top: 20px; right: 20px;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px;
            cursor: pointer;
            background: rgba(200, 40, 40, 0.85); /* Rötlicher Hintergrund */
            border: 1px solid rgba(255, 100, 100, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            padding: 0; line-height: 1;
        }
        #closeBtn:active { transform: scale(0.95); } /* Kleiner Effekt beim Klicken */

        /* Informations-Popup für 3D-Modelle (unten mittig) */
        #modelInfo {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%); /* Zentriert das Element exakt horizontal */
            width: 85%; max-width: 400px;
            text-align: center;
            display: none; /* Standardmäßig ausgeblendet */
            cursor: pointer;
            z-index: 200; 
        }
        #modelInfo h3 { color: #4f4; margin: 0 0 4px 0; font-size: 18px; font-weight: bold; }
        #modelInfo p { color: #eee; margin: 0; font-size: 14px; line-height: 1.3; }

        /* Anzeige für das historische Bild (Kupferstich) - rechts mittig */
        #historicalInfo {
            display: none; 
            top: 50%; 
            right: 20px;
            left: auto;
            transform: translateY(-50%); /* Exakte vertikale Zentrierung */
            width: 180px; 
            padding: 10px;
            text-align: center;
            z-index: 250;
        }
        #historicalInfo h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #ffda85; 
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 4px;
        }
        #historicalInfo img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Container für die Karten-Steuerelemente unten rechts */
        #mapControls {
            position: absolute; bottom: 20px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
        }

        /* Container für die Leaflet-Karte (wird ein-/ausgeblendet) */
        #mapContainer {
            position: relative; width: 240px; height: 180px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; pointer-events: auto;
        }

        #mapStations { width: 100%; height: 100%; }

        /* Buttons innerhalb der Karte (Overlay oben rechts in der Karte) */
        .map-btn-overlay {
            position: absolute; top: 5px; right: 5px;
            display: flex; flex-direction: column; gap: 4px; z-index: 1000;
        }

        /* Styling für kleine Icons */
        .icon-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 4px; padding: 6px;
            cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }

        .bottom-right-btns { display: flex; gap: 12px; }

        .action-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Steuerung für die Rotation der Modelle unten links */
        #rotationControls {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            display: flex; gap: 12px;
        }

        .rotate-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 26px; cursor: pointer; position: relative;
            padding: 0; line-height: 1;
        }

        /* Hinweis-Text "Tippe auf das Modell" (erscheint mittig) */
        #clickHint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: bold; font-family: sans-serif;
            z-index: 90; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; font-size: 1.3rem;
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
        }

        /* Der grüne Richtungspfeil unten Mitte */
        #direction-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 95;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); pointer-events: none;
            transition: opacity 0.5s; opacity: 0;
        }
        /* Das eigentliche Dreieck des Pfeils (CSS Shapes) */
        #arrow {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 30px solid #00ff00; /* Grün */
            transform-origin: center 20px; /* Drehpunkt */
            filter: drop-shadow(0 0 4px #00ff00);
            transform: rotate(0deg);
            transition: transform 0.2s ease-out;
        }

        /* Hilfsklassen für Textfarben und Labels */
        .label-small { font-size: 11px; color: #bbb; margin-right: 5px; text-transform: uppercase; }
        .val-highlight { color: #fff; font-weight: bold; }
        .val-green { color: #4f4; font-weight: bold; }

    </style>
</head>
<body>

    <!-- Video Element für den Kamerastream -->
    <video id="videoElement" playsinline muted autoplay></video>
    
    <!-- Container für die 3D-Szene -->
    <div id="container"></div>
    
    <!-- Canvas für ArUco Marker Debug-Zeichnungen -->
    <canvas id="videoCanvas"></canvas>

    <!-- Info Panel oben links -->
    <div id="debugInfo" class="ui-panel">
        <strong id="debugTitle">Herrenhäuser Gärten - Augmented Reality (AR)</strong>
        <div id="statusText">Starte System...<br><span style='color: #aaa;'>Initialisiere...</span></div>
    </div>

    <!-- Schließen Button -->
    <div id="closeBtn" class="ui-panel" title="Schließen" onclick="window.history.length > 1 ? window.history.back() : window.close()">✕</div>

    <!-- Bildcontainer für historische Info -->
    <div id="historicalInfo" class="ui-panel">
        <h4>Kupferstich Große Fontäne um 1800</h4>
        <img src="https://herrenhaeuser-gaerten.hannover.de/var/storage/images/_aliases/alias_1600xVariabel/9/4/8/5/25555849-2-ger-DE/a12171440e88-Stich_Grosse_Fontaene.jpg" alt="Historischer Stich">
    </div>

    <!-- Container für den Richtungspfeil -->
    <div id="direction-indicator">
        <div id="arrow"></div>
    </div>

    <!-- Info-Fenster unten -->
    <div id="modelInfo" class="ui-panel">
        <h3 id="objTitle">Titel</h3>
        <p id="objText">Beschreibung</p>
    </div>

    <!-- Klick-Hinweis Overlay -->
    <div id="clickHint">👆 Tippe auf das 3D-Modell<br>für weitere Informationen</div>

    <!-- Karten-UI -->
    <div id="mapControls">
        <div id="mapContainer">
            <div id="mapStations"></div>
            <div class="map-btn-overlay">
                <button id="locateBtn" class="icon-btn" title="Standort">📍</button>
                <button id="orientBtn" class="icon-btn" title="Ausrichtung">🧭</button>
            </div>
        </div>
        <div class="bottom-right-btns">
            <button id="toggleMapBtn" class="ui-panel action-btn">🗺️</button>
            <button id="switchCamBtn" class="ui-panel action-btn">📷</button>
        </div>
    </div>

    <!-- Rotations-Buttons -->
    <div id="rotationControls">
        <button id="rotLeftBtn" class="ui-panel rotate-btn">↺</button>
        <button id="rotRightBtn" class="ui-panel rotate-btn">↻</button>
    </div>

    <!-- Bibliotheken laden -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // --- KONFIGURATION ---
        const markerSize = 100.0; 
        const selectedDictionary = 'ARUCO_MIP_36h12'; 
        const VISIBILITY_DISTANCE = 75.0; 
        
        const target0Lat = 52.386444;
        const target0Lon = 9.695780;
        const targetBlumengartenLat = 52.388029;
        const targetBlumengartenLon = 9.697794;
        
        const AR_MODELS = {
            0: { url: '3D_models/Koenig.glb', scale: 150.0, title: 'König Georg I.', info: 'Referenzmodell (ID 0)', link: null, lat: null, lon: null },
            1: { url: '3D_models/Statue_3D.glb', scale: 90.0, title: 'Niederdeutscher Blumengarten', info: 'Sandsteinstatue "Veritas" von 1730', link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Gro%C3%9Fer-Garten/Der-Niederdeutsche-Blumengarten', mindTargetIndexes: [1, 2, 3, 4, 5, 6], lat: 52.388196, lon: 9.697853 },
            2: { url: '3D_models/BorghesischerFechter_WebAR.glb', scale: 26000.0, title: 'Borghesischer Fechter', info: 'Borghesischer Fechter am Gartentheater', link: 'https://www.visit-hannover.com/Kultur-Sehensw%C3%BCrdigkeiten/Sehensw%C3%BCrdigkeiten/Die-Herrenh%C3%A4user-G%C3%A4rten/Gartentheater-Herrenhausen', lat: 52.389463, lon: 9.699207 },
            3: { url: '3D_models/GrosseFontaine_WebAR.glb', scale: 8000.0, title: 'Große Fontäne', info: 'Große Fontäne - Wahrzeichen des Großen Gartens', link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst', isAnimated: true, mindTargetIndexes: [0], lat: 52.386018, lon: 9.695975 },
            33: { url: '3D_models/GrosseFontaine_WebAR.glb', scale: 8000.0, title: 'Große Fontäne', info: 'Große Fontäne (Standort 2)', link: 'https://herrenhaeuser-gaerten.hannover.de/Herrenhausen-erleben/Wasserkunst/Die-Geschichte-der-Wasserkunst', isAnimated: true, lat: 52.388778, lon: 9.817775 }
        };

        const stations = [
            { title: 'Große Fontaine', coords: [52.386018, 9.695975] },
            { title: 'Goldenes Tor', coords: [52.390184, 9.699546] },
            { title: 'Haupteingang mit Kasse', coords: [52.391185, 9.698368] },
            { title: 'Niki de Saint Phalle - Grotte', coords: [52.390713, 9.696767] },
            { title: 'Sommer - Statue', coords: [ 52.389583, 9.697833] },
            { title: 'Borghesischer Fechter', coords: [52.389463, 9.699207] },
            { title: 'Niederdeutscher Blumengarten', coords: [52.388196, 9.697853] }
        ];

        const videoCanvas = document.getElementById('videoCanvas');
        const statusText = document.getElementById('statusText');
        const modelInfo = document.getElementById('modelInfo');
        const objTitle = document.getElementById('objTitle');
        const objText = document.getElementById('objText');
        const clickHint = document.getElementById('clickHint');
        const arrowContainer = document.getElementById('direction-indicator');
        const arrowEl = document.getElementById('arrow');
        const historicalInfo = document.getElementById('historicalInfo');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const toggleMapBtn = document.getElementById('toggleMapBtn');
        const rotLeftBtn = document.getElementById('rotLeftBtn');
        const rotRightBtn = document.getElementById('rotRightBtn');
        const mapEl = document.getElementById('mapStations');
        const mapContainer = document.getElementById('mapContainer');
        const locateBtn = document.getElementById('locateBtn');
        const orientBtn = document.getElementById('orientBtn');

        const context2D = videoCanvas.getContext('2d', { willReadFrequently: true });

        let activeLink = null;
        let loadedMeshes = {}; 
        let mindARMeshes = {}; 
        let gnssMeshes = {};   
        let detector, posit;   
        let mindarThree, renderer, scene, camera; 
        let mindarAnchors = []; 
        let markerGroup, gnssGroup; 
        
        let lastPos = null; 
        let realPos = null; 
        let heading = 0; 
        let mapStations, userLayer; 
        let currentTrackingID = -1; 
        let lossCounter = 0; 
        const maxLossFrames = 30; 
        let hintTimeout = null; 
        let isMarkerTracking = false; 
        let closestObjForArrow = null;

        let isSimulatedPos = false;
        let simulationEndTime = 0;
        let simulatedCoords = null;
        const SIMULATION_PERSISTENCE = 30000; 

        let activeMindARId = -1; 
        let activeMindAREndTime = 0; 
        const STANDARD_PERSISTENCE = 5000; 

        // --- PARTIKELSYSTEM (KORREKTUR FEHLER 2) ---
        function createWaterEffect() {
            const particleCount = 12000; 
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3); 
            const velocities = new Float32Array(particleCount * 3); 

            for (let i = 0; i < particleCount; i++) {
                // Alle Partikel starten im Zentrum
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                // KORREKTUR: Ausstoß primär nach oben (Y-Achse), schmalere Streuung auf X/Z
                velocities[i*3] = (Math.random() - 0.5) * 0.02;     // X Streuung (Breite reduziert)
                velocities[i*3+1] = (Math.random() * 0.15 + 0.1);  // Y (Geschwindigkeit nach oben erhöht)
                velocities[i*3+2] = (Math.random() - 0.5) * 0.02;  // Z Streuung (Tiefe reduziert)
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xbbddff, size: 0.015, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geometry, material);
            points.userData.vels = velocities; 
            points.frustumCulled = false; 
            return points;
        }

        function updateWaterEffect(points) {
            const pos = points.geometry.attributes.position.array;
            const vels = points.userData.vels;
            const gravity = 0.0035; // Etwas stärkere Schwerkraft für natürlicheren Fall

            for (let i = 0; i < pos.length / 3; i++) {
                // Positionen aktualisieren
                pos[i*3] += vels[i*3];     
                pos[i*3+1] += vels[i*3+1]; 
                pos[i*3+2] += vels[i*3+2]; 
                
                // Schwerkraft wirkt auf Y-Achse (nach unten)
                vels[i*3+1] -= gravity; 

                // Reset, wenn Partikel unter die Modell-Basis fallen
                if (pos[i*3+1] < 0) {
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
                    vels[i*3] = (Math.random() - 0.5) * 0.02;
                    vels[i*3+1] = (Math.random() * 0.15 + 0.1); 
                    vels[i*3+2] = (Math.random() - 0.5) * 0.02;
                }
            }
            points.geometry.attributes.position.needsUpdate = true; 
        }

        // --- AR STARTROUTINE ---
        const startAR = async () => {
            mindarThree = new MindARThree({
                container: document.querySelector("#container"),
                imageTargetSrc: 'ImageMatching/GrosseFontaineInfo_NiederdeutscherBlumengarten_targets.mind',
                uiLoading: "no", uiScanning: "no", uiError: "no",
                filterMinCF: 0.0001, filterBeta: 0.001,
                maxTrack: 2 
            });

            renderer = mindarThree.renderer;
            scene = mindarThree.scene;
            camera = mindarThree.camera;
            camera.far = 50000; camera.updateProjectionMatrix();
            renderer.setClearColor(0x000000, 0);
            
            scene.add(new THREE.AmbientLight(0xffffff, 1.2)); 
            const dl = new THREE.DirectionalLight(0xffffff, 2.5); 
            dl.position.set(0, 500, 1000);
            scene.add(dl);

            markerGroup = new THREE.Group(); markerGroup.visible = false; scene.add(markerGroup);
            gnssGroup = new THREE.Group(); gnssGroup.visible = true; scene.add(gnssGroup);
            
            for (let i = 0; i < 7; i++) {
                const anchor = mindarThree.addAnchor(i);
                anchor.onTargetFound = () => {
                    activeMindARId = i;
                    if (i === 0) activateSimulation(target0Lat, target0Lon);
                    else if (i === 4 || i === 5 || i === 6) activateSimulation(targetBlumengartenLat, targetBlumengartenLon);
                    else if (i === 1 || i === 2 || i === 3) activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                };
                anchor.onTargetLost = () => {
                    if (i === activeMindARId && (i === 1 || i === 2 || i === 3)) activeMindAREndTime = Date.now() + STANDARD_PERSISTENCE;
                };
                mindarAnchors[i] = anchor;
            }

            loadModels();
            await mindarThree.start();

            renderer.setAnimationLoop(() => {
                const video = mindarThree.video;
                const arucoFound = processArucoFrame(video);
                
                let showSimulation = false;
                let showStandardMindAR = false;
                
                if (arucoFound) {
                    activeMindARId = -1; 
                } else {
                    if (isSimulatedPos) {
                        if (Date.now() < simulationEndTime) {
                            showSimulation = true;
                            if (simulatedCoords) lastPos = { latitude: simulatedCoords.lat, longitude: simulatedCoords.lon, accuracy: 1.5 };
                        } else {
                            isSimulatedPos = false;
                            if (realPos) lastPos = realPos;
                        }
                    } 
                    else if (activeMindARId >= 1 && activeMindARId <= 3) {
                        if (Date.now() < activeMindAREndTime) showStandardMindAR = true;
                        else activeMindARId = -1;
                    }
                }

                Object.keys(mindARMeshes).forEach(idStr => {
                    const id = parseInt(idStr);
                    const isRelevant = AR_MODELS[id].mindTargetIndexes.includes(activeMindARId);
                    if (mindARMeshes[id]) {
                        mindARMeshes[id].forEach(mesh => {
                            if (showStandardMindAR && isRelevant) {
                                mesh.visible = true;
                                if(mesh.userData.particles) updateWaterEffect(mesh.userData.particles);
                                updateUIForModel(id, "MindAR (Image)");
                            } else mesh.visible = false;
                        });
                    }
                });

                isMarkerTracking = arucoFound || showStandardMindAR;

                if (showSimulation || !isMarkerTracking) {
                    gnssGroup.visible = true;
                    updateGNSSObjects();
                    updateGNSSUI();
                } else {
                    gnssGroup.visible = false;
                }

                Object.values(gnssMeshes).forEach(m => {
                    if (m.visible && m.userData.particles) updateWaterEffect(m.userData.particles);
                });

                if (closestObjForArrow) updateArrow();
                else arrowContainer.style.opacity = 0;

                renderer.render(scene, camera);
            });
        }

        function activateSimulation(lat, lon) {
            isSimulatedPos = true;
            simulationEndTime = Date.now() + SIMULATION_PERSISTENCE; 
            simulatedCoords = { lat: lat, lon: lon };
            activeMindARId = -1; 
        }

        function loadModels() {
            const loader = new GLTFLoader();
            Object.keys(AR_MODELS).forEach(idStr => {
                const id = parseInt(idStr);
                const config = AR_MODELS[id];
                loader.load(config.url, (gltf) => {
                    // ArUco
                    const modelAruco = gltf.scene.clone();
                    modelAruco.scale.set(config.scale, config.scale, config.scale);
                    modelAruco.rotation.x = Math.PI / 2; 
                    if ([1, 2, 3, 33].includes(id)) modelAruco.rotation.z += Math.PI;
                    if (id === 3 || id === 33) {
                        const p = createWaterEffect();
                        modelAruco.add(p); modelAruco.userData.particles = p;
                    }
                    modelAruco.visible = false;
                    markerGroup.add(modelAruco);
                    loadedMeshes[id] = modelAruco;

                    // GNSS (KORREKTUR FEHLER 1: Simulation-IDs 0, 4, 5, 6)
                    if (config.lat && config.lon || [0].includes(id)) {
                        const modelGNSS = gltf.scene.clone();
                        const gnssScale = config.scale * 0.05; 
                        modelGNSS.scale.set(gnssScale, gnssScale, gnssScale);
                        if (id === 3 || id === 33) {
                             const pG = createWaterEffect();
                             modelGNSS.add(pG); modelGNSS.userData.particles = pG;
                        }
                        modelGNSS.visible = false;
                        gnssGroup.add(modelGNSS);
                        gnssMeshes[id] = modelGNSS;
                    }

                    // MindAR
                    if (config.mindTargetIndexes) {
                        if (!mindARMeshes[id]) mindARMeshes[id] = [];
                        config.mindTargetIndexes.forEach(idx => {
                            if ([1, 2, 3].includes(idx) && mindarAnchors[idx]) {
                                const modelMind = gltf.scene.clone();
                                modelMind.scale.set(config.scale * 0.015, config.scale * 0.015, config.scale * 0.015);
                                if (idx === 1) modelMind.rotation.y = THREE.MathUtils.degToRad(346); 
                                else modelMind.rotation.y = Math.PI;
                                if (id === 1) modelMind.position.y = -1.5; 
                                if (id === 3 || id === 33) {
                                     const pM = createWaterEffect();
                                     modelMind.add(pM); modelMind.userData.particles = pM;
                                }
                                mindarAnchors[idx].group.add(modelMind);
                                mindARMeshes[id].push(modelMind);
                                modelMind.visible = false;
                            }
                        });
                    }
                });
            });
        }

        function updateGNSSUI() {
            if (!lastPos) { statusText.innerHTML = "Warte auf GNSS Signal..."; return; }
            let closestDist = 99999;
            let closestObj = null;
            Object.keys(AR_MODELS).forEach(key => {
                const m = AR_MODELS[key];
                if(m.lat && m.lon) {
                    const dist = haversineDist(lastPos.latitude, lastPos.longitude, m.lat, m.lon);
                    if(dist < closestDist) { closestDist = dist; closestObj = m; }
                }
            });
            closestObjForArrow = closestObj;
            if (closestObj) {
                const distStr = closestDist < 1000 ? Math.round(closestDist) + " m" : (closestDist/1000).toFixed(1) + " km";
                statusText.innerHTML = `
                    <span class="label-small">${isSimulatedPos ? "Pos. (Simuliert)" : "Pos. (GNSS)"}</span> <span class="val-highlight">${lastPos.latitude.toFixed(5)}°, ${lastPos.longitude.toFixed(5)}°</span><br>
                    <span class="label-small">Kompass</span> <span class="val-highlight">${Math.round(heading)}°</span><br>
                    <div style="margin: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2);"></div>
                    <span class="label-small">POI</span> <span class="val-green">${closestObj.title}</span><br>
                    <span class="label-small">Entfernung</span> <span class="val-highlight">${distStr}</span>
                `;
            }
        }
        
        function updateArrow() {
            if (!lastPos || !closestObjForArrow) { arrowContainer.style.opacity = 0; return; }
            arrowContainer.style.opacity = 1;
            const bearing = calculateBearing(lastPos.latitude, lastPos.longitude, closestObjForArrow.lat, closestObjForArrow.lon);
            const relativeAngle = bearing - heading;
            arrowEl.style.transform = `rotate(${relativeAngle}deg)`;
        }

        // KORREKTUR FEHLER 1: POSITIONIERUNG UND HÖHE BEI SIMULATION
        function updateGNSSObjects() {
            if (!lastPos) return;
            // Gruppe stabil zur realen Welt ausrichten
            gnssGroup.rotation.y = -THREE.MathUtils.degToRad(heading);
            
            Object.keys(gnssMeshes).forEach(key => {
                const id = parseInt(key);
                const mesh = gnssMeshes[id];
                const config = AR_MODELS[id];
                if (!config.lat || !config.lon) return;

                const dist = haversineDist(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                
                // Einblenden, wenn in Reichweite ODER wenn Simulation für dieses Objekt aktiv ist
                const isTargetOfSimulation = (isSimulatedPos && 
                    ((activeMindARId === 0 && (id === 3 || id === 33)) || 
                     ([4,5,6].includes(activeMindARId) && id === 1)));

                if (dist < VISIBILITY_DISTANCE || isTargetOfSimulation) {
                    mesh.visible = true;
                    if (id === 3 || id === 33) historicalInfo.style.display = 'block';

                    let heightY = -2.0; // Standard Bodenhöhe
                    let posFactor = 1.0; 

                    // Speziallogik für Simulation: Objekte mittig und komplett sichtbar einblenden
                    if (isSimulatedPos) {
                        heightY = -0.3; // Knapp unter Augenhöhe für "schwebenden" Effekt in Bildmitte
                        // Wenn zu weit weg in Simulation, künstlich näher ranziehen für ArUco-Feeling
                        if (dist > 15) posFactor = 10 / dist; 
                    }

                    const offset = calcOffset(lastPos.latitude, lastPos.longitude, config.lat, config.lon);
                    // Positionierung relativ zum Nutzer (Z-Achse in Three.js ist Süden, daher -offset.z)
                    mesh.position.set(offset.x * posFactor, heightY, -offset.z * posFactor); 
                } else {
                    mesh.visible = false;
                    if (id === 3 || id === 33) historicalInfo.style.display = 'none';
                }
            });
        }

        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const rad = Math.PI/180;
            const dLat = (lat2-lat1)*rad; const dLon = (lon2-lon1)*rad;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad) * Math.sin(dLon/2)*Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcOffset(lat1, lon1, lat2, lon2) {
            const R = 6378137; 
            const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const dx = dLon * Math.cos(lat1Rad) * R; const dz = dLat * R; 
            return { x: dx, z: dz };
        }
        
        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * (Math.PI / 180); const startLngRad = startLng * (Math.PI / 180);
            const destLatRad = destLat * (Math.PI / 180); const destLngRad = destLng * (Math.PI / 180);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }

        function processArucoFrame(video) {
            if (!video || video.readyState < video.HAVE_METADATA) return false;
            const cw = videoCanvas.width; const ch = videoCanvas.height;
            if (cw !== window.innerWidth || ch !== window.innerHeight) {
                videoCanvas.width = window.innerWidth; videoCanvas.height = window.innerHeight;
                posit = new POS.Posit(markerSize, window.innerWidth);
            }
            const vw = video.videoWidth; const vh = video.videoHeight;
            const rV = vw / vh; const rC = cw / ch;
            let sx, sy, sw, sh;
            if (rV < rC) { sw = vw; sh = vw / rC; sx = 0; sy = (vh - sh) / 2; }
            else { sh = vh; sw = vh * rC; sx = (vw - sw) / 2; sy = 0; }
            context2D.clearRect(0, 0, cw, ch);
            context2D.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            const imageData = context2D.getImageData(0, 0, cw, ch);
            context2D.clearRect(0, 0, cw, ch); 
            let markers = detector.detect(imageData);
            markers = markers.filter(m => Math.sqrt(Math.pow(m.corners[0].x - m.corners[1].x, 2) + Math.pow(m.corners[0].y - m.corners[1].y, 2)) > 30);
            let found = false;
            if (markers.length > 0) {
                markers.forEach(marker => {
                    drawRedBox(marker.corners);
                    const cornersCentered = marker.corners.map(c => ({ x: c.x - (cw / 2), y: (ch / 2) - c.y }));
                    const pose = posit.pose(cornersCentered);
                    if (pose && AR_MODELS[marker.id] && marker === markers[0]) {
                        found = true; lossCounter = 0;
                        const r = pose.bestRotation; const t = pose.bestTranslation;
                        updatePoseUI(r, t, marker.id, "ArUco");
                        const targetPos = new THREE.Vector3(t[0], -t[1], -t[2]);
                        const m = new THREE.Matrix4();
                        m.set(r[0][0], r[0][1], r[0][2], 0, -r[1][0], -r[1][1], -r[1][2], 0, -r[2][0], -r[2][1], -r[2][2], 0, 0, 0, 0, 1);
                        const euler = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().setFromRotationMatrix(m), 'YXZ');
                        updateActiveModelArUco(marker.id, targetPos, new THREE.Quaternion().setFromEuler(new THREE.Euler(0, euler.y, 0)));
                    }
                });
            }
            if (!found) {
                markerGroup.visible = false; lossCounter++;
                if (lossCounter > maxLossFrames && currentTrackingID !== -1) {
                    modelInfo.style.display = 'none'; clickHint.style.opacity = 0; historicalInfo.style.display = 'none'; currentTrackingID = -1;
                }
            }
            return found;
        }

        function initMap() {
            mapStations = L.map(mapEl).setView([52.3895, 9.6975], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapStations);
            stations.forEach(s => L.marker(s.coords).addTo(mapStations).bindPopup(`<strong>${s.title}</strong>`));
            userLayer = L.layerGroup().addTo(mapStations);
            locateBtn.onclick = (e) => { e.stopPropagation(); if (lastPos) mapStations.setView([lastPos.latitude, lastPos.longitude], 17); };
            orientBtn.onclick = async (e) => {
                e.stopPropagation();
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const res = await DeviceOrientationEvent.requestPermission();
                    if (res === 'granted') window.addEventListener('deviceorientation', onDeviceOrientation, true);
                } else window.addEventListener('deviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onDeviceOrientation, true);
            };
            if (navigator.geolocation) navigator.geolocation.watchPosition(onPos, null, { enableHighAccuracy: true });
        }

        function onPos(pos) {
            realPos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy || 5 };
            if (!isSimulatedPos) lastPos = realPos;
            drawUserOnMap(lastPos);
        }

        function onDeviceOrientation(e) {
            let alpha = e.webkitCompassHeading || (360 - e.alpha);
            heading = alpha % 360;
            if (lastPos) drawUserOnMap(lastPos);
        }

        function drawUserOnMap(p) {
            if (!userLayer) return; userLayer.clearLayers();
            L.circle([p.latitude, p.longitude], { radius: p.accuracy, color: 'red', weight: 1 }).addTo(userLayer);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="translate(24,24) rotate(${heading})"><path d="M0,-16 L6,0 L0,-6 L-6,0 Z" fill="red"/></g></svg>`;
            L.marker([p.latitude, p.longitude], { icon: L.icon({ iconUrl: 'data:image/svg+xml;base64,' + btoa(svg), iconSize: [48, 48], iconAnchor: [24, 24] }) }).addTo(userLayer);
        }

        function drawRedBox(corners) {
            context2D.lineWidth = 4; context2D.strokeStyle = "red";
            context2D.beginPath(); corners.forEach((c, i) => i === 0 ? context2D.moveTo(c.x, c.y) : context2D.lineTo(c.x, c.y));
            context2D.closePath(); context2D.stroke();
        }

        function updatePoseUI(r, t, id, source) {
            statusText.innerHTML = `<span style="color:yellow;">Gefunden: ID ${id} (${source})</span><br>Entfernung: ${(t[2]/10).toFixed(0)} cm`;
        }

        function triggerHint() {
            clickHint.style.opacity = 1;
            if (hintTimeout) clearTimeout(hintTimeout);
            hintTimeout = setTimeout(() => clickHint.style.opacity = 0, 3000);
        }

        function updateUIForModel(id, sourceName) {
            if (currentTrackingID !== id) {
                currentTrackingID = id;
                modelInfo.style.display = id === 0 ? 'none' : 'block';
                objTitle.innerText = AR_MODELS[id].title;
                objText.innerText = AR_MODELS[id].info;
                activeLink = AR_MODELS[id].link;
                triggerHint();
            }
        }

        function updateActiveModelArUco(id, pos, quat) {
            Object.keys(loadedMeshes).forEach(k => loadedMeshes[k].visible = parseInt(k) === id);
            updateUIForModel(id, "ArUco");
            markerGroup.visible = true;
            markerGroup.position.lerp(pos, 0.2);
            markerGroup.quaternion.slerp(quat, 0.2);
        }

        detector = new AR.Detector({ dictionaryName: selectedDictionary });
        initMap();
        startAR();

        switchCamBtn.onclick = () => mindarThree.switchCamera();
        toggleMapBtn.onclick = () => {
            const isVis = mapContainer.style.display === 'block';
            mapContainer.style.display = isVis ? 'none' : 'block';
            toggleMapBtn.innerText = isVis ? '🗺️' : '✖';
            if (!isVis) setTimeout(() => mapStations.invalidateSize(), 50);
        };

        rotLeftBtn.onclick = () => { 
            Object.keys(AR_MODELS).forEach(id => {
                if(loadedMeshes[id]?.visible) loadedMeshes[id].rotation.z -= 0.2;
                if(gnssMeshes[id]?.visible) gnssMeshes[id].rotation.y -= 0.2;
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { if(m.visible) m.rotation.y -= 0.2; });
            });
        };
        rotRightBtn.onclick = () => { 
            Object.keys(AR_MODELS).forEach(id => {
                if(loadedMeshes[id]?.visible) loadedMeshes[id].rotation.z += 0.2;
                if(gnssMeshes[id]?.visible) gnssMeshes[id].rotation.y += 0.2;
                if(mindARMeshes[id]) mindARMeshes[id].forEach(m => { if(m.visible) m.rotation.y += 0.2; });
            });
        };

        modelInfo.onclick = () => { if (activeLink) window.open(activeLink, '_blank'); };
    </script>
</body>
</html>
